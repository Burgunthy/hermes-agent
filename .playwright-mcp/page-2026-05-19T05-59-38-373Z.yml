            - code [ref=e1124]: "if self.dp.runmode.value in ('live', 'dry_run'): ticker = self.dp.ticker(metadata['pair']) dataframe['last_price'] = ticker['last'] dataframe['volume24h'] = ticker['quoteVolume'] dataframe['vwap'] = ticker['vwap']"
