            - code [ref=e1158]: "if self.dp.runmode.value in ('live', 'dry_run'): funding_rate = self.dp.funding_rate(metadata['pair']) dataframe['current_funding_rate'] = funding_rate['fundingRate'] dataframe['next_funding_timestamp'] = funding_rate['fundingTimestamp'] dataframe['next_funding_datetime'] = funding_rate['fundingDatetime']"
