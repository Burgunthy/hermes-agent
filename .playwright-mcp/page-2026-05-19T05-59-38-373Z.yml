            - emphasis [ref=e1045]: current_whitelist()
            - link "¶" [ref=e1046] [cursor=pointer]:
              - /url: "#current_whitelist"
          - paragraph [ref=e1047]:
            - text: Imagine you've developed a strategy that trades the
            - code [ref=e1048]: 5m
            - text: timeframe using signals generated from a
            - code [ref=e1049]: 1d
            - text: timeframe on the top 10 exchange pairs by volume.
          - paragraph [ref=e1050]: "The strategy logic might look something like this:"
          - paragraph [ref=e1051]:
            - emphasis [ref=e1052]:
              - text: Scan through the top 10 pairs by volume using the
              - code [ref=e1053]: VolumePairList
              - text: every 5 minutes and use a 14 day RSI to enter and exit.
          - paragraph [ref=e1054]:
            - text: Due to the limited available data, it's very difficult to resample
            - code [ref=e1055]: 5m
            - text: candles into daily candles for use in a 14 day RSI. Most exchanges limit users to just 500-1000 candles which effectively gives us around 1.74 daily candles. We need 14 days at least!
          - paragraph [ref=e1056]: Since we can't resample the data we will have to use an informative pair, and since the whitelist will be dynamic we don't know which pair(s) to use! We have a problem!
          - paragraph [ref=e1057]:
            - text: This is where calling
            - code [ref=e1058]: self.dp.current_whitelist()
            - text: comes in handy to retrieve only those pairs in the whitelist.
          - generic [ref=e1060]:
            - navigation [ref=e1061]:
              - button "Copy to clipboard" [ref=e1062] [cursor=pointer]
            - code [ref=e1063]: "def informative_pairs(self): # get access to all pairs available in whitelist. pairs = self.dp.current_whitelist() # Assign timeframe to each pair so they can be downloaded and cached for strategy. informative_pairs = [(pair, '1d') for pair in pairs] return informative_pairs"
          - group [ref=e1064]:
            - generic "Plotting with current_whitelist" [ref=e1065] [cursor=pointer]
          - heading "get_pair_dataframe(pair, timeframe) ¶" [level=3] [ref=e1066]:
