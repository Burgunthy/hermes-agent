            - navigation [ref=e1192]:
              - button "Copy to clipboard" [ref=e1193] [cursor=pointer]
            - code [ref=e1194]: "from freqtrade.strategy import IStrategy, merge_informative_pair from pandas import DataFrame class SampleStrategy(IStrategy): # strategy init stuff... timeframe = '5m' # more strategy init stuff.. def informative_pairs(self): # get access to all pairs available in whitelist. pairs = self.dp.current_whitelist() # Assign tf to each pair so they can be downloaded and cached for strategy. informative_pairs = [(pair, '1d') for pair in pairs] # Optionally Add additional \"static\" pairs informative_pairs += [(\"ETH/USDT\", \"5m\"), (\"BTC/TUSD\", \"15m\"), ] return informative_pairs def populate_indicators(self, dataframe: DataFrame, metadata: dict) -> DataFrame: if not self.dp: # Don't do anything if DataProvider is not available. return dataframe inf_tf = '1d' # Get the informative pair informative = self.dp.get_pair_dataframe(pair=metadata['pair'], timeframe=inf_tf) # Get the 14 day rsi informative['rsi'] = ta.RSI(informative, timeperiod=14) # Use the helper function merge_informative_pair to safely merge the pair # Automatically renames the columns and merges a shorter timeframe dataframe and a longer timeframe informative pair # use ffill to have the 1d value available in every row throughout the day. # Without this, comparisons between columns of the original and the informative pair would only work once per day. # Full documentation of this method, see below dataframe = merge_informative_pair(dataframe, informative, self.timeframe, inf_tf, ffill=True) # Calculate rsi of the original dataframe (5m timeframe) dataframe['rsi'] = ta.RSI(dataframe, timeperiod=14) # Do other stuff # ... return dataframe def populate_entry_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame: dataframe.loc[ ( (qtpylib.crossed_above(dataframe['rsi'], 30)) & # Signal: RSI crosses above 30 (dataframe['rsi_1d'] < 30) & # Ensure daily RSI is < 30 (dataframe['volume'] > 0) # Ensure this candle had volume (important for backtesting) ), ['enter_long', 'enter_tag']] = (1, 'rsi_cross')"
          - separator [ref=e1195]
          - heading "Additional data (Wallets) ¶" [level=2] [ref=e1196]:
            - text: Additional data (Wallets)
            - link "¶" [ref=e1197] [cursor=pointer]:
              - /url: "#additional-data-wallets"
          - paragraph [ref=e1198]:
            - text: The strategy provides access to the
            - code [ref=e1199]: wallets
            - text: object. This contains the current balances of your wallets/accounts on the exchange.
          - generic [ref=e1200]:
            - paragraph [ref=e1201]: Backtesting / Hyperopt
            - paragraph [ref=e1202]:
              - text: Wallets behaves differently depending on the function from which it is called. Within
              - code [ref=e1203]: populate_*()
              - text: methods, it'll return the full wallet as configured. Within
              - link "callbacks" [ref=e1204] [cursor=pointer]:
                - /url: ../strategy-callbacks/
              - text: ", you'll get the wallet state corresponding to the actual simulated wallet at that point in the simulation process."
          - paragraph [ref=e1205]:
            - text: Always check if
            - code [ref=e1206]: wallets
            - text: is available to avoid failures during backtesting.
          - generic [ref=e1208]:
            - navigation [ref=e1209]:
              - button "Copy to clipboard" [ref=e1210] [cursor=pointer]
            - code [ref=e1211]: "if self.wallets: free_eth = self.wallets.get_free('ETH') used_eth = self.wallets.get_used('ETH') total_eth = self.wallets.get_total('ETH')"
          - heading "Possible options for Wallets ¶" [level=3] [ref=e1212]:
            - text: Possible options for Wallets
            - link "¶" [ref=e1213] [cursor=pointer]:
              - /url: "#possible-options-for-wallets"
          - list [ref=e1214]:
            - listitem [ref=e1215]:
              - code [ref=e1216]: get_free(asset)
              - text: "- currently available balance to trade"
            - listitem [ref=e1217]:
              - code [ref=e1218]: get_used(asset)
              - text: "- currently tied up balance (open orders)"
            - listitem [ref=e1219]:
              - code [ref=e1220]: get_total(asset)
              - text: "- total available balance - sum of the 2 above"
          - separator [ref=e1221]
          - heading "Additional data (Trades) ¶" [level=2] [ref=e1222]:
            - text: Additional data (Trades)
            - link "¶" [ref=e1223] [cursor=pointer]:
              - /url: "#additional-data-trades"
          - paragraph [ref=e1224]: A history of trades can be retrieved in the strategy by querying the database.
          - paragraph [ref=e1225]: "At the top of the file, import the required object:"
          - generic [ref=e1227]:
            - navigation [ref=e1228]:
              - button "Copy to clipboard" [ref=e1229] [cursor=pointer]
            - code [ref=e1230]: from freqtrade.persistence import Trade
          - paragraph [ref=e1231]:
            - text: The following example queries trades from today for the current pair (
            - code [ref=e1232]: metadata['pair']
            - text: ). Other filters can easily be added.
          - generic [ref=e1234]:
            - navigation [ref=e1235]:
              - button "Copy to clipboard" [ref=e1236] [cursor=pointer]
            - code [ref=e1237]: "trades = Trade.get_trades_proxy(pair=metadata['pair'], open_date=datetime.now(timezone.utc) - timedelta(days=1), is_open=False, ]).order_by(Trade.close_date).all() # Summarize profit for this pair. curdayprofit = sum(trade.close_profit for trade in trades)"
          - paragraph [ref=e1238]:
            - text: For a full list of available methods, please consult the
            - link "Trade object" [ref=e1239] [cursor=pointer]:
              - /url: ../trade-object/
            - text: documentation.
          - generic [ref=e1240]:
            - paragraph [ref=e1241]: Warning
            - paragraph [ref=e1242]:
              - text: Trade history is not available in
              - code [ref=e1243]: populate_*
              - text: methods during backtesting or hyperopt, and will result in empty results.
          - heading "Prevent trades from happening for a specific pair ¶" [level=2] [ref=e1244]:
            - text: Prevent trades from happening for a specific pair
            - link "¶" [ref=e1245] [cursor=pointer]:
              - /url: "#prevent-trades-from-happening-for-a-specific-pair"
          - paragraph [ref=e1246]: Freqtrade locks pairs automatically for the current candle (until that candle is over) when a pair exits, preventing an immediate re-entry of that pair.
          - paragraph [ref=e1247]: This is to prevent "waterfalls" of many and frequent trades within a single candle.
          - paragraph [ref=e1248]:
            - text: Locked pairs will show the message
            - code [ref=e1249]: Pair <pair> is currently locked.
            - text: .
          - heading "Locking pairs from within the strategy ¶" [level=3] [ref=e1250]:
            - text: Locking pairs from within the strategy
            - link "¶" [ref=e1251] [cursor=pointer]:
              - /url: "#locking-pairs-from-within-the-strategy"
          - paragraph [ref=e1252]: Sometimes it may be desired to lock a pair after certain events happen (e.g. multiple losing trades in a row).
          - paragraph [ref=e1253]:
            - text: Freqtrade has an easy method to do this from within the strategy, by calling
            - code [ref=e1254]: self.lock_pair(pair, until, [reason])
            - text: .
            - code [ref=e1255]: until
            - text: must be a datetime object in the future, after which trading will be re-enabled for that pair, while
            - code [ref=e1256]: reason
            - text: is an optional string detailing why the pair was locked.
          - paragraph [ref=e1257]:
            - text: Locks can also be lifted manually, by calling
            - code [ref=e1258]: self.unlock_pair(pair)
            - text: or
            - code [ref=e1259]: self.unlock_reason(<reason>)
            - text: ", providing the reason the pair was unlocked."
            - code [ref=e1260]: self.unlock_reason(<reason>)
            - text: will unlock all pairs currently locked with the provided reason.
          - paragraph [ref=e1261]:
            - text: To verify if a pair is currently locked, use
            - code [ref=e1262]: self.is_pair_locked(pair)
            - text: .
          - generic [ref=e1263]:
            - paragraph [ref=e1264]: Note
            - paragraph [ref=e1265]:
              - text: Locked pairs will always be rounded up to the next candle. So assuming a
              - code [ref=e1266]: 5m
              - text: timeframe, a lock with
              - code [ref=e1267]: until
              - text: set to 10:18 will lock the pair until the candle from 10:15-10:20 will be finished.
          - generic [ref=e1268]:
            - paragraph [ref=e1269]: Warning
            - paragraph [ref=e1270]: Manually locking pairs is not available during backtesting. Only locks via Protections are allowed.
          - heading "Pair locking example ¶" [level=4] [ref=e1271]:
            - text: Pair locking example
            - link "¶" [ref=e1272] [cursor=pointer]:
              - /url: "#pair-locking-example"
          - generic [ref=e1274]:
            - navigation [ref=e1275]:
              - button "Copy to clipboard" [ref=e1276] [cursor=pointer]
            - code [ref=e1277]: "from freqtrade.persistence import Trade from datetime import timedelta, datetime, timezone # Put the above lines at the top of the strategy file, next to all the other imports # -------- # Within populate indicators (or populate_entry_trend): if self.config['runmode'].value in ('live', 'dry_run'): # fetch closed trades for the last 2 days trades = Trade.get_trades_proxy( pair=metadata['pair'], is_open=False, open_date=datetime.now(timezone.utc) - timedelta(days=2)) # Analyze the conditions you'd like to lock the pair .... will probably be different for every strategy sumprofit = sum(trade.close_profit for trade in trades) if sumprofit < 0: # Lock pair for 12 hours self.lock_pair(metadata['pair'], until=datetime.now(timezone.utc) + timedelta(hours=12))"
          - heading "Print the main dataframe ¶" [level=2] [ref=e1278]:
            - text: Print the main dataframe
            - link "¶" [ref=e1279] [cursor=pointer]:
              - /url: "#print-the-main-dataframe"
          - paragraph [ref=e1280]:
            - text: To inspect the current main dataframe, you can issue a print-statement in either
            - code [ref=e1281]: populate_entry_trend()
            - text: or
            - code [ref=e1282]: populate_exit_trend()
            - text: . You may also want to print the pair so it's clear what data is currently shown.
          - generic [ref=e1284]:
            - navigation [ref=e1285]:
              - button "Copy to clipboard" [ref=e1286] [cursor=pointer]
            - code [ref=e1287]: "def populate_entry_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame: dataframe.loc[ ( #>> whatever condition<<< ), ['enter_long', 'enter_tag']] = (1, 'somestring') # Print the Analyzed pair print(f\"result for {metadata['pair']}\") # Inspect the last 5 rows print(dataframe.tail()) return dataframe"
          - paragraph [ref=e1288]:
            - text: Printing more than a few rows is also possible by using
            - code [ref=e1289]: print(dataframe)
            - text: instead of
            - code [ref=e1290]: print(dataframe.tail())
            - text: . However this is not recommended, as can results in a lot of output (~500 lines per pair every 5 seconds).
          - heading "Common mistakes when developing strategies ¶" [level=2] [ref=e1291]:
            - text: Common mistakes when developing strategies
            - link "¶" [ref=e1292] [cursor=pointer]:
              - /url: "#common-mistakes-when-developing-strategies"
          - heading "Looking into the future while backtesting ¶" [level=3] [ref=e1293]:
            - text: Looking into the future while backtesting
            - link "¶" [ref=e1294] [cursor=pointer]:
              - /url: "#looking-into-the-future-while-backtesting"
          - paragraph [ref=e1295]: Backtesting analyzes the whole dataframe timerange at once for performance reasons. Because of this, strategy authors need to make sure that strategies do not lookahead into the future, i.e. using data that would not be available in dry or live mode.
          - paragraph [ref=e1296]: This is a common pain-point, which can cause huge differences between backtesting and dry/live run methods. Strategies that look into the future will perform well during backtesting, often with incredible profits or winrates, but will fail or perform badly in real conditions.
          - paragraph [ref=e1297]: "The following list contains some common patterns which should be avoided to prevent frustration:"
          - list [ref=e1298]:
            - listitem [ref=e1299]:
              - text: don't use
              - code [ref=e1300]: shift(-1)
              - text: or other negative values. This uses data from the future in backtesting, which is not available in dry or live modes.
            - listitem [ref=e1301]:
              - text: don't use
              - code [ref=e1302]: .iloc[-1]
              - text: or any other absolute position in the dataframe within
              - code [ref=e1303]: populate_
              - text: functions, as this will be different between dry-run and backtesting. Absolute
              - code [ref=e1304]: iloc
              - text: indexing is safe to use in callbacks however - see
              - link "Strategy Callbacks" [ref=e1305] [cursor=pointer]:
                - /url: ../strategy-callbacks/
              - text: .
            - listitem [ref=e1306]:
              - text: don't use functions that use all dataframe or column values, e.g.
              - code [ref=e1307]: dataframe['mean_volume'] = dataframe['volume'].mean()
              - text: . As backtesting uses the full dataframe, at any point in the dataframe, the
              - code [ref=e1308]: "'mean_volume'"
              - text: series would include data from the future. Use rolling() calculations instead, e.g.
              - code [ref=e1309]: dataframe['volume'].rolling(<window>).mean()
              - text: .
            - listitem [ref=e1310]:
              - text: don't use
              - code [ref=e1311]: .resample('1h')
              - text: . This uses the left border of the period interval, so moves data from an hour boundary to the start of the hour. Use
              - code [ref=e1312]: .resample('1h', label='right')
              - text: instead.
            - listitem [ref=e1313]:
              - text: don't use
              - code [ref=e1314]: .merge()
              - text: to combine longer timeframes onto shorter ones. Instead, use the
              - link "informative pair" [ref=e1315] [cursor=pointer]:
                - /url: "#informative-pairs"
              - text: helpers. (A plain merge can implicitly cause a lookahead bias as date refers to open date, not close date).
          - generic [ref=e1316]:
            - paragraph [ref=e1317]: Identifying problems
            - paragraph [ref=e1318]:
              - text: You should always use the two helper commands
              - link "lookahead-analysis" [ref=e1319] [cursor=pointer]:
                - /url: ../lookahead-analysis/
              - text: and
              - link "recursive-analysis" [ref=e1320] [cursor=pointer]:
                - /url: ../recursive-analysis/
              - text: ", which can each help you figure out problems with your strategy in different ways. Please treat them as what they are - helpers to identify most common problems. A negative result of each does not guarantee that there are none of the above errors included."
          - heading "Colliding signals ¶" [level=3] [ref=e1321]:
            - text: Colliding signals
            - link "¶" [ref=e1322] [cursor=pointer]:
              - /url: "#colliding-signals"
          - paragraph [ref=e1323]:
            - text: When conflicting signals collide (e.g. both
            - code [ref=e1324]: "'enter_long'"
            - text: and
            - code [ref=e1325]: "'exit_long'"
            - text: are set to
            - code [ref=e1326]: "1"
            - text: ), freqtrade will do nothing and ignore the entry signal. This will avoid trades that enter, and exit immediately. Obviously, this can potentially lead to missed entries.
          - paragraph [ref=e1327]: "The following rules apply, and entry signals will be ignored if more than one of the 3 signals is set:"
          - list [ref=e1328]:
            - listitem [ref=e1329]:
              - code [ref=e1330]: enter_long
              - text: "->"
              - code [ref=e1331]: exit_long
              - text: ","
              - code [ref=e1332]: enter_short
            - listitem [ref=e1333]:
              - code [ref=e1334]: enter_short
              - text: "->"
              - code [ref=e1335]: exit_short
              - text: ","
              - code [ref=e1336]: enter_long
          - heading "Further strategy ideas ¶" [level=2] [ref=e1337]:
            - text: Further strategy ideas
            - link "¶" [ref=e1338] [cursor=pointer]:
              - /url: "#further-strategy-ideas"
          - paragraph [ref=e1339]:
            - text: To get additional ideas for strategies, head over to the
            - link "strategy repository" [ref=e1340] [cursor=pointer]:
              - /url: https://github.com/freqtrade/freqtrade-strategies
            - text: . Feel free to use them as examples, but results will depend on the current market situation, pairs used, etc. Therefore, these strategies should be considered only for learning purposes, not real world trading. Please backtest the strategy for your exchange/desired pairs first, then dry run to evaluate carefully, and use at your own risk.
          - paragraph [ref=e1341]: Feel free to use any of them as inspiration for your own strategies. We're happy to accept Pull Requests containing new strategies to the repository.
          - heading "Next steps ¶" [level=2] [ref=e1342]:
            - text: Next steps
            - link "¶" [ref=e1343] [cursor=pointer]:
              - /url: "#next-steps"
          - paragraph [ref=e1344]:
            - text: Now you have a perfect strategy you probably want to backtest it. Your next step is to learn
            - link "how to use backtesting" [ref=e1345] [cursor=pointer]:
              - /url: ../backtesting/
            - text: .
