        - article [ref=e503]:
          - link "Edit this page" [ref=e504] [cursor=pointer]:
            - /url: https://github.com/freqtrade/freqtrade/edit/develop/docs/strategy-customization.md
            - img [ref=e505]
          - heading "Strategy Customization ¶" [level=1] [ref=e507]:
            - text: Strategy Customization
            - link "¶" [ref=e508] [cursor=pointer]:
              - /url: "#strategy-customization"
          - paragraph [ref=e509]: This page explains how to customize your strategies, add new indicators and set up trading rules.
          - paragraph [ref=e510]: "If you haven't already, please familiarize yourself with:"
          - list [ref=e511]:
            - listitem [ref=e512]:
              - text: the
              - link "Freqtrade strategy 101" [ref=e513] [cursor=pointer]:
                - /url: ../strategy-101/
              - text: ", which provides a quick start to strategy development"
            - listitem [ref=e514]:
              - text: the
              - link "Freqtrade bot basics" [ref=e515] [cursor=pointer]:
                - /url: ../bot-basics/
              - text: ", which provides overall info on how the bot operates"
          - heading "Develop your own strategy ¶" [level=2] [ref=e516]:
            - text: Develop your own strategy
            - link "¶" [ref=e517] [cursor=pointer]:
              - /url: "#develop-your-own-strategy"
          - paragraph [ref=e518]: The bot includes a default strategy file.
          - paragraph [ref=e519]:
            - text: Also, several other strategies are available in the
            - link "strategy repository" [ref=e520] [cursor=pointer]:
              - /url: https://github.com/freqtrade/freqtrade-strategies
            - text: .
          - paragraph [ref=e521]: You will however most likely have your own idea for a strategy.
          - paragraph [ref=e522]: This document intends to help you convert your ideas into a working strategy.
          - heading "Generating a strategy template ¶" [level=3] [ref=e523]:
            - text: Generating a strategy template
            - link "¶" [ref=e524] [cursor=pointer]:
              - /url: "#generating-a-strategy-template"
          - paragraph [ref=e525]: "To get started, you can use the command:"
          - generic [ref=e527]:
            - navigation [ref=e528]:
              - button "Copy to clipboard" [ref=e529] [cursor=pointer]
            - code [ref=e530]: freqtrade new-strategy --strategy AwesomeStrategy
          - paragraph [ref=e531]:
            - text: This will create a new strategy called
            - code [ref=e532]: AwesomeStrategy
            - text: from a template, which will be located using the filename
            - code [ref=e533]: user_data/strategies/AwesomeStrategy.py
            - text: .
          - generic [ref=e534]:
            - paragraph [ref=e535]: Note
            - paragraph [ref=e536]:
              - text: There is a difference between the
              - emphasis [ref=e537]: name
              - text: of the strategy and the filename. In most commands, Freqtrade uses the
              - emphasis [ref=e538]: name
              - text: of the strategy,
              - emphasis [ref=e539]: not the filename
              - text: .
          - generic [ref=e540]:
            - paragraph [ref=e541]: Note
            - paragraph [ref=e542]:
              - text: The
              - code [ref=e543]: new-strategy
              - text: command generates starting examples which will not be profitable out of the box.
          - group [ref=e544]:
            - generic "Different template levels" [ref=e545] [cursor=pointer]
          - heading "Anatomy of a strategy ¶" [level=3] [ref=e546]:
            - text: Anatomy of a strategy
            - link "¶" [ref=e547] [cursor=pointer]:
              - /url: "#anatomy-of-a-strategy"
          - paragraph [ref=e548]: "A strategy file contains all the information needed to build the strategy logic:"
          - list [ref=e549]:
            - listitem [ref=e550]: Candle data in OHLCV format
            - listitem [ref=e551]: Indicators
            - listitem [ref=e552]:
              - text: Entry logic
              - list [ref=e553]:
                - listitem [ref=e554]: Signals
            - listitem [ref=e555]:
              - text: Exit logic
              - list [ref=e556]:
                - listitem [ref=e557]: Signals
                - listitem [ref=e558]: Minimal ROI
                - listitem [ref=e559]: Callbacks ("custom functions")
            - listitem [ref=e560]:
              - text: Stoploss
              - list [ref=e561]:
                - listitem [ref=e562]: Fixed/absolute
                - listitem [ref=e563]: Trailing
                - listitem [ref=e564]: Callbacks ("custom functions")
            - listitem [ref=e565]: Pricing [optional]
            - listitem [ref=e566]: Position adjustment [optional]
          - paragraph [ref=e567]:
            - text: The bot includes a sample strategy called
            - code [ref=e568]: SampleStrategy
            - text: "that you can use as a basis:"
            - code [ref=e569]: user_data/strategies/sample_strategy.py
            - text: ". You can test it with the parameter:"
            - code [ref=e570]: "--strategy SampleStrategy"
            - text: . Remember that you use the strategy class name, not the filename.
          - paragraph [ref=e571]:
            - text: Additionally, there is an attribute called
            - code [ref=e572]: INTERFACE_VERSION
            - text: ", which defines the version of the strategy interface the bot should use. The current version is 3 - which is also the default when it's not set explicitly in the strategy."
          - paragraph [ref=e573]: You may see older strategies set to interface version 2, and these will need to be updated to v3 terminology as future versions will require this to be set.
          - paragraph [ref=e574]:
            - text: Starting the bot in dry or live mode is accomplished using the
            - code [ref=e575]: trade
            - text: "command:"
          - generic [ref=e577]:
            - navigation [ref=e578]:
              - button "Copy to clipboard" [ref=e579] [cursor=pointer]
            - code [ref=e580]: freqtrade trade --strategy AwesomeStrategy
          - heading "Bot modes ¶" [level=3] [ref=e581]:
            - text: Bot modes
            - link "¶" [ref=e582] [cursor=pointer]:
              - /url: "#bot-modes"
          - paragraph [ref=e583]: "Freqtrade strategies can be processed by the Freqtrade bot in 5 main modes:"
          - list [ref=e584]:
            - listitem [ref=e585]: backtesting
            - listitem [ref=e586]: hyperopting
            - listitem [ref=e587]: dry ("forward testing")
            - listitem [ref=e588]: live
            - listitem [ref=e589]: FreqAI (not covered here)
          - paragraph [ref=e590]:
            - text: Check the
            - link "configuration documentation" [ref=e591] [cursor=pointer]:
              - /url: ../configuration/
            - text: about how to set the bot to dry or live mode.
          - paragraph [ref=e592]:
            - strong [ref=e593]: Always use dry mode when testing as this gives you an idea of how your strategy will work in reality without risking capital.
          - heading "Diving in deeper ¶" [level=2] [ref=e594]:
            - text: Diving in deeper
            - link "¶" [ref=e595] [cursor=pointer]:
              - /url: "#diving-in-deeper"
          - paragraph [ref=e596]:
            - strong [ref=e597]:
              - text: For the following section we will use the
              - link "user_data/strategies/sample_strategy.py" [ref=e598] [cursor=pointer]:
                - /url: https://github.com/freqtrade/freqtrade/blob/develop/freqtrade/templates/sample_strategy.py
              - text: file as reference.
          - generic [ref=e599]:
            - paragraph [ref=e600]: Strategies and Backtesting
            - paragraph [ref=e601]:
              - text: To avoid problems and unexpected differences between backtesting and dry/live modes, please be aware that during backtesting the full time range is passed to the
              - code [ref=e602]: populate_*()
              - text: methods at once. It is therefore best to use vectorized operations (across the whole dataframe, not loops) and avoid index referencing (
              - code [ref=e603]: df.iloc[-1]
              - text: ), but instead use
              - code [ref=e604]: df.shift()
              - text: to get to the previous candle.
          - generic [ref=e605]:
            - paragraph [ref=e606]: "Warning: Using future data"
            - paragraph [ref=e607]:
              - text: Since backtesting passes the full time range to the
              - code [ref=e608]: populate_*()
              - text: methods, the strategy author needs to take care to avoid having the strategy utilize data from the future. Some common patterns for this are listed in the
              - link "Common Mistakes" [ref=e609] [cursor=pointer]:
                - /url: "#common-mistakes-when-developing-strategies"
              - text: section of this document.
          - group [ref=e610]:
            - generic "Lookahead and recursive analysis" [ref=e611] [cursor=pointer]
          - heading "Dataframe ¶" [level=3] [ref=e612]:
            - text: Dataframe
            - link "¶" [ref=e613] [cursor=pointer]:
              - /url: "#dataframe"
          - paragraph [ref=e614]:
            - text: Freqtrade uses
            - link "pandas" [ref=e615] [cursor=pointer]:
              - /url: https://pandas.pydata.org/
            - text: to store/provide the candlestick (OHLCV) data. Pandas is a great library developed for processing large amounts of data in tabular format.
          - paragraph [ref=e616]: Each row in a dataframe corresponds to one candle on a chart, with the latest complete candle always being the last in the dataframe (sorted by date).
          - paragraph [ref=e617]:
            - text: If we were to look at the first few rows of the main dataframe using the pandas
            - code [ref=e618]: head()
            - text: "function, we would see:"
          - generic [ref=e620]:
            - navigation [ref=e621]:
              - button "Copy to clipboard" [ref=e622] [cursor=pointer]
            - code [ref=e623]: "> dataframe.head() date open high low close volume 0 2021-11-09 23:25:00+00:00 67279.67 67321.84 67255.01 67300.97 44.62253 1 2021-11-09 23:30:00+00:00 67300.97 67301.34 67183.03 67187.01 61.38076 2 2021-11-09 23:35:00+00:00 67187.02 67187.02 67031.93 67123.81 113.42728 3 2021-11-09 23:40:00+00:00 67123.80 67222.40 67080.33 67160.48 78.96008 4 2021-11-09 23:45:00+00:00 67160.48 67160.48 66901.26 66943.37 111.39292"
          - paragraph [ref=e624]: "A dataframe is a table where columns are not single values, but a series of data values. As such, simple python comparisons like the following will not work:"
          - generic [ref=e626]:
            - navigation [ref=e627]:
              - button "Copy to clipboard" [ref=e628] [cursor=pointer]
            - code [ref=e629]: "if dataframe['rsi'] > 30: dataframe['enter_long'] = 1"
          - paragraph [ref=e630]:
            - text: The above section will fail with
            - code [ref=e631]: The truth value of a Series is ambiguous [...]
            - text: .
          - paragraph [ref=e632]:
            - text: This must instead be written in a pandas-compatible way, so the operation is performed across the whole dataframe, i.e.
            - code [ref=e633]: vectorisation
            - text: .
          - generic [ref=e635]:
            - navigation [ref=e636]:
              - button "Copy to clipboard" [ref=e637] [cursor=pointer]
            - code [ref=e638]: dataframe.loc[ (dataframe['rsi'] > 30) , 'enter_long'] = 1
          - paragraph [ref=e639]:
            - text: With this section, you have a new column in your dataframe, which has
            - code [ref=e640]: "1"
            - text: assigned whenever RSI is above 30.
          - paragraph [ref=e641]: Freqtrade uses this new column as an entry signal, where it is assumed that a trade will subsequently open on the next open candle.
          - paragraph [ref=e642]: Pandas provides fast ways to calculate metrics, i.e. "vectorisation". To benefit from this speed, it is advised to not use loops, but use vectorized methods instead.
          - paragraph [ref=e643]: Vectorized operations perform calculations across the whole range of data and are therefore, compared to looping through each row, a lot faster when calculating indicators.
          - group [ref=e644]:
            - generic "Signals vs Trades" [ref=e645] [cursor=pointer]
          - generic [ref=e646]:
            - paragraph [ref=e647]: Trade order assumptions
            - paragraph [ref=e648]: In backtesting, signals are generated on candle close. Trades are then initiated immeditely on next candle open.
            - paragraph [ref=e649]: In dry and live, this may be delayed due to all pair dataframes needing to be analysed first, then trade processing for each of those pairs happens. This means that in dry/live you need to be mindful of having as low a computation delay as possible, usually by running a low number of pairs and having a CPU with a good clock speed.
          - heading "Why can't I see \"real time\" candle data? ¶" [level=4] [ref=e650]:
            - text: Why can't I see "real time" candle data?
            - link "¶" [ref=e651] [cursor=pointer]:
              - /url: "#why-cant-i-see-real-time-candle-data"
          - paragraph [ref=e652]: Freqtrade does not store incomplete/unfinished candles in the dataframe.
          - paragraph [ref=e653]: The use of incomplete data for making strategy decisions is called "repainting" and you might see other platforms allow this.
          - paragraph [ref=e654]: Freqtrade does not. Only complete/finished candle data is available in the dataframe.
          - heading "Customize Indicators ¶" [level=3] [ref=e655]:
            - text: Customize Indicators
            - link "¶" [ref=e656] [cursor=pointer]:
              - /url: "#customize-indicators"
          - paragraph [ref=e657]:
            - text: Entry and exit signals need indicators. You can add more indicators by extending the list contained in the method
            - code [ref=e658]: populate_indicators()
            - text: from your strategy file.
          - paragraph [ref=e659]:
            - text: You should only add the indicators used in either
            - code [ref=e660]: populate_entry_trend()
            - text: ","
            - code [ref=e661]: populate_exit_trend()
            - text: ", or to populate another indicator, otherwise performance may suffer."
          - paragraph [ref=e662]:
            - text: It's important to always return the dataframe from these three functions without removing/modifying the columns
            - code [ref=e663]: "\"open\", \"high\", \"low\", \"close\", \"volume\""
            - text: ", otherwise these fields would contain something unexpected."
          - paragraph [ref=e664]: "Sample:"
          - generic [ref=e666]:
            - navigation [ref=e667]:
              - button "Copy to clipboard" [ref=e668] [cursor=pointer]
            - code [ref=e669]: "def populate_indicators(self, dataframe: DataFrame, metadata: dict) -> DataFrame: \"\"\" Adds several different TA indicators to the given DataFrame Performance Note: For the best performance be frugal on the number of indicators you are using. Let uncomment only the indicator you are using in your strategies or your hyperopt configuration, otherwise you will waste your memory and CPU usage. :param dataframe: Dataframe with data from the exchange :param metadata: Additional information, like the currently traded pair :return: a Dataframe with all mandatory indicators for the strategies \"\"\" dataframe['sar'] = ta.SAR(dataframe) dataframe['adx'] = ta.ADX(dataframe) stoch = ta.STOCHF(dataframe) dataframe['fastd'] = stoch['fastd'] dataframe['fastk'] = stoch['fastk'] dataframe['bb_lower'] = ta.BBANDS(dataframe, nbdevup=2, nbdevdn=2)['lowerband'] dataframe['sma'] = ta.SMA(dataframe, timeperiod=40) dataframe['tema'] = ta.TEMA(dataframe, timeperiod=9) dataframe['mfi'] = ta.MFI(dataframe) dataframe['rsi'] = ta.RSI(dataframe) dataframe['ema5'] = ta.EMA(dataframe, timeperiod=5) dataframe['ema10'] = ta.EMA(dataframe, timeperiod=10) dataframe['ema50'] = ta.EMA(dataframe, timeperiod=50) dataframe['ema100'] = ta.EMA(dataframe, timeperiod=100) dataframe['ao'] = awesome_oscillator(dataframe) macd = ta.MACD(dataframe) dataframe['macd'] = macd['macd'] dataframe['macdsignal'] = macd['macdsignal'] dataframe['macdhist'] = macd['macdhist'] hilbert = ta.HT_SINE(dataframe) dataframe['htsine'] = hilbert['sine'] dataframe['htleadsine'] = hilbert['leadsine'] dataframe['plus_dm'] = ta.PLUS_DM(dataframe) dataframe['plus_di'] = ta.PLUS_DI(dataframe) dataframe['minus_dm'] = ta.MINUS_DM(dataframe) dataframe['minus_di'] = ta.MINUS_DI(dataframe) # remember to always return the dataframe return dataframe"
          - generic [ref=e670]:
            - paragraph [ref=e671]: Want more indicator examples?
            - paragraph [ref=e672]:
              - text: Look into the
              - link "user_data/strategies/sample_strategy.py" [ref=e673] [cursor=pointer]:
                - /url: https://github.com/freqtrade/freqtrade/blob/develop/freqtrade/templates/sample_strategy.py
              - text: . Then uncomment indicators you need.
          - heading "Indicator libraries ¶" [level=4] [ref=e674]:
            - text: Indicator libraries
            - link "¶" [ref=e675] [cursor=pointer]:
              - /url: "#indicator-libraries"
          - paragraph [ref=e676]: "Out of the box, freqtrade installs the following technical libraries:"
          - list [ref=e677]:
            - listitem [ref=e678]:
              - link "ta-lib" [ref=e679] [cursor=pointer]:
                - /url: https://ta-lib.github.io/ta-lib-python/
            - listitem [ref=e680]:
              - link "pandas-ta" [ref=e681] [cursor=pointer]:
                - /url: https://twopirllc.github.io/pandas-ta/
            - listitem [ref=e682]:
              - link "technical" [ref=e683] [cursor=pointer]:
                - /url: https://technical.freqtrade.io
          - paragraph [ref=e684]: Additional technical libraries can be installed as necessary, or custom indicators may be written / invented by the strategy author.
          - heading "Strategy startup period ¶" [level=3] [ref=e685]:
            - text: Strategy startup period
            - link "¶" [ref=e686] [cursor=pointer]:
              - /url: "#strategy-startup-period"
          - paragraph [ref=e687]: Some indicators have an unstable startup period in which there isn't enough candle data to calculate any values (NaN), or the calculation is incorrect. This can lead to inconsistencies, since Freqtrade does not know how long this unstable period is and uses whatever indicator values are in the dataframe.
          - paragraph [ref=e688]:
            - text: To account for this, the strategy can be assigned the
            - code [ref=e689]: startup_candle_count
            - text: attribute.
          - paragraph [ref=e690]:
            - text: This should be set to the maximum number of candles that the strategy requires to calculate stable indicators. In the case where a user includes higher timeframes with informative pairs, the
            - code [ref=e691]: startup_candle_count
            - text: does not necessarily change. The value is the maximum period (in candles) that any of the informatives timeframes need to compute stable indicators.
          - paragraph [ref=e692]:
            - text: You can use
            - link "recursive-analysis" [ref=e693] [cursor=pointer]:
              - /url: ../recursive-analysis/
            - text: to check and find the correct
            - code [ref=e694]: startup_candle_count
            - text: to be used. When recursive analysis shows a variance of 0%, then you can be sure that you have enough startup candle data.
          - paragraph [ref=e695]:
            - text: In this example strategy, this should be set to 400 (
            - code [ref=e696]: startup_candle_count = 400
            - text: ), since the minimum needed history for ema100 calculation to make sure the value is correct is 400 candles.
          - generic [ref=e698]:
            - navigation [ref=e699]:
              - button "Copy to clipboard" [ref=e700] [cursor=pointer]
            - code [ref=e701]: dataframe['ema100'] = ta.EMA(dataframe, timeperiod=100)
          - paragraph [ref=e702]: By letting the bot know how much history is needed, backtest trades can start at the specified timerange during backtesting and hyperopt.
          - generic [ref=e703]:
            - paragraph [ref=e704]: Using x calls to get OHLCV
            - paragraph [ref=e705]:
              - text: If you receive a warning like
              - code [ref=e706]: WARNING - Using 3 calls to get OHLCV. This can result in slower operations for the bot. Please check if you really need 1500 candles for your strategy
              - text: "- you should consider if you really need this much historic data for your signals. Having this will cause Freqtrade to make multiple calls for the same pair, which will obviously be slower than one network request. As a consequence, Freqtrade will take longer to refresh candles - and should therefore be avoided if possible. This is capped to 5 total calls to avoid overloading the exchange, or make freqtrade too slow."
          - generic [ref=e707]:
            - paragraph [ref=e708]: Warning
            - paragraph [ref=e709]:
              - code [ref=e710]: startup_candle_count
              - text: should be below
              - code [ref=e711]: ohlcv_candle_limit * 5
              - text: (which is 500 * 5 for most exchanges) - since only this amount of candles will be available during Dry-Run/Live Trade operations.
          - heading "Example ¶" [level=4] [ref=e712]:
            - text: Example
            - link "¶" [ref=e713] [cursor=pointer]:
              - /url: "#example"
          - paragraph [ref=e714]: Let's try to backtest 1 month (January 2019) of 5m candles using an example strategy with EMA100, as above.
          - generic [ref=e716]:
            - navigation [ref=e717]:
              - button "Copy to clipboard" [ref=e718] [cursor=pointer]
            - code [ref=e719]: freqtrade backtesting --timerange 20190101-20190201 --timeframe 5m
          - paragraph [ref=e720]:
            - text: Assuming
            - code [ref=e721]: startup_candle_count
            - text: is set to 400, backtesting knows it needs 400 candles to generate valid entry signals. It will load data from
            - code [ref=e722]: 20190101 - (400 * 5m)
            - text: "- which is ~2018-12-30 11:40:00."
          - paragraph [ref=e723]: If this data is available, indicators will be calculated with this extended timerange. The unstable startup period (up to 2019-01-01 00:00:00) will then be removed before backtesting is carried out.
          - generic [ref=e724]:
            - paragraph [ref=e725]: Unavailable startup candle data
            - paragraph [ref=e726]: If data for the startup period is not available, then the timerange will be adjusted to account for this startup period. In our example, backtesting would then start from 2019-01-02 09:20:00.
          - heading "Entry signal rules ¶" [level=3] [ref=e727]:
            - text: Entry signal rules
            - link "¶" [ref=e728] [cursor=pointer]:
              - /url: "#entry-signal-rules"
          - paragraph [ref=e729]:
            - text: Edit the method
            - code [ref=e730]: populate_entry_trend()
            - text: in your strategy file to update your entry strategy.
          - paragraph [ref=e731]:
            - text: It's important to always return the dataframe without removing/modifying the columns
            - code [ref=e732]: "\"open\", \"high\", \"low\", \"close\", \"volume\""
            - text: ", otherwise these fields would contain something unexpected. The strategy may then produce invalid values, or cease to work entirely."
          - paragraph [ref=e733]:
            - text: This method will also define a new column,
            - code [ref=e734]: "\"enter_long\""
            - text: (
            - code [ref=e735]: "\"enter_short\""
            - text: for shorts), which needs to contain
            - code [ref=e736]: "1"
            - text: for entries, and
            - code [ref=e737]: "0"
            - text: for "no action".
            - code [ref=e738]: enter_long
            - text: is a mandatory column that must be set even if the strategy is shorting only.
          - paragraph [ref=e739]:
            - text: You can name your entry signals by using the
            - code [ref=e740]: "\"enter_tag\""
            - text: column, which can help debug and assess your strategy later.
          - paragraph [ref=e741]:
            - text: Sample from
            - code [ref=e742]: user_data/strategies/sample_strategy.py
            - text: ":"
          - generic [ref=e744]:
            - navigation [ref=e745]:
              - button "Copy to clipboard" [ref=e746] [cursor=pointer]
            - code [ref=e747]: "def populate_entry_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame: \"\"\" Based on TA indicators, populates the buy signal for the given dataframe :param dataframe: DataFrame populated with indicators :param metadata: Additional information, like the currently traded pair :return: DataFrame with buy column \"\"\" dataframe.loc[ ( (qtpylib.crossed_above(dataframe['rsi'], 30)) & # Signal: RSI crosses above 30 (dataframe['tema'] <= dataframe['bb_middleband']) & # Guard (dataframe['tema'] > dataframe['tema'].shift(1)) & # Guard (dataframe['volume'] > 0) # Make sure Volume is not 0 ), ['enter_long', 'enter_tag']] = (1, 'rsi_cross') return dataframe"
          - group [ref=e748]:
            - generic "Enter short trades" [ref=e749] [cursor=pointer]
          - generic [ref=e750]:
            - paragraph [ref=e751]: Note
            - paragraph [ref=e752]:
              - text: Buying requires sellers to buy from. Therefore volume needs to be > 0 (
              - code [ref=e753]: dataframe['volume'] > 0
              - text: ) to make sure that the bot does not buy/sell in no-activity periods.
          - heading "Exit signal rules ¶" [level=3] [ref=e754]:
            - text: Exit signal rules
            - link "¶" [ref=e755] [cursor=pointer]:
              - /url: "#exit-signal-rules"
          - paragraph [ref=e756]:
            - text: Edit the method
            - code [ref=e757]: populate_exit_trend()
            - text: into your strategy file to update your exit strategy.
          - paragraph [ref=e758]:
            - text: The exit-signal can be suppressed by setting
            - code [ref=e759]: use_exit_signal
            - text: to false in the configuration or strategy.
          - paragraph [ref=e760]:
            - code [ref=e761]: use_exit_signal
            - text: will not influence
            - link "signal collision rules" [ref=e762] [cursor=pointer]:
              - /url: "#colliding-signals"
            - text: "- which will still apply and can prevent entries."
          - paragraph [ref=e763]:
            - text: It's important to always return the dataframe without removing/modifying the columns
            - code [ref=e764]: "\"open\", \"high\", \"low\", \"close\", \"volume\""
            - text: ", otherwise these fields would contain something unexpected. The strategy may then produce invalid values, or cease to work entirely."
          - paragraph [ref=e765]:
            - text: This method will also define a new column,
            - code [ref=e766]: "\"exit_long\""
            - text: (
            - code [ref=e767]: "\"exit_short\""
            - text: for shorts), which needs to contain
            - code [ref=e768]: "1"
            - text: for exits, and
            - code [ref=e769]: "0"
            - text: for "no action".
          - paragraph [ref=e770]:
            - text: You can name your exit signals by using the
            - code [ref=e771]: "\"exit_tag\""
            - text: column, which can help debug and assess your strategy later.
          - paragraph [ref=e772]:
            - text: Sample from
            - code [ref=e773]: user_data/strategies/sample_strategy.py
            - text: ":"
          - generic [ref=e775]:
            - navigation [ref=e776]:
              - button "Copy to clipboard" [ref=e777] [cursor=pointer]
            - code [ref=e778]: "def populate_exit_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame: \"\"\" Based on TA indicators, populates the exit signal for the given dataframe :param dataframe: DataFrame populated with indicators :param metadata: Additional information, like the currently traded pair :return: DataFrame with buy column \"\"\" dataframe.loc[ ( (qtpylib.crossed_above(dataframe['rsi'], 70)) & # Signal: RSI crosses above 70 (dataframe['tema'] > dataframe['bb_middleband']) & # Guard (dataframe['tema'] < dataframe['tema'].shift(1)) & # Guard (dataframe['volume'] > 0) # Make sure Volume is not 0 ), ['exit_long', 'exit_tag']] = (1, 'rsi_too_high') return dataframe"
          - group [ref=e779]:
            - generic "Exit short trades" [ref=e780] [cursor=pointer]
          - heading "Minimal ROI ¶" [level=3] [ref=e781]:
            - text: Minimal ROI
            - link "¶" [ref=e782] [cursor=pointer]:
              - /url: "#minimal-roi"
          - paragraph [ref=e783]:
            - text: The
            - code [ref=e784]: minimal_roi
            - text: strategy variable defines the minimal Return On Investment (ROI) a trade should reach before exiting, independent from the exit signal.
          - paragraph [ref=e785]:
            - text: It is of the following format, i.e. a python
            - code [ref=e786]: dict
            - text: ", with the dict key (left side of the colon) being the minutes passed since the trade opened, and the value (right side of the colon) being the percentage."
          - generic [ref=e788]:
            - navigation [ref=e789]:
              - button "Copy to clipboard" [ref=e790] [cursor=pointer]
            - code [ref=e791]: "minimal_roi = { \"40\": 0.0, \"30\": 0.01, \"20\": 0.02, \"0\": 0.04 }"
          - paragraph [ref=e792]: "The above configuration would therefore mean:"
          - list [ref=e793]:
            - listitem [ref=e794]: Exit whenever 4% profit was reached
            - listitem [ref=e795]: Exit when 2% profit was reached (in effect after 20 minutes)
            - listitem [ref=e796]: Exit when 1% profit was reached (in effect after 30 minutes)
            - listitem [ref=e797]: Exit when trade is non-loosing (in effect after 40 minutes)
          - paragraph [ref=e798]: The calculation does include fees.
          - heading "Disabling minimal ROI ¶" [level=4] [ref=e799]:
            - text: Disabling minimal ROI
            - link "¶" [ref=e800] [cursor=pointer]:
              - /url: "#disabling-minimal-roi"
          - paragraph [ref=e801]: "To disable ROI completely, set it to an empty dictionary:"
          - generic [ref=e803]:
            - navigation [ref=e804]:
              - button "Copy to clipboard" [ref=e805] [cursor=pointer]
            - code [ref=e806]: "minimal_roi = {}"
          - heading "Using calculations in minimal ROI ¶" [level=4] [ref=e807]:
            - text: Using calculations in minimal ROI
            - link "¶" [ref=e808] [cursor=pointer]:
              - /url: "#using-calculations-in-minimal-roi"
          - paragraph [ref=e809]: To use times based on candle duration (timeframe), the following snippet can be handy.
          - paragraph [ref=e810]: This will allow you to change the timeframe for the strategy, but the minimal ROI times will still be set as candles, e.g. after 3 candles.
          - generic [ref=e812]:
            - navigation [ref=e813]:
              - button "Copy to clipboard" [ref=e814] [cursor=pointer]
            - code [ref=e815]: "from freqtrade.exchange import timeframe_to_minutes class AwesomeStrategy(IStrategy): timeframe = \"1d\" timeframe_mins = timeframe_to_minutes(timeframe) minimal_roi = { \"0\": 0.05, # 5% for the first 3 candles str(timeframe_mins * 3): 0.02, # 2% after 3 candles str(timeframe_mins * 6): 0.01, # 1% After 6 candles }"
          - group [ref=e816]:
            - generic "Orders that don't fill immediately" [ref=e817] [cursor=pointer]
          - heading "Stoploss ¶" [level=3] [ref=e818]:
            - text: Stoploss
            - link "¶" [ref=e819] [cursor=pointer]:
              - /url: "#stoploss"
          - paragraph [ref=e820]: Setting a stoploss is highly recommended to protect your capital from strong moves against you.
          - paragraph [ref=e821]: "Sample of setting a 10% stoploss:"
          - generic [ref=e823]:
            - navigation [ref=e824]:
              - button "Copy to clipboard" [ref=e825] [cursor=pointer]
            - code [ref=e826]: stoploss = -0.10
          - paragraph [ref=e827]:
            - text: For the full documentation on stoploss features, look at the dedicated
            - link "stoploss page" [ref=e828] [cursor=pointer]:
              - /url: ../stoploss/
            - text: .
          - heading "Timeframe ¶" [level=3] [ref=e829]:
            - text: Timeframe
            - link "¶" [ref=e830] [cursor=pointer]:
              - /url: "#timeframe"
          - paragraph [ref=e831]: This is the periodicity of candles the bot should use in the strategy.
          - paragraph [ref=e832]:
            - text: Common values are
            - code [ref=e833]: "\"1m\""
            - text: ","
            - code [ref=e834]: "\"5m\""
            - text: ","
            - code [ref=e835]: "\"15m\""
            - text: ","
            - code [ref=e836]: "\"1h\""
            - text: ", however all values supported by your exchange should work."
          - paragraph [ref=e837]: Please note that the same entry/exit signals may work well with one timeframe, but not with others.
          - paragraph [ref=e838]:
            - text: This setting is accessible within the strategy methods as the
            - code [ref=e839]: self.timeframe
            - text: attribute.
          - heading "Can short ¶" [level=3] [ref=e840]:
            - text: Can short
            - link "¶" [ref=e841] [cursor=pointer]:
              - /url: "#can-short"
          - paragraph [ref=e842]:
            - text: To use short signals in futures markets, you will have to set
            - code [ref=e843]: can_short = True
            - text: .
          - paragraph [ref=e844]: Strategies which enable this will fail to load on spot markets.
          - paragraph [ref=e845]:
            - text: If you have
            - code [ref=e846]: "1"
            - text: values in the
            - code [ref=e847]: enter_short
            - text: column to raise short signals, setting
            - code [ref=e848]: can_short = False
            - text: (which is the default) will mean that these short signals are ignored, even if you have specified futures markets in your configuration.
          - heading "Metadata dict ¶" [level=3] [ref=e849]:
            - text: Metadata dict
            - link "¶" [ref=e850] [cursor=pointer]:
              - /url: "#metadata-dict"
          - paragraph [ref=e851]:
            - text: The
            - code [ref=e852]: metadata
            - text: dict (available for
            - code [ref=e853]: populate_entry_trend
            - text: ","
            - code [ref=e854]: populate_exit_trend
            - text: ","
            - code [ref=e855]: populate_indicators
            - text: ) contains additional information. Currently this is
            - code [ref=e856]: pair
            - text: ", which can be accessed using"
            - code [ref=e857]: metadata['pair']
            - text: ", and will return a pair in the format"
            - code [ref=e858]: XRP/BTC
            - text: (or
            - code [ref=e859]: XRP/BTC:BTC
            - text: for futures markets).
          - paragraph [ref=e860]: The metadata dict should not be modified and does not persist information across multiple functions in your strategy.
          - paragraph [ref=e861]:
            - text: Instead, please check the
            - link "Storing information" [ref=e862] [cursor=pointer]:
              - /url: ../strategy-advanced/#storing-information-persistent
            - text: section.
          - heading "Imports necessary for a strategy ¶" [level=2] [ref=e863]:
            - text: Imports necessary for a strategy
            - link "¶" [ref=e864] [cursor=pointer]:
              - /url: "#imports-necessary-for-a-strategy"
          - paragraph [ref=e865]: "When creating a strategy, you will need to import the necessary modules and classes. The following imports are required for a strategy:"
          - paragraph [ref=e866]: "By default, we recommend the following imports as a base line for your strategy: This will cover all imports necessary for freqtrade functions to work. Obviously you can add more imports as needed for your strategy."
          - generic [ref=e868]:
            - navigation [ref=e869]:
              - button "Copy to clipboard" [ref=e870] [cursor=pointer]
            - code [ref=e871]: "# flake8: noqa: F401 # isort: skip_file # --- Do not remove these imports --- import numpy as np import pandas as pd from datetime import datetime, timedelta, timezone from pandas import DataFrame from typing import Dict, Optional, Union, Tuple from freqtrade.strategy import ( IStrategy, Trade, Order, PairLocks, informative, # @informative decorator # Hyperopt Parameters BooleanParameter, CategoricalParameter, DecimalParameter, IntParameter, RealParameter, # timeframe helpers timeframe_to_minutes, timeframe_to_next_date, timeframe_to_prev_date, # Strategy helper functions merge_informative_pair, stoploss_from_absolute, stoploss_from_open, ) # -------------------------------- # Add your lib to import here import talib.abstract as ta from technical import qtpylib"
          - heading "Strategy file loading ¶" [level=2] [ref=e872]:
            - text: Strategy file loading
            - link "¶" [ref=e873] [cursor=pointer]:
              - /url: "#strategy-file-loading"
          - paragraph [ref=e874]:
            - text: By default, freqtrade will attempt to load strategies from all
            - code [ref=e875]: .py
            - text: files within the
            - code [ref=e876]: userdir
            - text: (default
            - code [ref=e877]: user_data/strategies
            - text: ).
          - paragraph [ref=e878]:
            - text: Assuming your strategy is called
            - code [ref=e879]: AwesomeStrategy
            - text: ", stored in the file"
            - code [ref=e880]: user_data/strategies/AwesomeStrategy.py
            - text: ", then you can start freqtrade in dry (or live, depending on your configuration) mode with:"
          - generic [ref=e882]:
            - navigation [ref=e883]:
              - button "Copy to clipboard" [ref=e884] [cursor=pointer]
            - code [ref=e885]: freqtrade trade --strategy AwesomeStrategy
          - paragraph [ref=e886]: Note that we're using the class name, not the file name.
          - paragraph [ref=e887]:
            - text: You can use
            - code [ref=e888]: freqtrade list-strategies
            - text: to see a list of all strategies Freqtrade is able to load (all strategies in the correct folder). It will also include a "status" field, highlighting potential problems.
          - group [ref=e889]:
            - generic "Customize strategy directory" [ref=e890] [cursor=pointer]
          - heading "Informative Pairs ¶" [level=2] [ref=e891]:
            - text: Informative Pairs
            - link "¶" [ref=e892] [cursor=pointer]:
              - /url: "#informative-pairs"
          - heading "Get data for non-tradeable pairs ¶" [level=3] [ref=e893]:
            - text: Get data for non-tradeable pairs
            - link "¶" [ref=e894] [cursor=pointer]:
              - /url: "#get-data-for-non-tradeable-pairs"
          - paragraph [ref=e895]: Data for additional, informative pairs (reference pairs) can be beneficial for some strategies to see data on a wider timeframe.
          - paragraph [ref=e896]:
            - text: OHLCV data for these pairs will be downloaded as part of the regular whitelist refresh process and is available via
            - code [ref=e897]: DataProvider
            - text: just as other pairs (see below).
          - paragraph [ref=e898]:
            - text: These pairs will
            - strong [ref=e899]: not
            - text: be traded unless they are also specified in the pair whitelist, or have been selected by Dynamic Whitelisting, e.g.
            - code [ref=e900]: VolumePairlist
            - text: .
          - paragraph [ref=e901]:
            - text: The pairs need to be specified as tuples in the format
            - code [ref=e902]: ("pair", "timeframe")
            - text: ", with pair as the first and timeframe as the second argument."
          - paragraph [ref=e903]: "Sample:"
          - generic [ref=e905]:
            - navigation [ref=e906]:
              - button "Copy to clipboard" [ref=e907] [cursor=pointer]
            - code [ref=e908]: "def informative_pairs(self): return [(\"ETH/USDT\", \"5m\"), (\"BTC/TUSD\", \"15m\"), ]"
          - paragraph [ref=e909]:
            - text: A full sample can be found
            - link "in the DataProvider section" [ref=e910] [cursor=pointer]:
              - /url: "#complete-dataprovider-sample"
            - text: .
          - generic [ref=e911]:
            - paragraph [ref=e912]: Warning
            - paragraph [ref=e913]: As these pairs will be refreshed as part of the regular whitelist refresh, it's best to keep this list short. All timeframes and all pairs can be specified as long as they are available (and active) on the used exchange. It is however better to use resampling to longer timeframes whenever possible to avoid hammering the exchange with too many requests and risk being blocked.
          - group [ref=e914]:
            - generic "Alternative candle types" [ref=e915] [cursor=pointer]
          - separator [ref=e916]
          - heading "Informative pairs decorator (@informative()) ¶" [level=3] [ref=e917]:
            - text: Informative pairs decorator (
            - code [ref=e918]: "@informative()"
            - text: )
            - link "¶" [ref=e919] [cursor=pointer]:
              - /url: "#informative-pairs-decorator-informative"
          - paragraph [ref=e920]:
            - text: To easily define informative pairs, use the
            - code [ref=e921]: "@informative"
            - text: decorator. All decorated
            - code [ref=e922]: populate_indicators_*
            - text: methods run in isolation, and do not have access to data from other informative pairs. However, all informative dataframes for each pair are merged and passed to main
            - code [ref=e923]: populate_indicators()
            - text: method.
          - generic [ref=e924]:
            - paragraph [ref=e925]: Note
            - paragraph [ref=e926]:
              - text: Do not use the
              - code [ref=e927]: "@informative"
