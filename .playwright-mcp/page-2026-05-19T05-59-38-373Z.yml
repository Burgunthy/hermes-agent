            - code [ref=e1073]: "# fetch live / historical candle (OHLCV) data for the first informative pair inf_pair, inf_timeframe = self.informative_pairs()[0] informative = self.dp.get_pair_dataframe(pair=inf_pair, timeframe=inf_timeframe)"
          - generic [ref=e1074]:
            - paragraph [ref=e1075]: Warning about backtesting
            - paragraph [ref=e1076]:
              - text: In backtesting,
              - code [ref=e1077]: dp.get_pair_dataframe()
              - text: behavior differs depending on where it's called. Within
              - code [ref=e1078]: populate_*()
              - text: methods,
              - code [ref=e1079]: dp.get_pair_dataframe()
              - text: returns the full timerange. Please make sure to not "look into the future" to avoid surprises when running in dry/live mode. Within
              - link "callbacks" [ref=e1080] [cursor=pointer]:
                - /url: ../strategy-callbacks/
              - text: ", you'll get the full timerange up to the current (simulated) candle."
          - heading "get_analyzed_dataframe(pair, timeframe) ¶" [level=3] [ref=e1081]:
