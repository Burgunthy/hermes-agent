          - img [ref=e193]
        - paragraph [ref=e194]: DeepSeek-R1 has received a minor version upgrade to DeepSeek-R1-0528 for the 8 billion parameter distilled model and the full 671 billion parameter model. In this update, DeepSeek R1 has significantly improved its reasoning and inference capabilities. The model has demonstrated outstanding performance across various benchmark evaluations, including mathematics, programming, and general logic. Its overall performance is now approaching that of leading models, such as O3 and Gemini 2.5 Pro.
        - paragraph [ref=e195]:
          - img "image.png" [ref=e196]
        - heading "Models" [level=2] [ref=e197]
        - paragraph [ref=e198]:
          - strong [ref=e199]: DeepSeek-R1-0528-Qwen3-8B
        - code [ref=e201]: ollama run deepseek-r1
        - paragraph [ref=e202]:
          - strong [ref=e203]: DeepSeek-R1
        - code [ref=e205]: ollama run deepseek-r1:671b
        - blockquote [ref=e206]:
          - paragraph [ref=e207]:
            - text: "Note: to update the model from an older version, run"
            - code [ref=e208]: ollama pull deepseek-r1
        - heading "Distilled models" [level=3] [ref=e209]
        - paragraph [ref=e210]: DeepSeek team has demonstrated that the reasoning patterns of larger models can be distilled into smaller models, resulting in better performance compared to the reasoning patterns discovered through RL on small models.
        - paragraph [ref=e211]: Below are the models created via fine-tuning against several dense models widely used in the research community using reasoning data generated by DeepSeek-R1. The evaluation results demonstrate that the distilled smaller dense models perform exceptionally well on benchmarks.
        - paragraph [ref=e212]:
          - strong [ref=e213]: DeepSeek-R1-0528-Qwen3-8B
        - code [ref=e215]: ollama run deepseek-r1:8b
        - paragraph [ref=e216]:
          - strong [ref=e217]: DeepSeek-R1-Distill-Qwen-1.5B
        - code [ref=e219]: ollama run deepseek-r1:1.5b
        - paragraph [ref=e220]:
          - strong [ref=e221]: DeepSeek-R1-Distill-Qwen-7B
        - code [ref=e223]: ollama run deepseek-r1:7b
        - paragraph [ref=e224]:
          - strong [ref=e225]: DeepSeek-R1-Distill-Qwen-14B
        - code [ref=e227]: ollama run deepseek-r1:14b
        - paragraph [ref=e228]:
          - strong [ref=e229]: DeepSeek-R1-Distill-Qwen-32B
        - code [ref=e231]: ollama run deepseek-r1:32b
        - paragraph [ref=e232]:
          - strong [ref=e233]: DeepSeek-R1-Distill-Llama-70B
        - code [ref=e235]: ollama run deepseek-r1:70b
        - heading "License" [level=3] [ref=e236]
        - paragraph [ref=e237]: "The model weights are licensed under the MIT License. DeepSeek-R1 series support commercial use, allow for any modifications and derivative works, including, but not limited to, distillation for training other LLMs. Please note that:"
        - paragraph [ref=e238]: The Qwen distilled models are derived from Qwen-2.5 series, which are originally licensed under Apache 2.0 License, and now finetuned with 800k samples curated with DeepSeek-R1.
        - paragraph [ref=e239]: The Llama 8B distilled model is derived from Llama3.1-8B-Base and is originally licensed under llama3.1 license.
        - paragraph [ref=e240]: The Llama 70B distilled model is derived from Llama3.3-70B-Instruct and is originally licensed under llama3.3 license.
