        - paragraph [ref=e121]:
          - text: We’ve trained a pair of neural networks to solve the Rubik’s Cube with a human-like robot hand. The neural networks are trained entirely in simulation, using the same reinforcement learning code as
          - link "OpenAI Five⁠" [ref=e122] [cursor=pointer]:
            - /url: /index/openai-five/
          - text: paired with a new technique called Automatic Domain Randomization (ADR). The system can handle situations it never saw during training, such as being prodded by a
          - link "stuffed giraffe⁠" [ref=e123] [cursor=pointer]:
            - /url: /index/solving-rubiks-cube/#perturbations
          - text: . This shows that reinforcement learning isn’t just a tool for virtual tasks, but can solve physical-world problems requiring unprecedented dexterity.
        - generic [ref=e134]:
          - paragraph [ref=e135]:
            - text: Human hands let us solve a wide variety of tasks. For the past 60 years of robotics, hard tasks which humans accomplish with their fixed pair of hands have required designing a custom robot for
            - link "each task⁠ (opens in a new window)" [ref=e136] [cursor=pointer]:
              - /url: https://www.guinnessworldrecords.com/world-records/fastest-robot-to-solve-a-rubiks-cube
              - text: each task⁠
              - generic [ref=e137]: (opens in a new window)
            - text: . As an alternative, people have spent
            - link "many decades trying to use general-purpose robotic hardware⁠ (opens in a new window)" [ref=e138] [cursor=pointer]:
              - /url: https://www.youtube.com/playlist?list=PLOXw6I10VTv8XX8Qnil18ilSaZvyQ4m2S
              - text: many decades trying to use general-purpose robotic hardware⁠
              - generic [ref=e139]: (opens in a new window)
            - text: ", but with limited success due to their high degrees of freedom. In particular, the hardware we use here is not new—the robot hand we use has been around for the last 15 years—but the software approach is."
          - paragraph [ref=e140]:
            - text: Since May 2017, we’ve been trying to train a human-like robotic hand to solve the
            - link "Rubik’s Cube⁠ (opens in a new window)" [ref=e141] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/Rubik%27s_Cube
              - text: Rubik’s Cube⁠
              - generic [ref=e142]: (opens in a new window)
            - text: . We set this goal because we believe that successfully training such a robotic hand to do complex manipulation tasks lays the foundation for general-purpose robots. We solved the Rubik’s Cube in simulation in July 2017. But as of July 2018, we could only
            - link "manipulate a block⁠" [ref=e143] [cursor=pointer]:
              - /url: /index/learning-dexterity/
            - text: on the robot. Now, we’ve reached our initial goal.
        - paragraph [ref=e157]: A full solve of the Rubik’s Cube. This video plays at real-time and was not edited in any way.
        - paragraph [ref=e161]:
          - text: Solving a Rubik’s Cube one-handed is a challenging task even for humans, and it takes children several years to gain the dexterity required to master it. Our robot
          - link "still hasn’t perfected its technique⁠" [ref=e162] [cursor=pointer]:
            - /url: /index/solving-rubiks-cube/#challenges
          - text: though, as it solves the Rubik’s Cube 60% of the time (and only 20% of the time for a
          - link "maximally difficult⁠ (opens in a new window)" [ref=e163] [cursor=pointer]:
            - /url: http://cube20.org/qtm/
            - text: maximally difficult⁠
            - generic [ref=e164]: (opens in a new window)
          - text: scramble).
        - heading "Our approach" [level=2] [ref=e168]
        - paragraph [ref=e172]:
          - text: We train neural networks to solve the Rubik’s Cube in
          - link "simulation⁠ (opens in a new window)" [ref=e173] [cursor=pointer]:
            - /url: https://mujoco.org/
            - text: simulation⁠
            - generic [ref=e174]: (opens in a new window)
          - text: using
          - link "reinforcement learning" [ref=e175] [cursor=pointer]:
            - /url: /index/openai-five-defeats-dota-2-world-champions/
          - text: and
          - link "Kociemba’s algorithm⁠ (opens in a new window)" [ref=e176] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Optimal_solutions_for_Rubik%27s_Cube#Kociemba's_algorithm
            - text: Kociemba’s algorithm⁠
            - generic [ref=e177]: (opens in a new window)
          - text: for picking the solution steps.
          - superscript [ref=e178]:
            - link "A" [ref=e180] [cursor=pointer]:
              - /url: "#citation-bottom-A"
          - link "Domain⁠ (opens in a new window)" [ref=e181] [cursor=pointer]:
            - /url: https://arxiv.org/abs/1703.06907
            - text: Domain⁠
            - generic [ref=e182]: (opens in a new window)
          - link "randomization⁠ (opens in a new window)" [ref=e183] [cursor=pointer]:
            - /url: https://arxiv.org/abs/1710.06537
            - text: randomization⁠
            - generic [ref=e184]: (opens in a new window)
          - text: enables networks trained solely in simulation to transfer to a real robot.
        - img "A colorful collage of robotic arms" [ref=e193]
        - generic [ref=e196]:
          - paragraph [ref=e197]: The biggest challenge we faced was to create environments in simulation diverse enough to capture the physics of the real world. Factors like friction, elasticity and dynamics are incredibly difficult to measure and model for objects as complex as Rubik’s Cubes or robotic hands and we found that domain randomization alone is not enough.
          - paragraph [ref=e198]:
            - text: To overcome this, we developed a new method called
            - generic [ref=e199]: Automatic Domain Randomization
            - text: (ADR), which endlessly generates progressively more difficult environments in simulation.
            - superscript [ref=e200]:
              - link "B" [ref=e202] [cursor=pointer]:
                - /url: "#citation-bottom-B"
            - text: This frees us from having an accurate model of the real world, and enables the transfer of neural networks learned in simulation to be applied to the real world.
          - paragraph [ref=e203]: ADR starts with a single, nonrandomized environment, wherein a neural network learns to solve Rubik’s Cube. As the neural network gets better at the task and reaches a performance threshold, the amount of domain randomization is increased automatically. This makes the task harder, since the neural network must now learn to generalize to more randomized environments. The network keeps learning until it again exceeds the performance threshold, when more randomization kicks in, and the process is repeated.
        - status [ref=e207]:
          - generic [ref=e208]: Loading...
        - paragraph [ref=e212]: One of the parameters we randomize is the size of the Rubik’s Cube (above). ADR begins with a fixed size of the Rubik’s Cube and gradually increases the randomization range as training progresses. We apply the same technique to all other parameters, such as the mass of the cube, the friction of the robot fingers, and the visual surface materials of the hand. The neural network thus has to learn to solve the Rubik’s Cube under all of those increasingly more difficult conditions.
        - status [ref=e216]:
          - generic [ref=e217]: Loading...
        - generic [ref=e220]:
          - paragraph [ref=e221]: Domain randomization required us to manually specify randomization ranges, which is difficult since too much randomization makes learning difficult but too little randomization hinders transfer to the real robot. ADR solves this by automatically expanding randomization ranges over time with no human intervention. ADR removes the need for domain knowledge and makes it simpler to apply our methods to new tasks. In contrast to manual domain randomization, ADR also keeps the task always challenging with training never converging.
          - paragraph [ref=e222]:
            - text: We compared ADR to manual domain randomization on the block flipping task, where we already had a
            - link "strong baseline⁠" [ref=e223] [cursor=pointer]:
              - /url: /index/learning-dexterity/
            - text: . In the beginning ADR performs worse in terms of number of successes on the real robot. But as ADR increases the entropy, which is a measure of the complexity of the environment, the transfer performance eventually doubles over the baseline—without human tuning.
        - heading "Analysis" [level=2] [ref=e227]
        - heading "Testing for robustness" [level=3] [ref=e231]
        - paragraph [ref=e235]: Using ADR, we are able to train neural networks in simulation that can solve the Rubik’s Cube on the real robot hand. This is because ADR exposes the network to an endless variety of randomized simulations. It is this exposure to complexity during training that prepares the network to transfer from simulation to the real world since it has to learn to quickly identify and adjust to whatever physical world it is confronted with.
        - status [ref=e239]:
          - generic [ref=e240]: Loading...
        - generic [ref=e243]:
          - paragraph [ref=e244]: To test the limits of our method, we experiment with a variety of perturbations while the hand is solving the Rubik’s Cube. Not only does this test for the robustness of our control network but also tests our vision network, which we here use to estimate the cube’s position and orientation.
          - paragraph [ref=e245]: "We find that our system trained with ADR is surprisingly robust to perturbations even though we never trained with them: The robot can successfully perform most flips and face rotations under all tested perturbations, though not at peak performance."
        - heading "Emergent meta-learning" [level=3] [ref=e249]
        - generic [ref=e252]:
          - paragraph [ref=e253]:
            - text: We believe that
            - link "meta-learning⁠ (opens in a new window)" [ref=e254] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/Meta_learning_(computer_science)
              - text: meta-learning⁠
              - generic [ref=e255]: (opens in a new window)
            - text: ", or learning to learn, is an important prerequisite for building general-purpose systems, since it enables them to quickly adapt to changing conditions in their environments. The hypothesis behind ADR is that a memory-augmented networks combined with a sufficiently randomized environment leads to"
            - generic [ref=e256]: emergent meta-learning
            - text: ", where the network implements a learning algorithm that allows itself to rapidly adapt its behavior to the environment it is deployed in."
            - superscript [ref=e257]:
              - link "C" [ref=e259] [cursor=pointer]:
                - /url: "#citation-bottom-C"
          - paragraph [ref=e260]: To test this systematically, we measure the time to success per cube flip (rotating the cube such that a different color faces up) for our neural network under different perturbations, such as resetting the network’s memory, resetting the dynamics, or breaking a joint. We perform these experiments in simulation, which allows us to average performance over 10,000 trials in a controlled setting.
        - status [ref=e264]:
          - generic [ref=e265]: Loading...
        - generic [ref=e268]:
          - paragraph [ref=e269]: In the beginning, as the neural network successfully achieves more flips, each successive time to success decreases because the network learns to adapt. When perturbations are applied (vertical gray lines in the above chart), we see a spike in time to success. This is because the strategy the network is employing doesn’t work in the changed environment. The network then relearns about the new environment and we again see time to success decrease to the previous baseline.
          - paragraph [ref=e270]:
            - text: We also measure failure probability and performed the same experiments for face rotations (rotating the top face 90 degrees clockwise or counterclockwise) and find the same pattern of adaptation.
            - superscript [ref=e271]:
              - link "D" [ref=e273] [cursor=pointer]:
                - /url: "#citation-bottom-D"
        - heading "Understanding our neural networks" [level=3] [ref=e277]
        - paragraph [ref=e281]: Visualizing our networks enables us to understand what they are storing in memory. This becomes increasingly important as the networks grow in complexity.
        - status [ref=e285]:
          - generic [ref=e286]: Loading...
        - generic [ref=e289]:
          - paragraph [ref=e290]:
            - text: The memory of our neural network is visualized above. We use a
            - link "building block from the interpretability toolbox⁠ (opens in a new window)" [ref=e291] [cursor=pointer]:
              - /url: https://distill.pub/2018/building-blocks/
              - text: building block from the interpretability toolbox⁠
              - generic [ref=e292]: (opens in a new window)
            - text: ", namely non-negative matrix factorization, to condense this high-dimensional vector into 6 groups and assign each a unique color. We then display the color of the currently dominant group for every timestep."
          - paragraph [ref=e293]:
            - text: We find that each memory group has a semantically meaningful behavior associated with it. For example, we can tell by looking at only the dominant group of the network’s memory if it is about to spin the cube or rotate the top clockwise
            - generic [ref=e294]: before it happens
            - text: .
        - heading "Challenges" [level=2] [ref=e298]
        - generic [ref=e301]:
          - paragraph [ref=e302]:
            - text: Solving the Rubik’s Cube with a robot hand is still not easy. Our method currently solves the Rubik’s Cube 20% of the time when applying a
            - link "maximally difficult scramble⁠ (opens in a new window)" [ref=e303] [cursor=pointer]:
              - /url: http://cube20.org/qtm/
              - text: maximally difficult scramble⁠
              - generic [ref=e304]: (opens in a new window)
            - text: that requires 26 face rotations. For simpler scrambles that require 15 rotations to undo, the success rate is 60%. When the Rubik’s Cube is dropped or a timeout is reached, we consider the attempt failed. However, our network is capable of solving the Rubik’s Cube from any initial condition. So if the cube is dropped, it is possible to put it back into the hand and continue solving.
          - paragraph [ref=e305]: We generally find that our neural network is much more likely to fail during the first few face rotations and flips. This is the case because the neural network needs to balance solving the Rubik’s Cube with adapting to the physical world during those early rotations and flips.
