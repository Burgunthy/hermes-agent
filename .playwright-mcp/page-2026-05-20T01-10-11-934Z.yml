              - row "Morning Star Consists of a large black body candlestick followed by a small body (black or white) that occurs below the large black body candlestick. On the following day, a third white body candlestick is formed that closes well into the black body candlestick. It is considered a major reversal signal when it appears at the bottom. Morning Doji Star Consists of a large black body candlestick followed by a Doji that occurred below the preceding candlestick. On the following day, a third white body candlestick is formed that closes well into the black body candlestick which appeared before the Doji. It is considered a major reversal signal that is more bullish than the regular morning star pattern because of the existence of the Doji." [ref=e481]:
