              - row "Evening Star Consists of a large white body candlestick followed by a small body candlestick (black or white) that gaps above the previous. The third is a black body candlestick that closes well within the large white body. It is considered a reversal signal when it appears at the top level. Evening Doji Star Consists of three candlesticks. First is a large white body candlestick followed by a Doji that gaps above the white body. The third candlestick is a black body that closes well into the white body. When it appears at the top it is considered a reversal signal. It signals a more bearish trend than the evening star pattern because of the Doji that has appeared between the two bodies." [ref=e464]:
