      - generic "Candlestick pattern" [ref=e174]:
        - generic [ref=e176]: From Wikipedia, the free encyclopedia
        - generic [ref=e178]:
          - paragraph [ref=e179]:
            - text: In
            - link "financial" [ref=e180] [cursor=pointer]:
              - /url: /wiki/Finance
            - link "technical analysis" [ref=e181] [cursor=pointer]:
              - /url: /wiki/Technical_analysis
            - text: ", a candlestick pattern is a movement in prices shown graphically on a"
            - link "candlestick chart" [ref=e182] [cursor=pointer]:
              - /url: /wiki/Candlestick_chart
            - text: that some believe can help to identify repeating patterns of a particular market movement.
            - superscript [ref=e183]:
              - link "[1]" [ref=e184] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: The recognition of the pattern is subjective and programs that are used for charting have to rely on predefined rules to match the pattern.
            - superscript [ref=e185]:
              - link "[2]" [ref=e186] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: There are 42 recognized patterns that can be split into simple and complex patterns.
            - superscript [ref=e187]:
              - link "[3]" [ref=e188] [cursor=pointer]:
                - /url: "#cite_note-3"
          - generic [ref=e189]:
            - heading "History" [level=2] [ref=e190]
            - generic [ref=e191]:
              - text: "["
              - link "edit" [ref=e192] [cursor=pointer]:
                - /url: /w/index.php?title=Candlestick_pattern&action=edit&section=1
              - text: "]"
          - paragraph [ref=e193]:
            - text: Some of the earliest technical trading analysis was used to track prices of rice in the 18th century. Much of the credit for candlestick charting goes to
            - link "Munehisa Homma" [ref=e194] [cursor=pointer]:
              - /url: /wiki/Munehisa_Homma
            - text: (1724–1803), a rice merchant from
            - link "Sakata" [ref=e195] [cursor=pointer]:
              - /url: /wiki/Sakata,_Yamagata
            - text: ","
            - link "Japan" [ref=e196] [cursor=pointer]:
              - /url: /wiki/Japan
            - text: who traded in the Dojima Rice market in
            - link "Osaka" [ref=e197] [cursor=pointer]:
              - /url: /wiki/Osaka
            - text: during the
            - link "Tokugawa Shogunate" [ref=e198] [cursor=pointer]:
              - /url: /wiki/Tokugawa_Shogunate
            - text: . While tracking price action, he saw patterns developing. He published his work in The Fountain of Gold — The Three Monkey Record of Money in 1755. In today’s dollars, he made about $10 billion.
            - superscript [ref=e199]:
              - link "[4]" [ref=e200] [cursor=pointer]:
                - /url: "#cite_note-4"
          - paragraph [ref=e201]:
            - text: According to Steve Nison, however, candlestick charting came later, probably beginning after 1850.
            - superscript [ref=e202]:
              - link "[5]" [ref=e203] [cursor=pointer]:
                - /url: "#cite_note-5"
          - generic [ref=e204]:
            - heading "Formation of candlestick" [level=2] [ref=e205]
            - generic [ref=e206]:
              - text: "["
              - link "edit" [ref=e207] [cursor=pointer]:
                - /url: /w/index.php?title=Candlestick_pattern&action=edit&section=2
              - text: "]"
          - note [ref=e208]:
            - text: "Further information:"
            - link "Candlestick chart" [ref=e209] [cursor=pointer]:
              - /url: /wiki/Candlestick_chart
          - figure "The aspects of a candlestick pattern" [ref=e210]:
            - link [ref=e211] [cursor=pointer]:
              - /url: /wiki/File:Candlestick_chart_scheme_03-en.svg
              - img [ref=e212]
            - generic [ref=e213]: The aspects of a candlestick pattern
          - paragraph [ref=e214]:
            - text: A candlestick chart (also called Japanese candlestick chart or K-line
            - superscript [ref=e215]:
              - link "[6]" [ref=e216] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: ) is a style of financial chart used to describe price movements of a
            - link "security" [ref=e217] [cursor=pointer]:
              - /url: /wiki/Security_(finance)
            - text: ","
            - link "derivative" [ref=e218] [cursor=pointer]:
              - /url: /wiki/Derivative_(finance)
            - text: ", or"
            - link "currency" [ref=e219] [cursor=pointer]:
              - /url: /wiki/Currency
            - text: . Stock price prediction based on K-line patterns is the essence of candlestick technical analysis. However, there are some disputes on whether the K-line patterns have predictive power in academia.
          - paragraph [ref=e220]: Candlesticks are graphical representations of price movements for a given period of time.
          - paragraph [ref=e221]: They are commonly formed by the opening, high, low, and closing prices of a financial instrument.
          - paragraph [ref=e222]: If the opening price is above the closing price then a filled (normally red or black) candlestick is drawn.
          - paragraph [ref=e223]: If the closing price is above the opening price, then normally a green or hollow candlestick (white with black outline) is shown.
          - paragraph [ref=e224]: The filled or hollow portion of the candle is known as the body or real body, and can be long, normal, or short depending on its proportion to the lines above or below it.
          - paragraph [ref=e225]: The lines above and below, known as shadows, tails, or wicks, represent the high and low price ranges within a specified time period.
          - paragraph [ref=e226]: However, not all candlesticks have shadows.
