                - cell [ref=e305]
                - cell [ref=e306]
              - row "Hammer A black or white candlestick that consists of a small body near the high with little or no upper shadow and a long lower tail. Considered a bullish pattern during a downtrend. A hammer shows that although there were selling pressures during the day, ultimately a strong buying pressure drove the price back up. The colour of the body can vary, but green hammers indicate a stronger bull market than red hammers. Hanging Man A black or white candlestick that consists of a small body near the high with little or no upper shadow and a long lower tail. The lower tail should be two or three times the height of the body. Considered a bearish pattern during an uptrend." [ref=e307]:
