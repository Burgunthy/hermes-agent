          - list [ref=e912]:
            - listitem [ref=e913]:
              - link "Average directional index" [ref=e914] [cursor=pointer]:
                - /url: /wiki/Average_directional_index
              - text: – a widely used indicator of trend strength.
            - listitem [ref=e915]:
              - link "Commodity channel index" [ref=e916] [cursor=pointer]:
                - /url: /wiki/Commodity_channel_index
              - text: – identifies cyclical trends.
            - listitem [ref=e917]:
              - link "MACD" [ref=e918] [cursor=pointer]:
                - /url: /wiki/MACD
              - text: –
              - link "moving average" [ref=e919] [cursor=pointer]:
                - /url: /wiki/Moving_average
              - text: convergence/divergence.
            - listitem [ref=e920]:
              - link "Momentum" [ref=e921] [cursor=pointer]:
                - /url: /wiki/Momentum_(technical_analysis)
              - text: – the rate of price change.
            - listitem [ref=e922]:
              - link "Relative strength index" [ref=e923] [cursor=pointer]:
                - /url: /wiki/Relative_strength_index
              - text: (RSI) – oscillator showing price strength.
            - listitem [ref=e924]: Relative Vigor Index (RVI) – oscillator measures the conviction of a recent price action and the likelihood that it will continue.
            - listitem [ref=e925]:
              - link "Stochastic oscillator" [ref=e926] [cursor=pointer]:
                - /url: /wiki/Stochastic_oscillator
              - text: – close position within recent trading range.
            - listitem [ref=e927]:
              - link "Trix" [ref=e928] [cursor=pointer]:
                - /url: /wiki/Trix_(technical_analysis)
              - text: – an oscillator showing the slope of a triple-smoothed exponential
              - link "moving average" [ref=e929] [cursor=pointer]:
                - /url: /wiki/Moving_average
              - text: .
            - listitem [ref=e930]:
              - link "Vortex Indicator" [ref=e931] [cursor=pointer]:
                - /url: /wiki/Vortex_Indicator
              - text: – an indicator used to identify the existence, continuation, initiation or termination of trends.
