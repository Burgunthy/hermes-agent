              - text: – a popular
              - link "closed-form" [ref=e903] [cursor=pointer]:
                - /url: /wiki/Closed_form_expression
              - text: indicator of breadth.
            - listitem [ref=e904]:
              - link "McClellan Summation Index" [ref=e905] [cursor=pointer]:
