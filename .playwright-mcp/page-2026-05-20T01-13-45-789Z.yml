              - text: "]"
          - paragraph [ref=e896]: These indicators are based on statistics derived from the broad market.
          - list [ref=e897]:
            - listitem [ref=e898]:
              - link "Advance–decline line" [ref=e899] [cursor=pointer]:
                - /url: /wiki/Advance%E2%80%93decline_line
              - text: – a popular indicator of
              - link "market breadth" [ref=e900] [cursor=pointer]:
                - /url: /wiki/Market_breadth
              - text: .
            - listitem [ref=e901]:
              - link "McClellan Oscillator" [ref=e902] [cursor=pointer]:
