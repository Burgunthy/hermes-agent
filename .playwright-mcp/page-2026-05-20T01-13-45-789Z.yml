          - paragraph [ref=e376]:
            - text: In finance, technical analysis is an
            - link "analysis" [ref=e377] [cursor=pointer]:
              - /url: /wiki/Analysis
            - text: methodology for analysing and forecasting the direction of
            - link "prices" [ref=e378] [cursor=pointer]:
              - /url: /wiki/Prices
            - text: through the study of past market data, primarily price and volume.
            - superscript [ref=e379]:
              - link "[1]" [ref=e380] [cursor=pointer]:
                - /url: "#cite_note-Kirkpatrick_3-1"
            - text: As a type of
            - link "active management" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Active_management
            - text: ", it stands in contradiction to much of"
            - link "modern portfolio theory" [ref=e382] [cursor=pointer]:
              - /url: /wiki/Modern_portfolio_theory
            - text: . The efficacy of technical analysis is disputed by the
            - link "efficient-market hypothesis" [ref=e383] [cursor=pointer]:
              - /url: /wiki/Efficient-market_hypothesis
            - text: ", which states that stock market prices are essentially unpredictable,"
            - superscript [ref=e384]:
              - link "[2]" [ref=e385] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: and research on whether technical analysis offers any benefit has produced mixed results.
            - superscript [ref=e386]:
              - link "[3]" [ref=e387] [cursor=pointer]:
                - /url: "#cite_note-SurveysReview-3"
            - superscript [ref=e388]:
              - link "[4]" [ref=e389] [cursor=pointer]:
                - /url: "#cite_note-Osler-4"
            - superscript [ref=e390]:
              - link "[5]" [ref=e391] [cursor=pointer]:
                - /url: "#cite_note-Foundations-5"
            - text: It is distinguished from
            - link "fundamental analysis" [ref=e392] [cursor=pointer]:
              - /url: /wiki/Fundamental_analysis
            - text: ", which considers a company's financial statements, health, and the overall state of the market and economy."
          - generic [ref=e393]:
            - heading "History" [level=2] [ref=e394]
            - generic [ref=e395]:
              - text: "["
              - link "edit" [ref=e396] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=1
              - text: "]"
          - paragraph [ref=e397]:
            - text: The principles of technical analysis are derived from hundreds of years of
            - link "financial market" [ref=e398] [cursor=pointer]:
              - /url: /wiki/Financial_market
            - text: data.
            - superscript [ref=e399]:
              - link "[6]" [ref=e400] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: Some aspects of technical analysis began to appear in Amsterdam-based merchant
            - link "Joseph de la Vega" [ref=e401] [cursor=pointer]:
              - /url: /wiki/Joseph_de_la_Vega
            - text: "'s accounts of the Dutch financial markets in the 17th century. In Asia, technical analysis is said to be a method developed by"
            - link "Homma Munehisa" [ref=e402] [cursor=pointer]:
              - /url: /wiki/Homma_Munehisa
            - text: during the early 18th century which evolved into the use of
            - link "candlestick techniques" [ref=e403] [cursor=pointer]:
              - /url: /wiki/Candlestick_chart
            - text: ", and is today a technical analysis charting tool."
            - superscript [ref=e404]:
              - link "[7]" [ref=e405] [cursor=pointer]:
                - /url: "#cite_note-7"
            - superscript [ref=e406]:
              - link "[8]" [ref=e407] [cursor=pointer]:
                - /url: "#cite_note-8"
          - paragraph [ref=e408]:
            - text: Journalist
            - link "Charles Dow" [ref=e409] [cursor=pointer]:
              - /url: /wiki/Charles_Dow
            - text: (1851–1902) compiled and closely analyzed American stock market data, and published some of his conclusions in editorials for
            - link "The Wall Street Journal" [ref=e410] [cursor=pointer]:
              - /url: /wiki/The_Wall_Street_Journal
            - text: . He believed patterns and
            - link "business cycles" [ref=e411] [cursor=pointer]:
              - /url: /wiki/Business_cycle
            - text: could possibly be found in this data, a concept later known as "
            - link "Dow theory" [ref=e412] [cursor=pointer]:
              - /url: /wiki/Dow_theory
            - text: "\". However, Dow himself never advocated using his ideas as a stock trading strategy."
          - paragraph [ref=e413]:
            - text: In the 1920s and 1930s, Richard W. Schabacker published several books which continued the work of
            - link "Charles Dow" [ref=e414] [cursor=pointer]:
              - /url: /wiki/Charles_Dow
            - text: and
            - link "William Peter Hamilton" [ref=e415] [cursor=pointer]:
              - /url: /wiki/William_Peter_Hamilton
            - text: in their books Stock Market Theory and Practice and Technical Market Analysis. In 1948, Robert D. Edwards and John Magee published Technical Analysis of Stock Trends which is widely considered to be one of the seminal works of the discipline. It is exclusively concerned with trend analysis and chart patterns and remains in use to the present. Early technical analysis was almost exclusively the analysis of charts because the processing power of computers was not available for the modern degree of statistical analysis. Charles Dow reportedly originated a form of
            - link "point and figure chart" [ref=e416] [cursor=pointer]:
              - /url: /wiki/Point_and_figure_chart
            - text: analysis. With the emergence of behavioral finance as a separate discipline in economics, Paul V. Azzopardi combined technical analysis with behavioral finance and coined the term "Behavioral Technical Analysis".
            - superscript [ref=e417]:
              - link "[9]" [ref=e418] [cursor=pointer]:
                - /url: "#cite_note-9"
          - paragraph [ref=e419]:
            - text: Other pioneers of analysis techniques include
            - link "Ralph Nelson Elliott" [ref=e420] [cursor=pointer]:
              - /url: /wiki/Ralph_Nelson_Elliott
            - text: ","
            - link "William Delbert Gann" [ref=e421] [cursor=pointer]:
              - /url: /wiki/William_Delbert_Gann
            - text: ", and"
            - link "Richard Wyckoff" [ref=e422] [cursor=pointer]:
              - /url: /wiki/Richard_Wyckoff
            - text: who developed their respective techniques in the early 20th century.
            - superscript [ref=e423]:
              - text: "["
              - link "citation needed" [ref=e425] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - generic [ref=e426]:
            - heading "General description" [level=2] [ref=e427]
            - generic [ref=e428]:
              - text: "["
              - link "edit" [ref=e429] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=2
              - text: "]"
          - paragraph [ref=e430]:
            - text: Fundamental analysts examine earnings, dividends, assets, quality, ratios, new products, research and the like. Technicians employ many methods, tools and techniques, one of which is the use of charts. Using charts, technical analysts seek to identify price patterns and
            - link "market trends" [ref=e431] [cursor=pointer]:
              - /url: /wiki/Market_trend
            - text: in financial markets and attempt to exploit those patterns.
            - superscript [ref=e432]:
              - link "[10]" [ref=e433] [cursor=pointer]:
                - /url: "#cite_note-Murphy-10"
          - paragraph [ref=e434]:
            - text: Technicians using charts search for archetypal price chart patterns, such as the well-known
            - link "head and shoulders" [ref=e435] [cursor=pointer]:
              - /url: /wiki/Head_and_shoulders_(chart_pattern)
            - superscript [ref=e436]:
              - link "[11]" [ref=e437] [cursor=pointer]:
                - /url: "#cite_note-11"
            - text: or
            - link "double top/bottom" [ref=e438] [cursor=pointer]:
              - /url: /wiki/Double_top_and_double_bottom
            - text: reversal patterns, study
            - link "technical indicators" [ref=e439] [cursor=pointer]:
              - /url: /wiki/Technical_indicator
            - text: ","
            - link "moving averages" [ref=e440] [cursor=pointer]:
              - /url: /wiki/Moving_average
            - text: and look for forms such as lines of support, resistance, channels and more obscure formations such as
            - link "flags" [ref=e441] [cursor=pointer]:
              - /url: /wiki/Flag_and_pennant_patterns#The_Flag_Pattern
            - text: ","
            - link "pennants" [ref=e442] [cursor=pointer]:
              - /url: /wiki/Flag_and_pennant_patterns#Pennant_pattern
            - text: ", balance days and"
            - link "cup and handle" [ref=e443] [cursor=pointer]:
              - /url: /wiki/Cup_and_handle
            - text: patterns.
            - superscript [ref=e444]:
              - link "[12]" [ref=e445] [cursor=pointer]:
                - /url: "#cite_note-12"
          - paragraph [ref=e446]:
            - text: Technical analysts also widely use market indicators of many sorts, some of which are mathematical transformations of price, often including up and down volume, advance/decline data and other inputs. These indicators are used to help assess whether an asset is trending, and if it is, the probability of its direction and of continuation. Technicians also look for relationships between price/volume indices and market indicators. Examples include the
            - link "moving average" [ref=e447] [cursor=pointer]:
              - /url: /wiki/Moving_average
            - text: ","
            - link "relative strength index" [ref=e448] [cursor=pointer]:
              - /url: /wiki/Relative_strength_index
            - text: and
            - link "MACD" [ref=e449] [cursor=pointer]:
              - /url: /wiki/MACD
            - text: . Other avenues of study include correlations between changes in Options (
            - link "implied volatility" [ref=e450] [cursor=pointer]:
              - /url: /wiki/Implied_volatility
            - text: ) and put/call ratios with price. Also important are sentiment indicators such as Put/Call ratios, bull/bear ratios, short interest, Implied
            - link "Volatility" [ref=e451] [cursor=pointer]:
              - /url: /wiki/Volatility_(finance)
            - text: ", etc."
          - paragraph [ref=e452]:
            - text: "There are many techniques in technical analysis. Adherents of different techniques (for example: Candlestick analysis, the oldest form of technical analysis developed by a Japanese grain trader;"
            - link "Harmonics" [ref=e453] [cursor=pointer]:
              - /url: /wiki/Harmonics
            - text: ;
            - link "Dow theory" [ref=e454] [cursor=pointer]:
              - /url: /wiki/Dow_theory
            - text: ; and
            - link "Elliott wave theory" [ref=e455] [cursor=pointer]:
              - /url: /wiki/Elliott_wave_theory
            - text: ) may ignore the other approaches, yet many traders combine elements from more than one technique. Some technical analysts use subjective judgment to decide which pattern(s) a particular instrument reflects at a given time and what the interpretation of that pattern should be. Others employ a strictly mechanical or systematic approach to pattern identification and interpretation.
          - generic [ref=e456]:
            - heading "Comparison with fundamental analysis" [level=3] [ref=e457]
            - generic [ref=e458]:
              - text: "["
              - link "edit" [ref=e459] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=3
              - text: "]"
          - paragraph [ref=e460]:
            - text: Contrasting with technical analysis is
            - link "fundamental analysis" [ref=e462] [cursor=pointer]:
              - /url: /wiki/Fundamental_analysis
            - text: ": the study of economic and other underlying factors that influence the way investors price financial markets. This may include regular corporate metrics like a company's recent"
            - link "EBITDA" [ref=e463] [cursor=pointer]:
              - /url: /wiki/EBITDA
            - text: figures, the estimated impact of recent staffing changes to the
            - link "board of directors" [ref=e464] [cursor=pointer]:
              - /url: /wiki/Board_of_directors
            - text: ", geopolitical considerations, and even scientific factors like the estimated future effects of"
            - link "global warming" [ref=e465] [cursor=pointer]:
              - /url: /wiki/Global_warming
            - text: . Pure forms of technical analysis can hold that prices already reflect all the underlying fundamental factors. Uncovering future trends is what technical indicators are designed to do, although neither technical nor fundamental indicators are perfect. Some traders use technical or fundamental analysis exclusively, while others use both types to make trading decisions.
            - superscript [ref=e466]:
              - link "[13]" [ref=e467] [cursor=pointer]:
                - /url: "#cite_note-13"
            - superscript [ref=e468]:
              - link "[14]" [ref=e469] [cursor=pointer]:
                - /url: "#cite_note-Wilmott-14"
          - generic [ref=e470]:
            - heading "Comparison with quantitative analysis" [level=3] [ref=e471]
            - generic [ref=e472]:
              - text: "["
              - link "edit" [ref=e473] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=4
              - text: "]"
          - paragraph [ref=e474]:
            - text: The contrast against
            - link "quantitative analysis" [ref=e475] [cursor=pointer]:
              - /url: /wiki/Quantitative_analysis_(finance)
            - text: is less clear cut than the distinction with fundamental analysis. Some sources treat technical and quantitative analysis as more or less synonymous, while others draw a sharp distinction. For example, quantitative analysis expert
            - link "Paul Wilmott" [ref=e476] [cursor=pointer]:
              - /url: /wiki/Paul_Wilmott
            - text: suggests technical analysis is little more than 'charting' (making forecasts based on extrapolating graphical representations), and that technical analysis rarely has any predictive power.
            - superscript [ref=e477]:
              - link "[15]" [ref=e478] [cursor=pointer]:
                - /url: "#cite_note-15"
            - superscript [ref=e479]:
              - link "[14]" [ref=e480] [cursor=pointer]:
                - /url: "#cite_note-Wilmott-14"
          - generic [ref=e481]:
            - heading "Principles" [level=2] [ref=e482]
            - generic [ref=e483]:
              - text: "["
              - link "edit" [ref=e484] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=5
              - text: "]"
          - figure "Stock chart showing levels of support (4, 5, 6, 7, and 8) and resistance (1, 2, and 3). Therefore, levels of resistance tend to become levels of support and vice versa.[citation needed]" [ref=e485]:
            - link [ref=e486] [cursor=pointer]:
              - /url: /wiki/File:Soporte-resistencia_reverseroles.jpg
              - img [ref=e487]
            - generic [ref=e488]:
              - text: Stock chart showing levels of support (4, 5, 6, 7, and 8) and resistance (1, 2, and 3). Therefore, levels of resistance tend to become levels of support and vice versa.
              - superscript [ref=e489]:
                - text: "["
                - link "citation needed" [ref=e491] [cursor=pointer]:
                  - /url: /wiki/Wikipedia:Citation_needed
                - text: "]"
          - paragraph [ref=e492]:
            - text: A core principle of technical analysis is that a market's price reflects all relevant information impacting that market. A technical analyst therefore looks at the history of a security or commodity's trading pattern rather than external drivers such as economic, fundamental and news events. It is believed that price action tends to repeat itself due to the collective, patterned behavior of investors. Hence technical analysis focuses on identifiable price trends and conditions.
            - superscript [ref=e493]:
              - link "[16]" [ref=e494] [cursor=pointer]:
                - /url: "#cite_note-16"
            - superscript [ref=e495]:
              - link "[17]" [ref=e496] [cursor=pointer]:
                - /url: "#cite_note-17"
          - generic [ref=e497]:
            - heading "Market action discounts everything" [level=3] [ref=e498]
            - generic [ref=e499]:
              - text: "["
              - link "edit" [ref=e500] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=6
              - text: "]"
          - paragraph [ref=e501]: Based on the premise that all relevant information is already reflected by prices, technical analysts believe it is important to understand what investors think of that information, known and perceived.
          - generic [ref=e502]:
            - heading "Prices move in trends" [level=3] [ref=e503]
            - generic [ref=e504]:
              - text: "["
              - link "edit" [ref=e505] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=7
              - text: "]"
          - note [ref=e506]:
            - text: "See also:"
            - link "Market trend" [ref=e507] [cursor=pointer]:
              - /url: /wiki/Market_trend
          - paragraph [ref=e508]:
            - text: Technical analysts believe that prices trend directionally, i.e., up, down, or sideways (flat) or some combination. The basic definition of a price trend was originally put forward by
            - link "Dow theory" [ref=e509] [cursor=pointer]:
              - /url: /wiki/Dow_theory
            - text: .
            - superscript [ref=e510]:
              - link "[10]" [ref=e511] [cursor=pointer]:
                - /url: "#cite_note-Murphy-10"
          - paragraph [ref=e512]:
            - text: An example of a security that had an apparent trend is AOL from November 2001 through August 2002. A technical analyst or trend follower recognizing this trend would look for opportunities to sell this security. AOL consistently moves downward in price. Each time the stock rose, sellers would enter the market and sell the stock; hence the "zig-zag" movement in the price. The series of "lower highs" and "lower lows" is a tell tale sign of a stock in a down trend.
            - superscript [ref=e513]:
              - link "[18]" [ref=e514] [cursor=pointer]:
                - /url: "#cite_note-Kahn-18"
            - text: In other words, each time the stock moved lower, it fell below its previous relative low price. Each time the stock moved higher, it could not reach the level of its previous relative high price.
          - paragraph [ref=e515]: Note that the sequence of lower lows and lower highs did not begin until August. Then AOL makes a low price that does not pierce the relative low set earlier in the month. Later in the same month, the stock makes a relative high equal to the most recent relative high. In this a technician sees strong indications that the down trend is at least pausing and possibly ending, and would likely stop actively selling the stock at that point.
          - generic [ref=e516]:
            - heading "History tends to repeat itself" [level=3] [ref=e517]
            - generic [ref=e518]:
              - text: "["
              - link "edit" [ref=e519] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=8
              - text: "]"
          - paragraph [ref=e520]:
            - text: Technical analysts believe that investors collectively repeat the behavior of the investors who preceded them. To a technician, the emotions in the market may be irrational, but they exist. Because investor behavior repeats itself so often, technicians believe that recognizable (and predictable) price patterns will develop on a chart.
            - superscript [ref=e521]:
              - link "[10]" [ref=e522] [cursor=pointer]:
                - /url: "#cite_note-Murphy-10"
            - text: Recognition of these patterns can allow the technician to select trades that have a higher
            - link "probability" [ref=e523] [cursor=pointer]:
              - /url: /wiki/Probability
            - text: of success.
            - superscript [ref=e524]:
              - link "[19]" [ref=e525] [cursor=pointer]:
                - /url: "#cite_note-Baiynd2011-19"
          - paragraph [ref=e526]:
            - text: Technical analysis is not limited to charting, but it always considers price trends.
            - superscript [ref=e527]:
              - link "[1]" [ref=e528] [cursor=pointer]:
                - /url: "#cite_note-Kirkpatrick_3-1"
            - text: For example, many technicians monitor surveys of investor sentiment. These surveys gauge the
            - link "market sentiment" [ref=e529] [cursor=pointer]:
              - /url: /wiki/Market_sentiment
            - text: of participants, specifically whether they are "bearish" or "bullish". Technicians use these surveys to help determine whether a trend will continue or if a reversal could develop; they are most likely to anticipate a change when the surveys report extreme investor sentiment.
            - superscript [ref=e530]:
              - link "[20]" [ref=e531] [cursor=pointer]:
                - /url: "#cite_note-20"
            - text: Surveys that show overwhelming bullishness, for example, are evidence that an uptrend may reverse; the premise being that if most investors are bullish they have already bought the market (anticipating higher prices). And because most investors are bullish and invested, one assumes that few buyers remain. This leaves more potential sellers than buyers, despite the bullish sentiment. This suggests that prices will trend down, and is an example of
            - link "contrarian investing" [ref=e532] [cursor=pointer]:
              - /url: /wiki/Contrarian_investing
            - text: .
            - superscript [ref=e533]:
              - link "[21]" [ref=e534] [cursor=pointer]:
                - /url: "#cite_note-21"
          - generic [ref=e535]:
            - heading "Industry" [level=2] [ref=e536]
            - generic [ref=e537]:
              - text: "["
              - link "edit" [ref=e538] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=9
              - text: "]"
          - paragraph [ref=e539]:
            - text: The industry is globally represented by the International Federation of Technical Analysts (IFTA), which is a federation of regional and national organizations. In the United States, the industry is represented by both the CMT Association and the American Association of Professional Technical Analysts (AAPTA). The United States is also represented by the Technical Security Analysts Association of San Francisco (TSAASF). In the United Kingdom, the industry is represented by the Society of Technical Analysts (STA). The STA was a founding member of IFTA, has recently celebrated its 50th anniversary and certifies analysts with the Diploma in Technical Analysis. In Canada the industry is represented by the Canadian Society of Technical Analysts.
            - superscript [ref=e540]:
              - link "[22]" [ref=e541] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: In Australia, the industry is represented by the Australian Technical Analysts Association (ATAA),
            - superscript [ref=e542]:
              - link "[23]" [ref=e543] [cursor=pointer]:
                - /url: "#cite_note-23"
            - text: (which is affiliated to IFTA) and the Australian Professional Technical Analysts (APTA) Inc.
            - superscript [ref=e544]:
              - link "[24]" [ref=e545] [cursor=pointer]:
                - /url: "#cite_note-24"
          - paragraph [ref=e546]:
            - text: Professional technical analysis societies have worked on creating a body of knowledge that describes the field of Technical Analysis. A body of knowledge is central to the field as a way of defining how and why technical analysis may work. It can then be used by academia, as well as regulatory bodies, in developing proper research and standards for the field. The
            - link "CMT Association" [ref=e547] [cursor=pointer]:
              - /url: /wiki/CMT_Association
            - text: has published a body of knowledge, which is the structure for the Chartered Market Technician (CMT) exam.
            - superscript [ref=e548]:
              - link "[25]" [ref=e549] [cursor=pointer]:
                - /url: "#cite_note-25"
            - superscript [ref=e550]:
              - link "[26]" [ref=e551] [cursor=pointer]:
                - /url: "#cite_note-26"
          - generic [ref=e552]:
            - heading "Software" [level=3] [ref=e553]
            - generic [ref=e554]:
              - text: "["
              - link "edit" [ref=e555] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=10
              - text: "]"
          - note [ref=e556]:
            - text: "See also:"
            - link "List of technical analysis software" [ref=e557] [cursor=pointer]:
              - /url: /wiki/List_of_financial_market_information_services#Technical_analysis_software
            - text: and
            - link "List of charting software" [ref=e558] [cursor=pointer]:
              - /url: /wiki/List_of_charting_software
          - paragraph [ref=e559]:
            - text: Technical analysis software automates the charting, analysis and reporting functions that support technical analysts in their review and prediction of
            - link "financial markets" [ref=e560] [cursor=pointer]:
              - /url: /wiki/Financial_market
            - text: (e.g. the
            - link "stock market" [ref=e561] [cursor=pointer]:
              - /url: /wiki/Stock_market
            - text: ).
            - superscript [ref=e562]:
              - text: "["
              - link "citation needed" [ref=e564] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e565]:
            - text: In addition to installable desktop-based software packages in the traditional sense, the industry has seen an emergence of cloud-based applications and application programming interfaces (APIs) that deliver technical indicators (e.g., MACD, Bollinger Bands) via
            - link "RESTful" [ref=e566] [cursor=pointer]:
              - /url: /wiki/Representational_state_transfer
            - text: HTTP or intranet protocols.
          - paragraph [ref=e567]: Modern technical analysis software is often available as a web or a smartphone application, without the need to download and install a software package. Some of them even offer an integrated programming language and automatic backtesting tools.
          - generic [ref=e568]:
            - heading "Systematic trading" [level=2] [ref=e569]
            - generic [ref=e570]:
              - text: "["
              - link "edit" [ref=e571] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=11
              - text: "]"
          - note [ref=e572]:
            - text: "Main article:"
            - link "Systematic trading" [ref=e573] [cursor=pointer]:
              - /url: /wiki/Systematic_trading
          - generic [ref=e574]:
            - heading "Neural networks" [level=3] [ref=e575]
            - generic [ref=e576]:
              - text: "["
              - link "edit" [ref=e577] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=12
              - text: "]"
          - paragraph [ref=e578]:
            - text: Since the early 1990s when the first practically usable types emerged,
            - link "artificial neural networks" [ref=e579] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
            - text: (ANNs) have rapidly grown in popularity. They are
            - link "artificial intelligence" [ref=e580] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: adaptive software systems that have been inspired by how biological neural networks work. They are used because they can learn to detect complex patterns in data. In mathematical terms, they are universal
            - link "function approximators" [ref=e581] [cursor=pointer]:
              - /url: /wiki/Function_approximation
            - text: ","
            - superscript [ref=e582]:
              - link "[27]" [ref=e583] [cursor=pointer]:
                - /url: "#cite_note-27"
            - superscript [ref=e584]:
              - link "[28]" [ref=e585] [cursor=pointer]:
                - /url: "#cite_note-28"
            - text: meaning that given the right data and configured correctly, they can capture and model any input-output relationships. This not only removes the need for human interpretation of charts or the series of rules for generating entry/exit signals, but also provides a bridge to fundamental analysis, as the variables used in fundamental analysis can be used as input.
          - paragraph [ref=e586]:
            - text: As ANNs are essentially non-linear statistical models, their accuracy and prediction capabilities can be both mathematically and empirically tested. In various studies, authors have claimed that neural networks used for generating trading signals given various technical and fundamental inputs have significantly outperformed buy-hold strategies as well as traditional linear technical analysis methods when combined with rule-based expert systems.
            - superscript [ref=e587]:
              - link "[29]" [ref=e588] [cursor=pointer]:
                - /url: "#cite_note-29"
            - superscript [ref=e589]:
              - link "[30]" [ref=e590] [cursor=pointer]:
                - /url: "#cite_note-30"
            - superscript [ref=e591]:
              - link "[31]" [ref=e592] [cursor=pointer]:
                - /url: "#cite_note-31"
          - paragraph [ref=e593]:
            - text: While the advanced mathematical nature of such adaptive systems has kept neural networks for financial analysis mostly within academic research circles, in recent years more user friendly
            - link "neural network software" [ref=e594] [cursor=pointer]:
              - /url: /wiki/Neural_network_software
            - text: has made the technology more accessible to traders.
            - superscript [ref=e595]:
              - text: "["
              - link "citation needed" [ref=e597] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - generic [ref=e598]:
            - heading "Backtesting/Hindcasting" [level=3] [ref=e599]: Backtesting/Hindcasting
            - generic [ref=e600]:
              - text: "["
              - link "edit" [ref=e601] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=13
              - text: "]"
          - figure "Temporal representation of hindcasting[32]" [ref=e602]:
            - link [ref=e603] [cursor=pointer]:
              - /url: /wiki/File:Hindcasting.jpeg
              - img [ref=e604]
            - generic [ref=e605]:
              - text: Temporal representation of hindcasting
              - superscript [ref=e606]:
                - link "[32]" [ref=e607] [cursor=pointer]:
                  - /url: "#cite_note-32"
          - paragraph [ref=e608]:
            - text: Systematic trading is most often employed after testing an investment strategy on historic data. This is known as
            - link "backtesting" [ref=e609] [cursor=pointer]:
              - /url: /wiki/Backtesting#Hindcast
            - text: (or
            - link "hindcasting" [ref=e610] [cursor=pointer]:
              - /url: /wiki/Thought_experiment#Hindcasting
            - text: ). Backtesting is most often performed for technical indicators combined with volatility but can be applied to most investment strategies (e.g. fundamental analysis). While traditional backtesting was done by hand, this was usually only performed on human-selected stocks, and was thus prone to prior knowledge in stock selection. With the advent of computers, backtesting can be performed on entire exchanges over decades of historic data in very short amounts of time.
          - paragraph [ref=e611]:
            - text: The use of computers does have its drawbacks, being limited to algorithms that a computer can perform. Several trading strategies rely on human interpretation,
            - superscript [ref=e612]:
              - link "[33]" [ref=e613] [cursor=pointer]:
                - /url: "#cite_note-33"
            - text: and are unsuitable for computer processing.
            - superscript [ref=e614]:
              - link "[34]" [ref=e615] [cursor=pointer]:
                - /url: "#cite_note-34"
            - text: Only technical indicators which are entirely algorithmic can be programmed for computerized automated backtesting.
          - generic [ref=e616]:
            - heading "Combination with other market forecast methods" [level=2] [ref=e617]
            - generic [ref=e618]:
              - text: "["
              - link "edit" [ref=e619] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=14
              - text: "]"
          - paragraph [ref=e620]:
            - link "John Murphy" [ref=e621] [cursor=pointer]:
              - /url: /wiki/John_Murphy_(technical_analyst)
            - text: states that the principal sources of information available to technicians are price, volume and
            - link "open interest" [ref=e622] [cursor=pointer]:
              - /url: /wiki/Open_interest
            - text: .
            - superscript [ref=e623]:
              - link "[10]" [ref=e624] [cursor=pointer]:
                - /url: "#cite_note-Murphy-10"
            - text: Other data, such as indicators and
            - link "sentiment analysis" [ref=e625] [cursor=pointer]:
              - /url: /wiki/Sentiment_analysis
            - text: ", are considered secondary."
          - paragraph [ref=e626]:
            - text: However, many technical analysts reach outside pure technical analysis, combining other market forecast methods with their technical work. One advocate for this approach is
            - link "John Bollinger" [ref=e627] [cursor=pointer]:
              - /url: /wiki/John_Bollinger
            - text: ", who coined the term rational analysis in the middle 1980s for the intersection of technical analysis and fundamental analysis."
            - superscript [ref=e628]:
              - link "[35]" [ref=e629] [cursor=pointer]:
                - /url: "#cite_note-35"
            - text: Another such approach, fusion analysis, overlays fundamental analysis with technical, in an attempt to improve portfolio manager performance.
          - paragraph [ref=e630]:
            - text: Technical analysis is also often combined with
            - link "quantitative analysis" [ref=e631] [cursor=pointer]:
              - /url: /wiki/Quantitative_analyst
            - text: and economics. For example, neural networks may be used to help identify intermarket relationships.
            - superscript [ref=e632]:
              - link "[36]" [ref=e633] [cursor=pointer]:
                - /url: "#cite_note-36"
          - paragraph [ref=e634]:
            - text: Investor and newsletter polls, and magazine cover sentiment indicators, are also used by technical analysts.
            - superscript [ref=e635]:
              - link "[37]" [ref=e636] [cursor=pointer]:
                - /url: "#cite_note-37"
          - generic [ref=e637]:
            - heading "Empirical evidence" [level=2] [ref=e638]
            - generic [ref=e639]:
              - text: "["
              - link "edit" [ref=e640] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=15
              - text: "]"
          - paragraph [ref=e641]:
            - text: Whether technical analysis actually works is a matter of controversy. Methods vary greatly, and different technical analysts can sometimes make contradictory predictions from the same data. Many investors claim that they experience positive returns, but academic appraisals often find that it has little
            - link "predictive power" [ref=e642] [cursor=pointer]:
              - /url: /wiki/Predictive_power
            - text: .
            - superscript [ref=e643]:
              - link "[38]" [ref=e644] [cursor=pointer]:
                - /url: "#cite_note-38"
            - text: Of 95 modern studies, 56 concluded that technical analysis had positive results, although
            - link "data-snooping bias" [ref=e645] [cursor=pointer]:
              - /url: /wiki/Data-snooping_bias
            - text: and other problems make the analysis difficult.
            - superscript [ref=e646]:
              - link "[3]" [ref=e647] [cursor=pointer]:
                - /url: "#cite_note-SurveysReview-3"
            - text: Nonlinear prediction using
            - link "neural networks" [ref=e648] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
            - text: occasionally produces
            - link "statistically significant" [ref=e649] [cursor=pointer]:
              - /url: /wiki/Statistical_significance
            - text: prediction results.
            - superscript [ref=e650]:
              - link "[39]" [ref=e651] [cursor=pointer]:
                - /url: "#cite_note-39"
            - text: A
            - link "Federal Reserve" [ref=e652] [cursor=pointer]:
              - /url: /wiki/Federal_Reserve
            - text: working paper
            - superscript [ref=e653]:
              - link "[4]" [ref=e654] [cursor=pointer]:
                - /url: "#cite_note-Osler-4"
            - text: regarding
            - link "support and resistance" [ref=e655] [cursor=pointer]:
              - /url: /wiki/Support_and_resistance
            - text: levels in short-term foreign exchange rates "offers strong evidence that the levels help to predict intraday trend interruptions", although the "predictive power" of those levels was "found to vary across the exchange rates and firms examined".
          - paragraph [ref=e656]:
            - text: Technical trading strategies were found to be effective in the Chinese marketplace by a 2007 study that states, "Finally, we find significant positive returns on buy trades generated by the contrarian version of the
            - link "moving-average crossover" [ref=e657] [cursor=pointer]:
              - /url: /wiki/Moving-average_crossover
            - text: rule, the channel breakout rule, and the Bollinger band trading rule, after accounting for transaction costs of 0.50%."
            - superscript [ref=e658]:
              - link "[40]" [ref=e659] [cursor=pointer]:
                - /url: "#cite_note-40"
          - paragraph [ref=e660]:
            - text: An influential 1992 study by Brock et al. appeared to find support for technical trading rules.
            - superscript [ref=e661]:
              - link "[41]" [ref=e662] [cursor=pointer]:
                - /url: "#cite_note-41"
            - text: Sullivan and Timmerman tested the 1992 study for data snooping and other problems in 1999;
            - superscript [ref=e663]:
              - link "[42]" [ref=e664] [cursor=pointer]:
                - /url: "#cite_note-Sullivan1999-42"
            - text: they determined the sample covered by Brock et al. was robust to data snooping.
          - paragraph [ref=e665]:
            - text: "Subsequently, a comprehensive study of the question by Amsterdam economist Gerwin Griffioen concludes that: \"for the U.S., Japanese and most Western European stock market indices the recursive out-of-sample forecasting procedure does not show to be profitable, after implementing little transaction costs. Moreover, for sufficiently high transaction costs it is found, by estimating"
            - link "CAPMs" [ref=e666] [cursor=pointer]:
              - /url: /wiki/Capital_asset_pricing_model
            - text: ", that technical trading shows no statistically significant risk-corrected out-of-sample forecasting power for almost all of the stock market indices.\""
            - superscript [ref=e667]:
              - link "[43]" [ref=e668] [cursor=pointer]:
                - /url: "#cite_note-autogenerated1-43"
            - text: Transaction costs are particularly applicable to "momentum strategies"; a comprehensive 1996 review of the data and studies concluded that even small transaction costs would lead to an inability to capture any excess from such strategies.
            - superscript [ref=e669]:
              - link "[44]" [ref=e670] [cursor=pointer]:
                - /url: "#cite_note-Chan1996-44"
          - paragraph [ref=e671]:
            - text: In a 2000 paper published in the
            - link "Journal of Finance" [ref=e673] [cursor=pointer]:
              - /url: /wiki/Journal_of_Finance
            - text: ", professor"
            - link "Andrew W. Lo" [ref=e674] [cursor=pointer]:
              - /url: /wiki/Andrew_W._Lo
            - text: "of MIT, working with Harry Mamaysky and Jiang Wang found that:"
          - blockquote [ref=e675]:
            - paragraph [ref=e676]:
              - text: Technical analysis, also known as "charting", has been a part of financial practice for many decades, but this discipline has not received the same level of academic scrutiny and acceptance as more traditional approaches such as fundamental analysis. One of the main obstacles is the highly subjective nature of technical analysis – the presence of geometric shapes in historical price charts is often in the eyes of the beholder. In this paper, we propose a systematic and automatic approach to technical pattern recognition using nonparametric
              - link "kernel regression" [ref=e677] [cursor=pointer]:
                - /url: /wiki/Kernel_regression
              - text: ", and apply this method to a large number of U.S. stocks from 1962 to 1996 to evaluate the effectiveness of technical analysis. By comparing the unconditional empirical distribution of daily stock returns to the conditional distribution – conditioned on specific technical indicators such as head-and-shoulders or double-bottoms – we find that over the 31-year sample period, several technical indicators do provide incremental information and may have some practical value."
              - superscript [ref=e678]:
                - link "[5]" [ref=e679] [cursor=pointer]:
                  - /url: "#cite_note-Foundations-5"
          - paragraph [ref=e680]:
            - text: In that same paper Lo wrote that "several academic studies suggest that ... technical analysis may well be an effective means for extracting useful information from market prices."
            - superscript [ref=e681]:
              - link "[5]" [ref=e682] [cursor=pointer]:
                - /url: "#cite_note-Foundations-5"
            - text: Some techniques such as
            - link "Drummond Geometry" [ref=e683] [cursor=pointer]:
              - /url: /wiki/Drummond_Geometry
            - text: attempt to overcome the past data bias by projecting support and resistance levels from differing time frames into the near-term future and combining that with reversion to the mean techniques.
            - superscript [ref=e684]:
              - link "[45]" [ref=e685] [cursor=pointer]:
                - /url: "#cite_note-45"
          - generic [ref=e686]:
            - heading "Efficient-market hypothesis" [level=3] [ref=e687]
            - generic [ref=e688]:
              - text: "["
              - link "edit" [ref=e689] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=16
              - text: "]"
          - paragraph [ref=e690]:
            - text: The
            - link "efficient-market hypothesis" [ref=e691] [cursor=pointer]:
              - /url: /wiki/Efficient-market_hypothesis
            - text: (EMH) contradicts the basic tenets of technical analysis by stating that past prices cannot be used to profitably predict future prices. Thus it holds that technical analysis cannot be effective. Economist
            - link "Eugene Fama" [ref=e692] [cursor=pointer]:
              - /url: /wiki/Eugene_Fama
            - text: published the seminal paper on the EMH in the Journal of Finance in 1970, and said "In short, the evidence in support of the efficient markets model is extensive, and (somewhat uniquely in economics) contradictory evidence is sparse."
            - superscript [ref=e693]:
              - link "[46]" [ref=e694] [cursor=pointer]:
                - /url: "#cite_note-46"
          - paragraph [ref=e695]:
            - text: However, because future stock prices can be strongly influenced by investor expectations, technicians claim it only follows that past prices influence future prices.
            - superscript [ref=e696]:
              - link "[47]" [ref=e697] [cursor=pointer]:
                - /url: "#cite_note-Aronson-47"
            - text: They also point to research in the field of
            - link "behavioral finance" [ref=e698] [cursor=pointer]:
              - /url: /wiki/Behavioral_finance
            - text: ", specifically that people are not the rational participants EMH makes them out to be. Technicians have long said that irrational human behavior influences stock prices, and that this behavior leads to predictable outcomes."
            - superscript [ref=e699]:
              - link "[48]" [ref=e700] [cursor=pointer]:
                - /url: "#cite_note-Dichotomy-48"
            - text: "Author David Aronson says that the theory of behavioral finance blends with the practice of technical analysis:"
          - blockquote [ref=e701]:
            - paragraph [ref=e702]:
              - text: By considering the impact of emotions, cognitive errors, irrational preferences, and the dynamics of group behavior, behavioral finance offers succinct explanations of excess market volatility as well as the excess returns earned by stale information strategies.... cognitive errors may also explain the existence of market inefficiencies that spawn the systematic price movements that allow objective TA [technical analysis] methods to work.
              - superscript [ref=e703]:
                - link "[47]" [ref=e704] [cursor=pointer]:
                  - /url: "#cite_note-Aronson-47"
          - paragraph [ref=e705]:
            - text: EMH advocates reply that while individual market participants do not always act rationally (or have complete information), their aggregate decisions balance each other, resulting in a rational outcome (optimists who buy stock and bid the price higher are countered by pessimists who sell their stock, which keeps the price in equilibrium).
            - superscript [ref=e706]:
              - link "[49]" [ref=e707] [cursor=pointer]:
                - /url: "#cite_note-Clark-49"
            - text: Likewise, complete information is reflected in the price because all market participants bring their own individual, but incomplete, knowledge together in the market.
            - superscript [ref=e708]:
              - link "[49]" [ref=e709] [cursor=pointer]:
                - /url: "#cite_note-Clark-49"
          - generic [ref=e710]:
            - heading "Random walk hypothesis" [level=4] [ref=e711]
            - generic [ref=e712]:
              - text: "["
              - link "edit" [ref=e713] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=17
              - text: "]"
          - paragraph [ref=e714]:
            - text: The
            - link "random walk hypothesis" [ref=e715] [cursor=pointer]:
              - /url: /wiki/Random_walk_hypothesis
            - text: may be derived from the weak-form efficient markets hypothesis, which is based on the assumption that market participants take full account of any information contained in past price movements (but not necessarily other public information). In his book A Random Walk Down Wall Street, Princeton economist
            - link "Burton Malkiel" [ref=e716] [cursor=pointer]:
              - /url: /wiki/Burton_Malkiel
            - text: "said that technical forecasting tools such as pattern analysis must ultimately be self-defeating: \"The problem is that once such a regularity is known to market participants, people will act in such a way that prevents it from happening in the future.\""
            - superscript [ref=e717]:
              - link "[50]" [ref=e718] [cursor=pointer]:
                - /url: "#cite_note-50"
            - text: Malkiel has stated that while momentum may explain some stock price movements, there is not enough momentum to make excess profits. Malkiel has compared technical analysis to "
            - link "astrology" [ref=e719] [cursor=pointer]:
              - /url: /wiki/Astrology
            - text: "\"."
            - superscript [ref=e720]:
              - link "[51]" [ref=e721] [cursor=pointer]:
                - /url: "#cite_note-huebscher-51"
          - paragraph [ref=e722]:
            - text: In the late 1980s, professors Andrew Lo and Craig McKinlay published a paper which cast doubt on the random walk hypothesis. In a 1999 response to Malkiel, Lo and McKinlay collected empirical papers that questioned the hypothesis' applicability
            - superscript [ref=e723]:
              - link "[52]" [ref=e724] [cursor=pointer]:
                - /url: "#cite_note-52"
            - text: that suggested a non-random and possibly predictive component to stock price movement, though they were careful to point out that rejecting random walk does not necessarily invalidate EMH, which is an entirely separate concept from RWH. In a 2000 paper,
            - link "Andrew Lo" [ref=e725] [cursor=pointer]:
              - /url: /wiki/Andrew_Lo
            - text: back-analyzed data from the U.S. from 1962 to 1996 and found that "several technical indicators do provide incremental information and may have some practical value".
            - superscript [ref=e726]:
              - link "[5]" [ref=e727] [cursor=pointer]:
                - /url: "#cite_note-Foundations-5"
            - text: Burton Malkiel dismissed the irregularities mentioned by Lo and McKinlay as being too small to profit from.
            - superscript [ref=e728]:
              - link "[51]" [ref=e729] [cursor=pointer]:
                - /url: "#cite_note-huebscher-51"
          - paragraph [ref=e730]:
            - text: Technicians argue that the EMH and random walk theories both ignore the realities of markets, in that participants are not completely rational and that current price moves are not independent of previous moves.
            - superscript [ref=e731]:
              - link "[18]" [ref=e732] [cursor=pointer]:
                - /url: "#cite_note-Kahn-18"
            - superscript [ref=e733]:
              - link "[53]" [ref=e734] [cursor=pointer]:
                - /url: "#cite_note-53"
            - text: Some signal processing researchers negate the random walk hypothesis that stock market prices resemble
            - link "Wiener processes" [ref=e735] [cursor=pointer]:
              - /url: /wiki/Wiener_process
            - text: ", because the statistical moments of such processes and real stock data vary significantly with respect to window size and"
            - link "similarity measure" [ref=e736] [cursor=pointer]:
              - /url: /wiki/Similarity_measure
            - text: .
            - superscript [ref=e737]:
              - link "[54]" [ref=e738] [cursor=pointer]:
                - /url: "#cite_note-54"
            - text: They argue that feature transformations used for the description of audio and
            - link "biosignals" [ref=e739] [cursor=pointer]:
              - /url: /wiki/Biosignal
            - text: can also be used to predict stock market prices successfully which would contradict the random walk hypothesis.
          - paragraph [ref=e740]:
            - text: The random walk index (RWI) is a technical indicator that attempts to determine if a stock's price movement is random in nature or a result of a statistically significant trend. The random walk index attempts to determine when the market is in a strong uptrend or downtrend by measuring price ranges over N and how it differs from what would be expected by a random walk (randomly going up or down). The greater the range suggests a stronger trend.
            - superscript [ref=e741]:
              - link "[55]" [ref=e742] [cursor=pointer]:
                - /url: "#cite_note-55"
          - paragraph [ref=e743]:
            - text: Applying Kahneman and Tversky's
            - link "prospect theory" [ref=e744] [cursor=pointer]:
              - /url: /wiki/Prospect_theory
            - text: to price movements, Paul V. Azzopardi provided a possible explanation why fear makes prices fall sharply while greed pushes up prices gradually.
            - superscript [ref=e745]:
              - link "[56]" [ref=e746] [cursor=pointer]:
                - /url: "#cite_note-56"
            - text: This commonly observed behaviour of securities prices is sharply at odds with random walk. By gauging greed and fear in the market,
            - superscript [ref=e747]:
              - link "[57]" [ref=e748] [cursor=pointer]:
                - /url: "#cite_note-57"
            - text: investors can better formulate long and short portfolio stances.
          - generic [ref=e749]:
            - heading "Scientific technical analysis" [level=2] [ref=e750]
            - generic [ref=e751]:
              - text: "["
              - link "edit" [ref=e752] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=18
              - text: "]"
          - paragraph [ref=e753]:
            - text: Caginalp and Balenovich in 1994
            - superscript [ref=e754]:
              - link "[58]" [ref=e755] [cursor=pointer]:
                - /url: "#cite_note-58"
            - text: used their asset-flow differential equations model to show that the major patterns of technical analysis could be generated with some basic assumptions. Some of the patterns such as a triangle continuation or reversal pattern can be generated with the assumption of two distinct groups of investors with different assessments of valuation. The major assumptions of the models are the finiteness of assets and the use of trend as well as valuation in decision making. Many of the patterns follow as mathematically logical consequences of these assumptions.
          - paragraph [ref=e756]: One of the problems with conventional technical analysis has been the difficulty of specifying the patterns in a manner that permits objective testing.
          - paragraph [ref=e757]:
            - text: Japanese candlestick patterns involve patterns of a few days that are within an uptrend or downtrend. Caginalp and Laurent
            - superscript [ref=e758]:
              - link "[59]" [ref=e759] [cursor=pointer]:
                - /url: "#cite_note-59"
            - text: were the first to perform a successful large scale test of patterns. A mathematically precise set of criteria were tested by first using a definition of a short-term trend by smoothing the data and allowing for one deviation in the smoothed trend. They then considered eight major three-day candlestick reversal patterns in a non-parametric manner and defined the patterns as a set of inequalities. The results were positive with an overwhelming statistical confidence for each of the patterns using the data set of all S&P 500 stocks daily for the five-year period 1992–1996.
          - paragraph [ref=e760]:
            - text: Among the most basic ideas of conventional technical analysis is that a trend, once established, tends to continue. However, testing for this trend has often led researchers to conclude that stocks are a random walk. One study, performed by Poterba and Summers,
            - superscript [ref=e761]:
              - link "[60]" [ref=e762] [cursor=pointer]:
                - /url: "#cite_note-60"
            - text: found a small trend effect that was too small to be of trading value. As Fisher Black noted,
            - superscript [ref=e763]:
              - link "[61]" [ref=e764] [cursor=pointer]:
                - /url: "#cite_note-61"
            - text: "\"noise\" in trading price data makes it difficult to test hypotheses."
          - paragraph [ref=e765]:
            - text: One method for avoiding this noise was discovered in 1995 by Caginalp and Constantine
            - superscript [ref=e766]:
              - link "[62]" [ref=e767] [cursor=pointer]:
                - /url: "#cite_note-62"
            - text: who used a ratio of two essentially identical closed-end funds to eliminate any changes in valuation. A closed-end fund (unlike an open-end fund) trades independently of its net asset value and its shares cannot be redeemed, but only traded among investors as any other stock on the exchanges. In this study, the authors found that the best estimate of tomorrow's price is not yesterday's price (as the efficient-market hypothesis would indicate), nor is it the pure momentum price (namely, the same relative price change from yesterday to today continues from today to tomorrow). But rather it is almost exactly halfway between the two.
          - paragraph [ref=e768]:
            - text: Starting from the characterization of the past time evolution of market prices in terms of price velocity and price acceleration, an attempt towards a general framework for technical analysis has been developed, with the goal of establishing a principled classification of the possible patterns characterizing the deviation or defects from the random walk market state and its time translational invariant properties.
            - superscript [ref=e769]:
              - link "[63]" [ref=e770] [cursor=pointer]:
                - /url: "#cite_note-63"
            - text: The classification relies on two dimensionless parameters, the
            - link "Froude number" [ref=e771] [cursor=pointer]:
              - /url: /wiki/Froude_number
            - text: characterizing the relative strength of the acceleration with respect to the velocity and the time horizon forecast dimensionalized to the training period. Trend-following and contrarian patterns are found to coexist and depend on the dimensionless time horizon. Using a
            - link "renormalisation group" [ref=e772] [cursor=pointer]:
              - /url: /wiki/Renormalisation_group
            - text: approach, the probabilistic based scenario approach exhibits statistically significant predictive power in essentially all tested market phases.
          - paragraph [ref=e773]:
            - text: A survey of modern studies by Park and Irwin
            - superscript [ref=e774]:
              - link "[64]" [ref=e775] [cursor=pointer]:
                - /url: "#cite_note-64"
            - text: showed that most found a positive result from technical analysis.
          - paragraph [ref=e776]:
            - text: In 2011, Caginalp and DeSantis
            - superscript [ref=e777]:
              - link "[65]" [ref=e778] [cursor=pointer]:
                - /url: "#cite_note-65"
            - text: have used large data sets of closed-end funds, where comparison with valuation is possible, in order to determine quantitatively whether key aspects of technical analysis such as trend and resistance have scientific validity. Using data sets of over 100,000 points they demonstrate that trend has an effect that is at least half as important as valuation. The effects of volume and volatility, which are smaller, are also evident and statistically significant. An important aspect of their work involves the nonlinear effect of trend. Positive trends that occur within approximately 3.7 standard deviations have a positive effect. For stronger uptrends, there is a negative effect on returns, suggesting that profit taking occurs as the magnitude of the uptrend increases. For downtrends the situation is similar except that the "buying on dips" does not take place until the downtrend is a 4.6 standard deviation event. These methods can be used to examine investor behavior and compare the underlying strategies among different asset classes.
          - paragraph [ref=e779]:
            - text: In 2013, Kim Man Lui and T Chong pointed out that the past findings on technical analysis mostly reported the profitability of specific trading rules for a given set of historical data. These past studies had not taken the human trader into consideration as no real-world trader would mechanically adopt signals from any technical analysis method. Therefore, to unveil the truth of technical analysis, we should get back to understand the performance between experienced and novice traders. If the market really walks randomly, there will be no difference between these two kinds of traders. However, it is found by experiment that traders who are more knowledgeable on technical analysis significantly outperform those who are less knowledgeable.
            - superscript [ref=e780]:
              - link "[66]" [ref=e781] [cursor=pointer]:
                - /url: "#cite_note-66"
          - generic [ref=e782]:
            - heading "Ticker-tape reading" [level=2] [ref=e783]
            - generic [ref=e784]:
              - text: "["
              - link "edit" [ref=e785] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=19
              - text: "]"
          - note [ref=e786]:
            - text: "Main article:"
            - link "Ticker tape" [ref=e787] [cursor=pointer]:
              - /url: /wiki/Ticker_tape
          - paragraph [ref=e788]:
            - text: Until the mid-1960s, tape reading was a popular form of technical analysis. It consisted of reading market information such as price, volume, order size, and so on from a paper strip which ran through a machine called a
            - link "stock ticker" [ref=e789] [cursor=pointer]:
              - /url: /wiki/Stock_ticker
            - text: . Market data was sent to brokerage houses and to the homes and offices of the most active speculators. This system fell into disuse with the advent of electronic information panels in the late 60's, and later computers, which allow for the easy preparation of charts.
          - paragraph [ref=e790]:
            - link "Jesse Livermore" [ref=e791] [cursor=pointer]:
              - /url: /wiki/Jesse_Livermore
            - text: ", one of the most successful stock market operators of all time, was primarily concerned with ticker tape reading since a young age. He followed his own (mechanical) trading system (he called it the 'market key'), which did not need charts, but was relying solely on price data. He described his market key in detail in his 1940s book 'How to Trade in Stocks'."
            - superscript [ref=e792]:
              - link "[67]" [ref=e793] [cursor=pointer]:
                - /url: "#cite_note-67"
            - text: Livermore's system was determining market phases (trend, correction etc.) via past price data. He also made use of volume data (which he estimated from how stocks behaved and via 'market testing', a process of testing market liquidity via sending in small market orders), as described in his 1940s book.
          - generic [ref=e794]:
            - heading "Quotation board" [level=2] [ref=e795]
            - generic [ref=e796]:
              - text: "["
              - link "edit" [ref=e797] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=20
              - text: "]"
          - paragraph [ref=e798]:
            - text: Another form of technical analysis used so far was via interpretation of
            - link "stock market data" [ref=e799] [cursor=pointer]:
              - /url: /wiki/Stock_market_data_systems
            - text: contained in quotation boards, that in the times before
            - link "electronic screens" [ref=e800] [cursor=pointer]:
              - /url: /wiki/Electronic_visual_display
            - text: ", were huge"
            - link "chalkboards" [ref=e801] [cursor=pointer]:
              - /url: /wiki/Blackboard
            - text: located in the stock exchanges, with data of the main financial assets listed on exchanges for analysis of their movements.
            - superscript [ref=e802]:
              - link "[68]" [ref=e803] [cursor=pointer]:
                - /url: "#cite_note-68"
            - text: It was manually updated with chalk, with the updates regarding some of these data being transmitted to environments outside of exchanges (such as
            - link "brokerage houses" [ref=e804] [cursor=pointer]:
              - /url: /wiki/Brokerage_firm
            - text: ","
            - link "bucket shops" [ref=e805] [cursor=pointer]:
              - /url: /wiki/Bucket_shop_(stock_market)
            - text: ", etc.) via the aforementioned tape,"
            - link "telegraph" [ref=e806] [cursor=pointer]:
              - /url: /wiki/Telegraphy
            - text: ", telephone and later"
            - link "telex" [ref=e807] [cursor=pointer]:
              - /url: /wiki/Telex
            - text: .
            - superscript [ref=e808]:
              - link "[69]" [ref=e809] [cursor=pointer]:
                - /url: "#cite_note-69"
          - paragraph [ref=e810]:
            - text: This analysis tool was used both, on the spot, mainly by market professionals, as well as by general public through the printed versions in newspapers showing the data of the negotiations of the previous day, for
            - link "swing" [ref=e811] [cursor=pointer]:
              - /url: /wiki/Swing_trading
            - text: and
            - link "position trades" [ref=e812] [cursor=pointer]:
              - /url: /wiki/Trend_following
            - text: .
            - superscript [ref=e813]:
              - link "[70]" [ref=e814] [cursor=pointer]:
                - /url: "#cite_note-70"
          - generic [ref=e815]:
            - heading "Charting terms and indicators" [level=2] [ref=e816]
            - generic [ref=e817]:
              - text: "["
              - link "edit" [ref=e818] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=21
              - text: "]"
          - generic [ref=e819]:
            - heading "Concepts" [level=3] [ref=e820]
            - generic [ref=e821]:
              - text: "["
              - link "edit" [ref=e822] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=22
              - text: "]"
          - list [ref=e823]:
            - listitem [ref=e824]:
              - link "Average true range" [ref=e825] [cursor=pointer]:
                - /url: /wiki/Average_true_range
              - text: – averaged daily trading range, adjusted for price gaps.
            - listitem [ref=e826]:
              - link "Breakout" [ref=e827] [cursor=pointer]:
                - /url: /wiki/Breakout_(technical_analysis)
              - text: – the concept whereby prices forcefully penetrate an area of prior
              - link "support" [ref=e828] [cursor=pointer]:
                - /url: /wiki/Support_(technical_analysis)
              - text: or
              - link "resistance" [ref=e829] [cursor=pointer]:
                - /url: /wiki/Resistance_(technical_analysis)
              - text: ", usually, but not always, accompanied by an increase in volume."
            - listitem [ref=e830]:
              - link "Chart pattern" [ref=e831] [cursor=pointer]:
                - /url: /wiki/Chart_pattern
              - text: – distinctive pattern created by the movement of security or commodity prices on a chart
            - listitem [ref=e832]:
              - link "Cycles" [ref=e833] [cursor=pointer]:
                - /url: /wiki/Stock_market_cycles
              - text: – time targets for potential change in price action (price only moves up, down, or sideways)
            - listitem [ref=e834]:
              - link "Dead cat bounce" [ref=e835] [cursor=pointer]:
                - /url: /wiki/Dead_cat_bounce
              - text: – the phenomenon whereby a spectacular decline in the price of a stock is immediately followed by a moderate and temporary rise before resuming its downward movement
            - listitem [ref=e836]:
              - link "Elliott wave principle" [ref=e837] [cursor=pointer]:
                - /url: /wiki/Elliott_wave_principle
              - text: and the
              - link "golden ratio" [ref=e838] [cursor=pointer]:
                - /url: /wiki/Golden_ratio
              - text: to calculate successive price movements and retracements
            - listitem [ref=e839]:
              - link "Fibonacci ratios" [ref=e840] [cursor=pointer]:
                - /url: /wiki/Fibonacci_ratio
              - text: – used as a guide to determine support and resistance and retracement percentages
            - listitem [ref=e841]:
              - link "Momentum" [ref=e842] [cursor=pointer]:
                - /url: /wiki/Momentum_(technical_analysis)
              - text: – the rate of price change
            - listitem [ref=e843]:
              - link "Point and figure analysis" [ref=e844] [cursor=pointer]:
                - /url: /wiki/Point_and_figure_chart
              - text: – A priced-based analytical approach employing numerical filters which may incorporate time references, though ignores time entirely in its construction
            - listitem [ref=e845]:
              - link "Resistance" [ref=e846] [cursor=pointer]:
                - /url: /wiki/Resistance_(technical_analysis)
              - text: – a price level that may prompt a net increase of selling activity
            - listitem [ref=e847]:
              - link "Support" [ref=e848] [cursor=pointer]:
                - /url: /wiki/Support_(technical_analysis)
              - text: – a price level that may prompt a net increase of buying activity
            - listitem [ref=e849]:
              - link "Trending" [ref=e850] [cursor=pointer]:
                - /url: /wiki/Market_trend
              - text: – the phenomenon by which price movement tends to persist in one direction for an extended period of time
          - generic [ref=e851]:
            - heading "Types of charts" [level=3] [ref=e852]
            - generic [ref=e853]:
              - text: "["
              - link "edit" [ref=e854] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=23
              - text: "]"
          - list [ref=e855]:
            - listitem [ref=e856]:
              - link "Candlestick chart" [ref=e857] [cursor=pointer]:
                - /url: /wiki/Candlestick_chart
              - text: – Of Japanese origin and similar to OHLC, candlesticks widen and fill the interval between the open and close prices to emphasize the open/close relationship. In the West, often black or red candle bodies represent a close lower than the open, while white, green or blue candles represent a close higher than the open price.
            - listitem [ref=e858]:
              - link "Line chart" [ref=e859] [cursor=pointer]:
                - /url: /wiki/Line_chart
              - text: – Connects the closing price values with line segments. You can also choose to draw the line chart using open, high or low price.
            - listitem [ref=e860]:
              - link "Open-high-low-close chart" [ref=e861] [cursor=pointer]:
                - /url: /wiki/Open-high-low-close_chart
              - text: – OHLC charts, also known as bar charts, plot the span between the high and low prices of a trading period as a vertical line segment at the trading time, and the open and close prices with horizontal tick marks on the range line, usually a tick to the left for the open price and a tick to the right for the closing price.
            - listitem [ref=e862]:
              - link "Point and figure chart" [ref=e863] [cursor=pointer]:
                - /url: /wiki/Point_and_figure_chart
              - text: – a chart type employing numerical filters with only passing references to time, and which ignores time entirely in its construction.
          - generic [ref=e864]:
            - heading "Overlays" [level=3] [ref=e865]
            - generic [ref=e866]:
              - text: "["
              - link "edit" [ref=e867] [cursor=pointer]:
                - /url: /w/index.php?title=Technical_analysis&action=edit&section=24
              - text: "]"
          - paragraph [ref=e868]: Overlays are generally superimposed over the main price chart.
          - list [ref=e869]:
            - listitem [ref=e870]:
              - link "Bollinger bands" [ref=e871] [cursor=pointer]:
                - /url: /wiki/Bollinger_bands
              - text: – a range of price volatility
            - listitem [ref=e872]:
              - link "Channel" [ref=e873] [cursor=pointer]:
                - /url: /wiki/Price_channels
              - text: – a pair of parallel trend lines
            - listitem [ref=e874]:
              - link "Ichimoku" [ref=e875] [cursor=pointer]:
                - /url: /wiki/Ichimoku
              - text: kinko hyo – a moving average-based system that factors in time and the average point between a candle's high and low
            - listitem [ref=e876]:
              - link "Moving average" [ref=e877] [cursor=pointer]:
                - /url: /wiki/Moving_average
              - text: – an average over a window of time before and after a given time point that is repeated at each time point in the given chart. A moving average can be thought of as a kind of dynamic trend-line.
            - listitem [ref=e878]:
              - link "Parabolic SAR" [ref=e879] [cursor=pointer]:
                - /url: /wiki/Parabolic_SAR
              - text: – Wilder's
              - link "trailing stop" [ref=e880] [cursor=pointer]:
                - /url: /wiki/Stop_loss_order
              - text: based on
              - link "prices" [ref=e881] [cursor=pointer]:
                - /url: /wiki/Prices
              - text: tending to stay within a
              - link "parabolic" [ref=e882] [cursor=pointer]:
                - /url: /wiki/Parabola
              - text: curve during a strong trend
            - listitem [ref=e883]:
              - link "Pivot point" [ref=e884] [cursor=pointer]:
                - /url: /wiki/Pivot_point_(stock_market)
              - text: – derived by calculating the numerical average of a particular currency's or stock's high, low and closing prices
            - listitem [ref=e885]:
              - link "Resistance" [ref=e886] [cursor=pointer]:
                - /url: /wiki/Resistance_(technical_analysis)
              - text: – a price level that may act as a ceiling above price
            - listitem [ref=e887]:
              - link "Support" [ref=e888] [cursor=pointer]:
                - /url: /wiki/Support_(technical_analysis)
              - text: – a price level that may act as a floor below price
            - listitem [ref=e889]:
              - link "Trend line" [ref=e890] [cursor=pointer]:
                - /url: /wiki/Trend_lines_(technical_analysis)
              - text: – a sloping line described by at least two peaks or two troughs
            - listitem [ref=e891]: Zig Zag – This chart overlay that shows filtered price movements that are greater than a given percentage.
          - generic [ref=e892]:
            - heading "Breadth indicators" [level=3] [ref=e893]
            - generic [ref=e894]:
              - text: "["
              - link "edit" [ref=e895] [cursor=pointer]:
