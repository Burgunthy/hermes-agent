            - heading "Bernoulli" [level=2] [ref=e3806]
            - generic [ref=e3807]:
              - text: "["
              - link "edit" [ref=e3808] [cursor=pointer]:
                - /url: /w/index.php?title=Kelly_criterion&action=edit&section=12
              - text: "]"
          - paragraph [ref=e3809]:
            - text: In a 1738 article,
            - link "Daniel Bernoulli" [ref=e3810] [cursor=pointer]:
              - /url: /wiki/Daniel_Bernoulli
            - text: suggested that, when one has a choice of bets or investments, one should choose that with the highest
            - link "geometric mean" [ref=e3811] [cursor=pointer]:
              - /url: /wiki/Geometric_mean
            - text: of outcomes. This is mathematically equivalent to the Kelly criterion, although the motivation is different (Bernoulli wanted to resolve the
            - link "St. Petersburg paradox" [ref=e3812] [cursor=pointer]:
              - /url: /wiki/St._Petersburg_paradox
            - text: ).
          - paragraph [ref=e3813]:
            - text: An English translation of the Bernoulli article was not published until 1954,
            - superscript [ref=e3814]:
              - link "[21]" [ref=e3815] [cursor=pointer]:
                - /url: "#cite_note-Bernoulli_translation-21"
            - text: but the work was well known among mathematicians and economists.
          - generic [ref=e3816]:
            - heading "Criticism" [level=2] [ref=e3817]
            - generic [ref=e3818]:
              - text: "["
              - link "edit" [ref=e3819] [cursor=pointer]:
                - /url: /w/index.php?title=Kelly_criterion&action=edit&section=13
              - text: "]"
          - paragraph [ref=e3820]:
            - text: Although the Kelly strategy's promise of doing better than any other strategy in the long run seems compelling, some economists have argued strenuously against it, mainly because an individual's specific investing constraints may override the desire for optimal growth rate.
            - superscript [ref=e3821]:
              - link "[8]" [ref=e3822] [cursor=pointer]:
                - /url: "#cite_note-Poundstone_book_article-8"
            - text: The conventional alternative is
            - link "expected utility" [ref=e3823] [cursor=pointer]:
              - /url: /wiki/Expected_utility
            - text: theory which says bets should be sized to
            - link "maximize" [ref=e3824] [cursor=pointer]:
              - /url: /wiki/Optimization_(mathematics)
            - text: the
            - link "expected" [ref=e3825] [cursor=pointer]:
              - /url: /wiki/Expected_value
            - text: utility of the outcome (to an individual with
            - link "logarithmic" [ref=e3826] [cursor=pointer]:
              - /url: /wiki/Logarithm
            - text: utility, the Kelly bet maximizes expected utility, so there is no conflict; moreover, Kelly's original paper clearly states the need for a utility function in the case of gambling games which are played finitely many times
            - superscript [ref=e3827]:
              - link "[1]" [ref=e3828] [cursor=pointer]:
                - /url: "#cite_note-original_Kelly_article-1"
            - text: ). Even Kelly supporters usually argue for fractional Kelly (betting a fixed fraction of the amount recommended by Kelly) for a variety of practical reasons, such as wishing to reduce volatility, or protecting against non-deterministic errors in their advantage (edge) calculations.
            - superscript [ref=e3829]:
              - link "[22]" [ref=e3830] [cursor=pointer]:
                - /url: "#cite_note-22"
            - superscript [ref=e3831]:
              - text: "["
              - link "page needed" [ref=e3833] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citing_sources
              - text: "]"
            - text: In colloquial terms, the Kelly criterion requires accurate probability values, which isn't always possible for real-world event outcomes. When a gambler overestimates their true probability of winning, the criterion value calculated will diverge from the optimal, increasing the risk of ruin.
          - paragraph [ref=e3834]:
            - text: In the stock market, the Kelly bet can be thought as time diversification, which is taking equal risk during different sequential time periods (as opposed to taking equal risk in different assets for asset diversification). There is a difference between time diversification and asset diversification, which was raised by
            - link "Paul A. Samuelson" [ref=e3835] [cursor=pointer]:
              - /url: /wiki/Paul_A._Samuelson
            - text: .
            - superscript [ref=e3836]:
              - link "[23]" [ref=e3837] [cursor=pointer]:
                - /url: "#cite_note-23"
            - text: There is also a difference between ensemble-averaging (utility calculation) and time-averaging (Kelly multi-period betting over a single time path in real life). The debate was renewed by evoking
            - link "ergodicity" [ref=e3838] [cursor=pointer]:
              - /url: /wiki/Ergodicity
            - text: breaking.
            - superscript [ref=e3839]:
              - link "[24]" [ref=e3840] [cursor=pointer]:
                - /url: "#cite_note-24"
            - text: Yet the difference between
            - link "ergodicity" [ref=e3841] [cursor=pointer]:
              - /url: /wiki/Ergodicity
            - text: breaking and
            - link "Knightian uncertainty" [ref=e3842] [cursor=pointer]:
              - /url: /wiki/Knightian_uncertainty
            - text: should be recognized.
            - superscript [ref=e3843]:
              - link "[25]" [ref=e3844] [cursor=pointer]:
                - /url: "#cite_note-25"
          - generic [ref=e3845]:
