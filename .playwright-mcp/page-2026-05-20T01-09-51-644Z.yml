          - paragraph [ref=e270]:
            - text: Gamblers often state the size of their bets relative to the Kelly criterion. A full Kelly bet is a bet made at the Kelly Criterion. A half Kelly bet is half the size of a full Kelly bet. A quarter Kelly bet is a quarter of the size of a full Kelly. Gamblers would use less than full Kelly in order to reduce the chance of ruin, reduce volatility, and account for model error. Due to the high drawdowns, gamblers in practice find fractional Kellies much better emotionally than full Kelly. This reduced volatility is a tradeoff, as it increases the time to reach an intended wealth or decreases the wealth growth rate. It has been found that betting an amount larger than the Kelly amount increases the
            - link "risk of ruin" [ref=e271] [cursor=pointer]:
              - /url: /wiki/Risk_of_ruin
            - text: .
            - superscript [ref=e272]:
