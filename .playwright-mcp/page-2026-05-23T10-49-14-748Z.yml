                - generic [ref=e483]:
                  - generic [ref=e484]: python train.py task=Ant checkpoint=runs/Ant/nn/Ant.pth
                  - button "Copy code to clipboard" [ref=e486] [cursor=pointer]:
                    - img [ref=e487]
                - paragraph [ref=e490]:
                  - text: To load a trained checkpoint and only perform inference (no training), pass
                  - code [ref=e491]: test=True
                  - text: as an argument, along with the checkpoint name. To avoid rendering overhead, you may also want to run with fewer environments using
                  - code [ref=e492]: num_envs=64
                  - text: ":"
                - generic [ref=e493]:
                  - generic [ref=e494]: python train.py task=Ant checkpoint=runs/Ant/nn/Ant.pth test=True num_envs=64
                  - button "Copy code to clipboard" [ref=e496] [cursor=pointer]:
                    - img [ref=e497]
                - paragraph [ref=e500]:
                  - text: Note that If there are special characters such as
                  - code [ref=e501]: "["
                  - text: or
                  - code [ref=e502]: =
                  - text: in the checkpoint names, you will need to escape them and put quotes around the string. For example,
                  - code [ref=e503]: checkpoint="./runs/Ant/nn/last_Antep\=501rew\[5981.31\].pth"
                - generic [ref=e504]:
                  - heading "Configuration and command line arguments" [level=3] [ref=e505]
                  - 'link "Permalink: Configuration and command line arguments" [ref=e506] [cursor=pointer]':
                    - /url: "#configuration-and-command-line-arguments"
                    - img [ref=e507]
                - paragraph [ref=e509]:
                  - text: We use
                  - link "Hydra" [ref=e510] [cursor=pointer]:
                    - /url: https://hydra.cc/docs/intro/
                  - text: to manage the config. Note that this has some differences from previous incarnations in older versions of Isaac Gym.
                - paragraph [ref=e511]:
                  - text: Key arguments to the
                  - code [ref=e512]: train.py
                  - text: "script are:"
                - list [ref=e513]:
                  - listitem [ref=e514]:
                    - code [ref=e515]: task=TASK
                    - text: "- selects which task to use. Any of"
                    - code [ref=e516]: AllegroHand
                    - text: ","
                    - code [ref=e517]: AllegroHandDextremeADR
                    - text: ","
                    - code [ref=e518]: AllegroHandDextremeManualDR
                    - text: ","
                    - code [ref=e519]: AllegroKukaLSTM
                    - text: ","
                    - code [ref=e520]: AllegroKukaTwoArmsLSTM
                    - text: ","
                    - code [ref=e521]: Ant
                    - text: ","
                    - code [ref=e522]: Anymal
                    - text: ","
                    - code [ref=e523]: AnymalTerrain
                    - text: ","
                    - code [ref=e524]: BallBalance
                    - text: ","
                    - code [ref=e525]: Cartpole
                    - text: ","
                    - code [ref=e526]: FrankaCabinet
                    - text: ","
                    - code [ref=e527]: Humanoid
                    - text: ","
                    - code [ref=e528]: Ingenuity
                    - code [ref=e529]: Quadcopter
                    - text: ","
                    - code [ref=e530]: ShadowHand
                    - text: ","
                    - code [ref=e531]: ShadowHandOpenAI_FF
                    - text: ","
                    - code [ref=e532]: ShadowHandOpenAI_LSTM
                    - text: ", and"
                    - code [ref=e533]: Trifinger
                    - text: (these correspond to the config for each environment in the folder
                    - code [ref=e534]: isaacgymenvs/config/task
                    - text: )
                  - listitem [ref=e535]:
                    - code [ref=e536]: train=TRAIN
                    - text: "- selects which training config to use. Will automatically default to the correct config for the environment (ie."
                    - code [ref=e537]: <TASK>PPO
                    - text: ).
                  - listitem [ref=e538]:
                    - code [ref=e539]: num_envs=NUM_ENVS
                    - text: "- selects the number of environments to use (overriding the default number of environments set in the task config)."
                  - listitem [ref=e540]:
                    - code [ref=e541]: seed=SEED
                    - text: "- sets a seed value for randomizations, and overrides the default seed set up in the task config"
                  - listitem [ref=e542]:
                    - code [ref=e543]: sim_device=SIM_DEVICE_TYPE
                    - text: "- Device used for physics simulation. Set to"
                    - code [ref=e544]: cuda:0
                    - text: (default) to use GPU and to
                    - code [ref=e545]: cpu
                    - text: for CPU. Follows PyTorch-like device syntax.
                  - listitem [ref=e546]:
                    - code [ref=e547]: rl_device=RL_DEVICE
                    - text: "- Which device / ID to use for the RL algorithm. Defaults to"
                    - code [ref=e548]: cuda:0
                    - text: ", and also follows PyTorch-like device syntax."
                  - listitem [ref=e549]:
                    - code [ref=e550]: graphics_device_id=GRAPHICS_DEVICE_ID
                    - text: "- Which Vulkan graphics device ID to use for rendering. Defaults to 0."
                    - strong [ref=e551]: Note
                    - text: "- this may be different from CUDA device ID, and does"
                    - strong [ref=e552]: not
                    - text: follow PyTorch-like device syntax.
                  - listitem [ref=e553]:
                    - code [ref=e554]: pipeline=PIPELINE
                    - text: "- Which API pipeline to use. Defaults to"
                    - code [ref=e555]: gpu
                    - text: ", can also set to"
                    - code [ref=e556]: cpu
                    - text: . When using the
                    - code [ref=e557]: gpu
                    - text: pipeline, all data stays on the GPU and everything runs as fast as possible. When using the
                    - code [ref=e558]: cpu
                    - text: pipeline, simulation can run on either CPU or GPU, depending on the
                    - code [ref=e559]: sim_device
                    - text: setting, but a copy of the data is always made on the CPU at every step.
                  - listitem [ref=e560]:
                    - code [ref=e561]: test=TEST
                    - text: "- If set to"
                    - code [ref=e562]: "True"
                    - text: ", only runs inference on the policy and does not do any training."
                  - listitem [ref=e563]:
                    - code [ref=e564]: checkpoint=CHECKPOINT_PATH
                    - text: "- Set to path to the checkpoint to load for training or testing."
                  - listitem [ref=e565]:
                    - code [ref=e566]: headless=HEADLESS
                    - text: "- Whether to run in headless mode."
                  - listitem [ref=e567]:
                    - code [ref=e568]: experiment=EXPERIMENT
                    - text: "- Sets the name of the experiment."
                  - listitem [ref=e569]:
                    - code [ref=e570]: max_iterations=MAX_ITERATIONS
                    - text: "- Sets how many iterations to run for. Reasonable defaults are provided for the provided environments."
                - paragraph [ref=e571]:
                  - text: Hydra also allows setting variables inside config files directly as command line arguments. As an example, to set the discount rate for a rl_games training run, you can use
                  - code [ref=e572]: train.params.config.gamma=0.999
                  - text: . Similarly, variables in task configs can also be set. For example,
                  - code [ref=e573]: task.env.enableDebugVis=True
                  - text: .
                - generic [ref=e574]:
                  - heading "Hydra Notes" [level=4] [ref=e575]
                  - 'link "Permalink: Hydra Notes" [ref=e576] [cursor=pointer]':
                    - /url: "#hydra-notes"
                    - img [ref=e577]
                - paragraph [ref=e579]:
                  - text: Default values for each of these are found in the
                  - code [ref=e580]: isaacgymenvs/config/config.yaml
                  - text: file.
                - paragraph [ref=e581]:
                  - text: The way that the
                  - code [ref=e582]: task
                  - text: and
                  - code [ref=e583]: train
                  - text: portions of the config works are through the use of config groups. You can learn more about how these work
                  - link "here" [ref=e584] [cursor=pointer]:
                    - /url: https://hydra.cc/docs/tutorials/structured_config/config_groups/
                  - text: The actual configs for
                  - code [ref=e585]: task
                  - text: are in
                  - code [ref=e586]: isaacgymenvs/config/task/<TASK>.yaml
                  - text: and for train in
                  - code [ref=e587]: isaacgymenvs/config/train/<TASK>PPO.yaml
                  - text: .
                - paragraph [ref=e588]:
                  - text: In some places in the config you will find other variables referenced (for example,
                  - code [ref=e589]: "num_actors: ${....task.env.numEnvs}"
                  - text: ). Each
                  - code [ref=e590]: .
                  - text: represents going one level up in the config hierarchy. This is documented fully
                  - link "here" [ref=e591] [cursor=pointer]:
                    - /url: https://omegaconf.readthedocs.io/en/latest/usage.html#variable-interpolation
                  - text: .
                - generic [ref=e592]:
                  - heading "Tasks" [level=2] [ref=e593]
                  - 'link "Permalink: Tasks" [ref=e594] [cursor=pointer]':
                    - /url: "#tasks"
                    - img [ref=e595]
                - paragraph [ref=e597]:
                  - text: Source code for tasks can be found in
                  - code [ref=e598]: isaacgymenvs/tasks
                  - text: .
                - paragraph [ref=e599]:
                  - text: Each task subclasses the
                  - code [ref=e600]: VecEnv
                  - text: base class in
                  - code [ref=e601]: isaacgymenvs/base/vec_task.py
                  - text: .
                - paragraph [ref=e602]:
                  - text: Refer to
                  - link "docs/framework.md" [ref=e603] [cursor=pointer]:
                    - /url: /isaac-sim/IsaacGymEnvs/blob/main/docs/framework.md
                  - text: for how to create your own tasks.
                - paragraph [ref=e604]:
                  - text: Full details on each of the tasks available can be found in the
                  - link "RL examples documentation" [ref=e605] [cursor=pointer]:
                    - /url: /isaac-sim/IsaacGymEnvs/blob/main/docs/rl_examples.md
                  - text: .
                - generic [ref=e606]:
                  - heading "Domain Randomization" [level=2] [ref=e607]
                  - 'link "Permalink: Domain Randomization" [ref=e608] [cursor=pointer]':
                    - /url: "#domain-randomization"
                    - img [ref=e609]
                - paragraph [ref=e611]:
                  - text: IsaacGymEnvs includes a framework for Domain Randomization to improve Sim-to-Real transfer of trained RL policies. You can read more about it
                  - link "here" [ref=e612] [cursor=pointer]:
                    - /url: /isaac-sim/IsaacGymEnvs/blob/main/docs/domain_randomization.md
                  - text: .
                - generic [ref=e613]:
                  - heading "Reproducibility and Determinism" [level=2] [ref=e614]
                  - 'link "Permalink: Reproducibility and Determinism" [ref=e615] [cursor=pointer]':
                    - /url: "#reproducibility-and-determinism"
                    - img [ref=e616]
                - paragraph [ref=e618]:
                  - text: If deterministic training of RL policies is important for your work, you may wish to review our
                  - link "Reproducibility and Determinism Documentation" [ref=e619] [cursor=pointer]:
                    - /url: /isaac-sim/IsaacGymEnvs/blob/main/docs/reproducibility.md
                  - text: .
                - generic [ref=e620]:
                  - heading "Multi-GPU Training" [level=2] [ref=e621]
                  - 'link "Permalink: Multi-GPU Training" [ref=e622] [cursor=pointer]':
                    - /url: "#multi-gpu-training"
                    - img [ref=e623]
                - paragraph [ref=e625]:
                  - text: You can run multi-GPU training using
                  - code [ref=e626]: torchrun
                  - text: (i.e.,
                  - code [ref=e627]: torch.distributed
                  - text: ) using this repository.
                - paragraph [ref=e628]:
                  - text: Here is an example command for how to run in this way -
                  - code [ref=e629]: torchrun --standalone --nnodes=1 --nproc_per_node=2 train.py multi_gpu=True task=Ant <OTHER_ARGS>
                - paragraph [ref=e630]:
                  - text: Where the
                  - code [ref=e631]: "--nproc_per_node="
                  - text: flag specifies how many processes to run and note the
                  - code [ref=e632]: multi_gpu=True
                  - text: flag must be set on the train script in order for multi-GPU training to run.
                - generic [ref=e633]:
                  - heading "Population Based Training" [level=2] [ref=e634]
                  - 'link "Permalink: Population Based Training" [ref=e635] [cursor=pointer]':
                    - /url: "#population-based-training"
                    - img [ref=e636]
                - paragraph [ref=e638]:
                  - text: You can run population based training to help find good hyperparameters or to train on very difficult environments which would otherwise be hard to learn anything on without it. See
                  - link "the readme" [ref=e639] [cursor=pointer]:
                    - /url: /isaac-sim/IsaacGymEnvs/blob/main/docs/pbt.md
                  - text: for details.
                - generic [ref=e640]:
                  - heading "WandB support" [level=2] [ref=e641]
