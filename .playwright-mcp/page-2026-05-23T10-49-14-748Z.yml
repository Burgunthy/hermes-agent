                    - /url: "#wandb-support"
                    - img [ref=e643]
                - paragraph [ref=e645]:
                  - text: You can run
                  - link "WandB" [ref=e646] [cursor=pointer]:
                    - /url: https://wandb.ai/
                  - text: with Isaac Gym Envs by setting
                  - code [ref=e647]: wandb_activate=True
                  - text: flag from the command line. You can set the group, name, entity, and project for the run by setting the
                  - code [ref=e648]: wandb_group
                  - text: ","
                  - code [ref=e649]: wandb_name
                  - text: ","
                  - code [ref=e650]: wandb_entity
                  - text: and
                  - code [ref=e651]: wandb_project
                  - text: set. Make sure you have WandB installed with
                  - code [ref=e652]: pip install wandb
                  - text: before activating.
                - generic [ref=e653]:
                  - heading "Capture videos" [level=2] [ref=e654]
                  - 'link "Permalink: Capture videos" [ref=e655] [cursor=pointer]':
                    - /url: "#capture-videos"
                    - img [ref=e656]
                - paragraph [ref=e658]:
                  - text: We implement the standard
                  - code [ref=e659]: env.render(mode='rgb_rray')
                  - code [ref=e660]: gym
                  - text: API to provide an image of the simulator viewer. Additionally, we can leverage
                  - code [ref=e661]: gym.wrappers.RecordVideo
                  - text: to help record videos that shows agent's gameplay. Consider running the following file which should produce a video in the
                  - code [ref=e662]: videos
                  - text: folder.
                - generic [ref=e663]:
                  - generic [ref=e664]: "import gym import isaacgym import isaacgymenvs import torch num_envs = 64 envs = isaacgymenvs.make( seed=0, task=\"Ant\", num_envs=num_envs, sim_device=\"cuda:0\", rl_device=\"cuda:0\", graphics_device_id=0, headless=False, multi_gpu=False, virtual_screen_capture=True, force_render=False, ) envs.is_vector_env = True envs = gym.wrappers.RecordVideo( envs, \"./videos\", step_trigger=lambda step: step % 10000 == 0, # record the videos every 10000 steps video_length=100 # for each video record up to 100 steps ) envs.reset() print(\"the image of Isaac Gym viewer is an array of shape\", envs.render(mode=\"rgb_array\").shape) for _ in range(100): actions = 2.0 * torch.rand((num_envs,) + envs.action_space.shape, device = 'cuda:0') - 1.0 envs.step(actions)"
                  - button "Copy code to clipboard" [ref=e666] [cursor=pointer]:
                    - img [ref=e667]
