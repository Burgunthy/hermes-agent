          - paragraph [ref=e377]: N.B. This first value is the first in the time series (not the most recent) and is n periods from the beginning of the chart.
          - paragraph [ref=e378]:
            - text: The idea of ranges is that they show the commitment or enthusiasm of traders. Large or increasing ranges suggest traders prepared to continue to bid up or sell down a
            - link "stock" [ref=e379] [cursor=pointer]:
              - /url: /wiki/Stock
            - text: through the course of the day. Decreasing range suggests waning interest.
          - generic [ref=e380]:
            - heading "Applicability to futures contracts vs. stocks" [level=2] [ref=e381]
            - generic [ref=e382]:
              - text: "["
              - link "edit" [ref=e383] [cursor=pointer]:
                - /url: /w/index.php?title=Average_true_range&action=edit&section=2
              - text: "]"
          - paragraph [ref=e384]:
            - text: Since true range and ATR are calculated by subtracting prices, the volatility they compute does not change when historical prices are back-adjusted by adding or subtracting a constant to every price. Back-adjustments are often employed when splicing together individual monthly
            - link "futures contracts" [ref=e385] [cursor=pointer]:
              - /url: /wiki/Futures_contract
            - text: to form a continuous futures contract spanning a long period of time. However the standard procedures used to compute volatility of stock prices, such as the
            - link "standard deviation" [ref=e386] [cursor=pointer]:
              - /url: /wiki/Standard_deviation
            - text: of logarithmic price ratios, are not invariant (to addition of a constant). Thus futures traders and analysts typically use one method (ATR) to calculate volatility, while stock traders and analysts typically use standard deviation of log price ratios.
          - generic [ref=e387]:
            - heading "Use in position size calculation" [level=2] [ref=e388]
            - generic [ref=e389]:
              - text: "["
              - link "edit" [ref=e390] [cursor=pointer]:
                - /url: /w/index.php?title=Average_true_range&action=edit&section=3
              - text: "]"
          - paragraph [ref=e391]:
            - text: Apart from being a trend strength gauge, ATR serves as an element of position sizing in financial trading. Current ATR value (or a multiple of it) can be used as the size of the potential adverse movement (
            - link "stop-loss" [ref=e392] [cursor=pointer]:
              - /url: /wiki/Order_(exchange)#Stop_orders
            - text: distance) when calculating the trade volume based on trader's risk tolerance. In this case, ATR provides a self-adjusting risk limit dependent on the market volatility for strategies without a fixed stop-loss placement.
            - superscript [ref=e393]:
