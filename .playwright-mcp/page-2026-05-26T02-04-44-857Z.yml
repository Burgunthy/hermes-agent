                    - heading "워뇨띠 매매원칙, 매매법 정리" [level=2] [ref=e138]
                    - strong [ref=e140]: "워뇨띠: \"일년넘게 하루 차트 10시간씩 보며 기억하고 예측하고 분석하기\" 가 제일 중요하다고 생각합니다."
                    - generic [ref=e141]:
                      - strong
                    - generic [ref=e142]:
                      - paragraph [ref=e143]: 과거 차트를 분석하여 진입과 익절, 손절을 결정하는 방법은 거래 전략의 핵심 중 하나입니다.
                      - paragraph [ref=e144]: 거래량과 캔들 패턴을 병행하여 시장을 분석하면 보다 정확한 판단을 내릴 수 있습니다.
                      - paragraph [ref=e145]: 특히, 짧은 기간 동안 많은 단타를 치는 전략을 사용할 때 이러한 분석은 필수적입니다.
                      - paragraph [ref=e146]: 이익을 실현하고 자산을 관리하기 위해서는 출금을 통한 수익 실현이 중요하며, 자산 대비 안전한 레버리지를 사용하는 것이 좋습니다.
                      - paragraph [ref=e147]: 상승장과 하락장을 구분하여 투자 전략을 조정하는 것도 성공적인 거래의 중요한 요소입니다. 예를 들어, 상승장에서는 적극적인 매수 전략을, 하락장에서는 보수적인 매도 전략을 취할 수 있습니다.
                      - list [ref=e148]:
                        - listitem [ref=e149]:
                          - paragraph [ref=e150]: "거래량과 캔들 패턴을 병행하여 분석할 것: 두 가지 요소를 함께 봄으로써 시장의 움직임을 더 잘 이해할 수 있습니다. 최대한 많은 차트를 보고 패턴을 익히는 것이 중요합니다."
                        - listitem [ref=e151]:
                          - paragraph [ref=e152]: "시장에 적극적으로 참여해볼 것: 차트를 많이 보고 직접 거래에 참여하는 경험을 쌓아야 합니다."
                        - listitem [ref=e153]:
                          - paragraph [ref=e154]: "잃어도 괜찮은 비중으로 매매할 것: 손실을 감당할 수 있는 범위 내에서 거래를 해야 합니다."
                        - listitem [ref=e155]:
                          - paragraph [ref=e156]: "항상 복구할 자산을 남겨둘 것: 크게 손실을 보더라도 복구할 수 있는 자산을 남겨두는 것이 중요합니다. 자산이 적더라도 추가 입금을 지양하며, 남은 금액으로 복구하는 방법을 찾아야 합니다."
                      - paragraph [ref=e157]: 이와 같은 원칙을 따르면, 거래에서의 성공 가능성을 높일 수 있습니다. 특히 단타 매매에서는 신속한 판단과 대응이 필요하기 때문에, 위의 원칙들을 철저히 지키는 것이 중요합니다.
