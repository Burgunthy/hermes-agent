              - listitem [ref=e235]:
                - paragraph [ref=e236]:
                  - strong [ref=e237]:
                    - code [ref=e238]: session_search
                    - text: rebuilt — no LLM, no cost, 4,500× faster
                  - text: — The old
                  - code [ref=e239]: session_search
                  - text: was an aux-LLM-powered tool that cost ~$0.30/call and took ~30 seconds to summarize three sessions, sometimes confabulating when the right session wasn't even in the FTS5 hit list. The new shape is one tool with three modes (discovery, scroll, browse) inferred from which args are set — no
                  - code [ref=e240]: mode
                  - text: parameter, no aux-LLM, no config knob, no companion skill. Discovery is ~20ms instead of ~90s; scroll is ~1ms. Searching your past sessions for context is now free and instant. (
                  - link "#27590" [ref=e241] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/27590
                  - text: )
              - listitem [ref=e242]:
                - paragraph [ref=e243]:
                  - strong [ref=e244]: Promptware defense — Brainworm-class attacks blocked at three chokepoints
                  - text: — Inspired by recent Brainworm / Promptware Kill Chain research (Origin HQ, arxiv 2601.09625), Hermes now defends the context window against prompt-injection attacks that try to hijack the agent via tool output, recalled memory, or stored skills. Single source of truth (
                  - code [ref=e245]: tools/threat_patterns.py
                  - text: ) with ~15 new Brainworm/C2 patterns; recalled memory is scanned at load time; tool results get delimiter markers so a malicious file or remote service can't impersonate Hermes' own system content. Paired with a new
                  - code [ref=e246]: security-guidance
                  - text: plugin that pattern-matches dangerous code writes. (
                  - link "#32269" [ref=e247] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/32269
                  - text: ","
                  - link "#33131" [ref=e248] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/33131
                  - text: ","
                  - link "#9151" [ref=e249] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/9151
                  - text: )
              - listitem [ref=e250]:
                - paragraph [ref=e251]:
                  - strong [ref=e252]: Bitwarden Secrets Manager — one bootstrap token replaces every per-provider API key
                  - text: — Stop keeping plaintext API keys in
                  - code [ref=e253]: ~/.hermes/.env
                  - text: . Install Bitwarden Secrets Manager (
                  - code [ref=e254]: bws
                  - text: auto-installs lazily on first use), point Hermes at it with one bootstrap token (
                  - code [ref=e255]: BWS_ACCESS_TOKEN
                  - text: ), and every credential you need comes from Bitwarden at startup. Rotate a key in the Bitwarden web app and the rotation actually takes effect — Bitwarden defaults to source-of-truth so its values overwrite matching env vars on startup. Flip
                  - code [ref=e256]: "secrets.bitwarden.override_existing: false"
                  - text: to invert. EU Cloud and self-hosted Bitwarden server URLs supported. Detected credentials are now labeled with their source so you can see at a glance which keys came from Bitwarden vs. the local env. (
                  - link "#30035" [ref=e257] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/30035
                  - text: ","
                  - link "#31378" [ref=e258] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/31378
                  - text: ","
                  - link "#30364" [ref=e259] [cursor=pointer]:
                    - /url: https://github.com/NousResearch/hermes-agent/pull/30364
                  - text: )
              - listitem [ref=e260]:
                - paragraph [ref=e261]:
                  - strong [ref=e262]: ntfy as the 23rd messaging platform — push notifications without an account
                  - text: — ntfy is the self-hostable push-notification service with no signup, no API key, just a topic URL. Hermes now adapts to it as a platform plugin (zero edits to core), so your agent can send you push notifications from any cron job, kanban task completion, or chat
                  - code [ref=e263]: send_message
                  - text: — to your phone, your watch, your desktop, your homelab. (salvages
                  - link "#30625" [ref=e264] [cursor=pointer]:
