                  - strong [ref=e298]: Nous-approved MCP catalog with interactive picker
                  - text: — A curated catalog of Nous-vetted MCP servers, mirroring the optional-skills shape. Run
                  - code [ref=e299]: hermes mcp
                  - text: and you get an interactive picker; install with one keystroke, credentials prompted at install time and written to
