                - paragraph [ref=e287]:
                  - strong [ref=e288]: Two new image_gen providers — Krea 2 Medium + Large, FAL ported to plugin
                  - text: "— Krea joins the image_gen lineup as a built-in plugin:"
                  - code [ref=e289]: Krea 2 Medium
                  - text: ($0.03) and
                  - code [ref=e290]: Krea 2 Large
                  - text: ($0.06), auto-discovered, selectable via
                  - code [ref=e291]: hermes tools
                  - text: → Image Generation → Krea. Available through both the native Krea plugin and the FAL.ai catalog. The FAL.ai backend got pulled out of the monolithic image-generation tool into
                  - code [ref=e292]: plugins/image_gen/fal/
                  - text: ", completing the four-way architectural parity already established by web, browser, and video_gen — new image providers are now one file, not a fork. ("
