                - paragraph [ref=e268]:
                  - strong [ref=e269]:
                    - text: Skill bundles —
                    - code [ref=e270]: /<name>
                    - text: loads multiple skills at once
                  - text: — A skill bundle is a named group of skills that loads them all together with one slash command. Set up your "writing day" bundle (humanizer + ideation + obsidian + youtube-content) and
                  - code [ref=e271]: /writing-day
                  - text: "activates all four for the session. Skills Hub now has health checks, a freshness badge, and a watchdog cron. Three new optional skills land:"
                  - code [ref=e272]: code-wiki
                  - text: (Karpathy's LLM-Wiki, persistent indexed dev wiki),
                  - code [ref=e273]: openhands
                  - text: (delegate to OpenHands for parallel coding agents), and
                  - code [ref=e274]: web-pentest
                  - text: (OWASP-style web pentest recipes). (
