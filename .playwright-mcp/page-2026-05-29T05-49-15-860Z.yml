                  - code [ref=e200]: agent/
                  - text: ". Behavior is unchanged: every extraction keeps a thin forwarder on"
                  - code [ref=e201]: AIAgent
                  - text: ", every test patch path still works, every external caller is compatible. The reason you care: future Hermes development moves faster, plugin authors can finally grep the codebase, and the file that took 90 seconds to load in your editor opens in a blink. ("
