                - paragraph [ref=e223]:
                  - strong [ref=e224]: Cold-start perf wave keeps going — another second saved, 47% fewer per-turn function calls
                  - text: "— Three new optimization rounds: defer"
                  - code [ref=e225]: openai._base_client
                  - text: import (-240ms / -17MB on every CLI invocation), hot-path optimizations cut 47% of per-conversation function calls (399k → 213k for 31-turn chat), defer compression-feasibility check (-170 to -290ms on every agent construction), adaptive subprocess polling (-195ms per tool call, 1+ second per turn). Termux cold start drops from 2.9s to 0.8s.
                  - code [ref=e226]: hermes --version
                  - text: cold drops 63% (701ms → 258ms), flipping the head-to-head benchmark against Codex CLI from 5/11 wins to 6/11. (
                  - link "#28864" [ref=e227] [cursor=pointer]:
