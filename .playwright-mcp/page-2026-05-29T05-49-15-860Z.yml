                  - strong [ref=e205]: Kanban grew into a real multi-agent platform — 104 PRs end to end
                  - text: — Triage auto-decomposes one task into a tree of sub-tasks.
                  - code [ref=e206]: hermes kanban swarm
                  - text: creates a full Swarm v1 graph in one command — root, parallel workers, gated verifier, gated synthesizer, shared blackboard. Tasks support per-task model overrides (cheap models for boilerplate, expensive ones for hard sub-tasks), board-level default workdirs, per-task worktree paths and branches, scheduled start times, configurable claim TTL, retry fingerprinting, stale-task detection, respawn guards, and a drag-to-delete trash zone. Workers report through
                  - code [ref=e207]: /workers/active
                  - text: ","
