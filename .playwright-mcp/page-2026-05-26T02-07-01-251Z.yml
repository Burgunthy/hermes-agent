        - paragraph [ref=e111]: 워뇨띠가 강조한 것은 복잡한 보조 지표가 아닌 캔들과 거래량이었습니다. 보조 지표는 캔들과 거래량을 기반으로 만들어진 도구들이기 때문에, 보조지표를 추천하지 않았습니다. 캔들은 시장 참여자들의 심리를 반영하며, 거래량은 캔들 하나만 보기에는 시장에 노이즈가(가짜 신호) 발생하기 때문에 꼭 같이 본다고 합니다. 워뇨띠는 캔들과 거래량을 분석하여 매수와 매도의 힘을 파악했는데, 예를 들어, 꽉 찬 양봉 캔들은 강한 매수세를, 꽉 찬 음봉 캔들은 강한 매도세를 의미합니다. 이렇게 캔들과 거래량만으로 시장의 흐름을 읽어내는 것이 그의 성공 비결 중 하나였습니다.
