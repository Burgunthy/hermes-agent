        - paragraph [ref=e91]: 국내 코인 커뮤니티의 전설적인 트레이더로 유명한 ‘워뇨띠’는 19일 디시인사이드 차트 갤러리에서 커뮤니티 유저들의 질문에 답변했다.
        - heading "가상자산 시장 평가" [level=2] [ref=e92]
        - paragraph [ref=e93]: 워뇨띠는 최근 가상자산 시장에 대해서 “요즘에는 기관이 많이 유입되면서 장 난이도 자체가 높아져서 그런지 코인판에서 개인투자자의 성공사례를 찾기가 많이 어려워지긴 함. 요즘 코인시장은 비트기준으로 비싸게 느껴짐 알트는 모르겠음”이라며 투자 환경이 바뀌었음을 설명했다. 또한 유동성 주도자 개념의 ‘주포’는 거대한 시장 규모에서 신뢰하지 않지만, 기관 유입으로 개인 투자자의 수익 환경이 어려워졌다고 말했다.
        - paragraph [ref=e94]: 올해 흐름에 대해선 4월 이후 자산시장 강세가 이어진 만큼 추가 상승보다는 하락 시 매수를 고려하겠다고 답했고, 비트코인은 비싸게 느껴진다고 덧붙였다.
        - heading "비트코인 – 현재 포지션" [level=2] [ref=e95]
        - paragraph [ref=e96]: 워뇨띠는 현재 상황에 대해 바닥을 단정하기보다 비트코인(BTC)이 11만달러(약 1억5300만원) 부근에 오면 천천히 매수하겠다며 “아직 매수를 하기엔 망설여짐”이라고 답했다.
        - paragraph [ref=e97]: 현재 포지션에 대해선 “지금은 대충 바낸 비맥 평균내보면 평단 121000달러 1.3배숏 포지션입니다”라고 밝혔다. 단기 전략은 “상황에 따라 위아래로 패닉 좀 나올 것 같아서 노리는 중”이라고 덧붙였다.
        - generic:
          - insertion:
