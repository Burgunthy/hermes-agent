        - paragraph [ref=e98]: 비트코인 매수 계획에 대해선 “어디까지 떨어지겠다를 보기 보다는 110k쯤 오면 천천히 매수해 볼 생각입니다”라고 답했으며, 장기 흐름에 대해 “장기관점은 잘 모르겠습니다. 전 1월 110k가 올해 고점일 줄 알았어요”라고 언급했다.
        - paragraph [ref=e99]: 단기적으로는 차트 위주의 매매를 유지하되 2023~2024년부터는 미국 증시 개장과 경제지표 발표가 가상자산 가격에 미치는 영향을 참고한다고 설명했다.
        - heading "이더리움" [level=2] [ref=e100]
        - paragraph [ref=e101]: 이더리움 관련 질문에는 “이더는 무포”라고 답하며 보유가 없음을 밝혔고, “이더 5K가는날이 올까요”라는 질문에는 “언젠간 오지 않을까요”라고만 짧게 말했다.
        - heading "알트코인" [level=2] [ref=e102]
        - paragraph [ref=e103]: 알트코인 전략에 대해선 “시총 수십조 미만의 알트는 왠만하면 하지 않습니다. ‘운전’ 이라는 생각이 드는 알트는 그 자체로 비정상이라는 것이기에 더더욱 하지 않는 것을 추천합니다”라고 밝혔고, 소형 알트에 대해선 “개잡코는 저도 승률이 개판이라 안 건드리는 편이긴 한데.. 상승장이 생각보다 길게 진행된다면 펌핑시점이 한 번은 올 수도 있을겁니다. 전 개잡코매매는 취미삼아 전체시드의 0.1%정도로만 하고 주력으로는 절대 하지 않습니다”라고 선을 그었다.
        - heading "자산 현황" [level=2] [ref=e104]
        - paragraph [ref=e105]: 자산 현황에 대해서는 “2022년 초 3400억이 커리어하이고, 그대로 하락장을 직격으로 맞으며 2023년에 1300억선까지 떨어졌었습니다. 현재는 많이 복구했습니다”라고 언급했다.
        - heading "투자 철학" [level=2] [ref=e106]
        - paragraph [ref=e107]: 워뇨띠는 “보통 상승장이나 하락장의 초입 느낌이 들 때는 편승하기엔 이미 좋은 타점이 지나간 상황일 확률이 높습니다. 저는 보통 편승하는 매매는 잘 하지 않고 너무 싸졌을 때 매수하고, 너무 비싸졌을 때 매도하려 하는 편입니다”라 원칙을 강조했고, 목표 가격에 닿은 뒤 캔들 전개를 확인해 진입하며 지정가는 주로 취침 전에만 건다고 설명했다.
        - paragraph [ref=e108]: 워뇨띠는 과거 비트멕스 인터뷰 당시와 같이 리스크 관리 원칙을 재차 강조했다.
        - paragraph [ref=e109]: “결국 다른 매매트렌드는 바뀌더라도 ‘리스크 관리’ 하나는 불변의 진리라고 생각합니다. 한 번의 포지션으로 인해 전체 시드의 20~30% 이상의 손실을 보지 않도록 관리하는 것만으로도 장기적으로 큰 도움이 됩니다”라고 말했다.
        - blockquote [ref=e110]:
          - paragraph [ref=e111]:
            - link "워뇨띠 Q&A" [ref=e112] [cursor=pointer]:
              - /url: https://gall.dcinside.com/mgallery/board/view/?id=chartanalysis&no=3943303
            - text: – 디시인사이드 차트갤러리
        - heading "워뇨띠 주요 발언" [level=2] [ref=e113]
        - list [ref=e114]:
          - listitem [ref=e115]: 상승장이나 하락장 초입에서 편승 매매는 잘 하지 않고, 너무 싸졌을 때 매수하고 너무 비싸졌을 때 매도한다.
          - listitem [ref=e116]: 비트코인 12만달러까지 오르는 동안 대부분의 숏은 청산당하며, 고점에서 숏한 소수만 주목받는다.
          - listitem [ref=e117]: 시가총액 수십조 미만 알트는 거래하지 않고, ‘운전’이 의심되는 종목은 비정상이라 더더욱 하지 않는다.
          - listitem [ref=e118]: 목표가에 닿으면 이후 캔들을 보고 진입하며, 지정가는 주로 잠들기 전에만 건다.
          - listitem [ref=e119]: 시총 수천조 시장에서 ‘주포’ 개념은 믿지 않지만, 기관 유입으로 개인이 벌기 어려워진 건 명확하다.
          - listitem [ref=e120]: 바닥을 단정하지 않고, 비트코인이 11만달러쯤 오면 천천히 매수할 생각이다.
          - listitem [ref=e121]: 이더리움 5000달러는 언젠가 올 수 있다고 본다.
          - listitem [ref=e122]: 장기관점은 확신이 없으며, 1월 11만달러가 올해 고점일 것으로 예상했었다.
          - listitem [ref=e123]: 매매법은 본인에게 잘 맞으면 어떤 것이든 상관없으나 손실 리스크 관리가 중요하다.
          - listitem [ref=e124]: VWAP은 잘 보지 않지만 의미 있는 지표라고 생각한다.
          - listitem [ref=e125]: 현재 즐겨보는 애니메이션은 ‘최애의 아이’다.
          - listitem [ref=e126]: 단기 매매는 차트 중심이지만, 2023~2024년부터는 뉴스와 실물경기도 참고한다.
          - listitem [ref=e127]: 지금은 너무 비싸져서 이더리움은 매수하지 않는다.
          - listitem [ref=e128]: 이더리움은 현재 무포지션이다.
          - listitem [ref=e129]: 매매법에서 가장 중요한 것은 리스크 관리이며, 한 포지션으로 전체 시드의 20~30% 이상 잃지 않도록 관리하는 것이 핵심이다.
          - listitem [ref=e130]: 소형 알트코인은 취미 수준으로 전체 시드의 0.1%만 할당하며, 주력으로는 하지 않는다.
          - listitem [ref=e131]: 현재 시드는 2022년 초 3400억원이 정점이었고, 2023년 1300억원까지 줄었으나 지금은 회복했다.
          - listitem [ref=e132]: 매매 관련 책은 따로 본 적 없어 추천하기 어렵다.
          - listitem [ref=e133]: 비트코인은 아직 매수하기 망설여진다.
          - listitem [ref=e134]: 현재 평균 단가 12만1000달러의 1.3배 숏 포지션을 보유 중이다.
          - listitem [ref=e135]: 차트는 위아래로 패닉 움직임이 나올 가능성이 있어 그 흐름을 노리고 있다.
          - listitem [ref=e136]: 4월부터 자산시장 상승세가 이어졌기에 추가상승보다는 하락 시 매수를 고려한다.
          - listitem [ref=e137]: 요즘 시장은 기관 유입으로 난이도가 높아졌고, 비트코인은 비싸게 느껴진다.
          - listitem [ref=e138]: 여전히 차트매매가 단기에는 유효하다고 생각하며 제 주력이지만, 아무래도 미 증시 개장, 각종 지표발표가 코인가격에 영향을 주는건 사실이기 때문에 한 23~4년부터는 뉴스도 좀 참고하면서 실물경기를 좀 고려하며 매매하고 있습니다.
