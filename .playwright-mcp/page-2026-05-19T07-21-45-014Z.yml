              - paragraph [ref=e238]:
                - strong [ref=e239]: "Tools (5):"
                - code [ref=e240]: honcho_profile
                - text: (read/update peer card),
                - code [ref=e241]: honcho_search
                - text: (semantic search),
                - code [ref=e242]: honcho_context
                - text: (session context — summary, representation, card, messages),
                - code [ref=e243]: honcho_reasoning
                - text: (LLM-synthesized),
                - code [ref=e244]: honcho_conclude
                - text: (create/delete conclusions)
              - paragraph [ref=e245]:
                - strong [ref=e246]: "Architecture:"
                - text: Two-layer context injection — a base layer (session summary + representation + peer card, refreshed on
                - code [ref=e247]: contextCadence
                - text: ) plus a dialectic supplement (LLM reasoning, refreshed on
                - code [ref=e248]: dialecticCadence
                - text: ). The dialectic automatically selects cold-start prompts (general user facts) vs. warm prompts (session-scoped context) based on whether base context exists.
              - paragraph [ref=e249]:
                - strong [ref=e250]: Three orthogonal config knobs
                - text: "control cost and depth independently:"
              - list [ref=e251]:
                - listitem [ref=e252]:
                  - code [ref=e253]: contextCadence
                  - text: — how often the base layer refreshes (API call frequency)
                - listitem [ref=e254]:
                  - code [ref=e255]: dialecticCadence
                  - text: — how often the dialectic LLM fires (LLM call frequency)
                - listitem [ref=e256]:
                  - code [ref=e257]: dialecticDepth
                  - text: — how many
                  - code [ref=e258]: .chat()
                  - text: passes per dialectic invocation (1–3, depth of reasoning)
