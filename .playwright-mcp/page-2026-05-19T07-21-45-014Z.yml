                - text: Honcho
                - link "Direct link to Honcho" [ref=e212] [cursor=pointer]:
                  - /url: "#honcho"
                  - text: "#"
              - paragraph [ref=e213]: AI-native cross-session user modeling with dialectic reasoning, session-scoped context injection, semantic search, and persistent conclusions. Base context now includes the session summary alongside user representation and peer cards, giving the agent awareness of what has already been discussed.
