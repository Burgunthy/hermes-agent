                - strong [ref=e295]: "Multi-peer setup:"
              - paragraph [ref=e296]:
                - text: "Honcho models conversations as peers exchanging messages — one user peer plus one AI peer per Hermes profile, all sharing a workspace. The workspace is the shared environment: the user peer is global across profiles, each AI peer is its own identity. Every AI peer builds an independent representation / card from its own observations, so a"
                - code [ref=e297]: coder
                - text: profile stays code-oriented while a
                - code [ref=e298]: writer
                - text: profile stays editorial against the same user.
