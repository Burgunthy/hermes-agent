              - heading "Memory Providers" [level=1] [ref=e170]
              - paragraph [ref=e171]:
                - text: Hermes Agent ships with 8 external memory provider plugins that give the agent persistent, cross-session knowledge beyond the built-in MEMORY.md and USER.md. Only
                - strong [ref=e172]: one
                - text: external provider can be active at a time — the built-in memory is always active alongside it.
              - heading "Quick StartDirect link to Quick Start" [level=2] [ref=e173]:
                - text: Quick Start
                - link "Direct link to Quick Start" [ref=e174] [cursor=pointer]:
                  - /url: "#quick-start"
                  - text: "#"
              - code [ref=e178]:
                - generic [ref=e179]: "hermes memory setup # interactive picker + configuration"
                - generic [ref=e180]: "hermes memory status # check what's active"
                - generic [ref=e181]: "hermes memory off # disable external provider"
              - paragraph [ref=e182]:
                - text: You can also select the active memory provider via
                - code [ref=e183]: hermes plugins
                - text: → Provider Plugins → Memory Provider.
              - paragraph [ref=e184]:
                - text: Or set manually in
                - code [ref=e185]: ~/.hermes/config.yaml
                - text: ":"
              - code [ref=e189]:
                - generic [ref=e190]: "memory:"
                - generic [ref=e191]: "provider: openviking # or honcho, mem0, hindsight, holographic, retaindb, byterover, supermemory"
              - heading "How It WorksDirect link to How It Works" [level=2] [ref=e192]:
                - text: How It Works
                - link "Direct link to How It Works" [ref=e193] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - text: "#"
              - paragraph [ref=e194]: "When a memory provider is active, Hermes automatically:"
              - list [ref=e195]:
                - listitem [ref=e196]:
                  - strong [ref=e197]: Injects provider context
                  - text: into the system prompt (what the provider knows)
                - listitem [ref=e198]:
                  - strong [ref=e199]: Prefetches relevant memories
                  - text: before each turn (background, non-blocking)
                - listitem [ref=e200]:
                  - strong [ref=e201]: Syncs conversation turns
                  - text: to the provider after each response
                - listitem [ref=e202]:
                  - strong [ref=e203]: Extracts memories on session end
                  - text: (for providers that support it)
                - listitem [ref=e204]:
                  - strong [ref=e205]: Mirrors built-in memory writes
                  - text: to the external provider
                - listitem [ref=e206]:
                  - strong [ref=e207]: Adds provider-specific tools
                  - text: so the agent can search, store, and manage memories
              - paragraph [ref=e208]: The built-in memory (MEMORY.md / USER.md) continues to work exactly as before. The external provider is additive.
              - heading "Available ProvidersDirect link to Available Providers" [level=2] [ref=e209]:
                - text: Available Providers
                - link "Direct link to Available Providers" [ref=e210] [cursor=pointer]:
