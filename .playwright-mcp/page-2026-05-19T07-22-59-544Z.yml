              - paragraph [ref=e3372]: "Configure subagent behavior for the delegate tool:"
              - generic [ref=e3374]:
                - code [ref=e3376]:
                  - generic [ref=e3377]: "delegation:"
                  - generic [ref=e3378]: "# model: \"google/gemini-3-flash-preview\" # Override model (empty = inherit parent)"
                  - generic [ref=e3379]: "# provider: \"openrouter\" # Override provider (empty = inherit parent)"
                  - generic [ref=e3380]: "# base_url: \"http://localhost:1234/v1\" # Direct OpenAI-compatible endpoint (takes precedence over provider)"
                  - generic [ref=e3381]: "# api_key: \"local-key\" # API key for base_url (falls back to OPENAI_API_KEY)"
                  - generic [ref=e3382]: "# api_mode: \"\" # Wire protocol for base_url: \"chat_completions\", \"codex_responses\", or \"anthropic_messages\". Empty = auto-detect from URL (e.g. /anthropic suffix → anthropic_messages). Set explicitly for non-standard endpoints the heuristic can't detect."
                  - generic [ref=e3383]: "max_concurrent_children: 3 # Parallel children per batch (floor 1, no ceiling). Also via DELEGATION_MAX_CONCURRENT_CHILDREN env var."
                  - generic [ref=e3384]: "max_spawn_depth: 1 # Delegation tree depth cap (1-3, clamped). 1 = flat (default): parent spawns leaves that cannot delegate. 2 = orchestrator children can spawn leaf grandchildren. 3 = three levels."
                  - generic [ref=e3385]: "orchestrator_enabled: true # Global kill switch. When false, role=\"orchestrator\" is ignored and every child is forced to leaf regardless of max_spawn_depth."
                - generic [ref=e3386]:
