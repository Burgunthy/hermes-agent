                - text: to the
                - code [ref=e902]: docker run
                - text: command so files written into bind-mounted directories (
                - code [ref=e903]: /workspace
                - text: ","
                - code [ref=e904]: /root
                - text: ", anything in"
                - code [ref=e905]: docker_volumes
                - text: ") are owned by your host user, not root. The trade-off: the container can no longer"
                - code [ref=e906]: apt install
                - text: or write to root-owned paths like
                - code [ref=e907]: /root/.npm
                - text: — use a base image whose
                - code [ref=e908]: HOME
                - text: is owned by a non-root user (or add your required tooling at image build time) if you need both.
              - paragraph [ref=e909]:
                - text: Leave this
                - code [ref=e910]: "false"
                - text: (the default) for backwards-compatible behavior. Turn it on when your workflow is mostly "edit mounted host files" and you're tired of
                - code [ref=e911]: sudo chown -R
                - text: .
              - 'heading "Optional: Mount the Launch Directory into /workspaceDirect link to optional-mount-the-launch-directory-into-workspace" [level=3] [ref=e912]':
                - text: "Optional: Mount the Launch Directory into"
                - code [ref=e913]: /workspace
