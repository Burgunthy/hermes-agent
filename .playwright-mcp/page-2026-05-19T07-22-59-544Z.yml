                  - generic [ref=e2897]: "disk:"
                  - generic [ref=e2898]: "type: exec"
                  - generic [ref=e2899]: "command: df -h /"
                  - generic [ref=e2900]: "update:"
                  - generic [ref=e2901]: "type: exec"
                  - generic [ref=e2902]: "command: cd ~/.hermes/hermes-agent && git pull && pip install -e ."
                  - generic [ref=e2903]: "gpu:"
                  - generic [ref=e2904]: "type: exec"
                  - generic [ref=e2905]: "command: nvidia-smi --query-gpu=name,utilization.gpu,memory.used,memory.total --format=csv,noheader"
