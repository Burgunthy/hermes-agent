                - text: ), so a toolset listed here is always removed — even if a platform's saved config still lists it. Use this when you want a single switch for "turn X off everywhere" rather than editing 15+ platform rows in the
                - code [ref=e1243]: hermes tools
                - text: UI.
              - paragraph [ref=e1244]: Leaving the list empty, or omitting the key, is a no-op.
              - heading "Git Worktree IsolationDirect link to Git Worktree Isolation" [level=2] [ref=e1245]:
                - text: Git Worktree Isolation
                - link "Direct link to Git Worktree Isolation" [ref=e1246] [cursor=pointer]:
                  - /url: "#git-worktree-isolation"
                  - text: "#"
              - paragraph [ref=e1247]: "Enable isolated git worktrees for running multiple agents in parallel on the same repo:"
              - generic [ref=e1249]:
                - code [ref=e1251]:
                  - generic [ref=e1252]: "worktree: true # Always create a worktree (same as hermes -w)"
                  - generic [ref=e1253]: "# worktree: false # Default — only when -w flag is passed"
                - button "Copy code to clipboard" [ref=e1255] [cursor=pointer]:
                  - generic [ref=e1256]:
                    - img [ref=e1257]
                    - img [ref=e1259]
              - paragraph [ref=e1261]:
                - text: When enabled, each CLI session creates a fresh worktree under
                - code [ref=e1262]: .worktrees/
                - text: with its own branch. Agents can edit files, commit, push, and create PRs without interfering with each other. Clean worktrees are removed on exit; dirty ones are kept for manual recovery.
              - paragraph [ref=e1263]:
                - text: You can also list gitignored files to copy into worktrees via
                - code [ref=e1264]: .worktreeinclude
                - text: "in your repo root:"
              - generic [ref=e1266]:
