                - text: For cloud sandboxes such as Modal, Daytona, and Vercel Sandbox,
                - code [ref=e295]: "container_persistent: true"
                - text: means Hermes will try to preserve filesystem state across sandbox recreation. It does not promise that the same live sandbox, PID space, or background processes will still be running later.
