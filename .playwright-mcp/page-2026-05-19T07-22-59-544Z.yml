              - paragraph [ref=e246]:
                - text: "Multiple references in a single value work:"
                - code [ref=e247]: "url: \"${HOST}:${PORT}\""
                - text: . If a referenced variable is not set, the placeholder is kept verbatim (
                - code [ref=e248]: "${UNDEFINED_VAR}"
