              - paragraph [ref=e1324]:
                - code [ref=e1325]: hygiene_hard_message_limit
                - text: is a gateway-only
                - strong [ref=e1326]: pre-compression safety valve
                - text: . Runaway sessions with thousands of messages can hit model context limits before the normal percent-of-context threshold fires; when message count crosses this ceiling, Hermes forces compression regardless of token usage. Default
                - code [ref=e1327]: "400"
                - text: — raise it for platforms where very long sessions are normal, lower it to force more aggressive compression. Editing this value on a running gateway takes effect on the next message (see below).
              - generic [ref=e1328]:
                - generic [ref=e1329]:
