                - text: ", alternative"
                - code [ref=e425]: "--security-opt"
                - text: overrides, etc. Each entry must be a string; the list is appended last to the assembled
                - code [ref=e426]: docker run
                - text: invocation so it can override Hermes' defaults if needed. Use sparingly — flags that conflict with the sandbox hardening (capability drops,
                - code [ref=e427]: "--user"
                - text: ", the workspace bind mount) will silently weaken isolation."
              - paragraph [ref=e428]:
                - strong [ref=e429]: "Requirements:"
                - text: Docker Desktop or Docker Engine installed and running. Hermes probes
                - code [ref=e430]: $PATH
                - text: plus common macOS install locations (
                - code [ref=e431]: /usr/local/bin/docker
                - text: ","
                - code [ref=e432]: /opt/homebrew/bin/docker
                - text: ", Docker Desktop app bundle). Podman is supported out of the box: set"
                - code [ref=e433]: HERMES_DOCKER_BINARY=podman
                - text: (or the full path) to force it when both are installed.
              - paragraph [ref=e434]:
                - strong [ref=e435]: "Container lifecycle:"
                - text: Hermes reuses a single long-lived container (
                - code [ref=e436]: docker run -d ... sleep 2h
                - text: ) for every terminal and file-tool call, across sessions,
                - code [ref=e437]: /new
                - text: ","
                - code [ref=e438]: /reset
                - text: ", and"
                - code [ref=e439]: delegate_task
                - text: subagents, for the lifetime of the Hermes process. Commands run via
                - code [ref=e440]: docker exec
                - text: with a login shell, so working-directory changes, installed packages, and files in
                - code [ref=e441]: /workspace
                - text: all persist from one tool call to the next. The container is stopped and removed on Hermes shutdown (or when the idle-sweep reclaims it).
              - paragraph [ref=e442]:
                - text: Parallel subagents spawned via
                - code [ref=e443]: delegate_task(tasks=[...])
                - text: share this one container — concurrent
                - code [ref=e444]: cd
                - text: ", env mutations, and writes to the same path will collide. If a subagent needs an isolated sandbox, it must register a per-task image override via"
                - code [ref=e445]: register_task_env_overrides()
                - text: ", which RL and benchmark environments (TerminalBench2, HermesSweEnv, etc.) do automatically for their per-task Docker images."
              - paragraph [ref=e446]:
                - strong [ref=e447]: "Security hardening:"
              - list [ref=e448]:
                - listitem [ref=e449]:
                  - code [ref=e450]: "--cap-drop ALL"
                  - text: with only
                  - code [ref=e451]: DAC_OVERRIDE
                  - text: ","
                  - code [ref=e452]: CHOWN
                  - text: ","
                  - code [ref=e453]: FOWNER
                  - text: added back
                - listitem [ref=e454]:
                  - code [ref=e455]: "--security-opt no-new-privileges"
                - listitem [ref=e456]:
                  - code [ref=e457]: "--pids-limit 256"
                - listitem [ref=e458]:
                  - text: Size-limited tmpfs for
                  - code [ref=e459]: /tmp
                  - text: (512MB),
                  - code [ref=e460]: /var/tmp
                  - text: (256MB),
                  - code [ref=e461]: /run
                  - text: (64MB)
              - paragraph [ref=e462]:
                - strong [ref=e463]: "Credential forwarding:"
                - text: Env vars listed in
                - code [ref=e464]: docker_forward_env
                - text: are resolved from your shell environment first, then
                - code [ref=e465]: ~/.hermes/.env
                - text: . Skills can also declare
                - code [ref=e466]: required_environment_variables
                - text: which are merged automatically.
              - heading "SSH BackendDirect link to SSH Backend" [level=3] [ref=e467]:
