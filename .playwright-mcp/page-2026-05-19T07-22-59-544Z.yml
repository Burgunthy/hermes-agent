                    - img [ref=e1104]
                    - img [ref=e1106]
              - paragraph [ref=e1108]:
                - text: When on, any flagged
                - code [ref=e1109]: skill_manage
                - text: write surfaces as an approval prompt with the scanner's rationale. Accepted writes land; denied writes return an explanatory error to the agent.
              - heading "Memory ConfigurationDirect link to Memory Configuration" [level=2] [ref=e1110]:
                - text: Memory Configuration
                - link "Direct link to Memory Configuration" [ref=e1111] [cursor=pointer]:
                  - /url: "#memory-configuration"
                  - text: "#"
              - generic [ref=e1113]:
                - code [ref=e1115]:
