                  - img [ref=e1431]
                  - text: Summary model context length requirement
                - paragraph [ref=e1434]:
                  - text: The summary model
                  - strong [ref=e1435]: must
                  - text: have a context window at least as large as your main agent model's. The compressor sends the full middle section of the conversation to the summary model — if that model's context window is smaller than the main model's, the summarization call will fail with a context length error. When this happens, the middle turns are
                  - strong [ref=e1436]: dropped without a summary
                  - text: ", losing conversation context silently. If you override the model, verify its context length meets or exceeds your main model's."
              - heading "Context EngineDirect link to Context Engine" [level=2] [ref=e1437]:
                - text: Context Engine
                - link "Direct link to Context Engine" [ref=e1438] [cursor=pointer]:
                  - /url: "#context-engine"
                  - text: "#"
              - paragraph [ref=e1439]:
                - text: The context engine controls how conversations are managed when approaching the model's token limit. The built-in
                - code [ref=e1440]: compressor
                - text: engine uses lossy summarization (see
                - link "Context Compression" [ref=e1441] [cursor=pointer]:
                  - /url: /docs/developer-guide/context-compression-and-caching
                - text: ). Plugin engines can replace it with alternative strategies.
              - generic [ref=e1443]:
                - code [ref=e1445]:
                  - generic [ref=e1446]: "context:"
                  - generic [ref=e1447]: "engine: \"compressor\" # default — built-in lossy summarization"
                - button "Copy code to clipboard" [ref=e1449] [cursor=pointer]:
                  - generic [ref=e1450]:
                    - img [ref=e1451]
                    - img [ref=e1453]
              - paragraph [ref=e1455]: "To use a plugin engine (e.g., LCM for lossless context management):"
              - generic [ref=e1457]:
                - code [ref=e1459]:
                  - generic [ref=e1460]: "context:"
                  - generic [ref=e1461]: "engine: \"lcm\" # must match the plugin's name"
                - button "Copy code to clipboard" [ref=e1463] [cursor=pointer]:
                  - generic [ref=e1464]:
                    - img [ref=e1465]
                    - img [ref=e1467]
              - paragraph [ref=e1469]:
                - text: Plugin engines are
                - strong [ref=e1470]: never auto-activated
                - text: — you must explicitly set
                - code [ref=e1471]: context.engine
                - text: to the plugin name. Available engines can be browsed and selected via
                - code [ref=e1472]: hermes plugins
                - text: → Provider Plugins → Context Engine.
              - paragraph [ref=e1473]:
                - text: See
                - link "Memory Providers" [ref=e1474] [cursor=pointer]:
                  - /url: /docs/user-guide/features/memory-providers
                - text: for the analogous single-select system for memory plugins.
              - heading "Iteration Budget PressureDirect link to Iteration Budget Pressure" [level=2] [ref=e1475]:
                - text: Iteration Budget Pressure
                - link "Direct link to Iteration Budget Pressure" [ref=e1476] [cursor=pointer]:
                  - /url: "#iteration-budget-pressure"
                  - text: "#"
              - paragraph [ref=e1477]: "When the agent is working on a complex task with many tool calls, it can burn through its iteration budget (default: 90 turns) without realizing it's running low. Budget pressure automatically warns the model as it approaches the limit:"
              - table [ref=e1478]:
                - rowgroup [ref=e1479]:
                  - row "Threshold Level What the model sees" [ref=e1480]:
                    - columnheader "Threshold" [ref=e1481]
                    - columnheader "Level" [ref=e1482]
                    - columnheader "What the model sees" [ref=e1483]
                - rowgroup [ref=e1484]:
                  - 'row "70% Caution [BUDGET: 63/90. 27 iterations left. Start consolidating.]" [ref=e1485]':
                    - cell "70%" [ref=e1486]:
                      - strong [ref=e1487]: 70%
                    - cell "Caution" [ref=e1488]
                    - 'cell "[BUDGET: 63/90. 27 iterations left. Start consolidating.]" [ref=e1489]':
                      - code [ref=e1490]: "[BUDGET: 63/90. 27 iterations left. Start consolidating.]"
                  - 'row "90% Warning [BUDGET WARNING: 81/90. Only 9 left. Respond NOW.]" [ref=e1491]':
                    - cell "90%" [ref=e1492]:
                      - strong [ref=e1493]: 90%
                    - cell "Warning" [ref=e1494]
                    - 'cell "[BUDGET WARNING: 81/90. Only 9 left. Respond NOW.]" [ref=e1495]':
                      - code [ref=e1496]: "[BUDGET WARNING: 81/90. Only 9 left. Respond NOW.]"
              - paragraph [ref=e1497]:
                - text: Warnings are injected into the last tool result's JSON (as a
                - code [ref=e1498]: _budget_warning
                - text: field) rather than as separate messages — this preserves prompt caching and doesn't disrupt the conversation structure.
              - generic [ref=e1500]:
                - code [ref=e1502]:
                  - generic [ref=e1503]: "agent:"
                  - generic [ref=e1504]: "max_turns: 90 # Max iterations per conversation turn (default: 90)"
                  - generic [ref=e1505]: "api_max_retries: 3 # Retries per provider before fallback engages (default: 3)"
                - generic [ref=e1506]:
                  - button "Toggle word wrap" [ref=e1507] [cursor=pointer]:
                    - img [ref=e1508]
                  - button "Copy code to clipboard" [ref=e1510] [cursor=pointer]:
                    - generic [ref=e1511]:
                      - img [ref=e1512]
                      - img [ref=e1514]
              - paragraph [ref=e1516]: Budget pressure is enabled by default. The agent sees warnings naturally as part of tool results, encouraging it to consolidate its work and deliver a response before running out of iterations.
              - paragraph [ref=e1517]:
                - text: "When the iteration budget is fully exhausted, the CLI shows a notification to the user:"
                - code [ref=e1518]: ⚠ Iteration budget reached (90/90) — response may be incomplete
                - text: . If the budget runs out during active work, the agent generates a summary of what was accomplished before stopping.
              - paragraph [ref=e1519]:
                - code [ref=e1520]: agent.api_max_retries
                - text: controls how many times Hermes retries a provider API call on transient errors (rate limits, connection drops, 5xx)
                - strong [ref=e1521]: before
                - text: fallback-provider switching engages. The default is
                - code [ref=e1522]: "3"
                - text: — four attempts total. If you have
                - link "fallback providers" [ref=e1523] [cursor=pointer]:
                  - /url: /docs/user-guide/features/fallback-providers
                - text: configured and want to fail over faster, drop this to
                - code [ref=e1524]: "0"
                - text: so the first transient error on your primary immediately hands off to the fallback instead of churning retries against the flaky endpoint.
              - heading "API TimeoutsDirect link to API Timeouts" [level=3] [ref=e1525]:
                - text: API Timeouts
                - link "Direct link to API Timeouts" [ref=e1526] [cursor=pointer]:
                  - /url: "#api-timeouts"
                  - text: "#"
              - paragraph [ref=e1527]: Hermes has separate timeout layers for streaming, plus a stale detector for non-streaming calls. The stale detectors auto-adjust for local providers only when you leave them at their implicit defaults.
              - table [ref=e1528]:
                - rowgroup [ref=e1529]:
                  - row "Timeout Default Local providers Config / env" [ref=e1530]:
                    - columnheader "Timeout" [ref=e1531]
                    - columnheader "Default" [ref=e1532]
                    - columnheader "Local providers" [ref=e1533]
                    - columnheader "Config / env" [ref=e1534]
                - rowgroup [ref=e1535]:
                  - row "Socket read timeout 120s Auto-raised to 1800s HERMES_STREAM_READ_TIMEOUT" [ref=e1536]:
                    - cell "Socket read timeout" [ref=e1537]
                    - cell "120s" [ref=e1538]
                    - cell "Auto-raised to 1800s" [ref=e1539]
                    - cell "HERMES_STREAM_READ_TIMEOUT" [ref=e1540]:
                      - code [ref=e1541]: HERMES_STREAM_READ_TIMEOUT
                  - row "Stale stream detection 180s Auto-disabled HERMES_STREAM_STALE_TIMEOUT" [ref=e1542]:
                    - cell "Stale stream detection" [ref=e1543]
                    - cell "180s" [ref=e1544]
                    - cell "Auto-disabled" [ref=e1545]
                    - cell "HERMES_STREAM_STALE_TIMEOUT" [ref=e1546]:
                      - code [ref=e1547]: HERMES_STREAM_STALE_TIMEOUT
                  - row "Stale non-stream detection 300s Auto-disabled when left implicit providers.<id>.stale_timeout_seconds or HERMES_API_CALL_STALE_TIMEOUT" [ref=e1548]:
                    - cell "Stale non-stream detection" [ref=e1549]
                    - cell "300s" [ref=e1550]
                    - cell "Auto-disabled when left implicit" [ref=e1551]
                    - cell "providers.<id>.stale_timeout_seconds or HERMES_API_CALL_STALE_TIMEOUT" [ref=e1552]:
                      - code [ref=e1553]: providers.<id>.stale_timeout_seconds
                      - text: or
                      - code [ref=e1554]: HERMES_API_CALL_STALE_TIMEOUT
                  - row "API call (non-streaming) 1800s Unchanged providers.<id>.request_timeout_seconds / timeout_seconds or HERMES_API_TIMEOUT" [ref=e1555]:
                    - cell "API call (non-streaming)" [ref=e1556]
                    - cell "1800s" [ref=e1557]
                    - cell "Unchanged" [ref=e1558]
                    - cell "providers.<id>.request_timeout_seconds / timeout_seconds or HERMES_API_TIMEOUT" [ref=e1559]:
                      - code [ref=e1560]: providers.<id>.request_timeout_seconds
                      - text: /
                      - code [ref=e1561]: timeout_seconds
                      - text: or
                      - code [ref=e1562]: HERMES_API_TIMEOUT
              - paragraph [ref=e1563]:
                - text: The
                - strong [ref=e1564]: socket read timeout
                - text: controls how long httpx waits for the next chunk of data from the provider. Local LLMs can take minutes for prefill on large contexts before producing the first token, so Hermes raises this to 30 minutes when it detects a local endpoint. If you explicitly set
                - code [ref=e1565]: HERMES_STREAM_READ_TIMEOUT
                - text: ", that value is always used regardless of endpoint detection."
              - paragraph [ref=e1566]:
                - text: The
                - strong [ref=e1567]: stale stream detection
                - text: kills connections that receive SSE keep-alive pings but no actual content. This is disabled entirely for local providers since they don't send keep-alive pings during prefill.
              - paragraph [ref=e1568]:
                - text: The
                - strong [ref=e1569]: stale non-stream detection
                - text: kills non-streaming calls that produce no response for too long. By default Hermes disables this on local endpoints to avoid false positives during long prefills. If you explicitly set
                - code [ref=e1570]: providers.<id>.stale_timeout_seconds
                - text: ","
                - code [ref=e1571]: providers.<id>.models.<model>.stale_timeout_seconds
                - text: ", or"
                - code [ref=e1572]: HERMES_API_CALL_STALE_TIMEOUT
                - text: ", that explicit value is honored even on local endpoints."
              - heading "Context Pressure WarningsDirect link to Context Pressure Warnings" [level=2] [ref=e1573]:
                - text: Context Pressure Warnings
                - link "Direct link to Context Pressure Warnings" [ref=e1574] [cursor=pointer]:
                  - /url: "#context-pressure-warnings"
                  - text: "#"
              - paragraph [ref=e1575]:
                - text: Separate from iteration budget pressure, context pressure tracks how close the conversation is to the
                - strong [ref=e1576]: compaction threshold
                - text: — the point where context compression fires to summarize older messages. This helps both you and the agent understand when the conversation is getting long.
              - table [ref=e1577]:
                - rowgroup [ref=e1578]:
                  - row "Progress Level What happens" [ref=e1579]:
                    - columnheader "Progress" [ref=e1580]
                    - columnheader "Level" [ref=e1581]
                    - columnheader "What happens" [ref=e1582]
                - rowgroup [ref=e1583]:
                  - row "≥ 60% to threshold Info CLI shows a cyan progress bar; gateway sends an informational notice" [ref=e1584]:
                    - cell "≥ 60% to threshold" [ref=e1585]:
                      - strong [ref=e1586]: ≥ 60%
                      - text: to threshold
                    - cell "Info" [ref=e1587]
                    - cell "CLI shows a cyan progress bar; gateway sends an informational notice" [ref=e1588]
                  - row "≥ 85% to threshold Warning CLI shows a bold yellow bar; gateway warns compaction is imminent" [ref=e1589]:
                    - cell "≥ 85% to threshold" [ref=e1590]:
                      - strong [ref=e1591]: ≥ 85%
                      - text: to threshold
                    - cell "Warning" [ref=e1592]
                    - cell "CLI shows a bold yellow bar; gateway warns compaction is imminent" [ref=e1593]
              - paragraph [ref=e1594]: "In the CLI, context pressure appears as a progress bar in the tool output feed:"
              - generic [ref=e1596]:
                - code [ref=e1598]:
                  - generic [ref=e1599]: ◐ context ████████████░░░░░░░░ 62% to compaction 48k threshold (50%) · approaching compaction
                - generic [ref=e1600]:
                  - button "Toggle word wrap" [ref=e1601] [cursor=pointer]:
                    - img [ref=e1602]
                  - button "Copy code to clipboard" [ref=e1604] [cursor=pointer]:
                    - generic [ref=e1605]:
                      - img [ref=e1606]
                      - img [ref=e1608]
              - paragraph [ref=e1610]: "On messaging platforms, a plain-text notification is sent:"
              - generic [ref=e1612]:
                - code [ref=e1614]:
                  - generic [ref=e1615]: "◐ Context: ████████████░░░░░░░░ 62% to compaction (threshold: 50% of window)."
                - button "Copy code to clipboard" [ref=e1617] [cursor=pointer]:
                  - generic [ref=e1618]:
                    - img [ref=e1619]
                    - img [ref=e1621]
              - paragraph [ref=e1623]: If auto-compression is disabled, the warning tells you context may be truncated instead.
              - paragraph [ref=e1624]: Context pressure is automatic — no configuration needed. It fires purely as a user-facing notification and does not modify the message stream or inject anything into the model's context.
              - heading "Credential Pool StrategiesDirect link to Credential Pool Strategies" [level=2] [ref=e1625]:
                - text: Credential Pool Strategies
                - link "Direct link to Credential Pool Strategies" [ref=e1626] [cursor=pointer]:
                  - /url: "#credential-pool-strategies"
                  - text: "#"
              - paragraph [ref=e1627]: "When you have multiple API keys or OAuth tokens for the same provider, configure the rotation strategy:"
              - generic [ref=e1629]:
                - code [ref=e1631]:
                  - generic [ref=e1632]: "credential_pool_strategies:"
                  - generic [ref=e1633]: "openrouter: round_robin # cycle through keys evenly"
                  - generic [ref=e1634]: "anthropic: least_used # always pick the least-used key"
                - button "Copy code to clipboard" [ref=e1636] [cursor=pointer]:
                  - generic [ref=e1637]:
                    - img [ref=e1638]
                    - img [ref=e1640]
              - paragraph [ref=e1642]:
                - text: "Options:"
                - code [ref=e1643]: fill_first
                - text: (default),
                - code [ref=e1644]: round_robin
                - text: ","
                - code [ref=e1645]: least_used
                - text: ","
                - code [ref=e1646]: random
                - text: . See
                - link "Credential Pools" [ref=e1647] [cursor=pointer]:
                  - /url: /docs/user-guide/features/credential-pools
                - text: for full documentation.
              - heading "Prompt cachingDirect link to Prompt caching" [level=2] [ref=e1648]:
                - text: Prompt caching
                - link "Direct link to Prompt caching" [ref=e1649] [cursor=pointer]:
                  - /url: "#prompt-caching"
                  - text: "#"
              - paragraph [ref=e1650]: Hermes turns on cross-session prompt caching automatically when the active provider supports it — no user config needed.
              - paragraph [ref=e1651]:
                - text: For Claude on
                - strong [ref=e1652]: native Anthropic
                - text: ","
                - strong [ref=e1653]: OpenRouter
                - text: ", and"
                - strong [ref=e1654]: Nous Portal
                - text: ", Hermes attaches"
                - code [ref=e1655]: cache_control
                - text: breakpoints with the 1-hour TTL (
                - code [ref=e1656]: "ttl: \"1h\""
                - text: ) on the system prompt and skill blocks. The first send within a fresh hour pays full input rates; subsequent sends across any session within the same hour pull from the cache at the discounted cached-read rate. This means the system prompt, loaded skill content, and the early portion of any long-context include get reused across
                - code [ref=e1657]: hermes
                - text: sessions and across forked subagents for the first hour.
              - paragraph [ref=e1658]:
                - text: The Qwen Cloud (Alibaba DashScope) upstream caps cache TTL at 5 minutes, so Hermes uses the 5-minute breakpoint TTL there instead. Other Claude-via-third-party paths (AWS Bedrock, Azure Foundry) fall back to the provider's own caching defaults. xAI Grok uses a separate session-pinned conversation-id mechanism — see
                - link "xAI prompt caching" [ref=e1659] [cursor=pointer]:
                  - /url: /docs/integrations/providers#xai-grok--responses-api--prompt-caching
                - text: .
              - paragraph [ref=e1660]: No knob exists to disable this — caching is always-on and saves money even on single-turn conversations because the system prompt alone is a meaningful fraction of the input token count.
              - heading "Auxiliary ModelsDirect link to Auxiliary Models" [level=2] [ref=e1661]:
                - text: Auxiliary Models
                - link "Direct link to Auxiliary Models" [ref=e1662] [cursor=pointer]:
                  - /url: "#auxiliary-models"
                  - text: "#"
              - paragraph [ref=e1663]:
                - text: Hermes uses "auxiliary" models for side tasks like image analysis, web page summarization, browser screenshot analysis, session-title generation, and context compression. By default (
                - code [ref=e1664]: "auxiliary.*.provider: \"auto\""
                - text: ), Hermes routes every auxiliary task to your
                - strong [ref=e1665]: main chat model
                - text: — the same provider/model you picked in
                - code [ref=e1666]: hermes model
                - text: . You don't need to configure anything to get started, but be aware that on expensive reasoning models (Opus, MiniMax M2.7, etc.) auxiliary tasks add meaningful cost. If you want cheap-and-fast side tasks regardless of your main model, set
                - code [ref=e1667]: auxiliary.<task>.provider
                - text: and
                - code [ref=e1668]: auxiliary.<task>.model
                - text: explicitly (for example, Gemini Flash on OpenRouter for vision and web extraction).
              - generic [ref=e1669]:
                - generic [ref=e1670]:
                  - img [ref=e1672]
                  - text: Why "auto" uses your main model
                - paragraph [ref=e1675]:
                  - text: Earlier builds split aggregator users (OpenRouter, Nous Portal) onto a cheap provider-side default. That was surprising — users who paid for an aggregator subscription would see a different model handling their auxiliary traffic.
                  - code [ref=e1676]: auto
                  - text: now uses the main model for everyone, and per-task overrides in
                  - code [ref=e1677]: config.yaml
                  - text: still win (see
                  - link "Full auxiliary config reference" [ref=e1678] [cursor=pointer]:
                    - /url: "#full-auxiliary-config-reference"
                  - text: below).
