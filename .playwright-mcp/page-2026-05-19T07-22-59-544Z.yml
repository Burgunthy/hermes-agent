              - heading "Skill SettingsDirect link to Skill Settings" [level=2] [ref=e1044]:
                - text: Skill Settings
                - link "Direct link to Skill Settings" [ref=e1045] [cursor=pointer]:
                  - /url: "#skill-settings"
                  - text: "#"
              - paragraph [ref=e1046]:
                - text: Skills can declare their own configuration settings via their SKILL.md frontmatter. These are non-secret values (paths, preferences, domain settings) stored under the
                - code [ref=e1047]: skills.config
                - text: namespace in
                - code [ref=e1048]: config.yaml
