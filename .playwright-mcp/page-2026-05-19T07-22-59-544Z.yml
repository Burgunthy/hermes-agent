                - button "Copy code to clipboard" [ref=e1122] [cursor=pointer]:
                  - generic [ref=e1123]:
                    - img [ref=e1124]
                    - img [ref=e1126]
              - heading "File Read SafetyDirect link to File Read Safety" [level=2] [ref=e1128]:
                - text: File Read Safety
                - link "Direct link to File Read Safety" [ref=e1129] [cursor=pointer]:
                  - /url: "#file-read-safety"
                  - text: "#"
              - paragraph [ref=e1130]:
                - text: Controls how much content a single
                - code [ref=e1131]: read_file
                - text: call can return. Reads that exceed the limit are rejected with an error telling the agent to use
                - code [ref=e1132]: offset
                - text: and
                - code [ref=e1133]: limit
                - text: for a smaller range. This prevents a single read of a minified JS bundle or large data file from flooding the context window.
              - generic [ref=e1135]:
                - code [ref=e1137]:
                  - generic [ref=e1138]: "file_read_max_chars: 100000 # default — ~25-35K tokens"
                - button "Copy code to clipboard" [ref=e1140] [cursor=pointer]:
                  - generic [ref=e1141]:
                    - img [ref=e1142]
                    - img [ref=e1144]
              - paragraph [ref=e1146]: "Raise it if you're on a model with a large context window and frequently read big files. Lower it for small-context models to keep reads efficient:"
              - generic [ref=e1148]:
                - code [ref=e1150]:
                  - generic [ref=e1151]: "# Large context model (200K+)"
                  - generic [ref=e1152]: "file_read_max_chars: 200000"
                  - generic [ref=e1153]: "# Small local model (16K context)"
                  - generic [ref=e1154]: "file_read_max_chars: 30000"
                - button "Copy code to clipboard" [ref=e1156] [cursor=pointer]:
                  - generic [ref=e1157]:
                    - img [ref=e1158]
                    - img [ref=e1160]
              - paragraph [ref=e1162]: The agent also deduplicates file reads automatically — if the same file region is read twice and the file hasn't changed, a lightweight stub is returned instead of re-sending the content. This resets on context compression so the agent can re-read files after their content is summarized away.
              - heading "Tool Output Truncation LimitsDirect link to Tool Output Truncation Limits" [level=2] [ref=e1163]:
                - text: Tool Output Truncation Limits
                - link "Direct link to Tool Output Truncation Limits" [ref=e1164] [cursor=pointer]:
                  - /url: "#tool-output-truncation-limits"
                  - text: "#"
              - paragraph [ref=e1165]: "Three related caps control how much raw output a tool can return before Hermes truncates it:"
              - generic [ref=e1167]:
                - code [ref=e1169]:
                  - generic [ref=e1170]: "tool_output:"
                  - generic [ref=e1171]: "max_bytes: 50000 # terminal output cap (chars)"
                  - generic [ref=e1172]: "max_lines: 2000 # read_file pagination cap"
                  - generic [ref=e1173]: "max_line_length: 2000 # per-line cap in read_file's line-numbered view"
                - button "Copy code to clipboard" [ref=e1175] [cursor=pointer]:
                  - generic [ref=e1176]:
                    - img [ref=e1177]
                    - img [ref=e1179]
              - list [ref=e1181]:
                - listitem [ref=e1182]:
                  - strong [ref=e1183]:
                    - code [ref=e1184]: max_bytes
                  - text: — When a
                  - code [ref=e1185]: terminal
                  - text: command produces more than this many characters of combined stdout/stderr, Hermes keeps the first 40% and last 60% and inserts a
                  - code [ref=e1186]: "[OUTPUT TRUNCATED]"
                  - text: notice between them. Default
                  - code [ref=e1187]: "50000"
                  - text: (≈12-15K tokens across typical tokenisers).
                - listitem [ref=e1188]:
                  - strong [ref=e1189]:
                    - code [ref=e1190]: max_lines
                  - text: — Upper bound on the
                  - code [ref=e1191]: limit
                  - text: parameter of a single
                  - code [ref=e1192]: read_file
                  - text: call. Requests above this are clamped so a single read can't flood the context window. Default
                  - code [ref=e1193]: "2000"
                  - text: .
                - listitem [ref=e1194]:
                  - strong [ref=e1195]:
                    - code [ref=e1196]: max_line_length
                  - text: — Per-line cap applied when
                  - code [ref=e1197]: read_file
                  - text: emits the line-numbered view. Lines longer than this are truncated to this many chars followed by
                  - code [ref=e1198]: ... [truncated]
                  - text: . Default
                  - code [ref=e1199]: "2000"
                  - text: .
              - paragraph [ref=e1200]: "Raise the limits on models with large context windows that can afford more raw output per call. Lower them for small-context models to keep tool results compact:"
              - generic [ref=e1202]:
                - code [ref=e1204]:
                  - generic [ref=e1205]: "# Large context model (200K+)"
                  - generic [ref=e1206]: "tool_output:"
                  - generic [ref=e1207]: "max_bytes: 150000"
                  - generic [ref=e1208]: "max_lines: 5000"
                  - generic [ref=e1209]: "# Small local model (16K context)"
                  - generic [ref=e1210]: "tool_output:"
                  - generic [ref=e1211]: "max_bytes: 20000"
                  - generic [ref=e1212]: "max_lines: 500"
                - button "Copy code to clipboard" [ref=e1214] [cursor=pointer]:
                  - generic [ref=e1215]:
                    - img [ref=e1216]
                    - img [ref=e1218]
              - heading "Global Toolset DisableDirect link to Global Toolset Disable" [level=2] [ref=e1220]:
                - text: Global Toolset Disable
                - link "Direct link to Global Toolset Disable" [ref=e1221] [cursor=pointer]:
                  - /url: "#global-toolset-disable"
                  - text: "#"
              - paragraph [ref=e1222]:
                - text: To suppress specific toolsets across the CLI and every gateway platform in one place, list their names under
                - code [ref=e1223]: agent.disabled_toolsets
