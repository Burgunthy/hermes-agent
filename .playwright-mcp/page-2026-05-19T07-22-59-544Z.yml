                  - text: warning
                - paragraph [ref=e371]:
                  - text: The agent has the same filesystem access as your user account. Use
                  - code [ref=e372]: hermes tools
                  - text: to disable tools you don't want, or switch to Docker for sandboxing.
              - heading "Docker BackendDirect link to Docker Backend" [level=3] [ref=e373]:
                - text: Docker Backend
                - link "Direct link to Docker Backend" [ref=e374] [cursor=pointer]:
                  - /url: "#docker-backend"
                  - text: "#"
              - paragraph [ref=e375]: Runs commands inside a Docker container with security hardening (all capabilities dropped, no privilege escalation, PID limits).
              - paragraph [ref=e376]:
                - strong [ref=e377]: Single persistent container, not per-command.
                - text: Hermes starts ONE long-lived container on first use and routes every terminal, file, and
                - code [ref=e378]: execute_code
                - text: call through
                - code [ref=e379]: docker exec
                - text: into that same container — across sessions,
                - code [ref=e380]: /new
                - text: ","
                - code [ref=e381]: /reset
                - text: ", and"
                - code [ref=e382]: delegate_task
                - text: subagents — for the lifetime of the Hermes process. Working-directory changes, installed packages, and files in
                - code [ref=e383]: /workspace
                - text: carry over from one tool call to the next, just like a local shell. The container is stopped and removed on shutdown. See
                - strong [ref=e384]: Container lifecycle
                - text: below for details.
              - generic [ref=e386]:
                - code [ref=e388]:
                  - generic [ref=e389]: "terminal:"
                  - generic [ref=e390]: "backend: docker"
                  - generic [ref=e391]: "docker_image: \"nikolaik/python-nodejs:python3.11-nodejs20\""
                  - generic [ref=e392]: "docker_mount_cwd_to_workspace: false # Mount launch dir into /workspace"
                  - generic [ref=e393]: "docker_run_as_host_user: false # See \"Running container as host user\" below"
                  - generic [ref=e394]: "docker_forward_env: # Env vars to forward into container"
                  - generic [ref=e395]: "- \"GITHUB_TOKEN\""
                  - generic [ref=e396]: "docker_volumes: # Host directory mounts"
                  - generic [ref=e397]: "- \"/home/user/projects:/workspace/projects\""
                  - generic [ref=e398]: "- \"/home/user/data:/data:ro\" # :ro for read-only"
                  - generic [ref=e399]: "docker_extra_args: # Extra flags appended verbatim to `docker run`"
                  - generic [ref=e400]: "- \"--gpus=all\""
                  - generic [ref=e401]: "- \"--network=host\""
                  - generic [ref=e402]: "# Resource limits"
                  - generic [ref=e403]: "container_cpu: 1 # CPU cores (0 = unlimited)"
                  - generic [ref=e404]: "container_memory: 5120 # MB (0 = unlimited)"
                  - generic [ref=e405]: "container_disk: 51200 # MB (requires overlay2 on XFS+pquota)"
                  - generic [ref=e406]: "container_persistent: true # Persist /workspace and /root across sessions"
                - generic [ref=e407]:
                  - button "Toggle word wrap" [ref=e408] [cursor=pointer]:
