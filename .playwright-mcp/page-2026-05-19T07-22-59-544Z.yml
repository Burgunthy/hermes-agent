              - heading "Provider TimeoutsDirect link to Provider Timeouts" [level=3] [ref=e253]:
                - text: Provider Timeouts
                - link "Direct link to Provider Timeouts" [ref=e254] [cursor=pointer]:
                  - /url: "#provider-timeouts"
                  - text: "#"
              - paragraph [ref=e255]:
                - text: You can set
                - code [ref=e256]: providers.<id>.request_timeout_seconds
                - text: for a provider-wide request timeout, plus
                - code [ref=e257]: providers.<id>.models.<model>.timeout_seconds
                - text: for a model-specific override. Applies to the primary turn client on every transport (OpenAI-wire, native Anthropic, Anthropic-compatible), the fallback chain, rebuilds after credential rotation, and (for OpenAI-wire) the per-request timeout kwarg — so the configured value wins over the legacy
                - code [ref=e258]: HERMES_API_TIMEOUT
                - text: env var.
              - paragraph [ref=e259]:
                - text: You can also set
                - code [ref=e260]: providers.<id>.stale_timeout_seconds
                - text: for the non-streaming stale-call detector, plus
                - code [ref=e261]: providers.<id>.models.<model>.stale_timeout_seconds
                - text: for a model-specific override. This wins over the legacy
                - code [ref=e262]: HERMES_API_CALL_STALE_TIMEOUT
                - text: env var.
              - paragraph [ref=e263]:
                - text: Leaving these unset keeps the legacy defaults (
                - code [ref=e264]: HERMES_API_TIMEOUT=1800
                - text: s,
                - code [ref=e265]: HERMES_API_CALL_STALE_TIMEOUT=300
                - text: s, native Anthropic 900s). Not currently wired for AWS Bedrock (both
                - code [ref=e266]: bedrock_converse
                - text: and AnthropicBedrock SDK paths use boto3 with its own timeout configuration). See the commented example in
                - link "cli-config.yaml.example" [ref=e267] [cursor=pointer]:
                  - /url: https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example
                  - code [ref=e268]: cli-config.yaml.example
                - text: .
              - heading "Terminal Backend ConfigurationDirect link to Terminal Backend Configuration" [level=2] [ref=e269]:
                - text: Terminal Backend Configuration
                - link "Direct link to Terminal Backend Configuration" [ref=e270] [cursor=pointer]:
                  - /url: "#terminal-backend-configuration"
                  - text: "#"
              - paragraph [ref=e271]: Hermes supports seven terminal backends. Each determines where the agent's shell commands actually execute — your local machine, a Docker container, a remote server via SSH, a Modal cloud sandbox (direct or via the Nous-managed gateway), a Daytona workspace, a Vercel Sandbox, or a Singularity/Apptainer container.
              - generic [ref=e273]:
                - code [ref=e275]:
                  - generic [ref=e276]: "terminal:"
                  - generic [ref=e277]: "backend: local # local | docker | ssh | modal | daytona | vercel_sandbox | singularity"
                  - generic [ref=e278]: "cwd: \".\" # Gateway/cron working directory (CLI always uses launch dir)"
                  - generic [ref=e279]: "timeout: 180 # Per-command timeout in seconds"
                  - generic [ref=e280]: "env_passthrough: [] # Env var names to forward to sandboxed execution (terminal + execute_code)"
                  - generic [ref=e281]: "singularity_image: \"docker://nikolaik/python-nodejs:python3.11-nodejs20\" # Container image for Singularity backend"
                  - generic [ref=e282]: "modal_image: \"nikolaik/python-nodejs:python3.11-nodejs20\" # Container image for Modal backend"
                  - generic [ref=e283]: "daytona_image: \"nikolaik/python-nodejs:python3.11-nodejs20\" # Container image for Daytona backend"
                - generic [ref=e284]:
                  - button "Toggle word wrap" [ref=e285] [cursor=pointer]:
