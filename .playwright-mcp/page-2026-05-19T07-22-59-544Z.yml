              - heading "Context CompressionDirect link to Context Compression" [level=2] [ref=e1280]:
                - text: Context Compression
                - link "Direct link to Context Compression" [ref=e1281] [cursor=pointer]:
                  - /url: "#context-compression"
                  - text: "#"
              - paragraph [ref=e1282]: Hermes automatically compresses long conversations to stay within your model's context window. The compression summarizer is a separate LLM call — you can point it at any provider or endpoint.
              - paragraph [ref=e1283]:
                - text: All compression settings live in
                - code [ref=e1284]: config.yaml
                - text: (no environment variables).
              - heading "Full referenceDirect link to Full reference" [level=3] [ref=e1285]:
                - text: Full reference
                - link "Direct link to Full reference" [ref=e1286] [cursor=pointer]:
                  - /url: "#full-reference"
                  - text: "#"
              - generic [ref=e1288]:
