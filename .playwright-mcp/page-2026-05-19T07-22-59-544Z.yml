                - code [ref=e2509]: es
                - text: (Spanish),
                - code [ref=e2510]: fr
                - text: (French),
                - code [ref=e2511]: tr
                - text: (Turkish),
                - code [ref=e2512]: uk
                - text: (Ukrainian). Unknown values fall back to English.
