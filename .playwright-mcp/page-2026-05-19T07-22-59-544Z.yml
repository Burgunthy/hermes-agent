                  - generic [ref=e2782]: "streaming: true # Stream tokens to terminal in real-time"
                  - generic [ref=e2783]: "show_reasoning: true # Also stream reasoning/thinking tokens (optional)"
                - button "Copy code to clipboard" [ref=e2785] [cursor=pointer]:
                  - generic [ref=e2786]:
                    - img [ref=e2787]
                    - img [ref=e2789]
              - paragraph [ref=e2791]: When enabled, responses appear token-by-token inside a streaming box. Tool calls are still captured silently. If the provider doesn't support streaming, it falls back to the normal display automatically.
              - heading "Gateway Streaming (Telegram, Discord, Slack)Direct link to Gateway Streaming (Telegram, Discord, Slack)" [level=3] [ref=e2792]:
                - text: Gateway Streaming (Telegram, Discord, Slack)
                - link "Direct link to Gateway Streaming (Telegram, Discord, Slack)" [ref=e2793] [cursor=pointer]:
                  - /url: "#gateway-streaming-telegram-discord-slack"
                  - text: "#"
              - generic [ref=e2795]:
                - code [ref=e2797]:
                  - generic [ref=e2798]: "streaming:"
                  - generic [ref=e2799]: "enabled: true # Enable progressive message editing"
                  - generic [ref=e2800]: "transport: edit # \"edit\" (progressive message editing) or \"off\""
                  - generic [ref=e2801]: "edit_interval: 0.3 # Seconds between message edits"
                  - generic [ref=e2802]: "buffer_threshold: 40 # Characters before forcing an edit flush"
                  - generic [ref=e2803]: "cursor: \" ▉\" # Cursor shown during streaming"
                  - generic [ref=e2804]: "fresh_final_after_seconds: 60 # Send fresh final (Telegram) when preview is this old; 0 = always edit in place"
                - generic [ref=e2805]:
                  - button "Toggle word wrap" [ref=e2806] [cursor=pointer]:
                    - img [ref=e2807]
                  - button "Copy code to clipboard" [ref=e2809] [cursor=pointer]:
                    - generic [ref=e2810]:
                      - img [ref=e2811]
                      - img [ref=e2813]
              - paragraph [ref=e2815]: When enabled, the bot sends a message on the first token, then progressively edits it as more tokens arrive. Platforms that don't support message editing (Signal, Email, Home Assistant) are auto-detected on the first attempt — streaming is gracefully disabled for that session with no flood of messages.
              - paragraph [ref=e2816]:
                - text: For separate natural mid-turn assistant updates without progressive token editing, set
                - code [ref=e2817]: "display.interim_assistant_messages: true"
                - text: .
              - paragraph [ref=e2818]:
                - strong [ref=e2819]: "Overflow handling:"
                - text: If the streamed text exceeds the platform's message length limit (~4096 chars), the current message is finalized and a new one starts automatically.
              - paragraph [ref=e2820]:
                - strong [ref=e2821]: "Fresh final (Telegram):"
                - text: Telegram's
                - code [ref=e2822]: editMessageText
                - text: preserves the original message timestamp, so a long-running streamed reply would keep the first-token timestamp even after completion. When
                - code [ref=e2823]: fresh_final_after_seconds > 0
                - text: (default
                - code [ref=e2824]: "60"
                - text: ), the completed reply is delivered as a brand-new message (with the stale preview best-effort deleted) so Telegram's visible timestamp reflects completion time. Short previews still finalize in place. Set to
                - code [ref=e2825]: "0"
                - text: to always edit in place.
              - generic [ref=e2826]:
                - generic [ref=e2827]:
                  - img [ref=e2829]
                  - text: note
                - paragraph [ref=e2832]:
                  - text: Streaming is disabled by default. Enable it in
                  - code [ref=e2833]: ~/.hermes/config.yaml
                  - text: to try the streaming UX.
              - heading "Group Chat Session IsolationDirect link to Group Chat Session Isolation" [level=2] [ref=e2834]:
                - text: Group Chat Session Isolation
                - link "Direct link to Group Chat Session Isolation" [ref=e2835] [cursor=pointer]:
                  - /url: "#group-chat-session-isolation"
                  - text: "#"
              - paragraph [ref=e2836]: "Control whether shared chats keep one conversation per room or one conversation per participant:"
              - generic [ref=e2838]:
                - code [ref=e2840]:
                  - generic [ref=e2841]: "group_sessions_per_user: true # true = per-user isolation in groups/channels, false = one shared session per chat"
                - generic [ref=e2842]:
                  - button "Toggle word wrap" [ref=e2843] [cursor=pointer]:
                    - img [ref=e2844]
                  - button "Copy code to clipboard" [ref=e2846] [cursor=pointer]:
                    - generic [ref=e2847]:
                      - img [ref=e2848]
                      - img [ref=e2850]
              - list [ref=e2852]:
                - listitem [ref=e2853]:
                  - code [ref=e2854]: "true"
                  - text: is the default and recommended setting. In Discord channels, Telegram groups, Slack channels, and similar shared contexts, each sender gets their own session when the platform provides a user ID.
                - listitem [ref=e2855]:
                  - code [ref=e2856]: "false"
                  - text: reverts to the old shared-room behavior. That can be useful if you explicitly want Hermes to treat a channel like one collaborative conversation, but it also means users share context, token costs, and interrupt state.
                - listitem [ref=e2857]: Direct messages are unaffected. Hermes still keys DMs by chat/DM ID as usual.
                - listitem [ref=e2858]:
                  - text: Threads stay isolated from their parent channel either way; with
                  - code [ref=e2859]: "true"
                  - text: ", each participant also gets their own session inside the thread."
              - paragraph [ref=e2860]:
                - text: For the behavior details and examples, see
                - link "Sessions" [ref=e2861] [cursor=pointer]:
                  - /url: /docs/user-guide/sessions
                - text: and the
                - link "Discord guide" [ref=e2862] [cursor=pointer]:
                  - /url: /docs/user-guide/messaging/discord
                - text: .
