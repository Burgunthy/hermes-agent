                  - text: "#"
              - paragraph [ref=e2342]: "When enabled, three layers of guidance may be added to the system prompt:"
              - list [ref=e2343]:
                - listitem [ref=e2344]:
                  - paragraph [ref=e2345]:
                    - strong [ref=e2346]: General tool-use enforcement
                    - text: (all matched models) — instructs the model to make tool calls immediately instead of describing intentions, keep working until the task is complete, and never end a turn with a promise of future action.
                - listitem [ref=e2347]:
                  - paragraph [ref=e2348]:
                    - strong [ref=e2349]: OpenAI execution discipline
                    - text: "(GPT and Codex models only) — additional guidance addressing GPT-specific failure modes: abandoning work on partial results, skipping prerequisite lookups, hallucinating instead of using tools, and declaring \"done\" without verification."
                - listitem [ref=e2350]:
                  - paragraph [ref=e2351]:
                    - strong [ref=e2352]: Google operational guidance
                    - text: (Gemini and Gemma models only) — conciseness, absolute paths, parallel tool calls, and verify-before-edit patterns.
              - paragraph [ref=e2353]:
                - text: These are transparent to the user and only affect the system prompt. Models that already use tools reliably (like Claude) don't need this guidance, which is why
                - code [ref=e2354]: "\"auto\""
                - text: excludes them.
