                - listitem [ref=e3151]:
                  - code [ref=e3152]: must_respond
                  - text: (default) — capture the dialog, surface it in
                  - code [ref=e3153]: browser_snapshot.pending_dialogs
                  - text: ", and wait for the agent to call"
                  - code [ref=e3154]: browser_dialog(action=...)
                  - text: . After
                  - code [ref=e3155]: dialog_timeout_s
                  - text: seconds with no response, the dialog is auto-dismissed to prevent the page's JS thread from stalling forever.
                - listitem [ref=e3156]:
                  - code [ref=e3157]: auto_dismiss
                  - text: — capture, dismiss immediately. The agent still sees the dialog record in
                  - code [ref=e3158]: browser_snapshot.recent_dialogs
                  - text: with
                  - code [ref=e3159]: closed_by="auto_policy"
                  - text: after the fact.
                - listitem [ref=e3160]:
                  - code [ref=e3161]: auto_accept
                  - text: — capture, accept immediately. Useful for pages with aggressive
                  - code [ref=e3162]: beforeunload
                  - text: prompts.
