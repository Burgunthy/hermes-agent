              - paragraph [ref=e673]:
                - strong [ref=e674]: "Persistence:"
                - text: When
                - code [ref=e675]: "container_persistent: true"
                - text: ", Hermes snapshots the sandbox filesystem during cleanup and restores a later sandbox for the same task from that snapshot. Snapshot contents can include Hermes-synced credentials, skills, and cache files that were copied into the sandbox. This preserves filesystem state only; it does not preserve live sandbox identity, PID space, shell state, or running background processes."
              - paragraph [ref=e676]:
                - strong [ref=e677]: "Background commands:"
                - code [ref=e678]: terminal(background=true)
                - text: uses Hermes' generic non-local background process flow. You can spawn, poll, wait, view logs, and kill processes through the normal process tool while the sandbox is alive. Hermes does not provide native Vercel detached-process recovery after cleanup or restart.
