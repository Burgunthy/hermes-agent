              - paragraph [ref=e1064]:
                - strong [ref=e1065]: "How skill settings work:"
              - list [ref=e1066]:
                - listitem [ref=e1067]:
                  - code [ref=e1068]: hermes config migrate
                  - text: scans all enabled skills, finds unconfigured settings, and offers to prompt you
                - listitem [ref=e1069]:
