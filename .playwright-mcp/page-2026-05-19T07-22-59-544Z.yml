                  - generic [ref=e1294]: "target_ratio: 0.20 # Fraction of threshold to preserve as recent tail"
                  - generic [ref=e1295]: "protect_last_n: 20 # Min recent messages to keep uncompressed"
                  - generic [ref=e1296]: "hygiene_hard_message_limit: 400 # Gateway safety valve — see below"
                  - generic [ref=e1297]: "# The summarization model/provider is configured under auxiliary:"
                  - generic [ref=e1298]: "auxiliary:"
                  - generic [ref=e1299]: "compression:"
                  - generic [ref=e1300]: "model: \"\" # Empty = use main chat model. Override with e.g. \"google/gemini-3-flash-preview\" for cheaper/faster compression."
                  - generic [ref=e1301]: "provider: \"auto\" # Provider: \"auto\", \"openrouter\", \"nous\", \"codex\", \"main\", etc."
                  - generic [ref=e1302]: "base_url: null # Custom OpenAI-compatible endpoint (overrides provider)"
                - generic [ref=e1303]:
                  - button "Toggle word wrap" [ref=e1304] [cursor=pointer]:
