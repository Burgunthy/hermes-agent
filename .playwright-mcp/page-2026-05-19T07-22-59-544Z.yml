                  - text: Gateway hot-reload of compression and context length
                - paragraph [ref=e1334]:
                  - text: As of recent releases, editing
                  - code [ref=e1335]: model.context_length
                  - text: or any
                  - code [ref=e1336]: compression.*
                  - text: key in
                  - code [ref=e1337]: config.yaml
                  - text: on a running gateway takes effect on the next message — no gateway restart, no
                  - code [ref=e1338]: /reset
                  - text: ", no session rotation required. The cached-agent signature includes these keys, so the gateway transparently rebuilds the agent when it sees a change. API keys and tool/skill config still require the usual reload paths."
              - heading "Common setupsDirect link to Common setups" [level=3] [ref=e1339]:
