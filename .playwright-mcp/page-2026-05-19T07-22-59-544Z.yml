                    - img [ref=e1082]
                    - img [ref=e1084]
              - paragraph [ref=e1086]:
                - text: For details on declaring config settings in your own skills, see
                - link "Creating Skills — Config Settings" [ref=e1087] [cursor=pointer]:
                  - /url: /docs/developer-guide/creating-skills#config-settings-configyaml
                - text: .
              - heading "Guard on agent-created skill writesDirect link to Guard on agent-created skill writes" [level=3] [ref=e1088]:
                - text: Guard on agent-created skill writes
                - link "Direct link to Guard on agent-created skill writes" [ref=e1089] [cursor=pointer]:
                  - /url: "#guard-on-agent-created-skill-writes"
                  - text: "#"
              - paragraph [ref=e1090]:
                - text: When the agent uses
                - code [ref=e1091]: skill_manage
                - text: to create, edit, patch, or delete a skill, Hermes can optionally scan the new/updated content for dangerous keyword patterns (credential harvesting, obvious prompt injection, exfil instructions). The scanner is
                - strong [ref=e1092]: off by default
                - text: — real agent workflows that legitimately touch
                - code [ref=e1093]: ~/.ssh/
                - text: or mention
                - code [ref=e1094]: $OPENAI_API_KEY
                - text: "were tripping the heuristic too often. Turn it back on if you want the scanner to prompt you before the agent's skill writes land:"
              - generic [ref=e1096]:
                - code [ref=e1098]:
                  - generic [ref=e1099]: "skills:"
                  - generic [ref=e1100]: "guard_agent_created: true # default: false"
                - button "Copy code to clipboard" [ref=e1102] [cursor=pointer]:
