                  - text: "#"
              - paragraph [ref=e881]:
                - text: By default Docker containers run as
                - code [ref=e882]: root
                - text: (UID 0). Files created inside
                - code [ref=e883]: /workspace
                - text: or other bind-mounts end up owned by root on the host, so after a session you have to
                - code [ref=e884]: sudo chown
                - text: them before you can edit them from your host editor. The
                - code [ref=e885]: terminal.docker_run_as_host_user
                - text: "flag fixes this:"
              - generic [ref=e887]:
