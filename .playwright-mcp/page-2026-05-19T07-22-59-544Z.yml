                - strong [ref=e2503]: not
                - text: translate agent responses, log lines, tool output, error tracebacks, or slash-command descriptions — those stay in English. If you want the agent itself to reply in another language, just tell it in your prompt or system message.
              - paragraph [ref=e2504]:
