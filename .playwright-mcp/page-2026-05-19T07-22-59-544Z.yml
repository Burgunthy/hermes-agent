                  - generic [ref=e3122]: "inactivity_timeout: 120 # Seconds before auto-closing idle sessions"
                  - generic [ref=e3123]: "command_timeout: 30 # Timeout in seconds for browser commands (screenshot, navigate, etc.)"
                  - generic [ref=e3124]: "record_sessions: false # Auto-record browser sessions as WebM videos to ~/.hermes/browser_recordings/"
                  - generic [ref=e3125]: "# Optional CDP override — when set, Hermes attaches directly to your own"
                  - generic [ref=e3126]: "# Chrome (via /browser connect) rather than starting a headless browser."
                  - generic [ref=e3127]: "cdp_url: \"\""
                  - generic [ref=e3128]: "# Dialog supervisor — controls how native JS dialogs (alert / confirm / prompt)"
                  - generic [ref=e3129]: "# are handled when a CDP backend is attached (Browserbase, local Chrome via"
                  - generic [ref=e3130]: "# /browser connect). Ignored on Camofox and default local agent-browser mode."
                  - generic [ref=e3131]: "dialog_policy: must_respond # must_respond | auto_dismiss | auto_accept"
                  - generic [ref=e3132]: "dialog_timeout_s: 300 # Safety auto-dismiss under must_respond (seconds)"
                  - generic [ref=e3133]: "camofox:"
                  - generic [ref=e3134]: "managed_persistence: false # When true, Camofox sessions persist cookies/logins across restarts"
                  - generic [ref=e3135]: "user_id: \"\" # Optional externally managed Camofox userId"
                  - generic [ref=e3136]: "session_key: \"\" # Optional session key sent when Hermes creates a tab"
                  - generic [ref=e3137]: "adopt_existing_tab: false # Reuse an existing tab for this identity before creating one"
                - generic [ref=e3138]:
                  - button "Toggle word wrap" [ref=e3139] [cursor=pointer]:
