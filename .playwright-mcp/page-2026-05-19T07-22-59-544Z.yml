              - paragraph [ref=e3396]:
                - strong [ref=e3397]: "Subagent provider:model override:"
                - text: By default, subagents inherit the parent agent's provider and model. Set
                - code [ref=e3398]: delegation.provider
                - text: and
                - code [ref=e3399]: delegation.model
                - text: to route subagents to a different provider:model pair — e.g., use a cheap/fast model for narrowly-scoped subtasks while your primary agent runs an expensive reasoning model.
              - paragraph [ref=e3400]:
                - strong [ref=e3401]: "Direct endpoint override:"
                - text: If you want the obvious custom-endpoint path, set
                - code [ref=e3402]: delegation.base_url
                - text: ","
                - code [ref=e3403]: delegation.api_key
                - text: ", and"
                - code [ref=e3404]: delegation.model
                - text: . That sends subagents directly to that OpenAI-compatible endpoint and takes precedence over
                - code [ref=e3405]: delegation.provider
                - text: . If
                - code [ref=e3406]: delegation.api_key
                - text: is omitted, Hermes falls back to
                - code [ref=e3407]: OPENAI_API_KEY
                - text: only.
              - paragraph [ref=e3408]:
                - strong [ref=e3409]:
                  - text: Wire protocol (
                  - code [ref=e3410]: api_mode
                  - text: "):"
                - text: Hermes auto-detects the wire protocol from
                - code [ref=e3411]: delegation.base_url
                - text: (e.g. paths ending in
                - code [ref=e3412]: /anthropic
                - text: →
                - code [ref=e3413]: anthropic_messages
                - text: ; Codex / native Anthropic / Kimi-coding hostnames keep their existing detection). For endpoints the heuristic can't classify — for example Azure AI Foundry, MiniMax, Zhipu GLM, or LiteLLM proxies fronting an Anthropic-shaped backend — set
                - code [ref=e3414]: delegation.api_mode
                - text: explicitly to one of
                - code [ref=e3415]: chat_completions
                - text: ","
                - code [ref=e3416]: codex_responses
                - text: ", or"
                - code [ref=e3417]: anthropic_messages
                - text: . Leave it empty (the default) to keep auto-detection.
              - paragraph [ref=e3418]:
                - text: "The delegation provider uses the same credential resolution as CLI/gateway startup. All configured providers are supported:"
                - code [ref=e3419]: openrouter
                - text: ","
                - code [ref=e3420]: nous
                - text: ","
                - code [ref=e3421]: copilot
                - text: ","
                - code [ref=e3422]: zai
                - text: ","
                - code [ref=e3423]: kimi-coding
                - text: ","
                - code [ref=e3424]: minimax
                - text: ","
                - code [ref=e3425]: minimax-cn
                - text: . When a provider is set, the system automatically resolves the correct base URL, API key, and API mode — no manual credential wiring needed.
              - paragraph [ref=e3426]:
                - strong [ref=e3427]: "Precedence:"
                - code [ref=e3428]: delegation.base_url
                - text: in config →
                - code [ref=e3429]: delegation.provider
                - text: in config → parent provider (inherited).
                - code [ref=e3430]: delegation.model
                - text: in config → parent model (inherited). Setting just
                - code [ref=e3431]: model
                - text: without
                - code [ref=e3432]: provider
                - text: changes only the model name while keeping the parent's credentials (useful for switching models within the same provider like OpenRouter).
              - paragraph [ref=e3433]:
                - strong [ref=e3434]: "Width and depth:"
                - code [ref=e3435]: max_concurrent_children
                - text: caps how many subagents run in parallel per batch (default
                - code [ref=e3436]: "3"
                - text: ", floor of 1, no ceiling). Can also be set via the"
                - code [ref=e3437]: DELEGATION_MAX_CONCURRENT_CHILDREN
                - text: env var. When the model submits a
                - code [ref=e3438]: tasks
                - text: array longer than the cap,
                - code [ref=e3439]: delegate_task
                - text: returns a tool error explaining the limit rather than silently truncating.
                - code [ref=e3440]: max_spawn_depth
                - text: controls the delegation tree depth (clamped to 1-3). At the default
                - code [ref=e3441]: "1"
                - text: ", delegation is flat: children cannot spawn grandchildren, and passing"
                - code [ref=e3442]: role="orchestrator"
                - text: silently degrades to
                - code [ref=e3443]: leaf
                - text: . Raise to
                - code [ref=e3444]: "2"
                - text: so orchestrator children can spawn leaf grandchildren;
                - code [ref=e3445]: "3"
                - text: for three-level trees. The agent opts into orchestration per call via
                - code [ref=e3446]: role="orchestrator"
                - text: ;
                - code [ref=e3447]: "orchestrator_enabled: false"
                - text: forces every child back to leaf regardless. Cost scales multiplicatively — at
                - code [ref=e3448]: "max_spawn_depth: 3"
                - text: with
                - code [ref=e3449]: "max_concurrent_children: 3"
                - text: ", the tree can reach 3×3×3 = 27 concurrent leaf agents. See"
                - link "Subagent Delegation → Depth Limit and Nested Orchestration" [ref=e3450] [cursor=pointer]:
                  - /url: /docs/user-guide/features/delegation#depth-limit-and-nested-orchestration
                - text: for usage patterns.
