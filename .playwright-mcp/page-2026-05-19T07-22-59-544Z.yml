              - paragraph [ref=e251]:
                - text: For AI provider setup (OpenRouter, Anthropic, Copilot, custom endpoints, self-hosted LLMs, fallback models, etc.), see
                - link "AI Providers" [ref=e252] [cursor=pointer]:
