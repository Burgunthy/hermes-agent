              - list [ref=e2880]:
                - listitem [ref=e2881]:
                  - code [ref=e2882]: pair
                  - text: is the default. Hermes denies access, but replies with a one-time pairing code in DMs.
                - listitem [ref=e2883]:
                  - code [ref=e2884]: ignore
                  - text: silently drops unauthorized DMs.
                - listitem [ref=e2885]: Platform sections override the global default, so you can keep pairing enabled broadly while making one platform quieter.
              - heading "Quick CommandsDirect link to Quick Commands" [level=2] [ref=e2886]:
                - text: Quick Commands
                - link "Direct link to Quick Commands" [ref=e2887] [cursor=pointer]:
                  - /url: "#quick-commands"
                  - text: "#"
              - paragraph [ref=e2888]: Define custom commands that either run shell commands without invoking the LLM, or alias one slash command to another. Exec quick commands are zero-token and useful from messaging platforms (Telegram, Discord, etc.) for quick server checks or utility scripts.
              - generic [ref=e2890]:
