                - listitem [ref=e992]:
                  - text: Shell variables (
                  - code [ref=e993]: MY_VAR=hello
                  - text: )
              - paragraph [ref=e994]:
                - strong [ref=e995]: "Precedence:"
              - table [ref=e996]:
                - rowgroup [ref=e997]:
                  - row "Level Variable Default" [ref=e998]:
                    - columnheader "Level" [ref=e999]
                    - columnheader "Variable" [ref=e1000]
                    - columnheader "Default" [ref=e1001]
                - rowgroup [ref=e1002]:
