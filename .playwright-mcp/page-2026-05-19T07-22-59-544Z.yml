                - text: ","
                - code [ref=e2921]: /disk
                - text: ","
                - code [ref=e2922]: /update
                - text: ","
                - code [ref=e2923]: /gpu
                - text: ", or"
                - code [ref=e2924]: /restart
                - text: in the CLI or any messaging platform.
                - code [ref=e2925]: exec
                - text: commands run locally on the host and return the output directly — no LLM call, no tokens consumed.
                - code [ref=e2926]: alias
                - text: commands rewrite to the configured slash command target.
              - list [ref=e2927]:
                - listitem [ref=e2928]:
                  - strong [ref=e2929]: 30-second timeout
                  - text: — long-running commands are killed with an error message
                - listitem [ref=e2930]:
                  - strong [ref=e2931]: Priority
                  - text: — quick commands are checked before skill commands, so you can override skill names
                - listitem [ref=e2932]:
                  - strong [ref=e2933]: Autocomplete
                  - text: — quick commands are resolved at dispatch time and are not shown in the built-in slash-command autocomplete tables
                - listitem [ref=e2934]:
                  - strong [ref=e2935]: Type
                  - text: — supported types are
                  - code [ref=e2936]: exec
                  - text: and
                  - code [ref=e2937]: alias
                  - text: ; other types show an error
                - listitem [ref=e2938]:
                  - strong [ref=e2939]: Works everywhere
                  - text: — CLI, Telegram, Discord, Slack, WhatsApp, Signal, Email, Home Assistant
              - paragraph [ref=e2940]: String-only prompt shortcuts are not valid quick commands. For reusable prompt workflows, create a skill or alias to an existing slash command.
