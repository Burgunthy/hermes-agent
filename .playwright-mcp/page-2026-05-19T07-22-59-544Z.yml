                  - text: "#"
              - paragraph [ref=e2471]:
                - text: When
                - code [ref=e2472]: display.file_mutation_verifier
                - text: is
                - code [ref=e2473]: "true"
                - text: (default), Hermes appends a one-line advisory to the assistant's final response whenever a
                - code [ref=e2474]: write_file
                - text: or
                - code [ref=e2475]: patch
                - text: call failed during the turn and was never superseded by a successful write to the same path. This catches the "batch of parallel patches, half silently fail, model summarises success" class of over-claim without requiring you to manually run
                - code [ref=e2476]: git status
                - text: after every edit.
              - paragraph [ref=e2477]: "Example footer:"
              - generic [ref=e2479]:
                - code [ref=e2481]:
                  - generic [ref=e2482]: "⚠️ File-mutation verifier: 3 file(s) were NOT modified this turn despite any wording above that may suggest otherwise. Run `git status` or `read_file` to confirm."
                  - generic [ref=e2483]: • concepts/automatic-organization.md — [patch] Could not find match for old_string
                  - generic [ref=e2484]: • concepts/lora.md — [patch] Could not find match for old_string
                  - generic [ref=e2485]: • concepts/rag-pipeline.md — [patch] Could not find match for old_string
                - generic [ref=e2486]:
                  - button "Toggle word wrap" [ref=e2487] [cursor=pointer]:
                    - img [ref=e2488]
                  - button "Copy code to clipboard" [ref=e2490] [cursor=pointer]:
                    - generic [ref=e2491]:
                      - img [ref=e2492]
                      - img [ref=e2494]
              - paragraph [ref=e2496]:
                - text: Set
                - code [ref=e2497]: "file_mutation_verifier: false"
                - text: (or
                - code [ref=e2498]: HERMES_FILE_MUTATION_VERIFIER=0
                - text: ) to suppress the footer. The verifier only fires when real failures are outstanding at turn end — a model that retries a failed patch and succeeds within the same turn will not trigger it for that file.
