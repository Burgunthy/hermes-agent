                - text: is not set, the backend is auto-detected from available API keys. If only
                - code [ref=e3081]: SEARXNG_URL
                - text: is set, SearXNG is used. If only
                - code [ref=e3082]: EXA_API_KEY
                - text: is set, Exa is used. If only
