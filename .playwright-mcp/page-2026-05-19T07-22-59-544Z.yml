              - paragraph [ref=e950]: Use the opt-in only when you intentionally want the container to work on live host files.
              - heading "Persistent ShellDirect link to Persistent Shell" [level=3] [ref=e951]:
                - text: Persistent Shell
                - link "Direct link to Persistent Shell" [ref=e952] [cursor=pointer]:
                  - /url: "#persistent-shell"
                  - text: "#"
              - paragraph [ref=e953]:
                - text: By default, each terminal command runs in its own subprocess — working directory, environment variables, and shell variables reset between commands. When
                - strong [ref=e954]: persistent shell
                - text: is enabled, a single long-lived bash process is kept alive across
                - code [ref=e955]: execute()
                - text: calls so that state survives between commands.
              - paragraph [ref=e956]:
                - text: This is most useful for the
                - strong [ref=e957]: SSH backend
                - text: ", where it also eliminates per-command connection overhead. Persistent shell is"
                - strong [ref=e958]: enabled by default for SSH
                - text: and disabled for the local backend.
              - generic [ref=e960]:
                - code [ref=e962]:
                  - generic [ref=e963]: "terminal:"
                  - generic [ref=e964]: "persistent_shell: true # default — enables persistent shell for SSH"
                - button "Copy code to clipboard" [ref=e966] [cursor=pointer]:
                  - generic [ref=e967]:
                    - img [ref=e968]
                    - img [ref=e970]
              - paragraph [ref=e972]: "To disable:"
              - generic [ref=e974]:
