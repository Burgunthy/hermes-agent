                  - text: "#"
              - paragraph [ref=e758]:
                - text: For the
                - strong [ref=e759]: SSH
                - text: ","
                - strong [ref=e760]: Modal
                - text: ", and"
                - strong [ref=e761]: Daytona
                - text: backends (anywhere the agent's working tree lives on a different machine than the host running Hermes), Hermes tracks files the agent touched inside the remote sandbox and, on session teardown / sandbox cleanup,
                - strong [ref=e762]: syncs the modified files back to the host
                - text: under
                - code [ref=e763]: ~/.hermes/cache/remote-syncs/<session-id>/
                - text: .
              - list [ref=e764]:
                - listitem [ref=e765]:
                  - text: "Triggers on: session close,"
                  - code [ref=e766]: /new
                  - text: ","
                  - code [ref=e767]: /reset
                  - text: ", gateway message timeout,"
                  - code [ref=e768]: delegate_task
                  - text: subagent completion when the child used a remote backend.
                - listitem [ref=e769]: Covers the whole tree the agent modified, not just files it explicitly opened. Additions, edits, and deletions are all captured.
                - listitem [ref=e770]:
                  - text: The remote sandbox may have been torn down by the time you go looking; the local
                  - code [ref=e771]: ~/.hermes/cache/remote-syncs/…
                  - text: copy is the authoritative record of what the agent changed.
                - listitem [ref=e772]:
                  - text: Large binary outputs (model checkpoints, raw datasets) are capped by size — the sync skips files over
                  - code [ref=e773]: file_sync_max_mb
                  - text: (default
                  - code [ref=e774]: "100"
                  - text: ). Bump that if you expect bigger artifacts to come back.
