          - heading "Integration of the geodesic equations via Noether Symmetries" [level=1] [ref=e42]
          - link "Ugur Camci" [ref=e44] [cursor=pointer]:
            - /url: https://arxiv.org/search/gr-qc?searchtype=author&query=Camci,+U
          - blockquote [ref=e45]: Through this article, I will overview the use of Noether symmetry approach in discussing the integration of geodesic equations for the geodesic Lagrangians of spacetimes. I will also give some examples to reveal the efficiency of Noether symmetry approach by finding the first integrals related for the geodesic Lagrangians of the Gödel-type, Schwarzschild, Reissner-Nordström and Kerr spacetimes. After obtaining the approximate Noether symmetries of the Schwarzschild, Reissner-Nordström and Kerr spacetimes, the first integrals associated with each of approximate Noether symmetries have been integrated to find a general solution of geodesic equations in terms of the arc length s .
