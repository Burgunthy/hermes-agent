                  - text: before using this software.
                - paragraph [ref=e880]: "I currently focus on strategies that revolve around one of several approaches:"
                - list [ref=e881]:
                  - listitem [ref=e882]:
                    - paragraph [ref=e883]:
                      - strong [ref=e884]: Time-series prediction
                      - text: — model expected price behaviour and compare to actual. Buy when the model projects a higher price (above a threshold), sell when it projects lower. Variants use Discrete Wavelet Transforms (DWT), FFTs, and Kalman filters. The DWT variants tend to perform best.
                  - listitem [ref=e885]:
                    - paragraph [ref=e886]:
                      - strong [ref=e887]: Neural network classification
                      - text: — trinary classifiers (sell/hold/buy) based on technical indicators. Base class is
                      - code [ref=e888]: BaseNNStrategy
                      - text: (
                      - code [ref=e889]: Framework/
                      - text: ); per-family subclasses live in
                      - code [ref=e890]: NNNC/
                      - text: (N-ary),
                      - code [ref=e891]: NNMT/
                      - text: (multi-task),
                      - code [ref=e892]: Anomaly/
                      - text: ", and"
                      - code [ref=e893]: Sklearn/
                      - text: . Models are trained over long periods and saved to
