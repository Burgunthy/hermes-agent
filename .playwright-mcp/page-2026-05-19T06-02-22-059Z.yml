                - paragraph [ref=e680]:
                  - emphasis [ref=e681]:
                    - strong [ref=e682]: The directory structure and code architecture have completely changed. The older code is available on branch v1, but I will not be maintaining that
                - paragraph [ref=e683]: Note that, like the rest of the software world, I have been playing with agent-assisted coding, so some of the code might look a little strange. I added a file AGENT_GUIDE.md that should be useful for agents (or humans) looking at the code.
                - paragraph [ref=e684]:
                  - text: All strategies share a common framework for entry/exit processing, custom exits, and stop-loss logic. There is also a consistent approach to normalization of data. The base framework lives in the
                  - emphasis [ref=e685]: Framework
                  - text: directory.
                - paragraph [ref=e686]: Many of the strategies use Neural Networks (Machine Learning), which requires training the underlying models on lots of data. Even then, I had to implement Generative Adversarial Network (GAN) models to artificially enhance the data because there are simply not enough buy/sell signals to train the stategy models. Look in the GANs directory for more info.
                - generic [ref=e687]:
