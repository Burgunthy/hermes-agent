                - paragraph [ref=e951]: It turns out that normalization of data is very, very important for any kind of model-based strategy. The data passed to the models cannot have pair-specific data (like price or volume), and the data must be consistently scaled across pairs. Because of this, I spent a lot of time tweaking which indicators are passed into the models. Also, using several indicators which essentially have the same information confuses the models, so I have trimmed down redundant indicators where possible. If you are interested, look at DebugAnalyseDf to see how I assess the indicators.
                - paragraph [ref=e952]:
                  - text: So, do
                  - emphasis [ref=e953]: not
                  - text: just blindly throw indicators into the dataframe, it will mess up the models. Also, if you do add anytghing, you will need to update the notrmalization code, regenerate the scalers and retrain the GAN and strategy models.
                - generic [ref=e954]:
                  - heading "GAN Data Augmentation" [level=3] [ref=e955]
                  - 'link "Permalink: GAN Data Augmentation" [ref=e956] [cursor=pointer]':
                    - /url: "#gan-data-augmentation"
                    - img [ref=e957]
                - paragraph [ref=e959]: Neural net strategies suffer from severe class imbalance (many more holds than buys/sells). GANs generate synthetic minority-class samples to improve training.
                - paragraph [ref=e960]:
                  - text: GAN models are created by running one of the
                  - code [ref=e961]: Create*GAN*
                  - text: strategies in
                  - code [ref=e962]: GANs/
                  - text: (e.g.
                  - code [ref=e963]: CreateWGAN
                  - text: ","
                  - code [ref=e964]: CreateMTWGAN
                  - text: ","
                  - code [ref=e965]: CreateCtabGanPlus
                  - text: ") under freqtrade backtesting. All GAN types share a single save layout:"
                  - code [ref=e966]: saved_data/<StrategyName>/GANs/<gan_type>/
                  - text: (or
                  - code [ref=e967]: GANs_PCA/<gan_type>/
                  - text: for PCA-reduced strategies). The convention lives in
                  - code [ref=e968]: GANs/paths.py::gan_save_path
                  - text: — every consumer goes through it.
                - paragraph [ref=e969]:
                  - text: Strategies consume a GAN by setting
                  - code [ref=e970]: gan_type = GANType.X
                  - text: on the class. The base class then loads the model, validates its persisted metadata against the strategy's current thresholds / training_type / etc., and dispatches class balancing through
                  - code [ref=e971]: GANs.balance.balance_single_task
                  - text: (single-task types) or
                  - code [ref=e972]: balance_multi_task
                  - text: (multi-task types). Metadata mismatches raise
                  - code [ref=e973]: GANMetadataMismatchError
                  - text: with a per-key diff so threshold drift between strategy and saved GAN is surfaced loudly rather than silently masked.
                - paragraph [ref=e974]:
                  - text: Internally, every GAN type is wrapped by a
                  - code [ref=e975]: GANBackend
                  - text: subclass (in
                  - code [ref=e976]: GANs/backends/
                  - text: ) so the
                  - code [ref=e977]: fit / generate / save / load
                  - text: lifecycle is uniform across types and across MLX/TF backends. Adding a new variant of an existing type is a one-class change in
                  - code [ref=e978]: GANs/
                  - text: ; adding a genuinely new GAN type means a new
                  - code [ref=e979]: GANBackend
                  - text: in
                  - code [ref=e980]: GANs/backends/
                  - text: . See
                  - code [ref=e981]: GANs/README.md
                  - text: for backend details and
                  - code [ref=e982]: GANs/tests/
                  - text: for the contract tests.
