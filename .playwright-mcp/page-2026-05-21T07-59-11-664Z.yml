                    - img [ref=e413]
                - paragraph [ref=e415]: NetEase Fuxi Lab is considered as the professional game AI research division in China. Dr. Harry Shum, an NAE foreign member who is worldly-known for his research on artificial intelligence has joined us as our chief advisor. Fuxi is founded on the principle of bridging artificial intelligence and electronic games through transdisciplinary research. We use cutting-edge technologies to reshape the audiovisual experience of our gamers. In the meantime, the mass data and virtual environment provided by our game platform also enable us to boost the development of AI frontier research.
                - paragraph [ref=e416]: We focus on researching big data platform, user persona, reinforcement learning, computer vision & graphics, natural language processing, speech synthesis & music generation, and their potentiality in game industry. All of our team members have both professional education background (THU, PKU, ZJU, USTC, WHU, etc.) and strong practice aptitude.
