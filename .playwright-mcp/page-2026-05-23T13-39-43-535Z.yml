                - heading "Is Polar built on Stripe? Why not just use Stripe directly?" [level=3] [ref=e187]
                - img [ref=e189]
              - paragraph [ref=e192]: We use Stripe rails for processing reliability and coverage. Processing ≠ the business layer. Polar is the MoR + billing + entitlements + unit-economics layer you'd otherwise build or buy on top of Stripe.
            - generic [ref=e193]:
              - button "03 How are payouts handled internationally?" [ref=e194] [cursor=pointer]:
