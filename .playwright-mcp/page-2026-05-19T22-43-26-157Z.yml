                - paragraph [ref=e1624]:
                  - strong [ref=e1625]: Notes
                - paragraph [ref=e1626]:
                  - strong [ref=e1627]: "1:"
                  - text: The difference between total and usable OCPUs and memory is caused by the need to reserve OCPUs and memory for hypervisor use.
                - paragraph [ref=e1628]:
                  - strong [ref=e1629]: "2:"
                  - text: Because this dedicated virtual machine host shape supports hosted VMs that use a
                  - link "previous generation" [ref=e1630] [cursor=pointer]:
                    - /url: computeshapes.htm#previous-generation-shapes
                  - text: shape series, it is available by request only.
                - paragraph [ref=e1631]:
                  - strong [ref=e1632]: "3:"
                  - text: For Standard2, Standard.E2, and DenseIO2 shapes, billing is based on OCPUs, not memory. For all other shapes that support flexible hosted VMs, billing is based on OCPUs and memory, which are billed independently.
            - article "Previous Generation Shapes Copy link to this section" [ref=e1633]:
              - heading "Previous Generation Shapes Copy link to this section" [level=2] [ref=e1634]:
                - heading "Previous Generation Shapes" [level=2] [ref=e1635]
                - button "Copy link to this section" [ref=e1636]: 🔗
              - generic [ref=e1637]:
                - generic [ref=e1638]:
                  - img [ref=e1640]
                  - strong [ref=e1651]: Tip
                  - text: Previous generation shapes are still fully supported. However, because the underlying hardware has reached the sustaining phase of its lifecycle, capacity in certain high-demand regions might be limited.
                - paragraph [ref=e1652]: Oracle Cloud Infrastructure periodically releases new generations of Compute shapes. The latest shapes let you take advantage of newer hardware and a better price-performance ratio. When a shape is several years old, and newer generation shapes that are suited for the same purposes are available, the old shape transitions to become a previous generation shape.
                - paragraph [ref=e1653]: Your current utilization is fully supported on the previous generation shape. In certain high demand regions, you may need to plan your utilization growth on a newer generation shape.
                - heading "Upgrading from a Previous Generation Shape" [level=3] [ref=e1655]
                - paragraph [ref=e1656]: "To upgrade from a previous generation shape to a current generation shape, you can do the following things:"
                - list [ref=e1657]:
                  - listitem [ref=e1658]:
                    - text: For supported VM instances,
                    - link "change the shape of the instance" [ref=e1659] [cursor=pointer]:
                      - /url: ../Tasks/resizinginstances.htm
                    - text: .
                  - listitem [ref=e1660]:
                    - text: For bare metal instances and VM instances that don't support changing the shape,
                    - link "terminate the instance but DO NOT delete the boot volume" [ref=e1661] [cursor=pointer]:
                      - /url: ../Tasks/terminatinginstance.htm
                    - text: . Then,
                    - link "use the boot volume to create a new instance" [ref=e1662] [cursor=pointer]:
                      - /url: ../Tasks/launchinginstance.htm
                    - text: .
