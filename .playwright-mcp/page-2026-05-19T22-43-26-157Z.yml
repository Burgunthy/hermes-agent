        - article "Compute Shapes" [ref=e128]:
          - article "Compute Shapes" [ref=e129]:
            - heading "Compute Shapes" [level=1] [ref=e130]
            - generic [ref=e131]:
              - paragraph [ref=e132]:
                - text: A shape is a template that determines the number of
                - strong [ref=e133]:
                  - text: OCPUs
                  - img [ref=e135]
                - text: ", amount of memory, and other resources that are allocated to an instance. Compute shapes are available with AMD processors, Intel processors, and Arm-based processors."
              - paragraph [ref=e138]:
                - text: This topic provides basic information about the shapes that are available for bare metal instances, virtual machines (VMs), and dedicated virtual machine hosts. For information about service limits, see
                - link "Compute Limits" [ref=e139] [cursor=pointer]:
                  - /url: /iaas/Content/General/service-limits/default.htm#computelimits
                - text: . For information about protecting data on NVMe devices, see
                - link "Protecting Data on NVMe Devices" [ref=e140] [cursor=pointer]:
                  - /url: nvmedeviceinformation.htm
                - text: .
              - generic [ref=e141]:
                - img [ref=e143]
                - strong [ref=e146]: Note
                - list [ref=e147]:
                  - listitem [ref=e148]:
                    - paragraph [ref=e149]: When a new region becomes available, it might take a few weeks before host capacity also becomes available.
                    - paragraph [ref=e150]:
                      - text: To obtain a list of shapes available to you, run the
                      - link "ListShapes" [ref=e151] [cursor=pointer]:
                        - /url: /iaas/api/#/en/iaas/latest/Shape/ListShapes
                      - text: operation.
                  - listitem [ref=e152]:
                    - text: If your instance uses
                    - link "stateful security rules" [ref=e153] [cursor=pointer]:
                      - /url: /iaas/Content/Network/Concepts/securityrules.htm#stateful
                    - text: ", each instance has a"
                    - link "maximum number of concurrent connections" [ref=e154] [cursor=pointer]:
                      - /url: /iaas/Content/General/service-limits/default.htm#connection-tracking
                    - text: that can be tracked, based on the instance's shape.
              - generic [ref=e155]:
                - heading "Compute Shape Pricing" [level=2] [ref=e156]
                - paragraph [ref=e157]:
                  - text: You can use the
                  - link "Cost Estimator" [ref=e158] [cursor=pointer]:
                    - /url: https://www.oracle.com/cloud/cost-estimator.html
                  - text: to estimate your expected monthly project costs with Oracle Cloud Infrastructure. For detailed information about billing, see
                  - link "Billing and Cost Management" [ref=e159] [cursor=pointer]:
                    - /url: /iaas/Content/Billing/home.htm
                  - text: and the Oracle Compute Cloud Services section of
                  - link "Oracle PaaS and IaaS Universal Credits Service Descriptions" [ref=e160] [cursor=pointer]:
                    - /url: https://www.oracle.com/assets/paas-iaas-universal-credits-3940775.pdf
                  - text: .
                - generic [ref=e161]:
                  - term [ref=e162]: OCPUs and vCPUs
                  - definition [ref=e163]:
                    - paragraph [ref=e164]: Oracle measures compute resource pricing differently. The Oracle CPU (OCPU) represents physical CPU cores and is the unit of measurement for CPUs on x86 CPUs (AMD and Intel) and Arm CPUs (OCI Ampere Compute). A virtual CPU (vCPU), the industry-standard for measuring compute resources, represents one execution thread of a physical CPU core.
                    - paragraph [ref=e165]: Most CPU architectures, including x86, runs two threads per physical core, so one OCPU is the equal of two vCPUs for x86-based compute. For OCI Compute, the minimum unit of provisioning starts from one OCPU on both X86 (Intel and AMD) and OCI Ampere Compute processors.
                    - generic [ref=e166]:
                      - text: "The following are the provisioning units for compute instances:"
                      - list [ref=e167]:
                        - listitem [ref=e168]: 1 OCPU on Arm A1 (Compute) = 1 core on Arm A1 (Compute) or 1 vCPU
                        - listitem [ref=e169]: 1 OCPU on Arm A2 (Compute) and A4 (Compute) = 2 cores on Arm A2 (Compute) and A4 (Compute) or 2 vCPUs
                        - listitem [ref=e170]: 1 OCPU on x86 (AMD and Intel) = 2 vCPUs
                    - paragraph [ref=e171]:
                      - text: For more information, see
                      - link "Cloud Price List" [ref=e172] [cursor=pointer]:
                        - /url: https://www.oracle.com/cloud/price-list.html#compute-vm
                      - text: . In addition, you can read this blog post on
                      - link "vCPU and OCPU pricing information" [ref=e173] [cursor=pointer]:
                        - /url: https://blogs.oracle.com/cloud-infrastructure/post/vcpu-and-ocpu-pricing-information
                      - text: .
            - article "Flexible Shapes Copy link to this section" [ref=e174]:
              - heading "Flexible Shapes Copy link to this section" [level=2] [ref=e175]:
                - heading "Flexible Shapes" [level=2] [ref=e176]
                - button "Copy link to this section" [ref=e177]: 🔗
              - generic [ref=e178]:
                - paragraph [ref=e179]:
                  - text: A flexible shape is a shape that lets you customize the number of OCPUs and the amount of memory when launching or resizing your VM. When you
                  - link "create a VM instance" [ref=e180] [cursor=pointer]:
                    - /url: ../Tasks/launchinginstance.htm
                  - text: using a flexible shape, you select the number of OCPUs and the amount of memory that you need for the workloads that run on the instance. The network bandwidth and number of VNICs scale proportionately with the number of OCPUs. This flexibility lets you build VMs that match your workload, enabling you to optimize performance and minimize cost.
                - paragraph [ref=e181]: "The flexible shapes are:"
                - list [ref=e182]:
                  - listitem [ref=e183]: VM.Standard3.Flex (Intel)
                  - listitem [ref=e184]: VM.Standard4.Ax.Flex (Intel)
                  - listitem [ref=e185]: VM.Standard.E4.Flex (AMD)
                  - listitem [ref=e186]: VM.Standard.E5.Flex (AMD)
                  - listitem [ref=e187]: VM.Standard.E6.Flex (AMD)
                  - listitem [ref=e188]: VM.Standard.E6.Ax.Flex (AMD)
                  - listitem [ref=e189]: VM.Standard.A1.Flex (Altra processor from Ampere)
                  - listitem [ref=e190]: VM.Standard.A2.Flex (AmpereOne processor from Ampere)
                  - listitem [ref=e191]: VM.Standard.A4.Flex (AmpereOne M processor from Ampere)
                  - listitem [ref=e192]: VM.Standard.A4.Ax.Flex (AmpereOne M processor from Ampere)
                  - listitem [ref=e193]: VM.DenseIO.E4.Flex (AMD)
                  - listitem [ref=e194]: VM.DenseIO.E5.Flex (AMD)
                  - listitem [ref=e195]: VM.DenseIO.E6.Ax.Flex (AMD)
                  - listitem [ref=e196]: VM.Optimized3.Flex (Intel)
                - paragraph [ref=e197]: Flexible memory is also available on flexible shapes. The amount of memory allowed is based on the number of OCPUs selected.
                - paragraph [ref=e198]:
                  - text: For
                  - link "standard" [ref=e199] [cursor=pointer]:
                    - /url: computeshapes.htm#vm-standard
                  - text: and
                  - link "optimized" [ref=e200] [cursor=pointer]:
                    - /url: computeshapes.htm#vm-hpc-optimized
                  - text: flexible shapes, the ratio of memory to OCPUs depends on the shape.
