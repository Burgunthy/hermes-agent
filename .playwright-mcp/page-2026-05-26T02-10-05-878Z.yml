              - text: 스캘핑(Scalping) 은 수초~수분 단위로 빠르게 포지션을 열고 닫으며 소폭의 수익을 반복해서 쌓는 초단타 매매 전략입니다. 한 번의 거래에서 0.1~1% 수익을 목표로 하지만, 하루에 수십~수백 번 거래해 누적 수익을 만듭니다. 비트코인·이더리움 선물거래에서 스캘핑은 레버리지를 활용해 소폭 가격 움직임에서도 의미 있는 수익을 낼 수 있어 많은 트레이더들이 활용합니다.
