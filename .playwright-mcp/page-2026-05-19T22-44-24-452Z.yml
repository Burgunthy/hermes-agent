        - article "Oracle Cloud Infrastructure Free Tier" [ref=e89]:
          - article "Oracle Cloud Infrastructure Free Tier" [ref=e90]:
            - heading "Oracle Cloud Infrastructure Free Tier" [level=1] [ref=e91]
            - generic [ref=e92]:
              - paragraph [ref=e93]: Learn about Oracle Cloud Infrastructure's Free Tier.
              - paragraph [ref=e94]: Oracle Cloud Infrastructure's Free Tier includes a free time-limited promotional trial that allows you to explore a wide range of Oracle Cloud Infrastructure products, and a set of Always Free offers that never expire.
              - paragraph [ref=e95]: The Free Tier and Always Free resources are not available in US Government Cloud regions.
            - article "Free Trial Copy link to this section" [ref=e96]:
              - heading "Free Trial Copy link to this section" [level=2] [ref=e97]:
                - heading "Free Trial" [level=2] [ref=e98]
                - button "Copy link to this section" [ref=e99]: 🔗
              - generic [ref=e100]:
                - paragraph [ref=e101]: The Free Trial provides you with $300 of cloud credits that are valid for up to 30 days. You can spend these credits on any eligible Oracle Cloud Infrastructure service.
                - generic [ref=e102]:
                  - heading "Getting Started" [level=3] [ref=e103]
                  - paragraph [ref=e104]:
                    - text: For more information, and to see a complete list of services available to you during the trial, visit the
                    - link "Free Trial website" [ref=e105] [cursor=pointer]:
                      - /url: https://www.oracle.com/cloud/free/
                    - text: .
                  - paragraph [ref=e106]:
                    - link "Start for Free" [ref=e107] [cursor=pointer]:
                      - /url: https://signup.cloud.oracle.com/
                  - generic [ref=e108]:
                    - img [ref=e110]
                    - strong [ref=e113]: Note
                    - text: During sign-up, choose the home region carefully. You can provision Always Free Autonomous AI Databases and compute instances only in the home region.
                  - paragraph [ref=e114]: For security purposes, most users need a mobile phone number and a credit card to create an account. Your credit card will not be charged unless you upgrade your account.
                - generic [ref=e115]:
                  - heading "When Your Trial Period Ends" [level=3] [ref=e116]
                  - paragraph [ref=e117]:
                    - text: After your trial ends, your account remains active. There is no interruption to the availability of the
                    - link "Always Free Resources" [ref=e118] [cursor=pointer]:
                      - /url: /iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm
                    - text: you have provisioned. You can delete and provision Always Free resources as needed.
                  - generic [ref=e119]:
                    - img [ref=e121]
                    - strong [ref=e124]: Note
                    - text: If you have more OCI Ampere A1 Compute instances provisioned than are available for an Always Free tenancy, all existing OCI Ampere A1 Compute instances are disabled and then deleted after 30 days, unless you upgrade to a paid account. To continue using your existing Arm-based instances as an Always Free user, before your trial ends, ensure that you have no more than 4 OCPUs and 24 GB of memory in total across all the OCI Ampere A1 Compute instances in your tenancy.
                  - paragraph [ref=e125]: Paid resources that were provisioned with your credits during your free trial are reclaimed by Oracle unless you upgrade your account.
                  - paragraph [ref=e126]:
                    - text: Pay As You Go accounts are available with no commitment. You can also contact an
                    - link "Oracle sales representative" [ref=e127] [cursor=pointer]:
                      - /url: https://www.oracle.com/corporate/contact/global.html
                    - text: in your location to learn about monthly and annual flex accounts that offer discounted pricing. For more information, see
                    - link "Oracle Cloud Infrastructure Pricing" [ref=e128] [cursor=pointer]:
                      - /url: https://www.oracle.com/cloud/pricing.html
                    - text: .
                - generic [ref=e129]:
                  - heading "Upgrading to a Paid Account Copy link to this section" [level=3] [ref=e130]:
                    - heading "Upgrading to a Paid Account" [level=3] [ref=e131]
                    - button "Copy link to this section" [ref=e132]: 🔗
                  - paragraph [ref=e133]:
                    - text: You can upgrade to a paid account at any time through the Oracle Cloud Infrastructure Console. To do so, click the
                    - strong [ref=e134]: Upgrade
                    - text: link in the banner at the top of the Console web page. If you don't see an
                    - strong [ref=e135]: Upgrade
                    - text: link on the page you're viewing, you can click the
                    - strong [ref=e136]: Oracle Cloud
                    - text: logo at the top of the Console and then look for the Upgrade link in the sidebar on the right side of the Console home page. You will continue to have access to all of your cloud resources after upgrading your account.
                  - paragraph [ref=e137]:
                    - text: Also see
                    - link "Account Upgrade Overview" [ref=e138] [cursor=pointer]:
                      - /url: /iaas/Content/Billing/Tasks/changingpaymentmethod.htm#Upgrade
                    - text: for more information on upgrading and associated credit card authorizations for the Free Trial and upgrades.
                - generic [ref=e139]:
                  - heading "Deleting a Free Tier Tenancy and Cloud Account" [level=3] [ref=e140]
                  - paragraph [ref=e141]:
                    - text: If you need to delete your account, see
                    - link "Deleting a Free Tier Tenancy and Cloud Account" [ref=e142] [cursor=pointer]:
                      - /url: /iaas/Content/General/Tasks/deleting_tenancy_freetier.htm
                    - text: .
