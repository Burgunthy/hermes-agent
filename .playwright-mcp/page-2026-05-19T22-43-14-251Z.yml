        - article "Arm-Based Compute" [ref=e93]:
          - article "Arm-Based Compute" [ref=e94]:
            - heading "Arm-Based Compute" [level=1] [ref=e95]
            - generic [ref=e96]:
              - paragraph [ref=e97]: OCI Ampere Compute is a general-purpose, Arm-based compute platform based on the Ampere processor. OCI Ampere A1 Compute (based on Ampere Altra processors) and OCI Ampere A2 Compute (based on AmpereOne processors) instances provide superior price-performance, near linear scaling, built-in security due to the single-threaded core architecture, and a broad developer ecosystem.
              - paragraph [ref=e98]:
                - text: Arm processors, ubiquitous in mobile computing, are increasingly used in PCs, laptops, and servers. Arm processors use a reduced instruction set computing (RISC) architecture, which requires less power and less silicon for each core than x86 processors. Arm puts more cores in a CPU socket and provides more dedicated resources for each core. As a result, Arm processors provide predictable performance, provide the highest density of cores, and consume less power.
                - link "OCI Ampere Compute" [ref=e99] [cursor=pointer]:
                  - /url: https://www.oracle.com/cloud/compute/arm/
                - text: eases and optimizes server-side development on Arm by providing the performance, features, and scalability required for cloud-to-edge infrastructure on Arm
              - paragraph [ref=e100]:
                - link "OCI Ampere Compute" [ref=e101] [cursor=pointer]:
                  - /url: https://www.oracle.com/cloud/compute/arm/
                - text: "instances are suitable for a wide range of applications and use cases. For example:"
              - list [ref=e102]:
                - listitem [ref=e103]: Containerized workloads (for example, Kubernetes)
                - listitem [ref=e104]: CPU-based AI and machine learning (ML) inferencing
                - listitem [ref=e105]: Databases and in-memory databases, including MySQL
                - listitem [ref=e106]: Web and cloud native applications
                - listitem [ref=e107]: Mobile apps and game development
                - listitem [ref=e108]: Media services and video streaming
              - paragraph [ref=e109]:
                - text: Oracle's development stack is available on OCI Ampere Compute, including Oracle Linux, Java, MySQL, GraalVM, and Oracle Cloud Infrastructure Kubernetes Engine. To make it easier to start developing on OCI Ampere Compute, you can use the pre-built
                - link "Oracle Linux Cloud Developer" [ref=e110] [cursor=pointer]:
                  - /url: https://blogs.oracle.com/linux/develop-arm-applications-quickly-using-oracle-linux-cloud-developer-image
                - text: platform image. For a full list of open source organizations and partners that have developed solutions for OCI Ampere Compute, see the
                - link "product page" [ref=e111] [cursor=pointer]:
                  - /url: https://www.oracle.com/cloud/compute/arm/
                - text: .
            - article "Creating Arm-Based Compute Instances Copy link to this section" [ref=e112]:
              - heading "Creating Arm-Based Compute Instances Copy link to this section" [level=2] [ref=e113]:
                - heading "Creating Arm-Based Compute Instances" [level=2] [ref=e114]
                - button "Copy link to this section" [ref=e115]: 🔗
              - generic [ref=e116]:
                - paragraph [ref=e117]: You can create Arm-based virtual machine (VM) instances using OCI A1 (Compute) and OCI A2 (Compute). If you require bare-metal instances, you can use OCI A1 (Compute). If you are an existing OCI A1 (Compute) customer interested in testing or migrating to OCI A1 (Compute) and OCI A2 (Compute), no re-architecting is required.
                - generic [ref=e118]:
                  - img [ref=e120]
                  - strong [ref=e131]: Tip
                  - text: "If this is your first time creating an instance, for a complete guided workflow see:"
                  - link "Launching Your First Linux Instance" [ref=e132] [cursor=pointer]:
                    - /url: ../tutorials/first-linux-instance/overview.htm
                  - text: .
                - paragraph [ref=e133]:
                  - text: If you're already familiar with Oracle Cloud Infrastructure and want to explore the full set of configuration options that are available when you create an instance, follow the
                  - link "detailed steps to create an instance" [ref=e134] [cursor=pointer]:
                    - /url: ../Tasks/launchinginstance.htm
                  - text: .
                - paragraph [ref=e135]:
                  - strong [ref=e136]: "Flexible hardware specifications:"
                  - text: The OCI Ampere A1 Compute
                  - strong [ref=e137]:
                    - text: shapes
                    - img [ref=e139]
                  - text: include the BM.Standard.A1.160 shape for bare metal instances and the VM.Standard.A1.Flex shape for VMs. The OCI Ampere A2 Compute shapes include VM.Standard.A2.Flex for VMs. For information about the OCPU count, memory, storage, and networking details of these shapes, see
                  - link "Compute Shapes" [ref=e142] [cursor=pointer]:
                    - /url: computeshapes.htm
                  - text: .
                - paragraph [ref=e143]:
                  - text: Because the OCI Ampere Compute shapes for VMs are a
                  - link "flexible shapes" [ref=e144] [cursor=pointer]:
                    - /url: computeshapes.htm#flexible
                  - text: ", you can customize the number of OCPUs and amount of memory that are allocated to each instance. This flexibility lets you build VMs that match your workload, enabling you to optimize performance and minimize cost."
                - paragraph [ref=e145]:
                  - strong [ref=e146]: "Images:"
                  - text: We recommend the Oracle Linux Cloud Developer image, available as a
                  - link "platform image" [ref=e147] [cursor=pointer]:
                    - /url: computeshapes.htm#images
                  - text: .
                  - link "Oracle Linux Cloud Developer" [ref=e148] [cursor=pointer]:
                    - /url: /iaas/oracle-linux/oci/developer-image.htm
                  - text: provides the latest development tools, languages and Oracle Cloud Infrastructure software development kits (SDKs) to rapidly launch a comprehensive development environment. The Oracle Linux and Ubuntu platform images are also supported.
                - paragraph [ref=e149]:
                  - strong [ref=e150]: "Managing instances:"
                  - text: "After you create an OCI Ampere Compute instance, you can use many of the features that are available for compute instances. For example:"
                - list [ref=e151]:
                  - listitem [ref=e152]:
                    - link "Monitor the health, capacity, and performance of your instances" [ref=e153] [cursor=pointer]:
                      - /url: computemetrics.htm
                    - text: by using metrics, alarms, and notifications.
                  - listitem [ref=e154]:
                    - link "Adjust the number of OCPUs, memory, and other resources that are allocated to the instance" [ref=e155] [cursor=pointer]:
                      - /url: ../Tasks/resizinginstances.htm
                    - text: . This lets you scale up your compute resources for increased performance, or scale down to reduce cost, without having to rebuild your instances or redeploy your applications.
            - article "Getting Started with OCI Ampere A1 Compute for Free Copy link to this section" [ref=e156]:
              - heading "Getting Started with OCI Ampere A1 Compute for Free Copy link to this section" [level=2] [ref=e157]:
