                  - generic [ref=e106]: "--- name: codex-review-loop description: Use when requesting iterative code review from OpenAI Codex CLI, when wanting Codex to review current changes and fix issues in a loop until approved, or when the user mentions codex review or /codex-review --- # Codex Iterative Review Loop Run OpenAI Codex CLI to review code changes, fix identified issues, and re-submit for review until all issues are resolved (max 10 rounds). ## Prerequisites - `codex` CLI installed and authenticated (`codex auth login`) - Uncommitted changes or a branch diff to review ## Flowchart ```dot digraph codex_review { rankdir=TB; start [label=\"Start\" shape=doublecircle]; scope [label=\"1. Determine scope\\n(uncommitted/branch/commit)\" shape=box]; review [label=\"2. Run codex review\\n→ capture stdout to /tmp file\" shape=box]; parse [label=\"3. Read & parse\\nreview output\\n(extract session ID)\" shape=box]; issues [label=\"Issues found?\" shape=diamond]; fix [label=\"4. Fix each issue\\n(Edit/Write)\" shape=box]; resume [label=\"5. codex exec resume SESSION_ID\\n-o FILE PROMPT\" shape=box]; limit [label=\"Round < 10?\" shape=diamond]; done [label=\"Done ✓\" shape=doublecircle]; fail [label=\"Max rounds reached\\nReport remaining issues\" shape=box]; start -> scope -> review -> parse -> issues; issues -> done [label=\"No\"]; issues -> fix [label=\"Yes\"]; fix -> resume -> parse; parse -> limit [label=\"(loop check)\"]; limit -> issues [label=\"Yes\"]; limit -> fail [label=\"No\"]; } ``` ## Core Workflow ### Step 1: Determine Review Scope Ask the user or auto-detect: | Situation | Flag | |-----------|------| | Uncommitted changes exist | `--uncommitted` | | On a feature branch | `--base main` (or appropriate base) | | Specific commit | `--base <commit>^` | Default to `--uncommitted` if there are unstaged/staged changes. If working tree is clean but on a non-main branch, use `--base main`. ### Step 2: Run Initial Review Generate a UUID for this session's output files: ```bash REVIEW_UUID=$(uuidgen | tr '[:upper:]' '[:lower:]') REVIEW_FILE=\"/tmp/codex-review-${REVIEW_UUID}.md\" ``` **IMPORTANT: `codex review` does NOT support `-o` flag.** Capture output via stdout redirect: ```bash codex review --uncommitted > \"$REVIEW_FILE\" 2>&1 ``` Or for branch diff: ```bash codex review --base main > \"$REVIEW_FILE\" 2>&1 ``` ### Step 3: Parse Review Output Read the output file with the Read tool. The output contains: 1. A header block with metadata including the **session ID** 2. Execution logs showing what codex inspected 3. The actual review comments at the end (after the last `codex` marker) **Extracting the session ID:** Look for the line `session id: <uuid>` in the header block. Example: ``` session id: 019cd31d-af5b-7472-abca-2771cc972232 ``` Save this UUID — you need it for `resume` in subsequent rounds. **Determining if issues exist (dual parsing):** For **Round 1** (initial `codex review` — text output): - If the review contains actionable feedback (file paths + descriptions of problems, priority markers like `[P1]`/`[P2]`, suggested fixes) → issues exist - If the review says variations of \"no issues found\", \"looks good\", \"LGTM\", \"approved\", \"no issues remain\" → no issues, done - Use your judgment as an experienced developer — minor style nitpicks that conflict with project conventions can be skipped For **Round 2+** (resume with structured output contract — JSON expected): 1. Read the `-o` output file 2. Strip markdown code fences if present (` ```json ... ``` `) 3. Find the first `{` to the last matching `}` in the output 4. Attempt to parse as JSON 5. If JSON parses successfully: - `verdict == \"approve\"` with empty `findings` → no issues, done - `verdict == \"needs-attention\"` or non-empty `findings` → process findings 6. If JSON parsing fails → **fall back to text-based evaluation** (same as Round 1 logic) and warn the user that structured output was not returned ### Step 4: Fix Issues For each identified issue: 1. Read the relevant file 2. Apply the fix using Edit or Write 3. Keep track of what was fixed **DO NOT blindly apply every suggestion.** Evaluate each against: - Project conventions (check CLAUDE.md) - Whether the suggestion is actually correct - Whether it conflicts with intentional design decisions If a suggestion seems wrong, skip it and note why when re-submitting. **Confidence-based filtering (when JSON output is available in Round 2+):** | Condition | Action | |-----------|--------| | `verdict == \"approve\"` and `findings` empty | Done — no issues | | Finding `confidence >= 0.8` | High confidence — fix unless project conventions disagree | | Finding `0.5 <= confidence < 0.8` | Medium confidence — verify evidence in actual code before fixing | | Finding `confidence < 0.5` | Low confidence — report to user but do NOT auto-fix | ### Step 5: Resume for Re-review **IMPORTANT: `codex exec resume` uses positional args, NOT `--session` flag.** The correct syntax is: ```bash codex exec resume <SESSION_ID> -o <OUTPUT_FILE> \"<PROMPT>\" ``` **Key details:** - Session ID is the **first positional argument** after `resume` - `-o` writes only the final agent message to the file (cleaner than stdout redirect) - The prompt is the **second positional argument** (or via stdin with `-`) - **NEVER use `--last`** — it creates race conditions if multiple codex sessions are active #### Resume Prompt Template (XML-structured) Construct the resume prompt using this XML block pattern for structured, high-quality re-review: ```xml <task> Re-review the current state of the code after fixes were applied. Fixes applied in this round: {FIXES_APPLIED_LIST — e.g. \"1. Fixed null check in auth.py:42\", \"2. Added retry logic in api.py:108\"} Issues intentionally skipped (with reasons): {SKIPPED_WITH_REASONS — e.g. \"1. Style nitpick on naming — conflicts with project convention\"} Inspect the current file contents and identify any remaining issues or new problems introduced by the fixes. </task> <structured_output_contract> Return ONLY valid JSON matching this schema: { \"verdict\": \"approve\" | \"needs-attention\", \"summary\": \"one-paragraph assessment\", \"findings\": [ { \"severity\": \"critical\" | \"high\" | \"medium\" | \"low\", \"title\": \"short title\", \"body\": \"detailed description with evidence\", \"file\": \"affected/file/path\", \"line_start\": 1, \"line_end\": 10, \"confidence\": 0.0-1.0, \"recommendation\": \"specific fix suggestion\" } ], \"next_steps\": [\"actionable step\"] } Put highest-severity findings first. If all issues are resolved, return verdict \"approve\" with empty findings. </structured_output_contract> <verification_loop> Before finalizing, verify each finding against the actual current file contents. Do not assume fixes were applied correctly based on the description alone. Drop any finding you cannot support with evidence. </verification_loop> <grounding_rules> Ground every finding in the actual code. Do not present inferences as facts. If a finding is a hypothesis, set confidence below 0.7. </grounding_rules> ``` Example command: ```bash REVIEW_FILE_N=\"/tmp/codex-review-${REVIEW_UUID}-round-N.md\" codex exec resume 019cd31d-af5b-7472-abca-2771cc972232 -o \"$REVIEW_FILE_N\" \"<task> Re-review the current state of the code after fixes were applied. Fixes applied in this round: 1. Fixed null check in auth.py:42 2. Added retry logic in api.py:108 Issues intentionally skipped: (none) Inspect the current file contents and identify any remaining issues. </task> <structured_output_contract> Return ONLY valid JSON matching this schema: {\\\"verdict\\\": \\\"approve\\\" | \\\"needs-attention\\\", \\\"summary\\\": \\\"...\\\", \\\"findings\\\": [{\\\"severity\\\": \\\"critical|high|medium|low\\\", \\\"title\\\": \\\"...\\\", \\\"body\\\": \\\"...\\\", \\\"file\\\": \\\"...\\\", \\\"line_start\\\": 1, \\\"line_end\\\": 1, \\\"confidence\\\": 0.0-1.0, \\\"recommendation\\\": \\\"...\\\"}], \\\"next_steps\\\": [\\\"...\\\"]} Put highest-severity findings first. If all issues are resolved, return verdict \\\"approve\\\" with empty findings. </structured_output_contract> <verification_loop> Verify each finding against actual current file contents. Drop unsupported findings. </verification_loop> <grounding_rules> Ground every finding in actual code. Label hypotheses with confidence below 0.7. </grounding_rules>\" ``` ### Step 6: Loop or Complete - Read the output file (if using `-o`, it contains only the final message — much cleaner to parse) - If no issues → report success to user with summary of all changes made - If issues remain → go to Step 4 (max 10 total rounds) - If max rounds reached → report remaining issues to user for manual review ### Result Presentation When reporting results to the user (after loop completes or max rounds reached): - Order findings by severity: critical → high → medium → low - Use file paths and line numbers exactly as reported by Codex - Preserve the distinction between confirmed findings (fact) and inferences (hypothesis) - Structure the final report as: 1. **Rounds completed** — how many review-fix cycles ran 2. **Issues fixed** — list with `file:line` references 3. **Remaining issues** — list with severity and `file:line` (if any) 4. **Recommended next steps** — from Codex's `next_steps` or your own assessment - Auto-fixing within the review loop is this skill's core value — continue doing it - After the loop ends, ask user confirmation only for **remaining unfixed issues** ## Round Tracking Maintain a mental count: - Round 1: Initial review (via `codex review`) - Round 2-10: Re-reviews after fixes (via `codex exec resume`) - After round 10: Stop and report ## CLI Reference (Quick) | Command | Output flag | Session ID | Notes | |---------|-----------|------------|-------| | `codex review --uncommitted` | NO `-o`, use `> file 2>&1` | In stdout header | Initial review | | `codex exec resume <ID> <PROMPT>` | `-o file` supported | Positional arg | Re-review rounds | ## Error Handling | Error | Action | |-------|--------| | `codex: command not found` | Tell user to install: `npm install -g @openai/codex` | | Authentication failure | Tell user to run `codex auth login` | | Empty review output | Retry once, then report to user | | `resume` fails (session not found) | Start a fresh `codex review` instead | | Codex times out | Report timeout, ask user to retry | | `unexpected argument '-o'` on `codex review` | Use stdout redirect `> file 2>&1` instead | | JSON parsing fails on resume output | Fall back to text-based evaluation, warn user | | `verdict` is \"approve\" but `findings` non-empty | Ignore verdict, evaluate based on findings content | | All findings have `confidence < 0.5` | Report as low-confidence review, do NOT auto-fix | ## Red Flags — DO NOT - **DO NOT run codex commands as background tasks** — always run in foreground (`run_in_background: false`) so you can read and act on the output immediately - **DO NOT use `-o` with `codex review`** — it only works with `codex exec resume` - **DO NOT use `--session` flag** for resume — session ID is a positional argument - **DO NOT use `--last`** for resume — always use explicit session ID - **DO NOT loop beyond 10 rounds** — report and let the user decide - **DO NOT use `--dangerously-auto-approve`** or writable sandbox modes for review — review should be read-only - **DO NOT skip reading the review output** — always parse and evaluate before acting - **DO NOT apply fixes you disagree with** — note disagreements when re-submitting"
