                  - generic [ref=e122]: "--- name: codex-conversation description: Use when the user asks to discuss, verify, or validate something with Codex CLI (e.g., \"codex와 대화해서 검증해줘\", \"ask codex about this\", \"get codex's opinion\"). NOT for code review (use codex-review-loop instead). --- # Codex Multi-Turn Conversation Conduct a multi-turn conversation with OpenAI Codex CLI to discuss, verify, or validate ideas based on the current conversation context. Max 10 rounds. ## CRITICAL: Read-Only Enforcement Codex conversations are STRICTLY READ-ONLY. Always use `--sandbox read-only`, prepend read-only instructions in every prompt, and run `git diff --stat` after every turn. If files were modified, revert immediately with `git checkout -- <files>`. ## Prerequisites - `codex` CLI installed and authenticated (`codex auth login`) ## Flowchart ```dot digraph codex_conversation { rankdir=TB; start [label=\"Start\" shape=doublecircle]; context [label=\"1. Build context\\nfrom current conversation\" shape=box]; prompt [label=\"2. Construct prompt\\n(read-only instruction\\n+ CLAUDE.md + summary + question)\" shape=box]; exec [label=\"3. codex exec --sandbox read-only\\n→ capture to /tmp file\" shape=box]; read [label=\"4. Read response\\n+ extract session ID\" shape=box]; verify [label=\"4a. Verify no files\\nwere modified\" shape=box]; sufficient [label=\"Sufficient\\ninsight?\" shape=diamond]; synthesize [label=\"6. Synthesize\\n& report to user\" shape=box]; followup [label=\"5. Follow-up via\\ncodex exec resume\" shape=box]; limit [label=\"Round < 10?\" shape=diamond]; done [label=\"Done\" shape=doublecircle]; maxed [label=\"Max rounds\\nSynthesize what we have\" shape=box]; start -> context -> prompt -> exec -> read -> verify -> sufficient; sufficient -> synthesize [label=\"Yes\"]; sufficient -> limit [label=\"No\"]; limit -> followup [label=\"Yes\"]; limit -> maxed [label=\"No\"]; followup -> read; synthesize -> done; maxed -> synthesize; } ``` ## Core Workflow ### Step 1: Build Context Gather context from the current conversation: 1. **CLAUDE.md** — If present in the project, include relevant sections as project overview 2. **Conversation summary** — Summarize what has been discussed so far (decisions, code changes, design choices) 3. **Files already read** — Reference key files/code snippets already examined in this session 4. **User's specific question** — What exactly they want Codex to verify or discuss **DO NOT** re-read files just for Codex — use what you already know from the conversation. ### Step 2: Initial Prompt Generate a UUID and run the first turn: ```bash CONV_UUID=$(uuidgen | tr '[:upper:]' '[:lower:]') CONV_FILE=\"/tmp/codex-conv-${CONV_UUID}.log\" ``` Run with read-only sandbox: ```bash codex exec --sandbox read-only \"PROMPT\" </dev/null > \"$CONV_FILE\" 2>&1 ``` If the user specifies a model, add `-m MODEL`: ```bash codex exec --sandbox read-only -m MODEL \"PROMPT\" </dev/null > \"$CONV_FILE\" 2>&1 ``` If no model is specified, omit `-m` to use Codex CLI's default. **CRITICAL: `</dev/null` is required.** `codex exec` docs: *\"If stdin is piped and a prompt is also provided, stdin is appended as a `<stdin>` block.\"* When Claude Code's Bash tool runs a subprocess, stdin stays open as a pipe (not a TTY), so Codex waits forever for additional stdin input even when the positional prompt is set. Always redirect stdin from `/dev/null` to force immediate EOF. Omitting this causes the command to hang until timeout. **Prompt construction: Use XML-structured templates for better Codex output quality.** **NEVER include sensitive information** (API keys, tokens, passwords) in prompts. #### Initial Prompt Template ```xml <task> {USER_QUESTION_OR_VERIFICATION_REQUEST} Context: {CONVERSATION_SUMMARY — decisions, code changes, design choices discussed so far} Project overview: {CLAUDE_MD_RELEVANT_SECTIONS — if available} </task> <action_safety> This is a READ-ONLY consultation. You must NOT modify, create, or delete any files. Do NOT execute any write commands (no sed, no tee, no echo >, no cat >, no patch). Your role is to ANALYZE and ADVISE only. Provide your findings as text output. If you want to suggest code changes, describe them in your response text — do NOT apply them. You may read files and run read-only commands (cat, grep, rg, git diff, git log, etc.). Keep analysis tightly scoped to the stated question. </action_safety> <compact_output_contract> Keep the answer compact and structured. Do not include long scene-setting or repeated recap. Separate observed facts from inferences. If uncertain, say so explicitly. </compact_output_contract> <grounding_rules> Ground every claim in the repository context or tool outputs. Do not present inferences as facts. If a point is a hypothesis, label it clearly. </grounding_rules> <missing_context_gating> Do not guess missing repository facts. If required context is absent, retrieve it with tools or state exactly what remains unknown. </missing_context_gating> ``` #### Follow-up Prompt Template (lightweight) For resume rounds, use this shorter structure: ```xml <task> {FOLLOW_UP_QUESTION} </task> <action_safety> This is a READ-ONLY consultation. You must NOT modify, create, or delete any files. Do NOT execute any write commands. ANALYZE and ADVISE only. </action_safety> <compact_output_contract> Focus on the new question. Do not restate prior conclusions. </compact_output_contract> ``` ### Step 3: Read Response & Extract Session ID Read the output file with the Read tool. **Extracting the session ID:** Look for `session id: <uuid>` in the header block. Example: ``` session id: 019cd31d-af5b-7472-abca-2771cc972232 ``` Save this UUID for follow-up turns. **Analyze the response:** - Does it answer the question sufficiently? - Are there points that need clarification or deeper exploration? - Does the reasoning have gaps or assumptions to challenge? ### Step 3a: Verify No Files Were Modified **After EVERY Codex turn**, run a quick check: ```bash git diff --stat ``` If Codex modified any files despite read-only mode: 1. **Immediately revert** with `git checkout -- <modified files>` 2. **Log the incident** in the synthesis report to the user 3. **Continue the conversation** — the modifications are discarded, not the insights This is a safety net. The `--sandbox read-only` flag should prevent writes, but defense-in-depth protects against edge cases. ### Step 4: Follow-up Turns If more discussion is needed, use `resume` with the session ID: ```bash CONV_FILE_N=\"/tmp/codex-conv-${CONV_UUID}-round-N.md\" codex exec resume <SESSION_ID> -o \"$CONV_FILE_N\" \"FOLLOW-UP PROMPT\" </dev/null ``` **Key details:** - Session ID is the **first positional argument** after `resume` - `-o` writes only the final agent message to the file - The follow-up prompt is the **second positional argument** - **`</dev/null` is required** for the same stdin-pipe reason as the initial turn - **After each resume turn, verify no files were modified** (Step 3a) **Tip: for long or multi-line prompts, use a prompt file.** Pass the prompt via `\"$(cat /tmp/my-prompt.md)\"` so shell quoting/escaping stays trivial. Write the prompt with the Write tool first, then reference it — this keeps XML tags, code blocks, and `$` characters safe. Do NOT use heredoc as stdin (`codex exec <<EOF ... EOF`) since that re-introduces the stdin-block problem. Good follow-up patterns: - Challenge assumptions: \"You assumed X, but what about Y?\" - Dig deeper: \"Can you elaborate on your point about X?\" - Provide counterarguments: \"Consider this alternative: ...\" - Request specifics: \"Give concrete examples of how X would work\" ### Step 5: Sufficiency Check After each round, evaluate whether you have enough insight: **Sufficient when:** - The core question has been answered with clear reasoning - Key trade-offs and alternatives have been explored - There is actionable information to report back **Continue when:** - Important aspects remain unexplored - The response raised new questions worth pursuing - The reasoning has gaps that need challenging **Hard limit: 10 rounds.** After 10 rounds, synthesize whatever you have. ### Step 6: Synthesize & Report Present findings to the user in a structured format: 1. **Key findings** — Main conclusions from the conversation 2. **Agreement/Disagreement** — Where you (Claude) and Codex agree or differ 3. **Recommendations** — Actionable next steps based on the discussion 4. **Notable insights** — Anything surprising or particularly valuable from Codex 5. **File modification incidents** — If Codex attempted to modify files, report which files and what it tried to do (all reverted) Be honest about disagreements — if you think Codex got something wrong, say so with reasoning. **Result handling principles:** - If Codex distinguished between observed facts, inferences, and hypotheses — preserve those boundaries - Present findings/conclusions first, supporting evidence second - File paths and line numbers from Codex should be included exactly as reported - When disagreeing, provide specific reasoning and evidence — not just \"I disagree\" ## Model Selection | Situation | Flag | |-----------|------| | User specifies a model | `-m MODEL` | | No model specified | Omit `-m` (use Codex CLI default) | ## CLI Reference | Command | Output | Session ID | Notes | |---------|--------|------------|-------| | `codex exec --sandbox read-only \"PROMPT\" </dev/null` | `> file 2>&1` | In stdout header | Initial turn | | `codex exec resume <ID> -o file \"PROMPT\" </dev/null` | `-o` supported | Positional arg | Follow-up turns | All invocations **must** redirect stdin from `/dev/null`. See the stdin-pipe block warning in Step 2. ## Error Handling | Error | Action | |-------|--------| | `codex: command not found` | Tell user to install: `npm install -g @openai/codex` | | Authentication failure | Tell user to run `codex auth login` | | Empty response | Retry once, then report to user | | `resume` fails (session not found) | Start a fresh `codex exec` instead | | Codex times out | Report timeout, ask user to retry | | Codex modified files despite read-only | Revert with `git checkout`, report to user | | Log shows only `Reading additional input from stdin...` and hangs | Missing `</dev/null`. Kill the task, add stdin redirect, retry. | ## DO NOTs - **DO NOT omit `</dev/null`** from any `codex exec` or `codex exec resume` call — without it the command hangs waiting for stdin even when the positional prompt is provided - **DO NOT use heredoc** (`codex exec <<EOF ... EOF`) to pass prompts — it re-opens stdin as a pipe and blocks. Use positional arg + `</dev/null`, or load from a file via `\"$(cat file)\"` - **DO NOT run codex commands as background tasks** — always run in foreground (`run_in_background: false`) so you can read and act on the output immediately - **DO NOT omit `--sandbox read-only`** — conversation must NEVER modify files - **DO NOT omit the `<action_safety>` tag** from prompts — defense-in-depth against writes - **DO NOT skip the post-turn `git diff` check** — always verify no files were modified - **DO NOT accept Codex file modifications** — if detected, revert immediately, no exceptions - **DO NOT use `--session` or `--last` flags** — always use explicit session ID as positional arg - **DO NOT include sensitive information** (API keys, tokens, credentials) in prompts - **DO NOT accept Codex responses without critical evaluation** — verify claims, challenge weak reasoning - **DO NOT exceed 10 rounds** — synthesize and report - **DO NOT use `codex review`** — this skill uses `codex exec` exclusively - **DO NOT re-read files just to build context** — use what's already known from the conversation"
