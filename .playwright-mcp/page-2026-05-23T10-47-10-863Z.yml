                - paragraph [ref=e740]: Note that this branch is currently under active development and may experience breaking changes or error messages. Performance issues and regressions may also be observed in some use cases.
                - paragraph [ref=e741]:
                  - strong [ref=e742]: Isaac Lab
                  - text: is a GPU-accelerated, open-source framework designed to unify and simplify robotics research workflows, such as reinforcement learning, imitation learning, and motion planning. Built on
                  - link "NVIDIA Isaac Sim" [ref=e743] [cursor=pointer]:
                    - /url: https://docs.isaacsim.omniverse.nvidia.com/latest/index.html
                  - text: ", it combines fast and accurate physics and sensor simulation, making it an ideal choice for sim-to-real transfer in robotics."
                - paragraph [ref=e744]: Isaac Lab provides developers with a range of essential features for accurate sensor simulation, such as RTX-based cameras, LIDAR, or contact sensors. The framework's GPU acceleration enables users to run complex simulations and computations faster, which is key for iterative processes like reinforcement learning and data-intensive tasks. Moreover, Isaac Lab can run locally or be distributed across the cloud, offering flexibility for large-scale deployments.
                - paragraph [ref=e745]:
                  - text: A detailed description of Isaac Lab can be found in our
                  - link "arXiv paper" [ref=e746] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/2511.04831
                  - text: .
                - generic [ref=e747]:
                  - heading "Key Features" [level=2] [ref=e748]
                  - 'link "Permalink: Key Features" [ref=e749] [cursor=pointer]':
                    - /url: "#key-features"
                    - img [ref=e750]
                - paragraph [ref=e752]: "Isaac Lab offers a comprehensive set of tools and environments designed to facilitate robot learning:"
                - list [ref=e753]:
                  - listitem [ref=e754]:
                    - strong [ref=e755]: Robots
                    - text: ": A diverse collection of robots, from manipulators, quadrupeds, to humanoids, with more than 16 commonly available models."
                  - listitem [ref=e756]:
                    - strong [ref=e757]: Environments
                    - text: ": Ready-to-train implementations of more than 30 environments, which can be trained with popular reinforcement learning frameworks such as RSL RL, SKRL, RL Games, or Stable Baselines. We also support multi-agent reinforcement learning."
                  - listitem [ref=e758]:
                    - strong [ref=e759]: Physics
                    - text: ": Rigid bodies, articulated systems, deformable objects"
                  - listitem [ref=e760]:
                    - strong [ref=e761]: Sensors
                    - text: ": RGB/depth/segmentation cameras, camera annotations, IMU, contact sensors, ray casters."
