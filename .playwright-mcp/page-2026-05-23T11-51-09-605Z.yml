              - region "dextreme.md" [ref=e907]:
                - article [ref=e909]:
                  - paragraph [ref=e910]:
                    - text: DeXtreme is our recent work on transferring cube rotation with allegro hand from simulations to the real world. This task is especially challenging due to increased number of contacts that come into play with doing physics simulation. Naturally, the transfer requires carefully modelling and scheduling the randomisation for both physics and non-physics parameters. More details of the work can be found on the website
                    - link "https://dextreme.org/" [ref=e911] [cursor=pointer]:
                      - /url: https://dextreme.org/
                    - text: as well as the paper (accepted at ICRA 2023, London) available on arXiv
                    - link "https://arxiv.org/pdf/2210.13702.pdf" [ref=e912] [cursor=pointer]:
                      - /url: https://arxiv.org/pdf/2210.13702.pdf
                    - text: .
                  - paragraph [ref=e913]:
                    - text: The work builds on top of our previously released
                    - code [ref=e914]: AllegroHand
                    - text: "environment but with changes to accomodate training for sim-to-real involving two different variants: ManualDR (where the ranges of parameter domain randomisation are chosen by the user manually) and Automatic Domain Randomisation or ADR (where the ranges of the parameter are updated automatically based on periodic simulation performance benchmarking in the loop)."
                  - generic [ref=e915]:
                    - heading "Overview" [level=2] [ref=e916]
                    - 'link "Permalink: Overview" [ref=e917] [cursor=pointer]':
                      - /url: "#overview"
                      - img [ref=e918]
                  - paragraph [ref=e920]:
                    - text: There are two different classes
                    - strong [ref=e921]: AllegroHandDextremeManualDR
                    - text: and
                    - strong [ref=e922]: AllegroHandDextremeADR
                    - text: both located in
                    - link "tasks/dextreme/allegro_hand_dextreme.py" [ref=e923] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/tasks/dextreme/allegro_hand_dextreme.py
                    - text: python file. There's additional
                    - link "adr_vec_task.py" [ref=e924] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/tasks/dextreme/adr_vec_task.py
                    - text: located in the same
                    - link "folder" [ref=e925] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/tasks/dextreme
                    - text: that covers the necessary code related to training with ADR in the
                    - code [ref=e926]: ADRVecTask
                    - text: class.
                  - paragraph [ref=e927]:
                    - text: Both the variants are trained with
                    - code [ref=e928]: Asymmetric Actor-Critic
                    - text: where the
                    - code [ref=e929]: policy
                    - text: only receives the input that is available in the real world while the
                    - code [ref=e930]: value function
                    - text: receives additional privileged information available from the simulator. At inference, only the policy is used to obtain the action given the history of states and value function is discarded. For more information, please look at
                    - code [ref=e931]: Section 2
                    - text: of the DeXtreme paper.
                  - paragraph [ref=e932]:
                    - text: As we will show below, both environments are compatible with the standard way of training with Isaac Gym via
                    - code [ref=e933]: python train.py task=<AllegroHandDextremeManualDR or AllegroHandDextremeADR>
                    - text: . Additionally, the code uses
                    - code [ref=e934]: dictionary observations
                    - text: enabled via
                    - code [ref=e935]: use_dict_obs=True
                    - text: (set as default for these enviornments) in the
                    - code [ref=e936]: ADRVecTask
                    - text: where the relevant observations needed for training are provided as dictionaries as opposed to filling in the data via slicing and indexing. This keeps it cleaner and easier to manage. Which observations to choose for the policy and value function can be described in the corresponding
                    - code [ref=e937]: yaml
                    - text: files for training located in
                    - code [ref=e938]: cfg/train
                    - text: folder. For instance, the policy in the
                    - link "AllegroHandDextremeManualDRPPO.yaml" [ref=e939] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/train/AllegroHandDextremeManualDRPPO.yaml
                    - text: can be described below like
                  - generic [ref=e940]:
                    - code [ref=e942]: "inputs: dof_pos_randomized: { } object_pose_cam_randomized: { } goal_pose_randomized: { } goal_relative_rot_cam_randomized: { } last_actions_randomized: { }"
                    - button "Copy code to clipboard" [ref=e944] [cursor=pointer]:
                      - img [ref=e945]
                  - paragraph [ref=e948]: Similarly, for the value function
                  - generic [ref=e949]:
                    - code [ref=e951]: "name: actor_critic central_value: True inputs: dof_pos: { } dof_vel: { } dof_force: { } object_pose: { } object_pose_cam_randomized: { } object_vels: { } goal_pose: { } goal_relative_rot: {} last_actions: { } ft_force_torques: {} gravity_vec: {} ft_states: {}"
                    - button "Copy code to clipboard" [ref=e953] [cursor=pointer]:
                      - img [ref=e954]
                  - paragraph [ref=e957]:
                    - text: Similar configuration set up is done for
                    - link "AllegroHandDextremeADRPPO.yaml" [ref=e958] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/train/AllegroHandDextremeManualDRPPO.yaml
                    - text: .
                  - paragraph [ref=e959]:
                    - text: Various parameters that the user wishes to randomise for their training can be chosen and tuned in the corresponding
                    - code [ref=e960]: task
                    - text: files located in
                    - code [ref=e961]: cfg/task
                    - link "folder" [ref=e962] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/task
                    - text: . For instance, in
                    - link "AllegroHandDextremeManualDR.yaml" [ref=e963] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/task/AllegroHandDextremeManualDR.yaml
                    - text: ", the randomisation parameters and ranges can be found under"
                  - generic [ref=e964]:
                    - code [ref=e966]: "task: randomize: True randomization_params: ...."
                    - button "Copy code to clipboard" [ref=e968] [cursor=pointer]:
                      - img [ref=e969]
                  - paragraph [ref=e972]:
                    - text: For the
                    - link "AllegroHandDextremeADR.yaml" [ref=e973] [cursor=pointer]:
                      - /url: /isaac-sim/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/task/AllegroHandDextremeADR.yaml
                    - text: ", additional configuration is needed and can be found under"
                  - generic [ref=e974]:
                    - code [ref=e976]: "adr: use_adr: True # set to false to not do update ADR ranges. useful for evaluation or training a base policy update_adr_ranges: True ... # raw ADR params. more are added by affine transforms code params: ### Hand Properties hand_damping: range_path: actor_params.hand.dof_properties.damping.range init_range: [0.5, 2.0] limits: [0.01, 20.0] delta: 0.01 delta_style: 'additive'"
                    - button "Copy code to clipboard" [ref=e978] [cursor=pointer]:
                      - img [ref=e979]
                  - paragraph [ref=e982]:
                    - text: "You will also see that there are two key variables:"
                    - code [ref=e983]: limits
                    - text: and
                    - code [ref=e984]: delta
                    - text: . The variable
                    - code [ref=e985]: limits
                    - text: refers to the complete range within which the parameter is permitted to move, while
                    - code [ref=e986]: delta
                    - text: represents the incremental change that the parameter can undergo with each ADR update. These variables play a crucial role in determining the scope and pace of parameter adjustments made by ADR.
                  - paragraph [ref=e987]: We highly recommend to familiarise yourself with the codebase and configuration files first before training to understand the relevant classes and the inheritence involved.
                  - paragraph [ref=e988]: Below we provide the exact settings for training the two different variants of the environment we used in our work for reproducibility.
                  - generic [ref=e989]:
                    - heading "To run experiments with Manual DR settings" [level=1] [ref=e990]
                    - 'link "Permalink: To run experiments with Manual DR settings" [ref=e991] [cursor=pointer]':
                      - /url: "#to-run-experiments-with-manual-dr-settings"
                      - img [ref=e992]
                  - paragraph [ref=e994]: If you are using a single GPU, run the following command to train DeXtreme RL policies with Manual DR
                  - generic [ref=e995]:
                    - code [ref=e997]: "HYDRA_MANUAL_DR=\"train.py multi_gpu=False \\ task=AllegroHandDextremeManualDR \\ task.env.resetTime=8 task.env.successTolerance=0.4 \\ experiment='allegrohand_dextreme_manual_dr' \\ headless=True seed=-1 \\ task.env.startObjectPoseDY=-0.15 \\ task.env.actionDeltaPenaltyScale=-0.2 \\ task.env.resetTime=8 \\ task.env.controlFrequencyInv=2 \\ train.params.network.mlp.units=[512,512] \\ train.params.network.rnn.units=768 \\ train.params.network.rnn.name=lstm \\ train.params.config.central_value_config.network.mlp.units=[1024,512,256] \\ train.params.config.max_epochs=50000 \\ task.env.apply_random_quat=True\" python ${HYDRA_MANUAL_DR}"
                    - button "Copy code to clipboard" [ref=e999] [cursor=pointer]:
                      - img [ref=e1000]
                  - paragraph [ref=e1003]:
                    - text: The
                    - code [ref=e1004]: apply_random_quat=True
                    - text: flag samples unbiased quaternion goals which makes the training slightly harder. We use a successTolerance of 0.4 radians in these settings overriding the settings in AllegroHandDextremeManualDR.yaml via hydra CLI.
                  - generic [ref=e1005]:
                    - heading "To run experiments with Automatic Domain Randomisation (ADR)" [level=1] [ref=e1006]
                    - 'link "Permalink: To run experiments with Automatic Domain Randomisation (ADR)" [ref=e1007] [cursor=pointer]':
                      - /url: "#to-run-experiments-with-automatic-domain-randomisation-adr"
                      - img [ref=e1008]
                  - paragraph [ref=e1010]: The ADR policies are trained with a successTolerance of 0.1 radians and use LSTMs both for policy as well as value function. For ADR on a single GPU, run the following commands to train the RL policies
                  - generic [ref=e1011]:
