                  - button "복사" [ref=e135] [cursor=pointer]
                - article [ref=e136]:
                  - generic [ref=e137]:
                    - paragraph [ref=e138]:
                      - generic [ref=e139]: 밥으로 오징어짬뽕 작은컵 먹은 aoa(워뇨띠) AMA 1차 정리
                    - paragraph [ref=e140]
                    - paragraph [ref=e141]: Q. 세금은 어떻게 내고있나요?, 자산 10억일때와 1000억일때 비교하면요?
                    - paragraph [ref=e142]: A. 세무사 통해서 처리하고 있습니다. 혼자서 다 정하기엔 신경쓸 부분이 너무 많더라구요
                    - paragraph [ref=e143]
                    - paragraph [ref=e144]: "Q. aoa님 비트맥스 거래량이 많이죽은시점인 지금은 자산분배를 어떻게 하고계신지 궁금합니다 비맥(관망=현물풀매수) :바이낸스: 현물 비율을 어떻게 리스크 관리 하고 계신지 ,포지션을 잡으실때 주로 어떻게 자산대비 레버리지 관리를 하고계신지 알고싶습니다"
                    - paragraph [ref=e145]: A. 거래량이 상대적으로 적은 거래소에서는 장기포지션을 주로, 거래량이 많은 거래소에서는 단기포지션을 주로 잡습니다. 자산대비 레버리지는 최근들어서 총 자산대비 1배를 넘어가지는 않는 것 같습니다. 자산이 너무 커져서 시장에서 받기엔 평단손실이 너무 나기 때문입니다.
                    - paragraph [ref=e146]
                    - paragraph [ref=e147]: Q. 청산맵(히트맵) 중요하게 보시나요?
                    - paragraph [ref=e148]: "A. sushi6974: 따로 중요하게 보진 않지만, 거래량을 중요하게 보기 때문에 거래량이 터지는 지점이라 생각하면 일맥상통한다 생각합니다."
                    - paragraph [ref=e149]
                    - paragraph [ref=e150]: Q. 요즘 해외애들 청산가추적기 같은거 이용하던데, 혹시 매매 툴(프로그램) 이용하시거나 하나요?
                    - paragraph [ref=e151]: A. 수작업으로 매매하고 있습니다..
                    - paragraph [ref=e152]
                    - paragraph [ref=e153]: Q. 리스크관리법 관련 질문드립니다. 과거 qna에서 청산당하더라도 25%정도만 당할정도로 격리로 관리하신다고 하셨습니다. 그렇다면 정말 생각한 시나리오대로 안흘러갔을때 청산(25%손절)나는것인데, 실제로 한번의 거래에서 몇퍼센트 정도의 리스크(손절)를 잡고 들어가시나요?
                    - paragraph [ref=e154]: A. 보통 해당 거래소에 있는 자산의 20%정도를 강제손절 타이밍으로 잡습니다. 그 이상 손실이 지속되면 복구하기 힘들기 때문입니다.
                    - paragraph [ref=e155]
                    - paragraph [ref=e156]: Q. aoa님 아직도 거래량 + 차트 위주로 거래하시나요?
                    - paragraph [ref=e157]: "A. cremayoyo: 네 맞습니다"
                    - paragraph [ref=e158]
                    - paragraph [ref=e159]: Q. 아직도 프렉탈 매매하고잇나요 비중이어느정도인가요???
                    - paragraph [ref=e160]: A. 프렉탈 가끔 쓰긴 하지만 주로 쓰는 방식은 아닙니다. 음, 전체 매매에서 한 5%정도 비중으로 쓰는 것 같습니다
                    - paragraph [ref=e161]
                    - paragraph [ref=e162]: Q. 물타기와 불타기 중에 더 많이 하는건 어떤거세요?
                    - paragraph [ref=e163]: A. 불타기보단 물타기를 훨씬 많이 합니다
                    - paragraph [ref=e164]
                    - paragraph [ref=e165]: Q. 지금부터 년말까지 코인시장 어떻게 보시나요? 강세, 횡보, 약세 메이저코인중심으로
                    - paragraph [ref=e166]: A. 큰 사이클 상승장은 지속될 것 같고, 중간중간 한두달짜리 하락장이 올 거라 예상합니다. 1년짜리 하락장은 2027년쯤에나 나오지 않을까 예상중입니다.
                    - paragraph [ref=e167]
                    - paragraph [ref=e168]: Q. 저번 주말에 토요일쯤에(13일) 아무리 롱인데 숏을 뭘보고 잡으신건지.. 숏 잡은 이유가 궁금합니다~ 사람들 다 금리인하 롱 예측해서 세력이 롱들 죽여야되서 숏 타신건지요? 사람심리를 중요하게 보시나요? 도대체 뭘 보시고 숏플레이 시작하신건지 정말정말 궁금합니다~!
                    - paragraph [ref=e169]: A. 아무리 봐도 숏이여서 잡았다가 물린겁니다.. 틀릴 때도 있습니다
                    - paragraph [ref=e170]
                    - paragraph [ref=e171]: Q. 시드 70%를 잃은 상태에서 다시 시작할 때 어떤 마음가짐으로 해야할까요?
                    - paragraph [ref=e172]: A. 한 번에 크게 복구하겠다는 생각을 하면 꼭 더 잃게 됩니다. 천천히 1년에 걸쳐 복구한다는 생각을 하는 것이 중요합니다. 하루만에 5배 10배 뛰는 코인은 저도 먹어본 적이 없습니다. 저건 그런 코인은 자기 몫이 아니라 생각하고 배아파 하면 안 됩니다.
                    - paragraph [ref=e173]
                    - paragraph [ref=e174]: Q. 과거에는 통했지만 지금은 통하지 않는 전략과, 여전히 유효한 전략은 무엇일까요? 21년도 시장이랑 현시장이랑 너무 다르다고 느끼는데 매매방식이 달라진게있을까요?
                    - paragraph [ref=e175]: A. 과거에는 제 반응속도로 순간 변동시 꼬리잡기 같은 것이 가능했는데, 현재는 봇이 너무 많아 인간의 반응속도로 하기 많이 어려워진 것 같습니다. 캔들, 거래량 위주의 매매방식은 크게 달라지지 않은 것 같습니다.
                    - paragraph [ref=e176]
                    - paragraph [ref=e177]: Q. 펀딩비를 참고하시는지 궁금합니다.
                    - paragraph [ref=e178]: A. 참고합니다. 음펀비일때는 꼭 롱이다 숏이다 같은 느낌이라기 보단, 중요한 변곡점이라 생각하면 얼추 맞다고 보입니다.
                    - paragraph [ref=e179]
                    - paragraph [ref=e180]: Q. 처음 매매를 시작했을 때 "잃어도 괜찮아 어차피 여기서 인생 더이상 떨어질곳이 없어"라는 절박한 심정으로 시작했나요? 아니면 편안하고 안정된 마음으로 게임처럼 해볼까?라는 마음으로 시작했나요?
                    - paragraph [ref=e181]: A. 둘 다 아니고, 적성에 어느정도 맞는 느낌이 들며 꾸준히 벌 수 있겠다는 생각이 들어 하게 됐습니다. 스트레스를 잘 참는다기에는 저도 물리면 머리 뜨거워져서 잘 모르겠습니다만, 좀 더 감정조절을 잘 하는 것 같긴 합니다. 항상 금액 그 자체보다는 시드 대비 비율로 보려고 하다 보니 자연스럽게 된 것 같습니다.
                    - paragraph [ref=e182]
                    - paragraph [ref=e183]: Q. Aoa님 가상화폐 지금 시작 늦지않았다고 생각하시나요
                    - paragraph [ref=e184]: A. 큰 대세상승장 속에 두 달 짜리 하락장이 섞이는 느낌일거라고 생각중입니다
                    - paragraph [ref=e185]
                    - paragraph [ref=e186]: Q. ??? 트롤박스 위로 밀려서 질문 못찾음.
                    - paragraph [ref=e187]: A. 변하지 않는 원칙은 리스크 관리. 90%의 확률로 2배가 되고, 10%의 확률로 0%가 되는 매매에서조차 전재산을 계속 넣는다면 결국은 0원임
                    - paragraph [ref=e188]
                    - paragraph [ref=e189]: Q. 질문못찾음
                    - paragraph [ref=e190]: A. 시드크기는 오히려 커질수록 난이도가 올라갑니다. 물탈 시드가 있다는 것을 동경하는 분들이 많은데, 저는 물타기 말고 한 번에 들어가고 한 번에 빠지는 매매를 주로 하다가 시드가 너무 커져 어쩔 수 없이 물타기를 하게 되는 것입니다. 한 번에 들어가고 한 번에 빠질 때가 수익률도 훨씬 더 좋았습니다. 다만, 이 방식을 어떻게든 따라하고 싶다면 시드 대비 비율 조정으로 따라하는 방법이 있습니다. 저랑 똑같은 비율로 진입 비율, 물탈 비율을 정한다면 매매에 있어 시드를 유리하게 생각할 이유가 전혀 없습니다.
                    - paragraph [ref=e191]
                    - paragraph [ref=e192]: Q. 시드가 아무리커도 고배율 레버리지에 유혹이 있을건데 언제부터 극복 하신걸까요?
                    - paragraph [ref=e193]: A. 유혹에 못이겨 몇 번 손대다가 큰 손실을 보고 본능적으로 깨달았습니다.. 고배는 잃어도 될 돈으로 해야 합니다. 초기에도 배율은 높아보이지만 전체 자산대비로는 많아봤자 2~3배였습니다.
                    - paragraph [ref=e194]
                    - paragraph [ref=e195]: Q. 금리 25bp 인하에대한 플랜
                    - paragraph [ref=e196]: A. 아마 금리결정 앞두고 불안해서 위험자산시장에는 돈이 안 몰리는게 아닌가 싶네요. 물론 틀릴 수도 있지만, 저는 그 기대감도 있고, 차트도 좋아서 매수했습니다, 금리발표시점에 변동이 생길 때 내림롱 예정입니다
                    - paragraph [ref=e197]
                    - paragraph [ref=e198]: Q. 못찾음(포지션규모에 따른 질문으로 보임)
                    - paragraph [ref=e199]: A. 그때그때 제 심리에 따라 유동적으로 조절합니다. 어떤 날은 심리가 불안정해 작은 손실도 견디기 힘들어 질 때가 있는데, 그럴 때는 더욱 타이트하게 잡습니다.
                    - paragraph [ref=e200]
                    - paragraph [ref=e201]: Q. 매매할떄 주로보는 타임프레임
                    - paragraph [ref=e202]: A. 1분봉, 5분봉, 15분봉, 1시간봉, 4시간봉, 일봉 모두 중요하게 봅니다. 평소에는 1분봉 켜둡니다.
                    - paragraph [ref=e203]
                    - paragraph [ref=e204]: Q. (질문 못찾음) 대략 포지션관련 질문으로 보임.
                    - paragraph [ref=e205]: A. 보통 전체 시드의 5%정도면 만족하고 익절하는 편입니다. 사실 전 그동안 매매하면서 전체시드 대비 하루 2배는 커녕 하루 30% 수익 본 적도 없습니다. 최대가 하루 20%정도였던 것 같습니다.
                    - paragraph [ref=e206]
                    - paragraph [ref=e207]: Q. 질문못찾음.
                    - paragraph [ref=e208]: A. 매매 복기는 더 큰 수익을 놓치거나, 방향을 아예 틀렸을 때 주로 진행합니다. 선택이 옳았지만 결과가 틀린건지, 선택 자체가 틀린건지를 냉정하게 분석하려 노력합니다.
                    - paragraph [ref=e209]
                    - paragraph [ref=e210]: Q. 루틴이나 습관이 있나요?
                    - paragraph [ref=e211]: A. 루틴이나 습관은 따로 없습니다. 그냥 일어나자마자 바로 차트부터 켜는게 그나마 습관이라고 할 수 있을 것 같습니다.
                    - paragraph [ref=e212]
                    - paragraph [ref=e213]: Q. 모든글에 리스크관리가 강조되어있는데 계속 그렇게 강조하는이유
                    - paragraph [ref=e214]: A. 잠깐이라도 수익을 본 경험은 사실 누구나 있습니다. 하지만 리스크 관리가 없다면 결국 제로에 수렴할 수 밖에 없기 때문입니다.
                    - paragraph [ref=e215]
                    - paragraph [ref=e216]: Q. BMEX 토큰 보유하고계신 양과 투자의목적인지 거래수수료의 목적인지 앞으로의 방향을 어떻게보시는지 궁금합니다!! 운영자님 저의 질문이 아주 고급스럽지않습니까?!
                    - paragraph [ref=e217]: A. 고급진 질문이라 먼저 답하겠습니다. 200만개 보유중이고, 많이 보유하면 거래수수료 깎아줘서 보유하고 있습니다. 오를지 내릴지는 모르겠습니다.
                    - paragraph [ref=e218]
