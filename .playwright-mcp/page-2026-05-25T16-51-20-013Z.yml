        - heading "New 30B model" [level=3] [ref=e203]
        - code [ref=e205]: ollama run qwen3:30b
        - paragraph [ref=e206]:
          - img "Qwen3-30B-A3B-Instruct-2507.jpg" [ref=e207]
        - heading "New 235B model" [level=3] [ref=e208]
        - code [ref=e210]: ollama run qwen3:235b
        - paragraph [ref=e211]:
          - img "0d7zztq4GB7G2ZYowO-dQ.jpg" [ref=e212]
        - heading "Overview" [level=3] [ref=e213]
        - paragraph [ref=e214]:
          - text: The Qwen 3 family is a comprehensive suite of dense and mixture-of-experts (MoE) models. The flagship model,
          - strong [ref=e215]: Qwen3-235B-A22B
          - text: ", achieves competitive results in benchmark evaluations of coding, math, general capabilities, etc., when compared to other top-tier models such as DeepSeek-R1, o1, o3-mini, Grok-3, and Gemini-2.5-Pro. Additionally, the small MoE model,"
          - strong [ref=e216]: Qwen3-30B-A3B
          - text: ", outcompetes QwQ-32B with 10 times of activated parameters, and even a tiny model like Qwen3-4B can rival the performance of Qwen2.5-72B-Instruct."
        - list [ref=e217]:
          - listitem [ref=e218]:
            - paragraph [ref=e219]:
              - strong [ref=e220]: Significantly enhancement in its reasoning capabilities
              - text: ", surpassing previous QwQ (in thinking mode) and Qwen2.5 instruct models (in non-thinking mode) on mathematics, code generation, and commonsense logical reasoning."
          - listitem [ref=e221]:
            - paragraph [ref=e222]:
              - strong [ref=e223]: Superior human preference alignment
              - text: ", excelling in creative writing, role-playing, multi-turn dialogues, and instruction following, to deliver a more natural, engaging, and immersive conversational experience."
          - listitem [ref=e224]:
            - paragraph [ref=e225]:
              - strong [ref=e226]: Expertise in agent capabilities
              - text: ", enabling precise integration with external tools in both thinking and unthinking modes and achieving leading performance among open-source models in complex agent-based tasks."
          - listitem [ref=e227]:
            - paragraph [ref=e228]:
              - strong [ref=e229]: Support of 100+ languages and dialects
              - text: with strong capabilities for
              - strong [ref=e230]: multilingual instruction following and translation
