                - generic [ref=e520]:
                  - heading "Why?" [level=2] [ref=e521]
                  - 'link "Permalink: Why?" [ref=e522] [cursor=pointer]':
                    - /url: "#why"
                    - img [ref=e523]
                - paragraph [ref=e525]: Rather than making slides for a workshop, why not make a website? It's easier to write, access, share, and reuse. GitHub and gh-pages makes this super easy.
                - paragraph [ref=e526]: It is a better Open Educational Resource since anyone can fork and adapt!
                - generic [ref=e527]:
                  - heading "Details" [level=2] [ref=e528]
                  - 'link "Permalink: Details" [ref=e529] [cursor=pointer]':
                    - /url: "#details"
                    - img [ref=e530]
                - paragraph [ref=e532]:
                  - text: The
                  - code [ref=e533]: workshop-template
                  - link "repository" [ref=e534] [cursor=pointer]:
                    - /url: https://github.com/evanwill/workshop-template
                  - text: is a template project--to get started quickly, make a copy and fill in your own content and customizations. The
                  - link "site" [ref=e535] [cursor=pointer]:
                    - /url: https://evanwill.github.io/workshop-template/
                  - text: demonstrates the output on gh-pages, and the content pages serve as examples.
                - paragraph [ref=e536]: "Overview:"
                - list [ref=e537]:
                  - listitem [ref=e538]:
                    - text: Copy the code to your own repository by clicking the green "Use this template" button (alternatively, import the
                    - link "repository" [ref=e539] [cursor=pointer]:
                      - /url: https://github.com/evanwill/workshop-template
                    - text: on GitHub or manually copy the files into a new repo).
                  - listitem [ref=e540]: Clone to your local machine, or work on the GitHub web interface to edit files.
                  - listitem [ref=e541]:
                    - text: Edit the
                    - code [ref=e542]: _config.yml
                    - text: with your info.
                  - listitem [ref=e543]: Edit the content pages in markdown.
                  - listitem [ref=e544]: Add images to the "images" folder.
                  - listitem [ref=e545]: Push to GitHub (or commit on the web interface).
                  - listitem [ref=e546]: In your repo's settings, activate gh-pages, using main branch.
                - paragraph [ref=e547]: "When creating content pages:"
                - list [ref=e548]:
                  - listitem [ref=e549]:
                    - text: to include a page in the nav, add
                    - code [ref=e550]: "nav: true"
                    - text: to the file's yml front matter.
                  - listitem [ref=e551]:
                    - text: the
                    - code [ref=e552]: "title:"
                    - text: value will appear in the nav, sorted in the order of filenames. For simplicity use leading numbers in the lesson page filenames to create correct order.
                  - listitem [ref=e553]:
                    - text: the default layout does not add
                    - code [ref=e554]: title
                    - text: to the page, so it can be a short for the nav. Add a title in the Markdown content.
                - paragraph [ref=e555]: "Using figure include:"
                - list [ref=e556]:
                  - listitem [ref=e557]:
                    - text: put all images in the
                    - code [ref=e558]: images
                    - text: directory.
                  - listitem [ref=e559]: figures will be centered, and can optionally be given a caption and percentage width.
                  - listitem [ref=e560]:
                    - text: in a markdown file where you want the image to appear, use the
                    - code [ref=e561]: figure.html
                    - text: include on its own line.
                  - listitem [ref=e562]:
                    - text: "pattern:"
                    - code [ref=e563]: "{% include figure.html file=\"my-cat.jpg\" alt=\"cat\" caption=\"My cat\" width=\"50%\" %}"
                - paragraph [ref=e564]: "Basic style customization:"
                - list [ref=e565]:
                  - listitem [ref=e566]:
                    - text: the
                    - code [ref=e567]: main.scss
                    - text: in the
                    - code [ref=e568]: css
                    - text: folder exposes variables that can customize the basic style of website.
                  - listitem [ref=e569]:
                    - text: Give a tiny splash of color on the header and footer borders by tweaking the
                    - code [ref=e570]: $border-color
                  - listitem [ref=e571]:
                    - code [ref=e572]: $link-color
                    - text: colors links
                - paragraph [ref=e573]: "Using optional google analytics:"
                - list [ref=e574]:
                  - listitem [ref=e575]:
                    - text: add your analytics id to
                    - code [ref=e576]: _config.yml
                    - text: in
                    - code [ref=e577]: "google-analytics-id:"
                  - listitem [ref=e578]:
                    - text: if
                    - code [ref=e579]: "google-analytics-id:"
                    - text: is blank, the ga code will not added
                  - listitem [ref=e580]:
                    - text: analytics code will only be added when using "production" environment. This happens automatically on gh-pages. To build locally, use
                    - code [ref=e581]: JEKYLL_ENV=production jekyll build
                - blockquote [ref=e582]:
                  - paragraph [ref=e583]: Repository does not include a Gemfile because it is a very simple project. Originally built using Ruby 2.3+ and Jekyll 3.4+; most recently used Jekyll 3.8.1.
