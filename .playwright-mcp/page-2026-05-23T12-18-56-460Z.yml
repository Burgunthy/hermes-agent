                - generic [ref=e460]:
                  - heading "DreamerV3" [level=2] [ref=e461]
                  - 'link "Permalink: DreamerV3" [ref=e462] [cursor=pointer]':
                    - /url: "#dreamerv3"
                    - img [ref=e463]
                - paragraph [ref=e465]: DreamerV3 learns a world model from experiences and uses it to train an actor critic policy from imagined trajectories. The world model encodes sensory inputs into categorical representations and predicts future representations and rewards given actions.
                - paragraph [ref=e466]:
                  - link "DreamerV3 Method Diagram" [ref=e467] [cursor=pointer]:
                    - /url: https://user-images.githubusercontent.com/2111293/217355673-4abc0ce5-1a4b-4366-a08d-64754289d659.png
                    - img "DreamerV3 Method Diagram" [ref=e468]
                - paragraph [ref=e469]: DreamerV3 masters a wide range of domains with a fixed set of hyperparameters, outperforming specialized methods. Removing the need for tuning reduces the amount of expert knowledge and computational resources needed to apply reinforcement learning.
                - paragraph [ref=e470]:
                  - link "DreamerV3 Benchmark Scores" [ref=e471] [cursor=pointer]:
                    - /url: https://private-user-images.githubusercontent.com/2111293/324081413-0fe8f1cf-6970-41ea-9efc-e2e2477e7861.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..0ZfC5l92W3wodYjbv3eslGRSlbtP-L5NFdo4mYbu48o
                    - img "DreamerV3 Benchmark Scores" [ref=e472]
                - paragraph [ref=e473]: Due to its robustness, DreamerV3 shows favorable scaling properties. Notably, using larger models consistently increases not only its final performance but also its data-efficiency. Increasing the number of gradient steps further increases data efficiency.
                - paragraph [ref=e474]:
                  - link "DreamerV3 Scaling Behavior" [ref=e475] [cursor=pointer]:
                    - /url: https://user-images.githubusercontent.com/2111293/217356063-0cf06b17-89f0-4d5f-85a9-b583438c98dd.png
                    - img "DreamerV3 Scaling Behavior" [ref=e476]
