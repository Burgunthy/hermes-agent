                - paragraph [ref=e512]:
                  - text: To reproduce results, train on the desired task using the corresponding config, such as
                  - code [ref=e513]: "--configs atari --task atari_pong"
                  - text: .
                - paragraph [ref=e514]: "View results:"
                - generic [ref=e515]:
                  - generic [ref=e516]: pip install -U scope python -m scope.viewer --basedir ~/logdir --port 8000
                  - button "Copy code to clipboard" [ref=e518] [cursor=pointer]:
                    - img [ref=e519]
                - paragraph [ref=e522]: Scalar metrics are also writting as JSONL files.
                - generic [ref=e523]:
                  - heading "Tips" [level=1] [ref=e524]
                  - 'link "Permalink: Tips" [ref=e525] [cursor=pointer]':
                    - /url: "#tips"
                    - img [ref=e526]
                - list [ref=e528]:
                  - listitem [ref=e529]:
                    - text: All config options are listed in
                    - code [ref=e530]: dreamerv3/configs.yaml
                    - text: and you can override them as flags from the command line.
                  - listitem [ref=e531]:
                    - text: The
                    - code [ref=e532]: debug
                    - text: config block reduces the network size, batch size, duration between logs, and so on for fast debugging (but does not learn a good model).
                  - listitem [ref=e533]:
                    - text: By default, the code tries to run on GPU. You can switch to CPU or TPU using the
                    - code [ref=e534]: "--jax.platform cpu"
                    - text: flag.
                  - listitem [ref=e535]:
                    - text: You can use multiple config blocks that will override defaults in the order they are specified, for example
                    - code [ref=e536]: "--configs crafter size50m"
                    - text: .
                  - listitem [ref=e537]: By default, metrics are printed to the terminal, appended to a JSON lines file, and written as Scope summaries. Other outputs like WandB and TensorBoard can be enabled in the training script.
                  - listitem [ref=e538]:
                    - text: If you get a
                    - code [ref=e539]: Too many leaves for PyTreeDef
                    - text: error, it means you're reloading a checkpoint that is not compatible with the current config. This often happens when reusing an old logdir by accident.
                  - listitem [ref=e540]:
                    - text: If you are getting CUDA errors, scroll up because the cause is often just an error that happened earlier, such as out of memory or incompatible JAX and CUDA versions. Try
                    - code [ref=e541]: "--batch_size 1"
                    - text: to rule out an out of memory error.
                  - listitem [ref=e542]:
                    - text: Many environments are included, some of which require installing additional packages. See the
                    - code [ref=e543]: Dockerfile
                    - text: for reference.
                  - listitem [ref=e544]:
                    - text: To continue stopped training runs, simply run the same command line again and make sure that the
                    - code [ref=e545]: "--logdir"
                    - text: points to the same directory.
                - generic [ref=e546]:
                  - heading "Disclaimer" [level=1] [ref=e547]
                  - 'link "Permalink: Disclaimer" [ref=e548] [cursor=pointer]':
                    - /url: "#disclaimer"
                    - img [ref=e549]
                - paragraph [ref=e551]: This repository contains a reimplementation of DreamerV3 based on the open source DreamerV2 code base. It is unrelated to Google or DeepMind. The implementation has been tested to reproduce the official results on a range of environments.
