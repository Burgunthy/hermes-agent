            - text: "The past five years of large language models trained one deep intuition into the field: make the model bigger, feed it more data, and new capabilities emerge. That intuition has carried directly into robotics. The prevailing bet is that if you train generalist robot policies on enough data, dexterous manipulation will emerge the way unexpected capabilities emerged in LLMs at scale"
