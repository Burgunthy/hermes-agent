        - generic [ref=e252]:
          - paragraph [ref=e253]:
            - strong [ref=e254]: "Grasp Diversity:"
            - text: "the hardware premise. Five-finger hands are the prerequisite every regime below assumes; we have run 10+ of them in-house (our separate post will unpack this). Two data pipelines diversify grasping: Synthetic Robot Data (§4-1) augments a ~5× dataset from a small teleoperation set, while Human Data (§4-2) covers the high-DoF in-hand dexterity teleoperation cannot reach."
          - paragraph [ref=e255]:
            - strong [ref=e256]: "Spatial Precision:"
            - text: geometric reasoning about the pre-contact approach. The policy must capture sufficient scene structure to place contact correctly before contact is made. RLDX-1 strengthens this capability with a robot-specialized VLM (Vision Language Model) fine-tuned on robot VQA (Visual Question and Answering), where the questions explicitly target the geometric relationship between the robot end-effector and the target object (§3-2). This training encourages the VLM to better ground object locations and spatial relations that are critical for precise contact placement.
          - paragraph [ref=e257]:
            - strong [ref=e258]: "Temporal Precision:"
            - text: acting at the right moment in a world that does not wait. A single-frame policy commits to where objects
            - emphasis [ref=e259]: were
            - text: ; by the time the hand arrives, the conveyor object has moved. To address this, the
            - strong [ref=e260]: Motion Module
            - text: (§3-3) extracts motion features from space-time visual correspondences and amortizes multi-frame context into a compact representation. It lets the policy see where and how fast objects are
            - emphasis [ref=e261]: going
            - text: .
          - paragraph [ref=e262]:
            - strong [ref=e263]: "Contact Precision:"
            - text: reasoning about contact using torque and tactile signals. A coffee pot growing lighter is visually invariant; the signal is in wrist torque. The
            - strong [ref=e264]: Physics Module
            - text: (§3-4) gives tactile and torque their own streams and predicts future contact states alongside actions, so the policy anticipates contact transitions before they happen.
