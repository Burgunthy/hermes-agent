          - paragraph [ref=e245]:
            - text: The last mile of industrial automation is dexterity, and today's robots still cannot reliably pour coffee as the pot grows lighter, pick a moving object off a conveyor, rotate a hex nut with fingertips. We distilled these recurring customer needs into
            - link "DexBench" [ref=e246] [cursor=pointer]:
