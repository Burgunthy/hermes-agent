              - strong [ref=e589]: RLDX-1-PT
            - text: ", without OpenArm-specific mid-training, to probe how well the embodiment-agnostic pre-trained policy generalizes to a platform it was not specialized for. The benchmark targets versatile intelligence, including object grounding, instruction understanding, and generalization to unseen environments."
        - 'figure "Figure 16: RLDX-1 Real-World Benchmark, OpenArm." [ref=e591]':
          - generic:
            - generic:
              - 'img "RLDX-1 Real-World Benchmark: OpenArm"'
          - generic [ref=e592]: "Figure 16: RLDX-1 Real-World Benchmark, OpenArm."
        - paragraph [ref=e594]: RLDX-1 consistently outperforms the baselines on the OpenArm benchmark for versatile intelligence. In particular, π₀.₅ performs better than GR00T N1.6 on in-domain tasks, but its performance drops below GR00T N1.6 on out-of-domain tasks, indicating limited generalization to unseen settings. GR00T N1.6 shows a different limitation. It completely fails on the object identification task, suggesting that it struggles with fine-grained instance-level object grounding. In contrast, RLDX-1 maintains balanced performance across different task types without collapsing on any specific capability. These results indicate that RLDX-1 is not only stronger in average success rate, but also more reliable across the diverse capabilities required for real-world humanoid manipulation.
