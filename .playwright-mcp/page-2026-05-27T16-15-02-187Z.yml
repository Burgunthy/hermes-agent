      - complementary "Paper summary" [ref=e201]:
        - paragraph [ref=e202]:
          - strong [ref=e203]: Summary.
          - text: We present RLDX-1, a new dexterity-first foundation model built to tackle complex tasks in real-world industry using high-DoF robotic hands. Existing models often lack essential capabilities, such as context memorization or force sensing, required for seamless real-world deployment. To address this, RLDX-1 encompasses the complete robotics lifecycle, integrating a scalable data collection pipeline, a versatile architecture design, robust training methodologies, and optimized deployment strategies. As a result, RLDX-1 achieves state-of-the-art performance, showcasing exceptional precision and generalization across both simulated environments and physical industrial applications.
