            - text: "Each regime enters the model as a fundamentally different modality: torque is a high-rate continuous stream, video is sparse high-dimensional frames, memory is stateful. In a single conventional transformer, whichever modality dominates the gradient absorbs all the capacity while the rest become decorative. The architectural answer is"
