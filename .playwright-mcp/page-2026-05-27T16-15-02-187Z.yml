            - text: ", a benchmark that organizes them along"
            - strong [ref=e247]: five regimes of dexterity
            - text: ", where each regime is a specific failure mode of today's robots and each one shapes a specific piece of RLDX-1. These tasks live in a world built for human hands. A robot that operates in that world has to meet it on its own terms."
          - paragraph [ref=e248]: "A five-finger hand is the natural form factor, but form factor is not dexterity. Dexterity begins when that hand is driven by a model that can reason about space, time, and contact in real time. The five regimes of dexterity, and the piece of RLDX-1 each one shapes:"
