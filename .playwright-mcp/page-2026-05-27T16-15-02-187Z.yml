        - heading "6-4. Future Direction" [level=3] [ref=e674]
        - list [ref=e676]:
          - listitem [ref=e677]:
            - strong [ref=e678]: Per-task data requirements vary.
            - text: Some tasks converge quickly with few demonstrations; others need relatively extensive post-training.
          - listitem [ref=e679]:
            - strong [ref=e680]: Long-horizon planning ability.
            - text: Our current experiments demonstrate memory-dependent decision-making over short-to-medium interaction horizons. Extending this capability to substantially longer temporal contexts, such as hour-long interactions, remains an important direction for future work.
          - listitem [ref=e681]:
            - strong [ref=e682]: Zero-shot ability.
            - text: RLDX-1 achieves strong instruction understanding under our current training and adaptation setting compared to other frontier VLAs, but its zero-shot generalization as a pre-trained policy remains an open direction.
          - listitem [ref=e683]:
            - strong [ref=e684]: Extending RLDX-1 to the video/world model.
            - text: RLDX-1 can be naturally extended toward video/world modeling, where the model learns to predict future visual observations conditioned on language instructions and actions. Such an extension could provide a stronger basis for long-horizon planning and action-conditioned imagination in embodied environments, and represents a promising direction for future work.
      - generic [ref=e685]:
        - heading "7. Closing" [level=2] [ref=e686]
        - generic [ref=e687]:
          - paragraph [ref=e688]:
            - text: The prevailing assumption in the field is "intelligence first, dexterity follows." Our experience points the other way.
            - strong [ref=e689]: Dexterity is not what comes after intelligence; it is the path intelligence takes when it has to act in the physical world.
            - text: The deciding signal can live in torque, tactile, depth, or modalities with no human analogue, and scaling vision pre-training does not conjure what was never in the pixels. What scales for embodied intelligence is the number of modalities a model can absorb and let complement each other, not the size of any single one.
          - paragraph [ref=e690]: RLDX-1 is the first checkpoint along this direction, not the last. If this is the kind of problem you want to work on, we'd love to hear from you.
        - generic [ref=e691]:
          - iframe [ref=e693]
