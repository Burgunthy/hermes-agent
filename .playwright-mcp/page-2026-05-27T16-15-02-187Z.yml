            - text: .
          - paragraph [ref=e226]: "That bet is promising, and scale will remain a powerful lever. But when we deployed the best available VLAs (Vision-Language-Action models) on the tasks our customers actually need (pouring, in-hand rotation, reactive grasping), they failed consistently, not because they lacked intelligence, but because the task lived in modalities the model was never given: high-DoF hand-object geometry, contact forces, temporal dynamics. Scale cannot recover a modality the model was never given in the first place."
          - paragraph [ref=e227]:
            - text: Recent works have explored leveraging video generation (or world) models trained on large-scale human data for policy learning, demonstrating strong generalization to unseen environments and tasks
