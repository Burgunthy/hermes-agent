        - heading "Best Practices" [level=2] [ref=e528]:
          - strong [ref=e529]: Best Practices
        - paragraph [ref=e530]: "For the best performance, use these configurations and best practices:"
        - heading "1. Sampling Parameters" [level=3] [ref=e531]
        - paragraph [ref=e532]: "Use the following standardized sampling configuration across all use cases:"
