    - generic [ref=e207]:
      - heading "Readme" [level=2] [ref=e209]
      - generic [ref=e211]:
        - paragraph [ref=e212]:
          - img "Gemma 4 Ollama logo" [ref=e213]
          - text: Gemma is a family of open models built by Google DeepMind. Gemma 4 models are multimodal, handling text and image input and generating text output.
        - paragraph [ref=e214]:
          - text: Gemma 4 introduces key
          - strong [ref=e215]: capability and architectural advancements
          - text: ":"
        - list [ref=e216]:
          - listitem [ref=e217]:
            - paragraph [ref=e218]:
              - strong [ref=e219]: Reasoning
              - text: – All models in the family are designed as highly capable reasoners, with configurable thinking modes.
          - listitem [ref=e220]:
            - paragraph [ref=e221]:
              - strong [ref=e222]: Extended Multimodalities
              - text: – Processes Text, Image with variable aspect ratio and resolution support (all models)
          - listitem [ref=e223]:
            - paragraph [ref=e224]:
              - strong [ref=e225]: Diverse & Efficient Architectures
              - text: – Offers Dense and Mixture-of-Experts (MoE) variants of different sizes for scalable deployment.
          - listitem [ref=e226]:
            - paragraph [ref=e227]:
              - strong [ref=e228]: Optimized for On-Device
              - text: – Smaller models are specifically designed for efficient local execution on laptops and mobile devices.
          - listitem [ref=e229]:
            - paragraph [ref=e230]:
              - strong [ref=e231]: Increased Context Window
              - text: – The small models feature a 128K context window, while the medium models support 256K.
          - listitem [ref=e232]:
            - paragraph [ref=e233]:
              - strong [ref=e234]: Enhanced Coding & Agentic Capabilities
              - text: – Achieves notable improvements in coding benchmarks alongside native function-calling support, powering highly capable autonomous agents.
          - listitem [ref=e235]:
            - paragraph [ref=e236]:
              - strong [ref=e237]: Native System Prompt Support
              - text: – Gemma 4 introduces native support for the
              - code [ref=e238]: system
              - text: role, enabling more structured and controllable conversations.
        - heading "Models" [level=3] [ref=e239]
        - paragraph [ref=e240]:
          - strong [ref=e241]: Ollama’s cloud
        - code [ref=e243]: ollama run gemma4:31b-cloud
        - paragraph [ref=e244]:
          - strong [ref=e245]: Edge models
        - paragraph [ref=e246]: The “E” in E2B and E4B stands for “effective” parameters, and are made for edge device deployments.
