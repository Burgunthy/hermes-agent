        - heading "2. Thinking Mode Configuration" [level=3] [ref=e540]
        - blockquote [ref=e541]:
          - paragraph [ref=e542]: Note that Ollama already handles the complexities of the chat template for you.
        - paragraph [ref=e543]:
          - text: Compared to Gemma 3, the models use standard
          - code [ref=e544]: system
          - text: ","
          - code [ref=e545]: assistant
          - text: ", and"
          - code [ref=e546]: user
          - text: "roles. To properly manage the thinking process, use the following control tokens:"
        - list [ref=e547]:
          - listitem [ref=e548]:
            - strong [ref=e549]: "Trigger Thinking:"
            - text: Thinking is enabled by including the
            - code [ref=e550]: <|think|>
            - text: token at the start of the system prompt. To disable thinking, remove the token.
          - listitem [ref=e551]:
            - strong [ref=e552]: "Standard Generation:"
            - text: "When thinking is enabled, the model will output its internal reasoning followed by the final answer using this structure:"
            - code [ref=e553]: <|channel>thought\n
            - strong [ref=e554]: "[Internal reasoning]"
            - code [ref=e555]: <channel|>
          - listitem [ref=e556]:
            - strong [ref=e557]: "Disabled Thinking Behavior:"
            - text: "For all models except for the E2B and E4B variants, if thinking is disabled, the model will still generate the tags but with an empty thought block:"
            - code [ref=e558]: <|channel>thought\n<channel|>
            - strong [ref=e559]: "[Final answer]"
        - heading "3. Multi-Turn Conversations" [level=3] [ref=e560]
        - list [ref=e561]:
          - listitem [ref=e562]:
            - strong [ref=e563]: No Thinking Content in History
            - text: ": In multi-turn conversations, the historical model output should only include the final response. Thoughts from previous model turns must"
            - emphasis [ref=e564]: not be added
            - text: before the next user turn begins.
        - heading "4. Modality order" [level=3] [ref=e565]
        - list [ref=e566]:
          - listitem [ref=e567]:
            - text: For optimal performance with multimodal inputs, place image and/or audio content
            - strong [ref=e568]: before
            - text: the text in your prompt.
        - heading "5. Variable Image Resolution" [level=3] [ref=e569]
        - paragraph [ref=e570]: Aside from variable aspect ratios, Gemma 4 supports variable image resolution through a configurable visual token budget, which controls how many tokens are used to represent an image. A higher token budget preserves more visual detail
        - paragraph [ref=e571]: at the cost of additional compute, while a lower budget enables faster inference for tasks that don’t require fine-grained understanding.
        - list [ref=e572]:
          - listitem [ref=e573]:
            - text: "The supported token budgets are:"
            - strong [ref=e574]: "70"
            - text: ","
            - strong [ref=e575]: "140"
            - text: ","
            - strong [ref=e576]: "280"
            - text: ","
            - strong [ref=e577]: "560"
            - text: ", and"
            - strong [ref=e578]: "1120"
            - text: .
            - list [ref=e579]:
              - listitem [ref=e580]:
                - text: Use
                - emphasis [ref=e581]: lower budgets
                - text: for classification, captioning, or video understanding, where faster inference and processing many frames outweigh fine-grained detail.
              - listitem [ref=e582]:
                - text: Use
                - emphasis [ref=e583]: higher budgets
                - text: for tasks like OCR, document parsing, or reading small text.
