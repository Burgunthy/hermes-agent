            - text: This model requires Ollama 0.6 or later.
            - link "Download Ollama" [ref=e154] [cursor=pointer]:
              - /url: https://ollama.com/download
        - paragraph [ref=e155]: Gemma is a lightweight, family of models from Google built on Gemini technology. The Gemma 3 models are multimodal—processing text and images—and feature a 128K context window with support for over 140 languages. Available in 270M, 1B, 4B, 12B, and 27B parameter sizes, they excel in tasks like question answering, summarization, and reasoning, while their compact design allows deployment on resource-limited devices.
