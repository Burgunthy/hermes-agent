            - paragraph [ref=e24]: 대한민국 코인판에서 “마진계의 전설”이라 불리는 워뇨띠는 투자자들 사이에서 신화 같은 존재다. 워뇨띠라는 독특한 닉네임은 디시인사이드 차트갤러리 특유의 분위기와 익명성이 잘 녹아 있으며, 2017년 본인 계좌에 고작 600만 원이라는 소액을 넣으며 ‘현물 투자’로 코인판에 첫 발을 내디뎠다.
            - paragraph [ref=e25]: 2018년 급락, 2020년 불장, 2021~2022년 치열한 하락장까지, 폭락장의 쓴맛도 수차례 봤지만 결국 누적 이익이 수 천억 원, 2024년 기준 약 3,000억 원에 달하는 것으로 확인돼 ‘마진계의 산증인’, ‘차갤의 전설’로 불린다. 최근에는 하루 만에 85억 원의 수익을 거뒀다는 소식이 기삿거리가 되기도 했다.
            - paragraph [ref=e26]: 워뇨띠는 익명성 유지를 원한다. SNS나 언론 인터뷰도 적고, 투자 관련 커뮤니티에서 간혹 인증 글이나 매매 내역을 올릴 뿐이다. 이 신비감과 거리 두기가 실력 이상의 전설을 만들어냈다. 그알 워뇨띠 제보는 그의 입지를 증명한다. 워뇨띠 그는 누군지 매매법은 어떤지 알아보자.
