            - paragraph [ref=e41]: 워뇨띠 이름은 걸그룹 아이브 장원영의 별명에서 따왔다고 한다. 워낙 팬이다 보니 장원영 별명 워뇨에서 닉네임을 따왔고, 그렇게 전설이 시작됐다. 대부분의 사람들에게 코인 투자는 ‘고위험, 고수익’이란 이미지지만, 워뇨띠는 자신만의 매매 기준으로 극단적 손익구간을 오가면서도 흔들림 없이 장기적인 자산 증식을 노렸다.
            - paragraph [ref=e42]: 워뇨띠가 시장에 미치는 영향력은 엄청나다. 실제로 워뇨띠가 대규모 매수를 하거나 계좌 인증을 올리기만 해도 시장 전체가 출렁인다. 업비트 실명 계좌와 이더리움, 비트코인 호가창 채우기 인증 등으로 “진짜 고래”, “진짜 부자”로 불린다.
            - paragraph [ref=e43]: 워낙 노출이 없다보니 실존인물이 맞는지 의심도 많지만, 디시 알트갤에 자주 출몰하며 질의응답도 해주고 있다. 대한민국 암호화폐 투자자들에게 워뇨띠는 한 명의 이름이 아니라, 신화 그 자체다.
