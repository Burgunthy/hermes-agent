            - heading "워뇨띠 매매법" [level=2] [ref=e136]
            - paragraph [ref=e137]: 600만원에서 3000억을 번 워뇨띠 매매법은 무엇일까? 워뇨띠도 세계적 투자자 워렌버핏이나 벤자민 그레이엄처럼 특별한 방법은 없다. 대신 기술적 지표, 정형 매매법과 달리 실전 경험에 기반한 원칙, 강도높은 리스크 관리가 전부다.
            - paragraph [ref=e138]: 다음은 워뇨띠의 매매 원칙 6가지이다.
            - heading "1. 시장 경험 우선" [level=3] [ref=e139]
            - paragraph [ref=e140]: 차트 패턴, 이론, 지표보다는 실전에서 다양한 금액·상황을 직접 겪으며 감각을 체득하는 것이 무엇보다 중요하다고 강조한다. 매매일지를 쓰거나 패턴을 암기하기보다 “매일같이 시장에 오래 참여하며 그때그때 경험을 축적”을 추천한다.
            - heading "2. 리스크 관리 최우선" [level=3] [ref=e141]
            - paragraph [ref=e142]: ‘격리’ 방식을 통해 한번의 트레이딩에서 전체 시드의 20~30%보다 큰 손실을 절대 보지 않는다. 평소나 변동성장(큰 파동시기)이나 자신의 시드를 강제 손절 라인에 맞춰 분할 관리한다.
            - paragraph [ref=e143]: 큰 손실을 본 날에도 전체 자산의 30% 이상을 잃지 않도록 ‘자동 입금 불가’ 등 자기통제를 하고, 추가 입금을 스스로 굉장히 불편하게 만들어서, 손실 시 충동적으로 자산을 더 투입하지 못하도록 한다.
            - heading "3. 저배율, 분할 진입/청산" [level=3] [ref=e144]
            - paragraph [ref=e145]: 풀시드를 한 번에 몰빵하는 것이 아니라 포지션을 소수분할(2~3회)로 쪼갠다. 레버리지는 자산이 커질수록 (초기 25배→) 요즘은 2~3배로 낮춰가고, 분할청산 역시 고점/저점 예측이 어렵기 때문에 나눠서 익절 및 손절을 시행한다.
            - heading "4. 캔들·거래량 중심 매매" [level=3] [ref=e146]
            - paragraph [ref=e147]: 보조지표나 복잡한 알고리즘은 많이 사용하지 않는다. 오랜 시간 차트(캔들·거래량 흐름)만 직접 관찰하여, 시장 참가자 심리 흐름·반복패턴을 감각적으로 파악한다.
            - heading "5. 타이밍과 심리" [level=3] [ref=e148]
            - paragraph [ref=e149]: 유행, 뉴스, 대세론보다 저점/고점 구간에서만 적극 진입. 남들 쏠릴 때는 오히려 관망. 초조하거나 계획과 달라질 때, 망설임이 크면 ‘분할 및 관망’으로 리스크를 최소화. 혼자서만 얻을 수 있는 실전 경험과 판단을 중시한다.
            - heading "6. 장·단기 포지션" [level=3] [ref=e150]
            - paragraph [ref=e151]: 거래량 많은 곳에선 단기, 적은 곳에선 장기 포지션으로 자산을 굴린다.
            - paragraph [ref=e152]: 이처럼 워뇨띠는 익히 알려진 매매법에 자신만의 인내와 지식을 추가하는 모습이다. 한번에 돈을 벌기 보다는 장기전에서 살아남기 위한 전략이 특징이라면 특징이다.
            - heading "워뇨띠 포지션 보는 법" [level=2] [ref=e153]
