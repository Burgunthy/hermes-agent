    - generic [ref=e152]:
      - heading "Readme" [level=2] [ref=e154]
      - generic [ref=e156]:
        - paragraph [ref=e157]:
          - img "image.png" [ref=e158]
        - paragraph [ref=e159]: The Llama 4 collection of models are natively multimodal AI models that enable text and multimodal experiences. These two models leverage a mixture-of-experts (MoE) architecture and support native multimodality (image input).
        - paragraph [ref=e160]:
          - strong [ref=e161]: "Supported languages:"
          - text: Arabic, English, French, German, Hindi, Indonesian, Italian, Portuguese, Spanish, Tagalog, Thai, and Vietnamese.
        - paragraph [ref=e162]:
          - strong [ref=e163]: "Input:"
          - text: multilingual text, image
        - paragraph [ref=e164]:
          - strong [ref=e165]: "Output:"
          - text: multilingual text, code
        - heading "Models" [level=3] [ref=e166]
        - heading "Llama 4 Scout" [level=4] [ref=e167]
        - code [ref=e169]: ollama run llama4:scout
        - paragraph [ref=e170]: 109B parameter MoE model with 17B active parameters
        - heading "Llama 4 Maverick" [level=4] [ref=e171]
        - code [ref=e173]: ollama run llama4:maverick
        - paragraph [ref=e174]: 400B parameter MoE model with 17B active parameters
        - heading "Intended Use" [level=3] [ref=e175]
        - paragraph [ref=e176]:
          - strong [ref=e177]: "Intended Use Cases:"
          - text: Llama 4 is intended for commercial and research use in multiple languages. Instruction tuned models are intended for assistant-like chat and visual reasoning tasks, whereas pretrained models can be adapted for natural language generation. For vision, Llama 4 models are also optimized for visual recognition, image reasoning, captioning, and answering general questions about an image. The Llama 4 model collection also supports the ability to leverage the outputs of its models to improve other models including synthetic data generation and distillation. The Llama 4 Community License allows for these use cases.
        - paragraph [ref=e178]:
          - strong [ref=e179]: Out-of-scope
          - text: ": Use in any manner that violates applicable laws or regulations (including trade compliance laws). Use in any other way that is prohibited by the Acceptable Use Policy and Llama 4 Community License. Use in languages or capabilities beyond those explicitly referenced as supported in this model card."
        - paragraph [ref=e180]: "Note:"
        - list [ref=e181]:
          - listitem [ref=e182]:
            - paragraph [ref=e183]:
              - text: Llama 4 has been trained on a broader collection of languages than the 12 supported languages (pre-training includes
              - link "200 total languages" [ref=e184] [cursor=pointer]:
                - /url: https://ai.meta.com/research/no-language-left-behind/
              - text: ). Developers may fine-tune Llama 4 models for languages beyond the 12 supported languages provided they comply with the Llama 4 Community License and the Acceptable Use Policy. Developers are responsible for ensuring that their use of Llama 4 in additional languages is done in a safe and responsible manner.
          - listitem [ref=e185]:
            - paragraph [ref=e186]: Llama 4 has been tested for image understanding up to 5 input images. If leveraging additional image understanding capabilities beyond this, Developers are responsible for ensuring that their deployments are mitigated for risks and should perform additional testing and tuning tailored to their specific applications.
