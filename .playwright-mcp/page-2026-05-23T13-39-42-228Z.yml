            - button "View Documentation" [ref=e53]:
              - generic [ref=e54]: View Documentation
      - generic [ref=e59]: Most jurisdictions tax digital sales, and the rules differ country by country. Polar takes the role of reseller for those sales, which moves the international tax liability off your balance sheet onto ours.
      - generic [ref=e60]:
        - heading "What Merchant of Record actually means" [level=2] [ref=e61]
        - generic [ref=e62]:
          - paragraph [ref=e63]: "A Payment Service Provider like Stripe routes money between your customer and your bank. It's a powerful abstraction for processing transactions, but it stops there: the merchant on every receipt is still you, which means the tax liability for every international sale is also still yours."
          - paragraph [ref=e64]: A Merchant of Record sits one layer higher. Polar buys the digital good from you and resells it to your customer, which makes us the merchant for that specific sale. As a consequence, international sales tax (VAT, GST, US Sales Tax, and the rest) is owed by us, not you.
          - paragraph [ref=e65]: What stays with you is the customer relationship. The renewals, the support, and the product experience are all yours. We sit underneath, handling the regulatory layer the customer never has to think about.
      - generic [ref=e66]:
