            - paragraph [ref=e2664]: We also collect configurations of the cube in-hand generated by our policies running in the real world and play them back in Isaac Sim to render data where the pose estimates are not fully reliable i.e. the pose estimator is not accurate all the time. This happens due to the sim-to-real gap as a result of either sparse sampling or insufficient lighting randomisations for those configurations. Playback in simulation enables dense sampling of pose and lighting around these configurations with more randomisations. This allows us to generate larger datasets that improve the reliability of the pose estimator in the real world i.e. closing the perception loop between real and sim by mining configurations from the current best policy in the real world and using them in sim to render more images. We use the same intrinsics of the cameras in the real world, but randomise extrinsics when rendering data.
            - paragraph [ref=e2666]:
              - text: "Training setup and inference: We use a torchvision Mask-RCNN"
              - generic [ref=e2667]:
                - text: (He et al.,
                - link "2017" [ref=e2668] [cursor=pointer]:
                  - /url: "#bib.bib17"
                - text: )
              - text: "-inspired network"
              - superscript [ref=e2670]: "6"
              - text: that regresses to the bounding box, segmentation, and keypoints located at the 8 corners of the cube. The bounding box localises the cube in the image, and the keypoint head regresses to the positions of the 8 corners of the cube within the bounding box. The networks are trained with cross-entropy loss for segmentation and keypoint location regression, and smooth L1 loss for bounding box regression. We use the ADAM optimiser with a learning rate of 1e-4. The network runs on three cameras at an inference rate of 20Hz on an NVIDIA RTX 3090 GPU and a 32-core AMD Ryzen Threadripper CPU. However, because the policy was trained with a control frequency of 30Hz in simulation, the pose estimator was locked to run at 15Hz to ensure that the policy receives pose observations at a constant integer interval of once every two control steps. To make the pose estimate reliable for the downstream policy, we first perform classic PnP
              - link "Wikipedia" [ref=e2672] [cursor=pointer]:
                - /url: "#bib.bib18"
              - text: on each of the three cameras independently and then filter out the ones where the projected keypoints from the PnP pose do not match the inferred keypoints from the network. We triangulate the keypoints from the filtered cameras and register them against the model of the cube to obtain the pose in a canonical reference frame. We use the OpenCV implementation of PnP and roma
              - generic [ref=e2673]:
                - text: Brégier (
                - link "2021" [ref=e2674] [cursor=pointer]:
                  - /url: "#bib.bib19"
                - text: )
              - text: for registering keypoints against the model of the cube. We benchmark the pose on a test set consisting of 50K images and provide results in Table
              - link "6" [ref=e2675] [cursor=pointer]:
                - /url: "#S2.T6"
              - text: . Since we do not use any marker-based system in the real world, we can only precisely evaluate the performance of the pose estimator in simulation. Our ablation studies in Section
              - link "3.2" [ref=e2676] [cursor=pointer]:
                - /url: "#S3.SS2"
              - text: do test the strength of the pose estimator for manipulation in the real world. One important difference between our approach and
              - generic [ref=e2677]:
                - text: OpenAI et al. (
                - link "2018" [ref=e2678] [cursor=pointer]:
                  - /url: "#bib.bib1"
                - text: )
              - text: is that our pose estimation is not done end-to-end. Since we detect keypoints in the image and use geometric computer vision to obtain the pose, our pose estimator is not tied to a fixed camera setup, unlike
              - generic [ref=e2679]:
                - text: OpenAI et al. (
                - link "2018" [ref=e2680] [cursor=pointer]:
                  - /url: "#bib.bib1"
                - text: )
              - text: .
