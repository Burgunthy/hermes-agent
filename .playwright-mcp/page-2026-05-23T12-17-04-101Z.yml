            - paragraph [ref=e182]:
              - text: We propose a method for performing object reorientation on an anthropomorphic hand. Initially the object to be manipulated is placed on the palm of the hand and a random target orientation is sampled in
              - math [ref=e183]:
                - generic [ref=e185]:
                  - generic [ref=e186]: S
