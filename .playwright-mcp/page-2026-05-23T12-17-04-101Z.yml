            - paragraph [ref=e872]:
              - text: Our aim in this paper is to learn dexterous manipulation behaviours. Current on-policy learning algorithms can struggle to accomplish this on real robots due to the number of samples required. Hence, we learn our behaviours entirely in simulation. We use the GPU-based Isaac Gym physics simulator
              - generic [ref=e873]:
                - text: (Makoviychuk et al.,
                - link "2021" [ref=e874] [cursor=pointer]:
                  - /url: "#bib.bib6"
                - text: )
              - text: ", which models contacts differently than MuJoCo’s soft-contact model"
              - generic [ref=e875]:
                - text: Todorov et al. (
                - link "2012" [ref=e876] [cursor=pointer]:
                  - /url: "#bib.bib7"
                - text: )
              - text: used in
              - generic [ref=e877]:
                - text: OpenAI et al. (
                - link "2018" [ref=e878] [cursor=pointer]:
                  - /url: "#bib.bib1"
                - text: )
              - text: . Isaac Gym gives the advantage of being able to simulate thousands of robots in parallel on a single GPU, mitigating the need for large amounts of CPU resources.
          - generic [ref=e879]:
            - heading "2.6 Domain Randomisation" [level=3] [ref=e880]:
              - generic [ref=e881]: "2.6"
              - text: Domain Randomisation
            - paragraph [ref=e883]:
              - text: It is widely known that there is a "sim-to-real" gap between physics simulators and real life
              - generic [ref=e884]:
                - text: Jakobi et al. (
                - link "1995" [ref=e885] [cursor=pointer]:
                  - /url: "#bib.bib14"
                - text: )
              - text: . Compounding this is the fact that the robot as a system can change from day to day (e.g., due to wear-and-tear) and even from timestep to timestep (e.g., stochastic noise). To help overcome this, we introduce various kinds of randomisations
              - generic [ref=e886]:
                - text: Peng et al. (
                - link "2018" [ref=e887] [cursor=pointer]:
                  - /url: "#bib.bib15"
                - text: )
              - text: into the simulated environment as listed in Table
              - link "3" [ref=e888] [cursor=pointer]:
                - /url: "#S2.T3"
              - text: .
            - paragraph [ref=e890]:
              - text: "Vectorised Automatic Domain Randomisation: In our best policies, we set the parameters of the domain randomisations via a vectorised implementation of Automatic Domain Randomisation (ADR, introduced in"
              - generic [ref=e891]:
                - text: (OpenAI et al.,
                - link "2019" [ref=e892] [cursor=pointer]:
                  - /url: "#bib.bib8"
                - text: )
              - text: ). ADR automatically adjusts the range of domain randomisations to keep them as wide as possible while keeping the policy performance above a certain threshold. This allows us to train policies with less randomisation earlier in training (enabling behaviour exploration) while producing final policies that are robust to the largest range of environment conditions possible at the end of training, with the aim of improving sim-to-real transfer by learning policies which are robust and adaptive to a range of environment randomisation parameters. Using the parallelisation provided by Isaac Gym, we implement a vectorised variant of the algorithm, which we call Vectorised Automatic Domain Randomisation (VADR, see Algorithm
              - link "1" [ref=e893] [cursor=pointer]:
                - /url: "#algorithm1"
              - text: ).
