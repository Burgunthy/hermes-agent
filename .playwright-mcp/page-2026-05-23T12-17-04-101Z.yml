              - text: Quirks, Problems, and Surprises
            - figure [ref=e3234]:
              - generic [ref=e3235]:
                - generic [ref=e3236]:
                  - img "[Uncaptioned image]" [ref=e3237]
                  - img "[Uncaptioned image]" [ref=e3238]
                  - img "[Uncaptioned image]" [ref=e3239]
                  - img "[Uncaptioned image]" [ref=e3240]
                - generic [ref=e3242]:
                  - generic [ref=e3243]: "Figure 9:"
                  - generic [ref=e3244]:
                    - text: Ribbon cables can burn with aggressive maneuvers or excessive usage. Full video is available at
                    - link "https://www.youtube.com/watch?v=H5xOer9jxJc" [ref=e3245] [cursor=pointer]:
                      - /url: https://www.youtube.com/watch?v=H5xOer9jxJc
                    - text: . The images show one of the instances of running the policy leading to burning cables and smoke coming out of the hand. Regular health checkups are necessary, involving replacing cables, tightening screws and resting the hand for a few hours after running about 10-15 trials.
            - paragraph [ref=e3247]: Throughout our work, we experienced a variety of recurring problems and observations, which we disclose here in the interest of transparency and providing avenues for future research. Due to complexities involved in training and slow turnaround time in results because of real hardware involved in the loop, we do not have rigorous experiments to prove these. However, they constitute "tricks of the trade" that will hopefully be of use to other researchers.
            - list [ref=e3249]:
              - listitem [ref=e3250]:
                - text: •
                - paragraph [ref=e3252]:
                  - text: Even though we are not training on the real robot hand and our policies are very gentle due to the low-pass filters we apply, the hand is quite fragile and requires regular health checks and cable replacements e.g. the ribbon cables connecting joints on the fingers can break or burn, disabling the corresponding joints (see Figure
                  - link "9" [ref=e3253] [cursor=pointer]:
                    - /url: "#S3.F9"
                  - text: ). We also apply hot glue at the either ends of the ribbon cables going into connectors to tighten the connection and prevent them from coming out.
              - listitem [ref=e3254]:
                - text: •
                - paragraph [ref=e3256]: We had applied 300lse tape on fingers and palm of the hand for another unrelated task of grasping, but it added significant friction, preventing the cube from sliding and moving smoothly on the palm. Higher friction also meant that the fingers tried aggressively to manipulate the cube when it was stuck in the hand. Therefore, we removed the tape from the palm. However, we kept the tape on the sides of the fingers to allow better grips on the object.
              - listitem [ref=e3257]:
                - text: •
                - paragraph [ref=e3259]:
                  - text: We found that deployment in the real world was quite variable between policies trained with different seeds, even with the same domain randomisation parameters. This is an issue that was also noted in
                  - generic [ref=e3260]:
                    - text: (Zhang et al.,
                    - link "2020" [ref=e3261] [cursor=pointer]:
                      - /url: "#bib.bib21"
                    - text: )
                  - text: . We suspect that this is because, despite the extreme levels of randomisation we do, there is a "null space" of possible policies which perform similarly in simulation but differently in the real world.
              - listitem [ref=e3262]:
                - text: •
                - paragraph [ref=e3264]:
                  - text: Automatic Domain Randomisation
                  - generic [ref=e3265]:
                    - text: (OpenAI et al.,
                    - link "2019" [ref=e3266] [cursor=pointer]:
                      - /url: "#bib.bib8"
                    - text: )
                  - text: ", which was used to achieve our best results, does not model the joint distribution and relationships between performance with different parameters. This means it can provide different results depending on the order in which randomisation ranges increase, and furthermore it may not explore the Pareto-limits of performance on any particular dimension. This can lead to cases where ADR disproportionately increases the performance of the policy on dimension A at the expense of dimension B."
              - listitem [ref=e3267]:
                - text: •
                - paragraph [ref=e3269]: Our best policy trained in a non-ADR setting exhibited slightly more natural and smooth behaviour than the ADR one. We also observed that the ADR policies tended to cage the object, resulting in letters occluded by the fingers from all cameras. This made the pose estimation unreliable in those configurations (although the policy was able to absorb the errors and performed better overall). It is possible temporal smoothing of the pose estimator can help as long as it does not introduce any latency.
              - listitem [ref=e3270]:
                - text: •
                - paragraph [ref=e3272]:
                  - text: We also tried pose estimation without the letters on the faces and found that to be quite challenging — the network was confused by colour changes due to lighting in the real scene and the quality of the cameras used e.g. yellow turning into white in the image when the normal of a cube face is perpendicular to the camera. Having a robot cage as used in
                  - generic [ref=e3273]:
                    - text: OpenAI et al. (
                    - link "2018" [ref=e3274] [cursor=pointer]:
                      - /url: "#bib.bib1"
                    - text: ","
                    - link "2019" [ref=e3275] [cursor=pointer]:
                      - /url: "#bib.bib8"
                    - text: )
                  - text: and
                  - generic [ref=e3276]:
                    - text: Allshire et al. (
                    - link "2021" [ref=e3277] [cursor=pointer]:
                      - /url: "#bib.bib22"
                    - text: )
                  - text: with an constrained artificial light can prevent this from happening to an extent, but it also makes the system confined to the cage.
            - paragraph [ref=e3279]: "On the other hand, we were surprised positively about some aspects of our system:"
            - list [ref=e3281]:
              - listitem [ref=e3282]:
                - text: •
                - paragraph [ref=e3284]: Our pose estimator proved to be surprisingly robust even in real-world scenarios outside of Allegro Hand manipulation. This hints at the power of extreme randomisation with synthetic data in simulation for developing such general systems.
              - listitem [ref=e3285]:
                - text: •
                - paragraph [ref=e3287]:
                  - text: The ability to, at test time, adjust the speed of the policy by tuning the EMA value (see Section
                  - link "2.3" [ref=e3288] [cursor=pointer]:
                    - /url: "#S2.SS3"
                  - text: "- we trained with 0.15 but tested with 0.1) was very useful to avoid damaging the hardware while at the same time having agile policies."
              - listitem [ref=e3289]:
                - text: •
                - paragraph [ref=e3291]: The agility of our policies in the real world on the Allegro Hand, which we initially expected to be a limitation as it is relatively large and is motor- rather than tendon-driven, was a positive surprise to us.
              - listitem [ref=e3292]:
                - text: •
                - paragraph [ref=e3294]: Most of our experiments and trials conducted on the robot were done with a worn-out thumb on the Allegro Hand — one of the wires connecting a joint to the circuit board had a loose connection — and we were quite surprised that the policies produced high consecutive successes despite a malfunctioning actuator, suggesting the robustness of learning-based approaches. The slow turnaround time involved in repairing the hardware motivated us to do it ourselves regularly during the experiments, but it was only a temporary solution.
              - listitem [ref=e3295]:
                - text: •
                - paragraph [ref=e3297]:
                  - text: Since we do not regress to the pose via an end-to-end network, we found that our pose estimator was not tied to a particular camera configuration as keypoint detection worked reliably from different configurations
                  - superscript [ref=e3299]: "9"
                  - text: i.e. our earlier results as described in
                  - link "A.5" [ref=e3300] [cursor=pointer]:
                    - /url: "#A1.SS5"
                  - text: were obtained with a camera configuration that was different to the one we used afterwards with ADR.
              - listitem [ref=e3301]:
                - text: •
                - paragraph [ref=e3303]:
                  - text: Our best policies were trained with continuous actions unlike
                  - generic [ref=e3304]:
                    - text: OpenAI et al. (
                    - link "2018" [ref=e3305] [cursor=pointer]:
                      - /url: "#bib.bib1"
                    - text: ","
                    - link "2019" [ref=e3306] [cursor=pointer]:
                      - /url: "#bib.bib8"
                    - text: )
                  - text: ", where discrete actions were used."
        - generic [ref=e3307]:
          - heading "4 Related work" [level=2] [ref=e3308]:
            - generic [ref=e3309]: "4"
            - text: Related work
          - paragraph [ref=e3311]:
            - text: In-hand manipulation is a longstanding challenge in robotics. Classical methods
            - generic [ref=e3312]:
              - text: Salisbury and Craig (
              - link "1982" [ref=e3313] [cursor=pointer]:
                - /url: "#bib.bib23"
              - text: ); Mason and Salisbury (
              - link "1985" [ref=e3314] [cursor=pointer]:
                - /url: "#bib.bib24"
              - text: ); Li et al. (
              - link "1989" [ref=e3315] [cursor=pointer]:
                - /url: "#bib.bib25"
              - text: )
            - text: have focussed on directly leveraging the robot’s kinematic and dynamic model to analytically derive controllers for the object in hand. These approaches work well while an object maintains no-slip contacts with the hand, but struggle to achieve good results in dynamic tasks where complex sequences of making-and-breaking of contacts is needed.
          - paragraph [ref=e3317]:
            - text: Reinforcement learning has proven to be a powerful method for learning complex behaviours in robots with many degrees of freedom.
            - generic [ref=e3318]:
              - text: Hwangbo et al. (
              - link "2019" [ref=e3319] [cursor=pointer]:
                - /url: "#bib.bib26"
              - text: )
            - text: and
            - generic [ref=e3320]:
              - text: Lee et al. (
              - link "2020" [ref=e3321] [cursor=pointer]:
                - /url: "#bib.bib27"
              - text: )
            - text: showed how robust legged locomotion can be learned even over challenging terrain using a combination of deep RL, fast simulation, and domain randomisation. A crucial inspiration for our work is
            - generic [ref=e3322]:
              - text: OpenAI et al. (
              - link "2018" [ref=e3323] [cursor=pointer]:
                - /url: "#bib.bib1"
              - text: )
            - text: on learning in-hand reorientation of cubes via reinforcement learning in simulation and subsequent
            - generic [ref=e3324]:
              - text: OpenAI et al. (
              - link "2019" [ref=e3325] [cursor=pointer]:
                - /url: "#bib.bib8"
              - text: )
            - text: extending this task to solving Rubik’s cubes. A variety of recent works
            - generic [ref=e3326]:
              - text: Makoviychuk et al. (
              - link "2021" [ref=e3327] [cursor=pointer]:
                - /url: "#bib.bib6"
              - text: ); Chen et al. (
              - link "2021b" [ref=e3328] [cursor=pointer]:
                - /url: "#bib.bib28"
              - text: ); Huang et al. (
              - link "2021" [ref=e3329] [cursor=pointer]:
                - /url: "#bib.bib29"
              - text: ); Caggiano et al. (
              - link "2022" [ref=e3330] [cursor=pointer]:
                - /url: "#bib.bib30"
              - text: )
            - text: have leveraged new RL techniques and simulators in order to reproduce or extend in simulation the anthropomorphic in-hand manipulation capabilities shown in
            - generic [ref=e3331]:
              - text: OpenAI et al. (
              - link "2018" [ref=e3332] [cursor=pointer]:
                - /url: "#bib.bib1"
              - text: )
            - text: . However, these works have not shown sim-to-real transfer, demonstrating that this remains a significant challenge for learned in-hand manipulation. There have also been a variety of recent approaches attempting in-hand manipulation from the perspective of finger gaiting
            - generic [ref=e3333]:
              - text: Higo et al. (
              - link "2018" [ref=e3334] [cursor=pointer]:
                - /url: "#bib.bib31"
              - text: ); Morgan et al. (
              - link "2022" [ref=e3335] [cursor=pointer]:
                - /url: "#bib.bib32"
              - text: )
            - text: . However, these often fail to reproduce the agile dexterity present in human hands, as the limitations of such a sequential approach to control place corresponding limits on speed. Similarly,
            - generic [ref=e3336]:
              - text: Allshire et al. (
              - link "2021" [ref=e3337] [cursor=pointer]:
                - /url: "#bib.bib22"
              - text: )
            - text: and
            - generic [ref=e3338]:
              - text: Shi et al. (
              - link "2020" [ref=e3339] [cursor=pointer]:
                - /url: "#bib.bib33"
              - text: )
            - text: achieve real-world in hand manipulation using reinforcement learning, but on a platform that cannot mimic the dexterity of a human hand.
            - generic [ref=e3340]:
              - text: Sievers et al. (
              - link "2022" [ref=e3341] [cursor=pointer]:
                - /url: "#bib.bib34"
              - text: )
            - text: learned in-hand manipulation using tactile sensing, but the lack of vision meant that the kinds of re-posing behaviour and speed of the manipulation were limited. There has also been research investigating using reinforcement learning directly on hardware platforms as opposed to in simulation
            - generic [ref=e3342]:
              - text: Kumar et al. (
              - link "2016a" [ref=e3343] [cursor=pointer]:
                - /url: "#bib.bib35"
              - text: ","
              - link "b" [ref=e3344] [cursor=pointer]:
                - /url: "#bib.bib36"
              - text: )
            - text: . However, this limits the complexity of learning that can be done due to the small number of trials available on real hardware platforms, as well as the wear-and-tear imposed.
          - paragraph [ref=e3346]:
            - text: Pose estimation for robotic manipulation is a widely studied area
            - generic [ref=e3347]:
              - text: Tremblay et al. (
              - link "2018" [ref=e3348] [cursor=pointer]:
                - /url: "#bib.bib37"
              - text: ); Labbé et al. (
              - link "2020" [ref=e3349] [cursor=pointer]:
                - /url: "#bib.bib38"
              - text: )
            - text: . However, relatively few works outside of
            - generic [ref=e3350]:
              - text: OpenAI et al. (
              - link "2018" [ref=e3351] [cursor=pointer]:
                - /url: "#bib.bib1"
              - text: )
            - text: have applied it to the problem of contact-rich, dexterous, in-hand manipulation, which introduces challenges that exclude many off-the-shelf pose estimators (due to the large degree of occlusions, motion blur, etc.).
        - generic [ref=e3352]:
          - heading "5 Limitations" [level=2] [ref=e3353]:
            - generic [ref=e3354]: "5"
            - text: Limitations
          - paragraph [ref=e3356]:
            - text: Despite our best efforts, the gap between simulations and the real world is still noticeable. Our non-ADR (manual DR) based policy achieves an average of 35 consecutive successes (see Figure
            - link "6" [ref=e3357] [cursor=pointer]:
              - /url: "#S3.F6"
            - text: (a)) in simulation, but only obtains an average of about 15 consecutive successes in the real world. While our ADR policies do perform better, they still fail to reach the average successes seen in simulations. Another limitation of our work is that our ADR policies do not consistently obtain high consecutive successes as seen in ADR (XXL) in
            - generic [ref=e3358]:
              - text: OpenAI et al. (
              - link "2019" [ref=e3359] [cursor=pointer]:
                - /url: "#bib.bib8"
              - text: )
            - text: . It is unclear whether we need a more reliable pose estimation e.g. marker-based systems, the policy needs more diversity in the data, or if it was due to the malfunctioning thumb on our Allegro Hand. Our best npd with ADR policies is around -0.2, and it is possible that further improvements can be made. This is something we would like to investigate in future work.
          - paragraph [ref=e3361]: We also observed that there is still some sim-to-real gap in pose estimation. This is manifested when we played back the real states in sim (real-to-sim) with physics enabled, which sometimes resulted in interpenetrations. Therefore, we were not able to easily calibrate physics parameters of the cube, which could have improved our sim-to-real transfer.
          - generic [ref=e3362]:
            - paragraph [ref=e3363]: "Lastly, putting this work in context, it is worth remembering that some of the key reasons for successful transfer of this task involve:"
            - list [ref=e3364]:
              - listitem [ref=e3365]:
                - text: •
                - paragraph [ref=e3367]: Being able to simulate the task, and having a clear and well-defined reward function so that the policies can be trained in simulation.
              - listitem [ref=e3368]:
                - text: •
                - paragraph [ref=e3370]: Randomisation of interpretable parameters exposed by the simulator and providing a curriculum for training in simulation. For instance, we randomised friction, damping, stiffness, etc., which were crucial for the transfer. ADR provided a curriculum.
              - listitem [ref=e3371]:
                - text: •
                - paragraph [ref=e3373]: Ability to evaluate successful execution of the task so that we can track the improvements. In this work, we compared the current orientation with the desired, and if the difference was within a user-specified threshold (0.4 rad in our case), the goal-reaching was considered successful.
          - paragraph [ref=e3375]: Many real-world tasks are hard to simulate and sometimes defining reward functions is not possible as it is in this task. Even if we could simulate and have a well-defined reward function, evaluating a successful execution of a task, e.g. cooking a meal, is not straightforward.
        - generic [ref=e3376]:
          - heading "6 Acknowledgements" [level=2] [ref=e3377]:
