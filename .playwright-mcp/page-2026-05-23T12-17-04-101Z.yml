                    - generic [ref=e191]: )
              - superscript [ref=e193]: "1"
              - text: . The policy then orchestrates the motion of the fingers so as to bring the object to its desired target orientation. Similar to
              - generic [ref=e194]:
                - text: OpenAI et al. (
                - link "2018" [ref=e195] [cursor=pointer]:
                  - /url: "#bib.bib1"
                - text: )
              - text: ", if the object orientation is within a specified threshold of 0.4 radians of the target orientation, we sample a new target orientation. The fingers continue from the current configuration and aim to move the object to its new target orientation. The success criterion is the number of consecutive target orientations achieved without dropping the object or having the object stuck in the same configuration for more than 80 seconds. Importantly, each consecutive success becomes increasingly harder to achieve as the fingers have to keep the object in the hand without dropping, hence testing the policy’s ability to model the dynamics on the go."
