            - paragraph [ref=e1841]:
              - text: "When training on multiple GPUs (8 for our best policies), we ran VADR separately on each one. This was done for two reasons: firstly, to avoid additional synchronisation overhead of buffers. Secondly, to partially mitigate the disadvantage of ADR noted below in Section"
              - link "3.3" [ref=e1842] [cursor=pointer]:
                - /url: "#S3.SS3"
              - text: caused by the failure to model the joint distribution; having multiple independent parameter sets to some extent will allow multiple sets of extreme parameters. All randomisations are set by ADR.
              - superscript [ref=e1844]: "3"
              - text: In the following, we describe the physics and non-physics randomisations in more detail.
            - generic [ref=e1845]:
              - heading "2.6.1 Physics Randomisations" [level=4] [ref=e1846]:
                - generic [ref=e1847]: 2.6.1
                - text: Physics Randomisations
              - paragraph [ref=e1849]:
                - text: We apply physics randomisations to account for both changing real-world dynamics and the inevitable gaps between physics in simulation and reality. These include basic properties such as mass, friction and restitution of the hand and object. We also randomly scale the hand and object to avoid over-reliance on exact morphology. On the hand, joint stiffness, damping, and limits are randomised. Furthermore, we add random forces to the cube in a similar fashion to
                - generic [ref=e1850]:
                  - text: OpenAI et al. (
                  - link "2018" [ref=e1851] [cursor=pointer]:
                    - /url: "#bib.bib1"
                  - text: )
                - text: .
              - paragraph [ref=e1853]: Joint Stiffness, Joint Damping, and Effort are scaled using the value sampled directly from the ADR-given uniform distribution.
              - paragraph [ref=e1855]: Mass and Scale are randomised within a fixed range due to API limitations currently. However, we did not observe this as a significant limitation for our experiments, and our policies nevertheless achieved rollouts with high consecutive successes in the real world.
              - paragraph [ref=e1857]:
                - text: Gravity cannot be randomised per-environment in Isaac Gym currently, but a new gravity value is sampled every
                - math [ref=e1858]:
                  - generic [ref=e1860]: "720"
                - text: concurrent simulation steps for all environments.
            - generic [ref=e1861]:
              - heading "2.6.2 Non-physics Randomisations" [level=4] [ref=e1862]:
                - generic [ref=e1863]: 2.6.2
                - text: Non-physics Randomisations
              - paragraph [ref=e1865]:
                - text: In addition to normal physics randomisations, Table
                - link "3" [ref=e1866] [cursor=pointer]:
                  - /url: "#S2.T3"
                - text: lists action and observation randomisations, which we found to be critical to achieving good real-world performance. To make our policies more robust to the changing inference frequency and jitter resulting from our ROS-based inference system, we add stochastic delays to cube pose and action delivery time as well as fixed-for-an-episode action latency. To the actions and observations, we add correlated and uncorrelated additive Gaussian noise. To account for unmodelled dynamics, we use a Random Network Adversary (RNA, see below).
