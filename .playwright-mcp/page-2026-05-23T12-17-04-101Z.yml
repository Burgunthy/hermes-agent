        - generic [ref=e127]:
          - heading "1 Introduction" [level=2] [ref=e128]:
            - generic [ref=e129]: "1"
            - text: Introduction
          - paragraph [ref=e131]: Multi-fingered robotic hands offer an exciting platform to develop and enable human-level dexterity. Not only do they provide kinematic redundancy for stable grasps, but they also enable the repertoire of skills needed to interact with a wide range of day-to-day objects. However, controlling such high-DoF end-effectors has remained challenging. Even in research, most robotic systems today use parallel-jaw grippers.
          - paragraph [ref=e133]:
            - text: In 2018,
            - generic [ref=e134]:
              - text: OpenAI et al. (
              - link "2018" [ref=e135] [cursor=pointer]:
                - /url: "#bib.bib1"
              - text: )
            - text: showed for the first time that multi-fingered hands with a purely end-to-end deep-RL based approach could endow robots with unprecedented capabilities for challenging contact-rich in-hand manipulation. However, due to the complexity of their training architecture, and the
            - emphasis [ref=e136]: sui generis
            - text: nature of their work on sim-to-real transfer, reproducing and building upon their success has proven to be a challenge for the community. Recent advancements in in-hand manipulation with RL have made progress with multiple objects and an anthropomorphic hand
            - generic [ref=e137]:
              - text: Chen et al. (
              - link "2021a" [ref=e138] [cursor=pointer]:
                - /url: "#bib.bib2"
              - text: )
            - text: ", but those results have only been in simulation."
          - paragraph [ref=e140]:
            - text: While the NLP and computer vision communities have reproduced and extended the successes of large-scale models like GPT-3
            - generic [ref=e141]:
              - text: Brown et al. (
              - link "2020" [ref=e142] [cursor=pointer]:
                - /url: "#bib.bib3"
              - text: )
            - text: and DALL-E
            - generic [ref=e143]:
              - text: Ramesh et al. (
              - link "2021" [ref=e144] [cursor=pointer]:
                - /url: "#bib.bib4"
              - text: ","
              - link "2022" [ref=e145] [cursor=pointer]:
                - /url: "#bib.bib5"
              - text: )
            - text: respectively, similar efforts have remained elusive in robotics due to hardware and infrastructure challenges. Using large-scale data from simulations may provide avenues to unlock a similar step function in robotics capabilities.
          - paragraph [ref=e147]:
            - text: This paper builds on top of the prior work in
            - generic [ref=e148]:
              - text: OpenAI et al. (
              - link "2018" [ref=e149] [cursor=pointer]:
                - /url: "#bib.bib1"
              - text: )
            - text: . We use a comparatively affordable Allegro Hand with a locked wrist and four fingers, using only position encoders on servo motors; the Shadow Hand used in OpenAI’s experiments costs an order of magnitude more than the Allegro Hand. We also develop a simple vision system that requires no specialised tracking or infrastructure on the hand; the system works on three off-the-shelf RGB cameras compared to OpenAI’s expensive marker-based setup, making our system easily accessible for everyone. Furthermore, we use the GPU-based Isaac Gym physics simulator
            - generic [ref=e150]:
              - text: Makoviychuk et al. (
              - link "2021" [ref=e151] [cursor=pointer]:
                - /url: "#bib.bib6"
              - text: )
            - text: as opposed to the CPU-based MuJoCo
            - generic [ref=e152]:
              - text: Todorov et al. (
              - link "2012" [ref=e153] [cursor=pointer]:
                - /url: "#bib.bib7"
              - text: )
            - text: ", which allows us to reduce the amount of computational resources used and the complexity of the training infrastructure. Our best models required only 8 NVIDIA A40 GPUs to train, as opposed to OpenAI’s use of a CPU cluster composed of 400 servers with 32 CPU-cores each, as well as 32 NVIDIA V100 GPUs"
            - generic [ref=e154]:
              - text: OpenAI et al. (
              - link "2019" [ref=e155] [cursor=pointer]:
                - /url: "#bib.bib8"
              - text: )
            - text: "(compute requirements for block reorientation). Our more affordable hand, in combination with the simple vision system architecture and accessible compute, dramatically simplifies the process of developing and deploying agile and dexterous manipulation. We summarise our contributions below:"
          - list [ref=e157]:
            - listitem [ref=e158]:
              - text: •
              - paragraph [ref=e160]:
                - text: We demonstrate a system for learning-based dexterous in-hand manipulation that uses low-cost hardware (one order of magnitude less expensive than
                - generic [ref=e161]:
                  - text: OpenAI et al. (
                  - link "2018" [ref=e162] [cursor=pointer]:
                    - /url: "#bib.bib1"
                  - text: )
                - text: ), uses a purely vision-based pipeline, sets more diverse pose targets, uses orders-of-magnitude cheaper compute, and offers further insights into this problem with detailed ablations.
            - listitem [ref=e163]:
              - text: •
              - paragraph [ref=e165]:
                - text: We develop a highly robust pose estimator trained entirely in simulation which works through heavy occlusions and in a variety of robotic settings e.g.
                - link "https://www.youtube.com/watch?v=-MTsm0Uh_5o" [ref=e166] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=-MTsm0Uh_5o
                - text: .
            - listitem [ref=e167]:
              - text: •
              - paragraph [ref=e169]:
                - text: While not directly comparable to
                - generic [ref=e170]:
                  - text: OpenAI et al. (
                  - link "2018" [ref=e171] [cursor=pointer]:
                    - /url: "#bib.bib1"
                  - text: )
                - text: due to different hardware, our purely vision-based state estimation results not only outperform their best vision-based results, but also fare comparably to their marker-based results.
            - listitem [ref=e172]:
              - text: •
              - paragraph [ref=e174]: We will also release both our vision and RL pipelines for reproducibility. We seek to provide a much broader segment of the research community with access to a novel state-of-the-art in-hand manipulation system in hopes of catalyzing further studies and advances.
