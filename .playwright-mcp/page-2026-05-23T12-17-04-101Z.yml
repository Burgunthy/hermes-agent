                - text: )
              - text: ", we observe a large range of different behaviours in the policies deployed on the real robot. Our real-world quantitative results measuring average consecutive successes are illustrated in Table"
              - link "7" [ref=e2927] [cursor=pointer]:
                - /url: "#S3.T7"
              - text: . We collect 10 trials for each policy to obtain the average consecutive successes and also collect different sets of trials across different days to understand the inter-day variability that may arise due to different dynamics, temperature, and lighting conditions. We believe such inter-day variations are important to benchmark in robotics
              - generic [ref=e2928]:
