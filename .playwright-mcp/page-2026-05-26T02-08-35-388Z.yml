              - generic [ref=e117]: 2026.03.06.
              - text: 스윙 트레이딩(Swing Trading) 은 수일~수주 단위로 포지션을 보유하며 중기 가격 움직임(스윙)을 노리는 매매 전략입니다. 일반적으로 4시간봉~일봉을 주로 활용하며, 하루에 수십 번 거래하는 스캘핑과 수개월~수년을 보유하는 장기투자의 중간에 위치합니다. 직장인이나 전업 트레이더가 아닌 분들에게 특히 적합합니다. 하루 1~2번 차트를 확인하고 포지션을 관리하면 되기 때문...
            - generic [ref=e121]: 구분 스캘핑 스윙 트레이딩 장기 투자 보유 기간 수초~수분 수일~수주 수개월~수년 목표 수익 0.1~1% 5~30% 100%+ 타임프레임 1분~5분봉 4시간~일봉 주봉~월봉 필요 시간 하루 종일 하루 1~2회 주 1회 스트레스 극심 중간 낮음
            - generic [ref=e125]: "일봉(1D) : 스윙 트레이딩의 핵심 타임프레임. 전체 방향과 주요 지지·저항 파악 4시간봉(4H) : 진입 타이밍 포착. 일봉 방향과 일치하는 4시간봉 신호만 진입 1시간봉(1H) : 더 정밀한 진입 타이밍 확인용 핵심 원칙: 상위 타임프레임(일봉)에서 방향을 확인하고, 하위 타임프레임(4시간봉)에서 진입 타이밍을 잡습니다."
            - generic [ref=e129]: EMA 200 — 장기 추세 판단 일봉 EMA200 위에서만 롱 포지션, 아래에서는 숏 포지션을 원칙으로 합니다. EMA200은 장기 상승장·하락장의 경계선입니다. RSI (14) — 과매수·과매도 일봉 RSI 40~60 구간에서의 돌파가 스윙 진입 신호로 자주 활용됩니다. 일봉 RSI 30 이하는 강한 매수 기회, 70 이상은 익절 구간입니다. MACD — 추세 전환 일봉 MACD 골든크로스 + 0선 상향 돌파는 강한 스윙 롱 신호...
            - generic [ref=e133]: 풀백(Pullback) 진입 — 가장 안전한 방법 상승 추세에서 가격이 EMA50 또는 주요 지지선까지 되돌아올 때 롱 진입 하락 추세에서 가격이 EMA50 또는 주요 저항선까지 반등할 때 숏 진입 리스크 대비 보상 비율(R:R)이 1:2 이상일 때만 진입 돌파(Breakout) 진입 주요 저항선을 거래량 급증과 함께 돌파할 때 롱 진입 돌파 후 재테스트(저항이 지지로 전환) 확인 후 진입이 더 안전
            - generic [ref=e137]: 전략 1 — 반감기 사이클 스윙 비트코인 반감기 후 6~18개월이 역사적으로 강한 상승 구간입니다. 이 구간에서는 풀백 시마다 롱을 추가하는 전략이 효과적입니다. 공포탐욕지수 30 이하, 김프 역프 구간이 최적 진입 기회입니다. 전략 2 — 김프+공포탐욕지수 조합 스윙 역프 + 공포탐욕지수 25 이하 + 일봉 RSI 35 이하 → 스윙 롱 진입 김프 +5%+ + 공포탐욕지수 80+ + 일봉 RSI 70+ → 스윙...
            - generic [ref=e141]: "손절 설정 : 진입 즉시 설정. 일반적으로 진입가 대비 3~7% 수준 레버리지 : 스윙에는 3~10배 권장. 높은 레버리지는 작은 조정에도 청산 위험 포지션 크기 : 한 포지션에 계좌의 10~20% 이하 분할 진입·청산 : 한 번에 전량 진입보다 2~3회 분할이 리스크 분산 FOMC 전 포지션 관리 : 주요 경제 이벤트 전날 손절을 타이트하게 설정하거나 포지션 축소"
            - generic [ref=e145]: "스윙 트레이딩에서 김프와 공포탐욕지수는 거시적 진입·청산 타이밍을 잡는 데 매우 유용합니다: 역프 + 공포탐욕지수 25 이하: 중기 바닥 가능성 높음 → 스윙 롱 시작 김프 +5%+, 공포탐욕지수 80+: 중기 고점 경계 → 스윙 익절 시작 시그빗에서 두 지표를 실시간으로 무료 확인"
