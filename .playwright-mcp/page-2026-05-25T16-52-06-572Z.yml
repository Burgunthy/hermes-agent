        - paragraph [ref=e155]:
          - text: Building on
          - link "Mistral Small 3" [ref=e156] [cursor=pointer]:
            - /url: https://ollama.com/library/mistral-small
          - text: ", this new model comes with improved text performance, multimodal understanding, and an expanded context window of up to 128k tokens. The model outperforms comparable models like Gemma 3 and GPT-4o Mini, while delivering inference speeds of 150 tokens per second."
        - paragraph [ref=e157]: Mistral Small 3.1 is released under an Apache 2.0 license.
        - heading "Key features and capabilities" [level=2] [ref=e158]
        - list [ref=e159]:
          - listitem [ref=e160]:
            - paragraph [ref=e161]: "Lightweight: Mistral Small 3.1 can run on a single RTX 4090 or a Mac with 32GB RAM. This makes it a great fit for on-device use cases."
          - listitem [ref=e162]:
            - paragraph [ref=e163]: "Fast-response conversational assistance: Ideal for virtual assistants and other applications where quick, accurate responses are essential."
          - listitem [ref=e164]:
            - paragraph [ref=e165]: "Low-latency function calling: Capable of rapid function execution within automated or agentic workflows"
          - listitem [ref=e166]:
            - paragraph [ref=e167]: "Fine-tuning for specialized domains: Mistral Small 3.1 can be fine-tuned to specialize in specific domains, creating accurate subject matter experts. This is particularly useful in fields like legal advice, medical diagnostics, and technical support."
          - listitem [ref=e168]:
            - paragraph [ref=e169]: "Foundation for advanced reasoning: We continue to be impressed by how the community builds on top of open Mistral models. Just in the last few weeks, we have seen several excellent reasoning models built on Mistral Small 3, such as the DeepHermes 24B by Nous Research. To that end, we are releasing both base and instruct checkpoints for Mistral Small 3.1 to enable further downstream customization of the model."
        - heading "References" [level=2] [ref=e170]
