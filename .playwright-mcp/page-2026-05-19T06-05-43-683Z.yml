            - emphasis [ref=e86]: BULL,
            - text: BEAR,
            - emphasis [ref=e87]: UP,
            - text: DOWN etc).
          - paragraph [ref=e88]: Ensure that you don't override any variables in you config.json. Especially the timeframe (must be 5m).
