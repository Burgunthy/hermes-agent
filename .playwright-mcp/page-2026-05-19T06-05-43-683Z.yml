          - paragraph [ref=e82]: For optimal performance, suggested to use between 6 and 12 open trades, with unlimited stake.
          - paragraph [ref=e83]: A pairlist with 40 to 80 pairs. Volume pairlist works well.
          - paragraph [ref=e84]: Prefer stable coin (USDT, USDC etc) pairs, instead of BTC or ETH pairs.
