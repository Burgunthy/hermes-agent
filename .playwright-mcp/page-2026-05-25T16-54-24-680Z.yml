          - listitem [ref=e189]: Question-answering
          - listitem [ref=e190]: Retrieval Augmented Generation (RAG)
          - listitem [ref=e191]: Code related tasks
          - listitem [ref=e192]: Function-calling tasks
          - listitem [ref=e193]: Multilingual dialog use cases
          - listitem [ref=e194]: Fill-In-the-Middle (FIM) code completions
