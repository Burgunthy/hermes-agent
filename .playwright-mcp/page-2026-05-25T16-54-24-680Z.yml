      - generic [ref=e155]:
        - paragraph [ref=e156]:
          - img [ref=e157]
        - heading "Granite 4 models" [level=3] [ref=e158]
        - paragraph [ref=e159]: Granite 4.1 language models are a family of state-of-the-art open foundation models featuring dense decoder-only architectures in three sizes — 3B, 8B, and 30B. They natively support multilingual capabilities, a wide range of coding tasks, retrieval-augmented generation (RAG), tool usage, and structured JSON output.
        - paragraph [ref=e160]: Our models are trained from scratch on approximately 15 trillion tokens through a five-phase strategy designed to progressively refine data quality and model capabilities. The first two phases cover pre-training proper, before transitioning into mid-training in Phases 3 and 4 with high-quality data annealing. The fifth and final phase performs long-context extension, scaling the context window up to 512K tokens through a staged process.
        - paragraph [ref=e161]: All models are publicly released under the Apache 2.0 license, allowing free use for both research and commercial purposes. The data curation and training processes were specifically designed for enterprise scenarios and customization, incorporating governance, risk, and compliance (GRC) evaluations alongside IBM’s standard data clearance and document quality review procedures.
        - paragraph [ref=e162]: We provide both base models (checkpoints after pre-training) and instruct models (checkpoints fine-tuned for dialogue, instruction following, helpfulness, and safety).
        - list [ref=e163]:
          - listitem [ref=e164]:
            - emphasis [ref=e165]:
              - text: Please note that
              - code [ref=e166]: instruct
              - text: models do not have the
              - code [ref=e167]: base
              - text: qualifier in their name (e.g.,
              - code [ref=e168]: ibm-granite/granite4.1:8b
              - text: vs.
              - code [ref=e169]: ibm-granite/granite4.1:8b-base
              - text: ).
        - heading "Running" [level=4] [ref=e170]
        - paragraph [ref=e171]:
          - text: Example of running the default model (i.e., typically, this is the
          - code [ref=e172]: Q4_K_M
          - text: "quantization):"
        - code [ref=e174]: ollama run ibm/granite4.1:8b
        - paragraph [ref=e175]:
          - text: To run other quantizations (e.g.,
          - code [ref=e176]: Q8_0
          - text: "):"
        - code [ref=e178]: ollama run ibm/granite4.1:8b-q8_0
        - heading "Supported Languages" [level=4] [ref=e179]
        - paragraph [ref=e180]: "Supported Languages: English, German, Spanish, French, Japanese, Portuguese, Arabic, Czech, Italian, Korean, Dutch, and Chinese. Users may finetune Granite 4.1 models for languages beyond these languages."
        - heading "Intended Use" [level=4] [ref=e181]
        - paragraph [ref=e182]: This model is designed to handle general instruction-following tasks and can be integrated into AI assistants across various domains, including business applications.
        - paragraph [ref=e183]: The model is designed to respond to general instructions and can be used to build AI assistants for multiple domains, including business applications.
        - heading "Capabilities" [level=4] [ref=e184]
        - list [ref=e185]:
