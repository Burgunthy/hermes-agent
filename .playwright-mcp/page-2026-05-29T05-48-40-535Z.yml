                    - paragraph [ref=e5476]:
                      - strong [ref=e5477]: "Release Date:"
                      - text: April 3, 2026
                    - blockquote [ref=e5478]:
                      - paragraph [ref=e5479]: The resilience release — pluggable memory providers, credential pool rotation, Camofox anti-detection browser, inline diff previews, gateway hardening across race conditions and approval routing, and deep security fixes across 168 PRs and 46 resolved issues.
                    - separator [ref=e5480]
                    - heading "✨ Highlights" [level=2] [ref=e5481]
                    - list [ref=e5482]:
                      - listitem [ref=e5483]:
                        - paragraph [ref=e5484]:
                          - strong [ref=e5485]: Pluggable Memory Provider Interface
                          - text: — Memory is now an extensible plugin system. Third-party memory backends (Honcho, vector stores, custom DBs) implement a simple provider ABC and register via the plugin system. Built-in memory is the default provider. Honcho integration restored to full parity as the reference plugin with profile-scoped host/peer resolution. (
                          - link "#4623" [ref=e5486] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4623
                          - text: ","
                          - link "#4616" [ref=e5487] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4616
                          - text: ","
                          - link "#4355" [ref=e5488] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4355
                          - text: )
                      - listitem [ref=e5489]:
                        - paragraph [ref=e5490]:
                          - strong [ref=e5491]: Same-Provider Credential Pools
                          - text: — Configure multiple API keys for the same provider with automatic rotation. Thread-safe
                          - code [ref=e5492]: least_used
                          - text: strategy distributes load across keys, and 401 failures trigger automatic rotation to the next credential. Set up via the setup wizard or
                          - code [ref=e5493]: credential_pool
                          - text: config. (
                          - link "#4188" [ref=e5494] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4188
                          - text: ","
                          - link "#4300" [ref=e5495] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4300
                          - text: ","
                          - link "#4361" [ref=e5496] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4361
                          - text: )
                      - listitem [ref=e5497]:
                        - paragraph [ref=e5498]:
                          - strong [ref=e5499]: Camofox Anti-Detection Browser Backend
                          - text: — New local browser backend using Camoufox for stealth browsing. Persistent sessions with VNC URL discovery for visual debugging, configurable SSRF bypass for local backends, auto-install via
                          - code [ref=e5500]: hermes tools
                          - text: . (
                          - link "#4008" [ref=e5501] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4008
                          - text: ","
