                          - text: )
                      - listitem [ref=e5509]:
                        - paragraph [ref=e5510]:
                          - strong [ref=e5511]: API Server Session Continuity & Tool Streaming
                          - text: — The API server (Open WebUI integration) now streams tool progress events in real-time and supports
                          - code [ref=e5512]: X-Hermes-Session-Id
                          - text: headers for persistent sessions across requests. Sessions persist to the shared SessionDB. (
                          - link "#4092" [ref=e5513] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4092
                          - text: ","
