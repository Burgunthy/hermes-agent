                          - text: —
                          - link "@kshitijk4poor" [ref=e3856] [cursor=pointer]:
                            - /url: https://github.com/kshitijk4poor
                          - text: + Teknium)
                      - listitem [ref=e3857]:
                        - paragraph [ref=e3858]:
                          - strong [ref=e3859]: Five new inference paths
                          - text: — Native NVIDIA NIM (
                          - link "#11774" [ref=e3860] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/11774
                          - text: ), Arcee AI (
                          - link "#9276" [ref=e3861] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/9276
                          - text: ), Step Plan (
                          - link "#13893" [ref=e3862] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13893
                          - text: ), Google Gemini CLI OAuth (
                          - link "#11270" [ref=e3863] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/11270
                          - text: ), and Vercel ai-gateway with pricing + dynamic discovery (
                          - link "#13223" [ref=e3864] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13223
                          - text: —
                          - link "@jerilynzheng" [ref=e3865] [cursor=pointer]:
                            - /url: https://github.com/jerilynzheng
                          - text: ). Plus Gemini routed through the native AI Studio API for better performance (
                          - link "#12674" [ref=e3866] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/12674
                          - text: ).
                      - listitem [ref=e3867]:
                        - paragraph [ref=e3868]:
                          - strong [ref=e3869]: GPT-5.5 over Codex OAuth
                          - text: — OpenAI's new GPT-5.5 reasoning model is now available through your ChatGPT Codex OAuth, with live model discovery wired into the model picker so new OpenAI releases show up without catalog updates. (
                          - link "#14720" [ref=e3870] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/14720
                          - text: )
                      - listitem [ref=e3871]:
                        - paragraph [ref=e3872]:
                          - strong [ref=e3873]: QQBot — 17th supported platform
                          - text: — Native QQBot adapter via QQ Official API v2, with QR scan-to-configure setup wizard, streaming cursor, emoji reactions, and DM/group policy gating that matches WeCom/Weixin parity. (
                          - link "#9364" [ref=e3874] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/9364
                          - text: ","
                          - link "#11831" [ref=e3875] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/11831
                          - text: )
                      - listitem [ref=e3876]:
                        - paragraph [ref=e3877]:
                          - strong [ref=e3878]: Plugin surface expanded
                          - text: — Plugins can now register slash commands (
                          - code [ref=e3879]: register_command
                          - text: ), dispatch tools directly (
                          - code [ref=e3880]: dispatch_tool
                          - text: ), block tool execution from hooks (
                          - code [ref=e3881]: pre_tool_call
                          - text: can veto), rewrite tool results (
                          - code [ref=e3882]: transform_tool_result
                          - text: ), transform terminal output (
                          - code [ref=e3883]: transform_terminal_output
                          - text: ), ship image_gen backends, and add custom dashboard tabs. The bundled disk-cleanup plugin is opt-in by default as a reference implementation. (
                          - link "#9377" [ref=e3884] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/9377
