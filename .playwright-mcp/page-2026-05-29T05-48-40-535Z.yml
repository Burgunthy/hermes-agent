                    - separator [ref=e1321]
                    - heading "✨ Highlights" [level=2] [ref=e1322]
                    - list [ref=e1323]:
                      - listitem [ref=e1324]:
                        - paragraph [ref=e1325]:
                          - strong [ref=e1326]: xAI Grok via SuperGrok OAuth — and grok-4.3 jumps to a 1M context window
                          - text: — If you pay for SuperGrok, you can now use Grok inside Hermes by signing in with your xAI account — no API key, no separate billing. The wire-through also bumps grok-4.3 to a 1M token context window, so you can drop whole codebases or research corpora into a single prompt. Includes proper handling for entitlement errors and an SSH-to-tunnel docs page for when you're SSH'd into a remote box and need to complete the OAuth flow. (
                          - link "#26534" [ref=e1327] [cursor=pointer]:
