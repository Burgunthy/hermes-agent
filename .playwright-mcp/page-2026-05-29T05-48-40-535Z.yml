                  - generic [ref=e3821]:
                    - heading "Hermes Agent v0.11.0 (v2026.4.23)" [level=1] [ref=e3822]
                    - paragraph [ref=e3823]:
                      - strong [ref=e3824]: "Release Date:"
                      - text: April 23, 2026
                      - strong [ref=e3825]: "Since v0.9.0:"
                      - text: 1,556 commits · 761 merged PRs · 1,314 files changed · 224,174 insertions · 29 community contributors (290 including co-authors)
                    - blockquote [ref=e3826]:
                      - paragraph [ref=e3827]: The Interface release — a full React/Ink rewrite of the interactive CLI, a pluggable transport architecture underneath every provider, native AWS Bedrock support, five new inference paths, a 17th messaging platform (QQBot), a dramatically expanded plugin surface, and GPT-5.5 via Codex OAuth.
                    - paragraph [ref=e3828]: This release also folds in all the highlights deferred from v0.10.0 (which shipped only the Nous Tool Gateway) — so it covers roughly two weeks of work across the whole stack.
                    - separator [ref=e3829]
                    - heading "✨ Highlights" [level=2] [ref=e3830]
                    - list [ref=e3831]:
                      - listitem [ref=e3832]:
                        - paragraph [ref=e3833]:
                          - strong [ref=e3834]: New Ink-based TUI
                          - text: —
                          - code [ref=e3835]: hermes --tui
                          - text: is now a full React/Ink rewrite of the interactive CLI, with a Python JSON-RPC backend (
                          - code [ref=e3836]: tui_gateway
                          - text: ). Sticky composer, live streaming with OSC-52 clipboard support, stable picker keys, status bar with per-turn stopwatch and git branch,
                          - code [ref=e3837]: /clear
                          - text: confirm, light-theme preset, and a subagent spawn observability overlay. ~310 commits to
                          - code [ref=e3838]: ui-tui/
                          - text: +
                          - code [ref=e3839]: tui_gateway/
                          - text: . (
                          - link "@OutThisLife" [ref=e3840] [cursor=pointer]:
                            - /url: https://github.com/OutThisLife
                          - text: + Teknium)
                      - listitem [ref=e3841]:
                        - paragraph [ref=e3842]:
                          - strong [ref=e3843]: Transport ABC + Native AWS Bedrock
                          - text: — Format conversion and HTTP transport were extracted from
                          - code [ref=e3844]: run_agent.py
                          - text: into a pluggable
                          - code [ref=e3845]: agent/transports/
                          - text: layer.
                          - code [ref=e3846]: AnthropicTransport
                          - text: ","
                          - code [ref=e3847]: ChatCompletionsTransport
                          - text: ","
                          - code [ref=e3848]: ResponsesApiTransport
                          - text: ", and"
                          - code [ref=e3849]: BedrockTransport
                          - text: each own their own format conversion and API shape. Native AWS Bedrock support via the Converse API ships on top of the new abstraction. (
                          - link "#10549" [ref=e3850] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/10549
                          - text: ","
                          - link "#13347" [ref=e3851] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13347
                          - text: ","
                          - link "#13366" [ref=e3852] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13366
                          - text: ","
