                      - text: April 30, 2026
                      - strong [ref=e2965]: "Since v0.11.0:"
                      - text: 1,096 commits · 550 merged PRs · 1,270 files changed · 217,776 insertions · 213 community contributors (including co-authors)
                    - blockquote [ref=e2966]:
                      - paragraph [ref=e2967]: The Curator release — Hermes Agent now maintains itself. An autonomous background Curator grades, prunes, and consolidates your skill library on its own schedule. The self-improvement loop that reviews what to save got a substantial upgrade. Four new inference providers, a 18th messaging platform, a 19th via Teams plugin, native Spotify + Google Meet integrations, ComfyUI and TouchDesigner-MCP moved from optional to bundled-by-default, and a ~57% cut to visible TUI cold start.
                    - separator [ref=e2968]
                    - heading "✨ Highlights" [level=2] [ref=e2969]
                    - list [ref=e2970]:
                      - listitem [ref=e2971]:
                        - paragraph [ref=e2972]:
                          - strong [ref=e2973]: Autonomous Curator
                          - text: —
                          - code [ref=e2974]: hermes curator
                          - text: runs as a background agent on the gateway's cron ticker (7-day cycle default). It grades your skill library, consolidates related skills, prunes dead ones, and writes per-run reports to
                          - code [ref=e2975]: logs/curator/run.json
                          - text: +
                          - code [ref=e2976]: REPORT.md
                          - text: . Archived skills are classified consolidated-vs-pruned via model + heuristic. Defense-in-depth gates protect bundled/hub skills from mutation. Unified under
                          - code [ref=e2977]: auxiliary.curator
                          - text: — pick the curator's model in
                          - code [ref=e2978]: hermes model
                          - text: ", manage it from the dashboard."
                          - code [ref=e2979]: hermes curator status
                          - text: ranks skills by usage (most-used / least-used). (
