                    - heading "Hermes Agent v0.15.1 (v2026.5.29)" [level=1] [ref=e189]
                    - paragraph [ref=e190]:
                      - strong [ref=e191]: "Release Date:"
                      - text: May 29, 2026
                      - strong [ref=e192]: "Since v0.15.0:"
                      - text: 28 commits · 21 merged PRs · hotfix release · 9 contributors
                    - blockquote [ref=e193]:
                      - paragraph [ref=e194]:
                        - strong [ref=e195]: The Patch Release.
                        - text: "A same-day hotfix for v0.15.0. Headline fix: the dashboard infinite-reload loop that hit anyone running v0.15.0 in loopback mode (Docker, hosted Hermes, fresh installs). A handful of other v0.15.0 follow-ups go along for the ride — kanban worker SIGTERM,"
                        - code [ref=e196]: /model
                        - text: picker unification,
                        - code [ref=e197]: /yolo
                        - text: session bypass, the full 19,932-entry skills.sh catalog,
                        - code [ref=e198]: .md
                        - text: media delivery restoration, gateway probe-stepdown safety, web-URL redaction passthrough, kanban worker vision on referenced images, hindsight observation-default. Docker users get an explicit
                        - code [ref=e199]: "--insecure"
                        - text: opt-in env var (no more bind-host inference), MCP server bare-command PATH resolution, and arm64 PR-build cache fixes.
                    - separator [ref=e200]
                    - heading "✨ Highlights" [level=2] [ref=e201]
                    - list [ref=e202]:
                      - listitem [ref=e203]:
                        - paragraph [ref=e204]:
                          - strong [ref=e205]: Dashboard 401 reload loop fixed
                          - text: — In loopback mode the dashboard's identity probe (
                          - code [ref=e206]: /api/auth/me
                          - text: ") returns 401 by design, but v0.15.0's stale-token reload guard treated every 401 as a rotated session token and full-page-reloaded to pick up a fresh one. Every successful sibling call cleared the one-shot reload guard, so the page reload-looped forever (Firefox: \"Navigated to /sessions\" storm; Chrome: React re-render storm). Fix adds an"
                          - code [ref=e207]: allowUnauthorized
                          - text: opt-out to
                          - code [ref=e208]: fetchJSON
                          - text: that skips only the loopback stale-token reload — 401 still throws so
                          - code [ref=e209]: AuthWidget
                          - text: swallows it, gated-mode
                          - code [ref=e210]: login_url
                          - text: redirects are unaffected. Closes
                          - link "#34206" [ref=e211] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/issues/34206
                          - text: ","
                          - link "#34202" [ref=e212] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/issues/34202
                          - text: . (
                          - link "#30698" [ref=e213] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/30698
                          - text: —
                          - link "@austinpickett" [ref=e214] [cursor=pointer]:
                            - /url: https://github.com/austinpickett
                          - text: )
                      - listitem [ref=e215]:
                        - paragraph [ref=e216]:
                          - strong [ref=e217]:
                            - text: Docker dashboard
                            - code [ref=e218]: "--insecure"
                            - text: is now an explicit env opt-in, never derived from bind host
                          - text: — Previously the Docker entrypoint inferred
                          - code [ref=e219]: "--insecure"
                          - text: "when the dashboard bound to a non-loopback host. That conflated \"I want LAN access\" with \"I want to disable the same-origin guard.\" The fix splits them: bind host is bind host, and disabling the dashboard's loopback auth requires an explicit"
                          - code [ref=e220]: HERMES_DASHBOARD_INSECURE=1
                          - text: . Existing setups that genuinely wanted insecure binding must now set the env var. (
                          - link "#34188" [ref=e221] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/34188
                          - text: ","
                          - link "#34204" [ref=e222] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/34204
                          - text: —
                          - link "@benbarclay" [ref=e223] [cursor=pointer]:
                            - /url: https://github.com/benbarclay
                          - text: )
                      - listitem [ref=e224]:
                        - paragraph [ref=e225]:
                          - strong [ref=e226]: MCP bare command resolution under Docker
                          - text: — MCP servers configured with bare commands (
                          - code [ref=e227]: npx
                          - text: ","
                          - code [ref=e228]: npm
                          - text: ","
                          - code [ref=e229]: node
                          - text: ) now resolve against
                          - code [ref=e230]: /usr/local/bin
                          - text: so they actually launch inside the Docker image where those binaries live. v0.15.0 left these failing silently in containers when the agent's effective PATH didn't include the Node toolchain location. (
                          - link "#34186" [ref=e231] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/34186
                          - text: —
                          - link "@benbarclay" [ref=e232] [cursor=pointer]:
                            - /url: https://github.com/benbarclay
                          - text: )
                      - listitem [ref=e233]:
                        - paragraph [ref=e234]:
                          - strong [ref=e235]: Skills page sidebar / source pills restored
                          - text: — A stale
                          - code [ref=e236]: useMemo
                          - text: dependency in the new dashboard skills page collapsed the source pills and category sidebar to "All" only. Fixed; both surfaces now reflect the live catalog state. (
                          - link "#34194" [ref=e237] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/34194
                          - text: )
                      - listitem [ref=e238]:
                        - paragraph [ref=e239]:
                          - strong [ref=e240]: Kanban worker can be killed again
                          - text: —
                          - code [ref=e241]: SIGTERM
                          - text: on a kanban worker was being absorbed by an intermediate process and the worker stayed running. Closes
                          - link "#28181" [ref=e242] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/issues/28181
                          - text: . (
