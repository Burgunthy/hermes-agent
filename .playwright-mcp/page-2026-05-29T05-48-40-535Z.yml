                          - text: )
                      - listitem [ref=e4868]:
                        - paragraph [ref=e4869]:
                          - strong [ref=e4870]:
                            - code [ref=e4871]: hermes backup
                            - text: "&"
                            - code [ref=e4872]: hermes import
                          - text: — Full backup and restore of your Hermes configuration, sessions, skills, and memory. Migrate between machines or create snapshots before major changes. (
                          - link "#7997" [ref=e4873] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7997
                          - text: )
                      - listitem [ref=e4874]:
                        - paragraph [ref=e4875]:
                          - strong [ref=e4876]: 16 Supported Platforms
                          - text: — With BlueBubbles (iMessage) and WeChat joining Telegram, Discord, Slack, WhatsApp, Signal, Matrix, Email, SMS, DingTalk, Feishu, WeCom, Mattermost, Home Assistant, and Webhooks, Hermes now runs on 16 messaging platforms out of the box.
