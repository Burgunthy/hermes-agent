                          - text: )
                      - listitem [ref=e5516]:
                        - paragraph [ref=e5517]:
                          - strong [ref=e5518]: "ACP: Client-Provided MCP Servers"
                          - text: — Editor integrations (VS Code, Zed, JetBrains) can now register their own MCP servers, which Hermes picks up as additional agent tools. Your editor's MCP ecosystem flows directly into the agent. (
