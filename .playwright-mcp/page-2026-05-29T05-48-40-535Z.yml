                  - generic [ref=e4803]:
                    - heading "Hermes Agent v0.9.0 (v2026.4.13)" [level=1] [ref=e4804]
                    - paragraph [ref=e4805]:
                      - strong [ref=e4806]: "Release Date:"
                      - text: April 13, 2026
                      - strong [ref=e4807]: "Since v0.8.0:"
                      - text: 487 commits · 269 merged PRs · 167 resolved issues · 493 files changed · 63,281 insertions · 24 contributors
                    - blockquote [ref=e4808]:
                      - paragraph [ref=e4809]: The everywhere release — Hermes goes mobile with Termux/Android, adds iMessage and WeChat, ships Fast Mode for OpenAI and Anthropic, introduces background process monitoring, launches a local web dashboard for managing your agent, and delivers the deepest security hardening pass yet across 16 supported platforms.
                    - separator [ref=e4810]
                    - heading "✨ Highlights" [level=2] [ref=e4811]
                    - list [ref=e4812]:
                      - listitem [ref=e4813]:
                        - paragraph [ref=e4814]:
                          - strong [ref=e4815]: Local Web Dashboard
                          - text: — A new browser-based dashboard for managing your Hermes Agent locally. Configure settings, monitor sessions, browse skills, and manage your gateway — all from a clean web interface without touching config files or the terminal. The easiest way to get started with Hermes.
                      - listitem [ref=e4816]:
                        - paragraph [ref=e4817]:
                          - strong [ref=e4818]:
                            - text: Fast Mode (
                            - code [ref=e4819]: /fast
                            - text: )
                          - text: — Priority processing for OpenAI and Anthropic models. Toggle
                          - code [ref=e4820]: /fast
                          - text: to route through priority queues for significantly lower latency on supported models (GPT-5.4, Codex, Claude). Expands across all OpenAI Priority Processing models and Anthropic's fast tier. (
                          - link "#6875" [ref=e4821] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6875
                          - text: ","
                          - link "#6960" [ref=e4822] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6960
                          - text: ","
                          - link "#7037" [ref=e4823] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7037
                          - text: )
                      - listitem [ref=e4824]:
                        - paragraph [ref=e4825]:
                          - strong [ref=e4826]: iMessage via BlueBubbles
                          - text: — Full iMessage integration through BlueBubbles, bringing Hermes to Apple's messaging ecosystem. Auto-webhook registration, setup wizard integration, and crash resilience. (
                          - link "#6437" [ref=e4827] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6437
                          - text: ","
                          - link "#6460" [ref=e4828] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6460
                          - text: ","
                          - link "#6494" [ref=e4829] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6494
                          - text: )
                      - listitem [ref=e4830]:
                        - paragraph [ref=e4831]:
                          - strong [ref=e4832]: WeChat (Weixin) & WeCom Callback Mode
                          - text: — Native WeChat support via iLink Bot API and a new WeCom callback-mode adapter for self-built enterprise apps. Streaming cursor, media uploads, markdown link handling, and atomic state persistence. Hermes now covers the Chinese messaging ecosystem end-to-end. (
                          - link "#7166" [ref=e4833] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7166
                          - text: ","
                          - link "#7943" [ref=e4834] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7943
                          - text: )
                      - listitem [ref=e4835]:
                        - paragraph [ref=e4836]:
                          - strong [ref=e4837]: Termux / Android Support
                          - text: — Run Hermes natively on Android via Termux. Adapted install paths, TUI optimizations for mobile screens, voice backend support, and the
                          - code [ref=e4838]: /image
                          - text: command work on-device. (
                          - link "#6834" [ref=e4839] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6834
                          - text: )
                      - listitem [ref=e4840]:
                        - paragraph [ref=e4841]:
                          - strong [ref=e4842]:
                            - text: Background Process Monitoring (
                            - code [ref=e4843]: watch_patterns
                            - text: )
                          - text: — Set patterns to watch for in background process output and get notified in real-time when they match. Monitor for errors, wait for specific events ("listening on port"), or watch build logs — all without polling. (
                          - link "#7635" [ref=e4844] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7635
                          - text: )
                      - listitem [ref=e4845]:
                        - paragraph [ref=e4846]:
                          - strong [ref=e4847]: Native xAI & Xiaomi MiMo Providers
                          - text: — First-class provider support for xAI (Grok) and Xiaomi MiMo, with direct API access, model catalogs, and setup wizard integration. Plus Qwen OAuth with portal request support. (
                          - link "#7372" [ref=e4848] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7372
                          - text: ","
                          - link "#7855" [ref=e4849] [cursor=pointer]:
