                    - paragraph [ref=e2096]:
                      - strong [ref=e2097]: "Release Date:"
                      - text: May 7, 2026
                      - strong [ref=e2098]: "Since v0.12.0:"
                      - text: 864 commits · 588 merged PRs · 829 files changed · 128,366 insertions · 282 issues closed (13 P0, 36 P1) · 295 community contributors (including co-authors)
                    - blockquote [ref=e2099]:
                      - paragraph [ref=e2100]:
                        - text: The Tenacity Release — Hermes Agent now finishes what it starts. Kanban ships as a durable multi-agent board (heartbeat, reclaim, zombie detection, auto-block on incomplete exit, per-task retries, hallucination recovery).
                        - code [ref=e2101]: /goal
                        - text: keeps the agent locked on a target across turns (Ralph loop). Checkpoints v2 rewrites state persistence with real pruning. Gateway auto-resumes interrupted sessions after restart. Cron grows a
                        - code [ref=e2102]: no_agent
                        - text: watchdog mode. A security wave closes 8 P0s — redaction is now ON by default, Discord role-allowlists are guild-scoped, WhatsApp rejects strangers by default, and TOCTOU windows close across auth.json and MCP OAuth. Google Chat becomes the 20th platform. Providers become a pluggable surface. Seven i18n locales ship.
