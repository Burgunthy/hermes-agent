                      - listitem [ref=e579]:
                        - paragraph [ref=e580]:
                          - strong [ref=e581]:
                            - code [ref=e582]: session_search
                            - text: rebuilt — no LLM, no cost, 4,500× faster
                          - text: — The old
                          - code [ref=e583]: session_search
                          - text: was an aux-LLM-powered tool that cost ~$0.30/call and took ~30 seconds to summarize three sessions, sometimes confabulating when the right session wasn't even in the FTS5 hit list. The new shape is one tool with three modes (discovery, scroll, browse) inferred from which args are set — no
                          - code [ref=e584]: mode
                          - text: parameter, no aux-LLM, no config knob, no companion skill. Discovery is ~20ms instead of ~90s; scroll is ~1ms. Searching your past sessions for context is now free and instant. (
                          - link "#27590" [ref=e585] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/27590
                          - text: )
                      - listitem [ref=e586]:
                        - paragraph [ref=e587]:
                          - strong [ref=e588]: Promptware defense — Brainworm-class attacks blocked at three chokepoints
                          - text: — Inspired by recent Brainworm / Promptware Kill Chain research (Origin HQ, arxiv 2601.09625), Hermes now defends the context window against prompt-injection attacks that try to hijack the agent via tool output, recalled memory, or stored skills. Single source of truth (
                          - code [ref=e589]: tools/threat_patterns.py
                          - text: ) with ~15 new Brainworm/C2 patterns; recalled memory is scanned at load time; tool results get delimiter markers so a malicious file or remote service can't impersonate Hermes' own system content. Paired with a new
                          - code [ref=e590]: security-guidance
                          - text: plugin that pattern-matches dangerous code writes. (
                          - link "#32269" [ref=e591] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/32269
                          - text: ","
                          - link "#33131" [ref=e592] [cursor=pointer]:
