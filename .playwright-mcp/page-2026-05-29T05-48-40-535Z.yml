                        - paragraph [ref=e1399]:
                          - strong [ref=e1400]: Two new messaging platforms — LINE + SimpleX Chat
                          - text: — LINE is huge in Japan, Korea, and Taiwan, and now Hermes runs natively on the LINE Messaging API. SimpleX Chat is the privacy-focused decentralized messenger with no user IDs — also wired up as a first-class platform. That brings Hermes to 22 messaging platforms total, so wherever you and your team chat, the agent can be there. (
