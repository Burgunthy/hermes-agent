                          - text: )
                      - listitem [ref=e4850]:
                        - paragraph [ref=e4851]:
                          - strong [ref=e4852]: Pluggable Context Engine
                          - text: — Context management is now a pluggable slot via
                          - code [ref=e4853]: hermes plugins
                          - text: . Swap in custom context engines that control what the agent sees each turn — filtering, summarization, or domain-specific context injection. (
                          - link "#7464" [ref=e4854] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/7464
                          - text: )
                      - listitem [ref=e4855]:
                        - paragraph [ref=e4856]:
                          - strong [ref=e4857]: Unified Proxy Support
                          - text: — SOCKS proxy,
                          - code [ref=e4858]: DISCORD_PROXY
                          - text: ", and system proxy auto-detection across all gateway platforms. Hermes behind corporate firewalls just works. ("
                          - link "#6814" [ref=e4859] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6814
                          - text: )
                      - listitem [ref=e4860]:
                        - paragraph [ref=e4861]:
                          - strong [ref=e4862]: Comprehensive Security Hardening
                          - text: — Path traversal protection in checkpoint manager, shell injection neutralization in sandbox writes, SSRF redirect guards in Slack image uploads, Twilio webhook signature validation (SMS RCE fix), API server auth enforcement, git argument injection prevention, and approval button authorization. (
