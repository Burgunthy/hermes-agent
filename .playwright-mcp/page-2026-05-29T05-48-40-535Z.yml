                      - listitem [ref=e1331]:
                        - paragraph [ref=e1332]:
                          - strong [ref=e1333]: OpenAI-compatible local proxy for OAuth providers
                          - text: — Run
                          - code [ref=e1334]: hermes proxy
                          - text: and you get a
                          - code [ref=e1335]: http://localhost:port
                          - text: endpoint that speaks the OpenAI API but is backed by whichever OAuth provider you're signed into — Claude Pro, ChatGPT Pro, SuperGrok. Now any tool that expects an OpenAI-compatible endpoint (Codex CLI, Aider, Cline, Continue, your custom scripts) just works with your existing subscription, no API key required. One subscription, every tool. (
                          - link "#25969" [ref=e1336] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/25969
                          - text: )
                      - listitem [ref=e1337]:
                        - paragraph [ref=e1338]:
                          - strong [ref=e1339]:
                            - code [ref=e1340]: x_search
                            - text: — first-class X (Twitter) search tool
                          - text: — The agent can now search X directly without installing a skill or wiring up a custom integration. Search the timeline, find threads, surface specific posts — straight from the chat. Auth with either your X OAuth login or an API key, whichever you have. (
                          - link "#26763" [ref=e1341] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/26763
                          - text: )
