                          - text: )
                      - listitem [ref=e594]:
                        - paragraph [ref=e595]:
                          - strong [ref=e596]: Bitwarden Secrets Manager — one bootstrap token replaces every per-provider API key
                          - text: — Stop keeping plaintext API keys in
                          - code [ref=e597]: ~/.hermes/.env
                          - text: . Install Bitwarden Secrets Manager (
                          - code [ref=e598]: bws
                          - text: auto-installs lazily on first use), point Hermes at it with one bootstrap token (
                          - code [ref=e599]: BWS_ACCESS_TOKEN
                          - text: ), and every credential you need comes from Bitwarden at startup. Rotate a key in the Bitwarden web app and the rotation actually takes effect — Bitwarden defaults to source-of-truth so its values overwrite matching env vars on startup. Flip
                          - code [ref=e600]: "secrets.bitwarden.override_existing: false"
                          - text: to invert. EU Cloud and self-hosted Bitwarden server URLs supported. Detected credentials are now labeled with their source so you can see at a glance which keys came from Bitwarden vs. the local env. (
                          - link "#30035" [ref=e601] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/30035
                          - text: ","
                          - link "#31378" [ref=e602] [cursor=pointer]:
