                        - paragraph [ref=e1343]:
                          - strong [ref=e1344]: Microsoft Teams — end-to-end
                          - text: "— Hermes can now read messages from Teams and post back. The full Microsoft Graph stack lands together: auth + client foundation, a webhook listener that receives Teams events, a pipeline plugin runtime, and outbound delivery. Wire up the bot once, then chat to your agent from any Teams channel, DM, or group. (salvages of"
                          - link "#21408" [ref=e1345] [cursor=pointer]:
