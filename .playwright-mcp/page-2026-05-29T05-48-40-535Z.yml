                            - code [ref=e1406]: /handoff
                            - text: actually transfers the session live
                          - text: — Switching models or personalities mid-conversation used to mean losing context or starting over. Now
                          - code [ref=e1407]: /handoff
                          - text: moves your active session — every message, every tool call, every piece of context — to the target model, persona, or profile, live, without dropping anything. Mid-debugging hand off from a fast model to a deep-reasoning one, or pass a session between profiles for different parts of a task. (
