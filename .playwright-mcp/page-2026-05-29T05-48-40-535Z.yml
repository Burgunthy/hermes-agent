                  - generic [ref=e5154]:
                    - heading "Hermes Agent v0.8.0 (v2026.4.8)" [level=1] [ref=e5155]
                    - paragraph [ref=e5156]:
                      - strong [ref=e5157]: "Release Date:"
                      - text: April 8, 2026
                    - blockquote [ref=e5158]:
                      - paragraph [ref=e5159]: The intelligence release — background task auto-notifications, free MiMo v2 Pro on Nous Portal, live model switching across all platforms, self-optimized GPT/Codex guidance, native Google AI Studio, smart inactivity timeouts, approval buttons, MCP OAuth 2.1, and 209 merged PRs with 82 resolved issues.
                    - separator [ref=e5160]
                    - heading "✨ Highlights" [level=2] [ref=e5161]
                    - list [ref=e5162]:
                      - listitem [ref=e5163]:
                        - paragraph [ref=e5164]:
                          - strong [ref=e5165]:
                            - text: Background Process Auto-Notifications (
                            - code [ref=e5166]: notify_on_complete
                            - text: )
                          - text: — Background tasks can now automatically notify the agent when they finish. Start a long-running process (AI model training, test suites, deployments, builds) and the agent gets notified on completion — no polling needed. The agent can keep working on other things and pick up results when they land. (
                          - link "#5779" [ref=e5167] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5779
                          - text: )
                      - listitem [ref=e5168]:
                        - paragraph [ref=e5169]:
                          - strong [ref=e5170]: Free Xiaomi MiMo v2 Pro on Nous Portal
                          - text: — Nous Portal now supports the free-tier Xiaomi MiMo v2 Pro model for auxiliary tasks (compression, vision, summarization), with free-tier model gating and pricing display in model selection. (
                          - link "#6018" [ref=e5171] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6018
                          - text: ","
                          - link "#5880" [ref=e5172] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5880
                          - text: )
                      - listitem [ref=e5173]:
                        - paragraph [ref=e5174]:
                          - strong [ref=e5175]:
                            - text: Live Model Switching (
                            - code [ref=e5176]: /model
                            - text: Command)
                          - text: — Switch models and providers mid-session from CLI, Telegram, Discord, Slack, or any gateway platform. Aggregator-aware resolution keeps you on OpenRouter/Nous when possible, with automatic cross-provider fallback when needed. Interactive model pickers on Telegram and Discord with inline buttons. (
                          - link "#5181" [ref=e5177] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5181
                          - text: ","
                          - link "#5742" [ref=e5178] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5742
                          - text: )
                      - listitem [ref=e5179]:
                        - paragraph [ref=e5180]:
                          - strong [ref=e5181]: Self-Optimized GPT/Codex Tool-Use Guidance
                          - text: — The agent diagnosed and patched 5 failure modes in GPT and Codex tool calling through automated behavioral benchmarking, dramatically improving reliability on OpenAI models. Includes execution discipline guidance and thinking-only prefill continuation for structured reasoning. (
                          - link "#6120" [ref=e5182] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/6120
                          - text: ","
                          - link "#5414" [ref=e5183] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5414
                          - text: ","
                          - link "#5931" [ref=e5184] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5931
                          - text: )
                      - listitem [ref=e5185]:
                        - paragraph [ref=e5186]:
                          - strong [ref=e5187]: Google AI Studio (Gemini) Native Provider
                          - text: — Direct access to Gemini models through Google's AI Studio API. Includes automatic models.dev registry integration for real-time context length detection across any provider. (
                          - link "#5577" [ref=e5188] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5577
                          - text: )
                      - listitem [ref=e5189]:
                        - paragraph [ref=e5190]:
                          - strong [ref=e5191]: Inactivity-Based Agent Timeouts
                          - text: — Gateway and cron timeouts now track actual tool activity instead of wall-clock time. Long-running tasks that are actively working will never be killed — only truly idle agents time out. (
                          - link "#5389" [ref=e5192] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5389
                          - text: ","
                          - link "#5440" [ref=e5193] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5440
                          - text: )
                      - listitem [ref=e5194]:
                        - paragraph [ref=e5195]:
                          - strong [ref=e5196]: Approval Buttons on Slack & Telegram
                          - text: — Dangerous command approval via native platform buttons instead of typing
                          - code [ref=e5197]: /approve
                          - text: . Slack gets thread context preservation; Telegram gets emoji reactions for approval status. (
                          - link "#5890" [ref=e5198] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5890
                          - text: ","
                          - link "#5975" [ref=e5199] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5975
                          - text: )
                      - listitem [ref=e5200]:
                        - paragraph [ref=e5201]:
                          - strong [ref=e5202]: MCP OAuth 2.1 PKCE + OSV Malware Scanning
                          - text: — Full standards-compliant OAuth for MCP server authentication, plus automatic malware scanning of MCP extension packages via the OSV vulnerability database. (
                          - link "#5420" [ref=e5203] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5420
                          - text: ","
                          - link "#5305" [ref=e5204] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5305
                          - text: )
                      - listitem [ref=e5205]:
                        - paragraph [ref=e5206]:
                          - strong [ref=e5207]: Centralized Logging & Config Validation
                          - text: — Structured logging to
                          - code [ref=e5208]: ~/.hermes/logs/
                          - text: (agent.log + errors.log) with the
                          - code [ref=e5209]: hermes logs
                          - text: command for tailing and filtering. Config structure validation catches malformed YAML at startup before it causes cryptic failures. (
                          - link "#5430" [ref=e5210] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5430
                          - text: ","
                          - link "#5426" [ref=e5211] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5426
                          - text: )
                      - listitem [ref=e5212]:
                        - paragraph [ref=e5213]:
                          - strong [ref=e5214]: Plugin System Expansion
                          - text: — Plugins can now register CLI subcommands, receive request-scoped API hooks with correlation IDs, prompt for required env vars during install, and hook into session lifecycle events (finalize/reset). (
                          - link "#5295" [ref=e5215] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/5295
                          - text: ","
