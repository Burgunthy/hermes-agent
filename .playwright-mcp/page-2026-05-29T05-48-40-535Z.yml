                      - listitem [ref=e1351]:
                        - paragraph [ref=e1352]:
                          - strong [ref=e1353]: Debloating wave — lighter installs, less you don't use
                          - text: — A clean
                          - code [ref=e1354]: pip install hermes-agent
                          - text: "used to pull down everything: every messaging adapter SDK, every image-gen SDK, every voice/TTS provider, whether you used them or not. Now those heavy backends (Slack / Matrix / Feishu / DingTalk adapters, hindsight client, codex app-server, Pixverse / Camofox / image-gen SDKs, voice/TTS providers) install automatically the first time you actually use them. The"
                          - code [ref=e1355]: "[all]"
                          - text: extras drop everything covered by lazy-deps, the installer falls back through tiers when a wheel doesn't fit your platform, and a supply-chain advisory checker scans every install for unsafe versions. Faster installs, smaller disk footprint, fewer transitive vulnerabilities. (
                          - link "#24220" [ref=e1356] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/24220
