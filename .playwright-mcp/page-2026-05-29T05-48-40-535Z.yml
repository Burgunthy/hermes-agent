                      - listitem [ref=e1369]:
                        - paragraph [ref=e1370]:
                          - strong [ref=e1371]: Cross-session 1h Claude prompt cache
                          - text: — When you use Claude through Anthropic, OpenRouter, or Nous Portal, the prompt prefix (system prompt, skills, memory) now caches for an hour across sessions. Start a
                          - code [ref=e1372]: /new
                          - text: session and the first response comes back faster and cheaper because the cache is still warm from your last session. Background memory review hits the cache too, so it's not paying full price every turn. (
                          - link "#23828" [ref=e1373] [cursor=pointer]:
