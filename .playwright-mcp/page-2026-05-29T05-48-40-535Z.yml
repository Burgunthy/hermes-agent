                        - paragraph [ref=e3928]:
                          - strong [ref=e3929]: Dashboard polish
                          - text: — i18n (English + Chinese), react-router sidebar layout, mobile-responsive, Vercel deployment, real per-session API call tracking, and one-click update + gateway restart buttons. (
