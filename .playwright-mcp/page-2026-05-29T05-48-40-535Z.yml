                      - listitem [ref=e3893]:
                        - paragraph [ref=e3894]:
                          - strong [ref=e3895]:
                            - code [ref=e3896]: /steer
                            - text: — mid-run agent nudges
                          - text: —
                          - code [ref=e3897]: /steer <prompt>
                          - text: injects a note that the running agent sees after its next tool call, without interrupting the turn or breaking prompt cache. For when you want to course-correct an agent in-flight. (
                          - link "#12116" [ref=e3898] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/12116
                          - text: )
                      - listitem [ref=e3899]:
                        - paragraph [ref=e3900]:
                          - strong [ref=e3901]: Shell hooks
                          - text: — Wire any shell script as a Hermes lifecycle hook (pre_tool_call, post_tool_call, on_session_start, etc.) without writing a Python plugin. (
                          - link "#13296" [ref=e3902] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13296
                          - text: )
                      - listitem [ref=e3903]:
                        - paragraph [ref=e3904]:
                          - strong [ref=e3905]: Webhook direct-delivery mode
                          - text: — Webhook subscriptions can now forward payloads straight to a platform chat without going through the agent — zero-LLM push notifications for alerting, uptime checks, and event streams. (
                          - link "#12473" [ref=e3906] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/12473
                          - text: )
                      - listitem [ref=e3907]:
                        - paragraph [ref=e3908]:
                          - strong [ref=e3909]: Smarter delegation
                          - text: — Subagents now have an explicit
                          - code [ref=e3910]: orchestrator
                          - text: role that can spawn their own workers, with configurable
                          - code [ref=e3911]: max_spawn_depth
                          - text: (default flat). Concurrent sibling subagents share filesystem state through a file-coordination layer so they don't clobber each other's edits. (
                          - link "#13691" [ref=e3912] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13691
                          - text: ","
                          - link "#13718" [ref=e3913] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/13718
                          - text: )
                      - listitem [ref=e3914]:
                        - paragraph [ref=e3915]:
                          - strong [ref=e3916]: Auxiliary models — configurable UI + main-model-first
                          - text: —
                          - code [ref=e3917]: hermes model
                          - text: has a dedicated "Configure auxiliary models" screen for per-task overrides (compression, vision, session_search, title_generation).
                          - code [ref=e3918]: auto
                          - text: routing now defaults to the main model for side tasks across all users (previously aggregator users were silently routed to a cheap provider-side default). (
                          - link "#11891" [ref=e3919] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/11891
                          - text: ","
                          - link "#11900" [ref=e3920] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/11900
                          - text: )
                      - listitem [ref=e3921]:
                        - paragraph [ref=e3922]:
                          - strong [ref=e3923]: Dashboard plugin system + live theme switching
                          - text: — The web dashboard is now extensible. Third-party plugins can add custom tabs, widgets, and views without forking. Paired with a live-switching theme system — themes now control colors, fonts, layout, and density — so users can hot-swap the dashboard look without a reload. Same theming discipline the CLI has, now on the web. (
                          - link "#10951" [ref=e3924] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/10951
                          - text: ","
