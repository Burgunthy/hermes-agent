                        - paragraph [ref=e1377]:
                          - strong [ref=e1378]:
                            - text: 180x faster
                            - code [ref=e1379]: browser_console
                            - text: evaluations
                          - text: "— When the agent uses the browser tool to inspect a page or run JavaScript, those calls now share one persistent connection to Chrome instead of spinning up a new DevTools session every time. The difference is huge: things that used to take a couple of seconds per call return in milliseconds. Real-world page interactions feel instant. ("
                          - link "#23226" [ref=e1380] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/23226
                          - text: )
                      - listitem [ref=e1381]:
                        - paragraph [ref=e1382]:
                          - strong [ref=e1383]:
                            - text: Cold-start performance wave — ~19 seconds off
                            - code [ref=e1384]: hermes
                            - text: launch
                          - text: — Running
                          - code [ref=e1385]: hermes
                          - text: "used to make you wait through a chunk of import overhead and network calls before you saw a prompt. Now the launch path is mostly deferred: heavy adapters only load when you use them, model catalogs come from disk cache first, doctor checks run in parallel, and"
                          - code [ref=e1386]: chat -q
                          - text: skips the welcome banner entirely. The
                          - code [ref=e1387]: hermes tools
                          - text: All-Platforms screen alone dropped from 14 seconds to under 1.5 seconds. (
