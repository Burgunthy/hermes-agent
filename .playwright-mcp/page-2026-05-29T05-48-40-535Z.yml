                  - generic [ref=e1305]:
                    - heading "Hermes Agent v0.14.0 (v2026.5.16)" [level=1] [ref=e1306]
                    - paragraph [ref=e1307]:
                      - strong [ref=e1308]: "Release Date:"
                      - text: May 16, 2026
                      - strong [ref=e1309]: "Since v0.13.0:"
                      - text: 808 commits · 633 merged PRs · 1393 files changed · 165,061 insertions · 545 issues closed (12 P0, 50 P1) · 215 community contributors (including co-authors)
                    - blockquote [ref=e1310]:
                      - paragraph [ref=e1311]:
                        - text: The Foundation Release — Hermes installs and runs anywhere, ships with the things you actually want to use, and stops shipping the things you don't. xAI Grok lands as a SuperGrok OAuth provider with grok-4.3 bumped to a 1M context window. A new OpenAI-compatible local proxy turns any OAuth-authed Hermes provider — Claude Pro, ChatGPT Pro, SuperGrok — into an endpoint that Codex / Aider / Cline / Continue can hit.
                        - code [ref=e1312]: x_search
                        - text: lands as a first-class X (Twitter) search tool with OAuth-or-API-key auth. The Microsoft Teams stack is wired end-to-end (Graph auth + webhook listener + pipeline runtime + outbound delivery). A debloating wave makes installs dramatically lighter — heavyweight backends now lazy-install on first use, the
                        - code [ref=e1313]: "[all]"
                        - text: extras drop everything covered by lazy-deps, and a tiered install falls back when a wheel rejects on your platform.
                        - code [ref=e1314]: pip install hermes-agent
                        - text: works from PyPI. The cold-start wave shaves ~19 seconds off
                        - code [ref=e1315]: hermes
                        - text: launch. Browser CDP calls are 180x faster. Two new messaging platforms (LINE + SimpleX Chat) bring the total to 22. Cross-session 1-hour Claude prompt caching,
                        - code [ref=e1316]: /handoff
                        - text: that actually transfers sessions live, native button UI for
                        - code [ref=e1317]: clarify
                        - text: on Telegram and Discord, Discord channel history backfill, LSP semantic diagnostics on every write, a unified pluggable
                        - code [ref=e1318]: video_generate
                        - text: ", a"
                        - code [ref=e1319]: computer_use
                        - text: cua-driver backend that finally works with non-Anthropic providers, clickable URLs in any terminal, Zed ACP Registry integration via
                        - code [ref=e1320]: uvx
