                            - code [ref=e1365]: pip install hermes-agent && hermes
                          - text: — Hermes Agent is now a real PyPI package. No more cloning the repo or running shell installers — one pip command and you're running. The wheel ships with the Ink TUI bundle and the shell launcher, so the full experience comes out of the box. (salvage of
                          - link "#26350" [ref=e1366] [cursor=pointer]:
