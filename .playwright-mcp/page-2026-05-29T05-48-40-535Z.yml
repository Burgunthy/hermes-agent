                          - text: )
                      - listitem [ref=e5520]:
                        - paragraph [ref=e5521]:
                          - strong [ref=e5522]: Gateway Hardening
                          - text: — Major stability pass across race conditions, photo media delivery, flood control, stuck sessions, approval routing, and compression death spirals. The gateway is substantially more reliable in production. (
