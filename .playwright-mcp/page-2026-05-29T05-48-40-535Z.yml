                          - text: )
                      - listitem [ref=e5504]:
                        - paragraph [ref=e5505]:
                          - strong [ref=e5506]: Inline Diff Previews
                          - text: — File write and patch operations now show inline diffs in the tool activity feed, giving you visual confirmation of what changed before the agent moves on. (
                          - link "#4411" [ref=e5507] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/pull/4411
                          - text: ","
