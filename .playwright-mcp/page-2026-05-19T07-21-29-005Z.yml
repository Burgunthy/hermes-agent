            - generic [ref=e168]:
              - heading "Persistent Memory" [level=1] [ref=e170]
              - paragraph [ref=e171]: Hermes Agent has bounded, curated memory that persists across sessions. This lets it remember your preferences, your projects, your environment, and things it has learned.
              - heading "How It WorksDirect link to How It Works" [level=2] [ref=e172]:
                - text: How It Works
                - link "Direct link to How It Works" [ref=e173] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - text: "#"
              - paragraph [ref=e174]: "Two files make up the agent's memory:"
              - table [ref=e175]:
                - rowgroup [ref=e176]:
                  - row "File Purpose Char Limit" [ref=e177]:
                    - columnheader "File" [ref=e178]
                    - columnheader "Purpose" [ref=e179]
                    - columnheader "Char Limit" [ref=e180]
                - rowgroup [ref=e181]:
                  - row "MEMORY.md Agent's personal notes — environment facts, conventions, things learned 2,200 chars (~800 tokens)" [ref=e182]:
                    - cell "MEMORY.md" [ref=e183]:
                      - strong [ref=e184]: MEMORY.md
                    - cell "Agent's personal notes — environment facts, conventions, things learned" [ref=e185]
                    - cell "2,200 chars (~800 tokens)" [ref=e186]
                  - row "USER.md User profile — your preferences, communication style, expectations 1,375 chars (~500 tokens)" [ref=e187]:
                    - cell "USER.md" [ref=e188]:
                      - strong [ref=e189]: USER.md
                    - cell "User profile — your preferences, communication style, expectations" [ref=e190]
                    - cell "1,375 chars (~500 tokens)" [ref=e191]
              - paragraph [ref=e192]:
                - text: Both are stored in
                - code [ref=e193]: ~/.hermes/memories/
                - text: and are injected into the system prompt as a frozen snapshot at session start. The agent manages its own memory via the
                - code [ref=e194]: memory
                - text: tool — it can add, replace, or remove entries.
              - generic [ref=e195]:
                - generic [ref=e196]:
                  - img [ref=e198]
                  - text: info
                - paragraph [ref=e201]: Character limits keep memory focused. When memory is full, the agent consolidates or replaces entries to make room for new information.
              - heading "How Memory Appears in the System PromptDirect link to How Memory Appears in the System Prompt" [level=2] [ref=e202]:
                - text: How Memory Appears in the System Prompt
                - link "Direct link to How Memory Appears in the System Prompt" [ref=e203] [cursor=pointer]:
                  - /url: "#how-memory-appears-in-the-system-prompt"
                  - text: "#"
              - paragraph [ref=e204]: "At the start of every session, memory entries are loaded from disk and rendered into the system prompt as a frozen block:"
              - code [ref=e208]:
                - generic [ref=e209]: ══════════════════════════════════════════════
                - generic [ref=e210]: MEMORY (your personal notes) [67% — 1,474/2,200 chars]
                - generic [ref=e211]: ══════════════════════════════════════════════
                - generic [ref=e212]: User's project is a Rust web service at ~/code/myapi using Axum + SQLx
                - generic [ref=e213]: §
                - generic [ref=e214]: This machine runs Ubuntu 22.04, has Docker and Podman installed
                - generic [ref=e215]: §
                - generic [ref=e216]: User prefers concise responses, dislikes verbose explanations
              - paragraph [ref=e217]: "The format includes:"
              - list [ref=e218]:
                - listitem [ref=e219]: A header showing which store (MEMORY or USER PROFILE)
                - listitem [ref=e220]: Usage percentage and character counts so the agent knows capacity
                - listitem [ref=e221]:
                  - text: Individual entries separated by
                  - code [ref=e222]: §
                  - text: (section sign) delimiters
                - listitem [ref=e223]: Entries can be multiline
              - paragraph [ref=e224]:
                - strong [ref=e225]: "Frozen snapshot pattern:"
                - text: The system prompt injection is captured once at session start and never changes mid-session. This is intentional — it preserves the LLM's prefix cache for performance. When the agent adds/removes memory entries during a session, the changes are persisted to disk immediately but won't appear in the system prompt until the next session starts. Tool responses always show the live state.
              - heading "Memory Tool ActionsDirect link to Memory Tool Actions" [level=2] [ref=e226]:
                - text: Memory Tool Actions
                - link "Direct link to Memory Tool Actions" [ref=e227] [cursor=pointer]:
                  - /url: "#memory-tool-actions"
                  - text: "#"
              - paragraph [ref=e228]:
                - text: The agent uses the
                - code [ref=e229]: memory
                - text: "tool with these actions:"
              - list [ref=e230]:
                - listitem [ref=e231]:
                  - strong [ref=e232]: add
                  - text: — Add a new memory entry
                - listitem [ref=e233]:
                  - strong [ref=e234]: replace
                  - text: — Replace an existing entry with updated content (uses substring matching via
                  - code [ref=e235]: old_text
                  - text: )
                - listitem [ref=e236]:
                  - strong [ref=e237]: remove
                  - text: — Remove an entry that's no longer relevant (uses substring matching via
                  - code [ref=e238]: old_text
                  - text: )
              - paragraph [ref=e239]:
                - text: There is no
                - code [ref=e240]: read
                - text: action — memory content is automatically injected into the system prompt at session start. The agent sees its memories as part of its conversation context.
              - heading "Substring MatchingDirect link to Substring Matching" [level=3] [ref=e241]:
                - text: Substring Matching
                - link "Direct link to Substring Matching" [ref=e242] [cursor=pointer]:
                  - /url: "#substring-matching"
                  - text: "#"
              - paragraph [ref=e243]:
                - text: The
                - code [ref=e244]: replace
                - text: and
                - code [ref=e245]: remove
                - text: actions use short unique substring matching — you don't need the full entry text. The
                - code [ref=e246]: old_text
                - text: "parameter just needs to be a unique substring that identifies exactly one entry:"
              - code [ref=e250]:
                - generic [ref=e251]: "# If memory contains \"User prefers dark mode in all editors\""
                - generic [ref=e252]: memory(action="replace", target="memory",
                - generic [ref=e253]: old_text="dark mode",
                - generic [ref=e254]: content="User prefers light mode in VS Code, dark mode in terminal")
              - paragraph [ref=e255]: If the substring matches multiple entries, an error is returned asking for a more specific match.
              - heading "Two Targets ExplainedDirect link to Two Targets Explained" [level=2] [ref=e256]:
                - text: Two Targets Explained
                - link "Direct link to Two Targets Explained" [ref=e257] [cursor=pointer]:
                  - /url: "#two-targets-explained"
                  - text: "#"
              - heading "memory — Agent's Personal NotesDirect link to memory--agents-personal-notes" [level=3] [ref=e258]:
                - code [ref=e259]: memory
                - text: — Agent's Personal Notes
                - link "Direct link to memory--agents-personal-notes" [ref=e260] [cursor=pointer]:
                  - /url: "#memory--agents-personal-notes"
                  - text: "#"
              - paragraph [ref=e261]: "For information the agent needs to remember about the environment, workflows, and lessons learned:"
              - list [ref=e262]:
                - listitem [ref=e263]: Environment facts (OS, tools, project structure)
                - listitem [ref=e264]: Project conventions and configuration
                - listitem [ref=e265]: Tool quirks and workarounds discovered
                - listitem [ref=e266]: Completed task diary entries
                - listitem [ref=e267]: Skills and techniques that worked
              - heading "user — User ProfileDirect link to user--user-profile" [level=3] [ref=e268]:
                - code [ref=e269]: user
                - text: — User Profile
                - link "Direct link to user--user-profile" [ref=e270] [cursor=pointer]:
                  - /url: "#user--user-profile"
                  - text: "#"
              - paragraph [ref=e271]: "For information about the user's identity, preferences, and communication style:"
              - list [ref=e272]:
                - listitem [ref=e273]: Name, role, timezone
                - listitem [ref=e274]: Communication preferences (concise vs detailed, format preferences)
                - listitem [ref=e275]: Pet peeves and things to avoid
                - listitem [ref=e276]: Workflow habits
                - listitem [ref=e277]: Technical skill level
              - heading "What to Save vs SkipDirect link to What to Save vs Skip" [level=2] [ref=e278]:
                - text: What to Save vs Skip
                - link "Direct link to What to Save vs Skip" [ref=e279] [cursor=pointer]:
                  - /url: "#what-to-save-vs-skip"
                  - text: "#"
              - heading "Save These (Proactively)Direct link to Save These (Proactively)" [level=3] [ref=e280]:
                - text: Save These (Proactively)
                - link "Direct link to Save These (Proactively)" [ref=e281] [cursor=pointer]:
                  - /url: "#save-these-proactively"
                  - text: "#"
              - paragraph [ref=e282]: "The agent saves automatically — you don't need to ask. It saves when it learns:"
              - list [ref=e283]:
                - listitem [ref=e284]:
                  - strong [ref=e285]: "User preferences:"
                  - text: "\"I prefer TypeScript over JavaScript\" → save to"
                  - code [ref=e286]: user
                - listitem [ref=e287]:
                  - strong [ref=e288]: "Environment facts:"
                  - text: "\"This server runs Debian 12 with PostgreSQL 16\" → save to"
                  - code [ref=e289]: memory
                - listitem [ref=e290]:
                  - strong [ref=e291]: "Corrections:"
                  - text: "\"Don't use"
                  - code [ref=e292]: sudo
                  - text: for Docker commands, user is in docker group" → save to
                  - code [ref=e293]: memory
                - listitem [ref=e294]:
                  - strong [ref=e295]: "Conventions:"
                  - text: "\"Project uses tabs, 120-char line width, Google-style docstrings\" → save to"
                  - code [ref=e296]: memory
                - listitem [ref=e297]:
                  - strong [ref=e298]: "Completed work:"
                  - text: "\"Migrated database from MySQL to PostgreSQL on 2026-01-15\" → save to"
                  - code [ref=e299]: memory
                - listitem [ref=e300]:
                  - strong [ref=e301]: "Explicit requests:"
                  - text: "\"Remember that my API key rotation happens monthly\" → save to"
                  - code [ref=e302]: memory
              - heading "Skip TheseDirect link to Skip These" [level=3] [ref=e303]:
                - text: Skip These
                - link "Direct link to Skip These" [ref=e304] [cursor=pointer]:
                  - /url: "#skip-these"
                  - text: "#"
              - list [ref=e305]:
                - listitem [ref=e306]:
                  - strong [ref=e307]: "Trivial/obvious info:"
                  - text: "\"User asked about Python\" — too vague to be useful"
                - listitem [ref=e308]:
                  - strong [ref=e309]: "Easily re-discovered facts:"
                  - text: "\"Python 3.12 supports f-string nesting\" — can web search this"
                - listitem [ref=e310]:
                  - strong [ref=e311]: "Raw data dumps:"
                  - text: Large code blocks, log files, data tables — too big for memory
                - listitem [ref=e312]:
                  - strong [ref=e313]: "Session-specific ephemera:"
                  - text: Temporary file paths, one-off debugging context
                - listitem [ref=e314]:
                  - strong [ref=e315]: "Information already in context files:"
                  - text: SOUL.md and AGENTS.md content
              - heading "Capacity ManagementDirect link to Capacity Management" [level=2] [ref=e316]:
                - text: Capacity Management
                - link "Direct link to Capacity Management" [ref=e317] [cursor=pointer]:
                  - /url: "#capacity-management"
                  - text: "#"
              - paragraph [ref=e318]: "Memory has strict character limits to keep system prompts bounded:"
              - table [ref=e319]:
                - rowgroup [ref=e320]:
                  - row "Store Limit Typical entries" [ref=e321]:
                    - columnheader "Store" [ref=e322]
                    - columnheader "Limit" [ref=e323]
                    - columnheader "Typical entries" [ref=e324]
                - rowgroup [ref=e325]:
                  - row "memory 2,200 chars 8-15 entries" [ref=e326]:
                    - cell "memory" [ref=e327]
                    - cell "2,200 chars" [ref=e328]
                    - cell "8-15 entries" [ref=e329]
                  - row "user 1,375 chars 5-10 entries" [ref=e330]:
                    - cell "user" [ref=e331]
                    - cell "1,375 chars" [ref=e332]
                    - cell "5-10 entries" [ref=e333]
              - heading "What Happens When Memory is FullDirect link to What Happens When Memory is Full" [level=3] [ref=e334]:
                - text: What Happens When Memory is Full
                - link "Direct link to What Happens When Memory is Full" [ref=e335] [cursor=pointer]:
                  - /url: "#what-happens-when-memory-is-full"
                  - text: "#"
              - paragraph [ref=e336]: "When you try to add an entry that would exceed the limit, the tool returns an error:"
              - code [ref=e340]:
                - generic [ref=e341]: "{"
                - generic [ref=e342]: "\"success\": false,"
                - generic [ref=e343]: "\"error\": \"Memory at 2,100/2,200 chars. Adding this entry (250 chars) would exceed the limit. Replace or remove existing entries first.\","
                - generic [ref=e344]: "\"current_entries\": [\"...\"],"
                - generic [ref=e345]: "\"usage\": \"2,100/2,200\""
                - generic [ref=e346]: "}"
              - paragraph [ref=e347]: "The agent should then:"
              - list [ref=e348]:
                - listitem [ref=e349]: Read the current entries (shown in the error response)
                - listitem [ref=e350]: Identify entries that can be removed or consolidated
                - listitem [ref=e351]:
                  - text: Use
                  - code [ref=e352]: replace
                  - text: to merge related entries into shorter versions
                - listitem [ref=e353]:
                  - text: Then
                  - code [ref=e354]: add
                  - text: the new entry
              - paragraph [ref=e355]:
                - strong [ref=e356]: "Best practice:"
                - text: When memory is above 80% capacity (visible in the system prompt header), consolidate entries before adding new ones. For example, merge three separate "project uses X" entries into one comprehensive project description entry.
              - heading "Practical Examples of Good Memory EntriesDirect link to Practical Examples of Good Memory Entries" [level=3] [ref=e357]:
                - text: Practical Examples of Good Memory Entries
                - link "Direct link to Practical Examples of Good Memory Entries" [ref=e358] [cursor=pointer]:
                  - /url: "#practical-examples-of-good-memory-entries"
                  - text: "#"
              - paragraph [ref=e359]:
                - strong [ref=e360]: "Compact, information-dense entries work best:"
              - code [ref=e364]:
                - generic [ref=e365]: "# Good: Packs multiple related facts"
                - generic [ref=e366]: "User runs macOS 14 Sonoma, uses Homebrew, has Docker Desktop and Podman. Shell: zsh with oh-my-zsh. Editor: VS Code with Vim keybindings."
                - generic [ref=e367]: "# Good: Specific, actionable convention"
                - generic [ref=e368]: Project ~/code/api uses Go 1.22, sqlc for DB queries, chi router. Run tests with 'make test'. CI via GitHub Actions.
                - generic [ref=e369]: "# Good: Lesson learned with context"
                - generic [ref=e370]: The staging server (10.0.1.50) needs SSH port 2222, not 22. Key is at ~/.ssh/staging_ed25519.
                - generic [ref=e371]: "# Bad: Too vague"
                - generic [ref=e372]: User has a project.
                - generic [ref=e373]: "# Bad: Too verbose"
                - generic [ref=e374]: On January 5th, 2026, the user asked me to look at their project which is
                - generic [ref=e375]: located at ~/code/api. I discovered it uses Go version 1.22 and...
              - heading "Duplicate PreventionDirect link to Duplicate Prevention" [level=2] [ref=e376]:
                - text: Duplicate Prevention
                - link "Direct link to Duplicate Prevention" [ref=e377] [cursor=pointer]:
                  - /url: "#duplicate-prevention"
                  - text: "#"
              - paragraph [ref=e378]: The memory system automatically rejects exact duplicate entries. If you try to add content that already exists, it returns success with a "no duplicate added" message.
              - heading "Security ScanningDirect link to Security Scanning" [level=2] [ref=e379]:
                - text: Security Scanning
                - link "Direct link to Security Scanning" [ref=e380] [cursor=pointer]:
                  - /url: "#security-scanning"
                  - text: "#"
              - paragraph [ref=e381]: Memory entries are scanned for injection and exfiltration patterns before being accepted, since they're injected into the system prompt. Content matching threat patterns (prompt injection, credential exfiltration, SSH backdoors) or containing invisible Unicode characters is blocked.
              - heading "Session SearchDirect link to Session Search" [level=2] [ref=e382]:
                - text: Session Search
                - link "Direct link to Session Search" [ref=e383] [cursor=pointer]:
                  - /url: "#session-search"
                  - text: "#"
              - paragraph [ref=e384]:
                - text: Beyond MEMORY.md and USER.md, the agent can search its past conversations using the
                - code [ref=e385]: session_search
                - text: "tool:"
              - list [ref=e386]:
                - listitem [ref=e387]:
                  - text: All CLI and messaging sessions are stored in SQLite (
                  - code [ref=e388]: ~/.hermes/state.db
                  - text: ) with FTS5 full-text search
                - listitem [ref=e389]: Search queries return actual messages from the DB — no LLM summarization, no truncation
                - listitem [ref=e390]: The agent can find things it discussed weeks ago, even if they're not in its active memory
                - listitem [ref=e391]: The agent can also scroll forward/backward inside any session it finds
              - code [ref=e395]:
                - generic [ref=e396]: "hermes sessions list # Browse past sessions"
              - paragraph [ref=e397]:
                - text: See
                - link "Session Search Tool" [ref=e398] [cursor=pointer]:
                  - /url: /docs/user-guide/sessions#session-search-tool
                - text: for the three calling shapes (discovery / scroll / browse) and the response format.
              - heading "session_search vs memoryDirect link to session_search vs memory" [level=3] [ref=e399]:
                - text: session_search vs memory
                - link "Direct link to session_search vs memory" [ref=e400] [cursor=pointer]:
                  - /url: "#session_search-vs-memory"
                  - text: "#"
              - table [ref=e401]:
                - rowgroup [ref=e402]:
